<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "dpt-juego-u1-l3", "niveles": ["Observador", "Analista", "Garante del derecho", "Referente en tutela"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dpt", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 1 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 1, "lesson": 3, "heading": "Lección 1.3. Reconocimiento de las reglas básicas fijadas por la jurisprudencia de la Corte Constitucional y el Consejo de Estado", "scenes": [{"layout": "compara", "segmentos": ["La jurisprudencia constitucional ha distinguido entre el deber de resolver una solicitud y la obligación de otorgar una respuesta favorable. La Directiva No. 0001 de 2022 recoge esta regla al citar las sentencias T-146 de 2012, T-422 de 2014 y T-230 de 2020 de la Corte Constitucional. Conforme a ese criterio, la respuesta de fondo no obliga a conceder lo solicitado; una contestación negativa puede ser compatible con el derecho de petición si expresa las razones que la sustentan y responde efectivamente al objeto de la solicitud.", "La distinción es relevante para el ejercicio de la función pública. Una solicitud puede ser improcedente, carecer de respaldo normativo, referirse a información sometida a reserva, plantearse ante una autoridad sin competencia o pretender una actuación regulada por un procedimiento especial. En todos esos supuestos, la autoridad conserva el deber de responder; lo que varía es el contenido de la decisión y su fundamentación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "El deber de resolver una solicitud", "segs": [0], "obj": "libros", "ilus": "norma-competencia.webp"}, {"label": "La distinción es relevante para el ejercicio de la función pública", "segs": [1], "obj": "personas", "ilus": "dialogo-autoridades.webp"}]}], "rotulo": null, "seccion": "La respuesta debe ser de fondo, sin que implique, necesariamente, acceder a lo solicitado", "grupo": null, "titulos_fuente": ["La respuesta debe ser de fondo, sin que implique, necesariamente, acceder a lo solicitado"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["El deber de resolver una solicitud", "La distinción es relevante para el ejercicio de la función pública"], "titulo_genially": "La respuesta debe ser de fondo, sin que implique, necesariamente, acceder a lo solicitado", "complemento_genially": "", "apartado": "La respuesta debe ser de fondo, sin que implique, necesariamente, acceder a lo solicitado", "bloques_fuente": [196, 198], "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "esquema", "segmentos": ["De fondo: resuelve, no solo anuncia. Contestar “su petición fue recibida y se encuentra en gestión” únicamente informa una actuación interna; no entrega la copia ni explica cuándo y cómo se envió la respuesta anterior. Si la respuesta y sus soportes existen y pueden entregarse, corresponde suministrarlos e informar la fecha y el medio de envío. Si, después de verificar los registros pertinentes, no se encuentra una respuesta anterior o no existe constancia de envío, debe explicarse esa circunstancia con veracidad y atender lo que corresponda, sin inventar documentos ni dar por demostrado un envío.", "Clara: se entiende. En lugar de escribir “se efectuó la remisión mediante el canal telemático registrado por la impetrante”, puede decirse: “La respuesta se envió al correo electrónico que usted indicó en su solicitud”. El contenido debe permitir que la persona comprenda qué ocurrió, sin necesidad de conocer vocabulario jurídico o administrativo específico. Si es indispensable usar un término técnico, se explica en la misma respuesta.", "Precisa: va al punto. Frente a la pregunta sobre la fecha y el medio de envío, contestar “la Fiscalía dispone de diversos canales y atiende oportunamente a los usuarios” aporta información general, pero evade el dato pedido. Si los registros lo acreditan, una contestación precisa sería: “La respuesta se envió el 3 de noviembre de 2026 al correo electrónico indicado en su petición; se adjunta la constancia”. La fecha es ilustrativa: en una respuesta real deben utilizarse exclusivamente los datos comprobados del caso.", "Congruente y completa: responde lo que se preguntó y no deja asuntos pendientes. Si la ciudadana pide la copia y la información sobre su envío, no basta con explicar cómo presentar una queja ni con contestar únicamente que hubo respuesta. Deben atenderse los dos puntos: entregar la copia, cuando proceda, e informar la fecha y el medio de envío, o explicar de manera concreta por qué alguno de esos elementos no puede suministrarse. La congruencia exige correspondencia entre la pregunta y la respuesta; la completitud evita que se omita una parte de lo solicitado.", "La Corte Constitucional, en la Sentencia T-1130 de 2008, referida por la Directiva No. 0001 de 2022, ha sido invocada para sustentar que la respuesta al derecho de petición debe ser de fondo, clara, oportuna, precisa y congruente. La claridad exige que la comunicación permita comprender el sentido de la decisión; la precisión demanda que se refiera al asunto sometido a consideración; y la congruencia requiere correspondencia entre lo pedido y lo contestado.", "Estas exigencias excluyen las respuestas genéricas, evasivas o ambiguas que no permitan establecer si la autoridad valoró la pretensión formulada. También exigen diferenciar las solicitudes múltiples contenidas en una misma comunicación y pronunciarse de manera individualizada sobre cada una, según la competencia y el régimen jurídico aplicable.", "En palabras simples y sencillas, resolver lo pedido y explicarlo de manera comprensible. Una respuesta de fondo se ocupa realmente de lo que la persona solicita: explica qué se decide o informa, atiende los asuntos que corresponde resolver y da las razones necesarias. No basta con confirmar que el escrito fue recibido, copiar normas o afirmar que “se encuentra en trámite”. Una respuesta negativa también puede ser de fondo si explica las razones aplicables; responder no significa conceder siempre lo pedido. Para cumplir este deber, la contestación debe poder comprenderse, ir directamente al asunto y corresponder a lo solicitado (Corte Constitucional, 2020, 2022).", "Ejemplo común: Una víctima había solicitado a la Fiscalía información sobre los canales de orientación y atención disponibles para las víctimas. Como afirma no haber recibido contestación, pide copia de la respuesta a esa solicitud y que se le informe en qué fecha y por qué medio se le envió. A partir de esta situación pueden distinguirse los siguientes criterios:", "Estos criterios se complementan; una respuesta puede estar escrita en palabras sencillas y, aun así, ser incompleta; también puede contener muchos detalles y no responder la pregunta. Antes de enviarla, conviene verificar: ¿resolví lo pedido?, ¿se entiende?, ¿contesté directamente y con datos comprobados?, ¿atendí todos los asuntos que me corresponden? Las respuestas deben respetar, además, la competencia, las restricciones legales de acceso y las demás reglas aplicables. Su elaboración tampoco reemplaza el deber de comunicarla efectivamente al peticionario (Corte Constitucional, 2020, 2022)."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [4, 5, 6, 7], "titulo": [], "tail": [8], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "De fondo: resuelve, no solo anuncia", "segs": [0], "obj": "documento"}, {"label": "Clara: se entiende", "segs": [1], "obj": "personas"}, {"label": "Precisa: va al punto", "segs": [2], "obj": "lupa"}, {"label": "Congruente y completa", "segs": [3], "obj": "balanza"}]}], "rotulo": null, "seccion": "La respuesta debe ser clara, precisa y congruente", "grupo": null, "titulos_fuente": ["La respuesta debe ser clara, precisa y congruente"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La respuesta debe ser clara, precisa y congruente"], "titulo_genially": "La respuesta debe ser clara, precisa y congruente", "complemento_genially": "", "apartado": "La respuesta debe ser clara, precisa y congruente", "guia": "Recorra el mapa conceptual: haga clic en cada concepto para leer su texto.", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "personas", "documento"], "descarga": {"href": "documentos/mapa-u1-l3-p02.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: La respuesta debe ser clara, precisa y congruente (imagen PNG)", "lamina": true}}, {"layout": "compacta", "segmentos": ["La oportunidad se determina conforme a los términos previstos en el artículo 14 del CPACA, sustituido por la Ley 1755 de 2015, o por la norma especial aplicable. La Corte Constitucional ha reiterado que la respuesta debe producirse dentro del término legal y ser puesta en conocimiento del peticionario. La Directiva No. 0001 de 2022 vincula este deber con la exigencia de trazabilidad de la respuesta y de sus constancias de envío o entrega.", "La comunicación cumple una función material: posibilita que el solicitante conozca la decisión, comprenda sus razones y, si corresponde, active los mecanismos jurídicos o administrativos pertinentes. Por ello, el control del término debe comprender tanto la elaboración de la respuesta como su remisión efectiva por el medio autorizado o informado por el peticionario."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "La respuesta debe ser oportuna y comunicada", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["telefono", "documento", "personas"], "escenario": true}], "rotulo": null, "seccion": "La respuesta debe ser oportuna y comunicada", "grupo": null, "titulos_fuente": ["La respuesta debe ser oportuna y comunicada"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["La respuesta debe ser oportuna y comunicada"], "titulo_genially": "La respuesta debe ser oportuna y comunicada", "complemento_genially": "", "apartado": "La respuesta debe ser oportuna y comunicada", "bloques_fuente": [202, 204], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "radicacion-terminos.webp"}, {"layout": "giro", "segmentos": ["La negativa de una solicitud no constituye, por sí misma, vulneración del derecho de petición. Sin embargo, debe estar sustentada en razones verificables y pertinentes. La Directiva No. 0001 de 2022 señala que no se vulnera el derecho cuando la respuesta niega lo solicitado y explica los fundamentos de la negativa. En el ámbito del acceso a la información, la Directiva exige que la decisión de negar el acceso por reserva identifique el fundamento constitucional o legal, la excepción aplicable, el periodo de clasificación o reserva y el daño presente, probable y específico que produciría la divulgación.", "La motivación permite controlar que la respuesta no sea arbitraria y que se ajuste a la competencia de la Entidad, a la norma aplicable y a las circunstancias del caso. En consecuencia, una fórmula estandarizada que se limite a negar una solicitud sin explicar sus razones no satisface el deber de respuesta de fondo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "La negativa de una solicitud", "segs": [0], "obj": "documento"}, {"label": "La motivación permite controlar que la respuesta no sea arbitraria", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "La respuesta negativa exige motivación suficiente", "grupo": null, "titulos_fuente": ["La respuesta negativa exige motivación suficiente"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["La negativa de una solicitud", "La motivación permite controlar que la respuesta no sea arbitraria"], "titulo_genially": "La respuesta negativa exige motivación suficiente", "complemento_genially": "", "apartado": "La respuesta negativa exige motivación suficiente", "bloques_fuente": [205, 207]}, {"layout": "compacta", "segmentos": ["El derecho de petición debe ejercerse de manera responsable. El artículo 19 del CPACA, modificado por la Ley 1755 de 2015, permite rechazar las peticiones irrespetuosas, devolver las solicitudes oscuras para que se corrijan o aclaren y remitir a respuestas anteriores frente a peticiones reiterativas ya resueltas, con las excepciones previstas por la ley. La Directiva No. 0001 de 2022 recoge estas reglas y recuerda que el ejercicio del derecho no implica la concesión de lo solicitado.", "No obstante, la existencia de estos límites no habilita a la autoridad para eludir el deber de decidir. La petición reiterativa debe ser examinada para verificar si incorpora elementos nuevos, si se refiere a derechos imprescriptibles o si subsana requisitos cuya falta fundamentó una negativa anterior. La petición oscura debe ser devuelta para aclaración; la incompleta debe tramitarse conforme al artículo 17 del CPACA; y la petición irrespetuosa debe ser valorada bajo el estándar legal aplicable."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Límites del ejercicio y deber de resolver", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["casa", "personas", "reloj"], "escenario": true}], "rotulo": null, "seccion": "Límites del ejercicio y deber de resolver", "grupo": null, "titulos_fuente": ["Límites del ejercicio y deber de resolver"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Límites del ejercicio y deber de resolver"], "titulo_genially": "Límites del ejercicio y deber de resolver", "complemento_genially": "", "apartado": "Límites del ejercicio y deber de resolver", "bloques_fuente": [208, 210], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "norma-competencia.webp"}, {"layout": "compacta", "segmentos": ["El cumplimiento de los deberes descritos tiene una doble dimensión. De una parte, garantiza el derecho fundamental de las personas a relacionarse con la Entidad y obtener una respuesta institucional. De otra, contribuye a prevenir contingencias asociadas a acciones de tutela, investigaciones disciplinarias y deficiencias en el servicio. El diseño del presente curso vincula expresamente la gestión oportuna, completa y trazable de solicitudes con la prevención de riesgos jurídicos y el fortalecimiento de los mecanismos institucionales de seguimiento y control.", "Por ello, el servidor responsable no debe reducir el trámite a un acto de producción documental. Su deber comprende identificar la pretensión, verificar la competencia, obtener información suficiente, aplicar el término correspondiente, motivar la respuesta, comunicarla y preservar la evidencia del trámite. Esta secuencia debe ajustarse a las particularidades de la solicitud y a los protocolos institucionales vigentes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Implicaciones para la Fiscalía General de la Nación", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"], "escenario": true}], "rotulo": null, "seccion": "Implicaciones para la Fiscalía General de la Nación", "grupo": null, "titulos_fuente": ["Implicaciones para la Fiscalía General de la Nación"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Implicaciones para la Fiscalía General de la Nación"], "titulo_genially": "Implicaciones para la Fiscalía General de la Nación", "complemento_genially": "", "apartado": "Implicaciones para la Fiscalía General de la Nación", "bloques_fuente": [211, 213], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "dialogo-autoridades.webp"}, {"layout": "compacta", "segmentos": ["Caso ficticio elaborado exclusivamente con fines pedagógicos. Los nombres y las referencias de trámite son inventados y no identifican personas ni actuaciones reales. Se omiten documentos de identidad, direcciones y datos de contacto para evitar la exposición innecesaria de información personal. Una ciudadana presenta la siguiente petición ante una dependencia de la Fiscalía General de la Nación:", "Señores, Fiscalía General de la Nación. Asunto: Información sobre mi solicitud de protección y amenazas recientes.", "Mi nombre es Elena Robles Zalcedo y soy víctima dentro de la actuación que, para efectos de este ejemplo, se identifica como CASO-FICTICIO-A. El 20 de octubre de 2026 presenté una solicitud de medidas de protección, identificada en este caso como SOLICITUD-PROTECCIÓN-B, porque Julián Argotes Veltrán me ha amenazado. No he recibido información sobre lo que ha ocurrido con esa solicitud. Les pido que me informen qué trámite le dieron, qué dependencia la está atendiendo y si ya se tomó alguna decisión. Si ya me respondieron, solicito copia de esa respuesta y que me indiquen cuándo y por qué medio me la enviaron. Las amenazas continúan. Ayer, 8 de noviembre de 2026, Julián Argotes Veltrán me envió un mensaje diciendo que me haría daño si seguía con la denuncia. Adjunto una copia y tengo miedo de que me agreda. Por eso, además de conocer el estado de mi solicitud, pido que se atienda con urgencia mi necesidad de protección y que dentro del proceso capturen inmediatamente a Julián Argotes Veltrán. Por mi seguridad, les pido que se comuniquen conmigo únicamente por el medio de contacto seguro que indiqué en mi solicitud de protección.", "Atentamente, Elena Robles Salcedo.", "La dependencia responde únicamente: «Su escrito fue remitido al área competente». No identifica el destino de la remisión ni informa qué ocurrió con la solicitud anterior, no se pronuncia sobre la copia y no deja evidencia de haber canalizado de manera urgente la información sobre las nuevas amenazas.", "La comunicación contiene asuntos distintos que deben identificarse y atenderse sin reducir toda la actuación a una remisión genérica. La solicitud de información exige verificar qué ocurrió con el escrito anterior, quién lo está atendiendo y si existe una decisión o respuesta. Si la respuesta ya fue emitida, debe resolverse la solicitud de copia conforme a las reglas de acceso aplicables e informarse la fecha y el medio de comunicación que acrediten los registros. Si no existe respuesta o no se encuentra constancia de envío, debe explicarse esa circunstancia con veracidad, sin dar por resuelta la solicitud de protección por el solo hecho de haberla remitido.", "Las amenazas recientes no pueden tratarse únicamente como una pregunta sobre el estado de un trámite. Deben ponerse sin demora en conocimiento de las instancias competentes para atender el riesgo y adoptar las actuaciones que correspondan. Si existe peligro inminente para la vida o la integridad, la respuesta no puede limitarse a esperar el vencimiento de un término ordinario: deben adoptarse las medidas de urgencia necesarias dentro de las competencias respectivas. La protección de las víctimas y la evaluación de las medidas correspondientes se rigen, además, por las normas y rutas institucionales aplicables; este caso no asigna al receptor funciones de evaluación especializada del riesgo (Congreso de la República de Colombia, 2004, arts. 133 y 134; 2015, art. 1, que sustituye el art. 20 del CPACA).", "La petición de captura, por su parte, pretende una actuación dentro del procedimiento penal. Debe canalizarse al despacho que conoce el asunto, junto con los nuevos hechos y sus soportes, para su valoración conforme al régimen procesal. La solicitud ciudadana no constituye por sí sola una orden de captura ni autoriza al servidor receptor a disponerla. La restricción de la libertad exige los presupuestos y controles legales correspondientes; como regla general, la captura requiere orden del juez de control de garantías, sin perjuicio de las excepciones legales (Congreso de la República de Colombia, 2004, arts. 297, 300 y 301). Por tanto, “su escrito fue remitido al área competente” no es una contestación suficiente al conjunto de lo solicitado. Debe precisarse el estado verificable del trámite anterior, atenderse la copia cuando corresponda y explicarse el encaminamiento de los asuntos de protección y de la solicitud procesal. La coordinación y la remisión deben quedar documentadas; su comunicación a la solicitante debe utilizar un medio seguro y evitar exponer datos que agraven el riesgo. Informar la remisión no equivale a decidir sobre la protección ni a resolver la solicitud de captura, y ninguna de estas actuaciones permite omitir la atención urgente de las amenazas."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2]]}], "repetidos": [], "columnas": 2}], "items": [{"label": "Caso de aplicación", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1, 2, 3, 4], "clase": "celda", "obj": "expediente"}, {"label": "Análisis", "segs": [5, 6, 7], "clase": "celda", "obj": "lupa"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Caso de aplicación", "grupo": null, "titulos_fuente": ["Caso de aplicación"], "encabezados": [], "mediacion": "", "rotulos": ["Caso de aplicación"], "titulo_genially": "Caso de aplicación", "complemento_genially": "", "apartado": "Caso de aplicación", "guia": "Escuche la situación y abra el análisis.", "ilustracion": "comunidad-interes-general.webp", "casosAudio": [{"id": "u1l3c1", "titulo": "Caso de aplicación: la carta de la ciudadana", "url": "../comun/casos/index.html?caso=u1l3c1"}]}, {"layout": "compacta", "segmentos": ["La eficacia del derecho de petición depende de que la respuesta institucional integre competencia, oportunidad, completitud, claridad, precisión, congruencia, motivación y comunicación verificable. Estos criterios no son exigencias formales aisladas: constituyen condiciones
