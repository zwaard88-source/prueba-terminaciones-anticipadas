<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin de la lección 3</title>
<link rel="stylesheet" href="../comun/assets/vendor/fontawesome.min.css">
<link rel="stylesheet" href="../comun/assets/vendor/solid.min.css">
<style>
@font-face{font-family:Montserrat;src:url('../comun/assets/fonts/montserrat-latin.woff2') format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:Montserrat;src:url('../comun/assets/fonts/montserrat-latin-ext.woff2') format('woff2');font-weight:400 800;font-display:swap;unicode-range:U+0100-02AF}
:root{--carbon:#002F46;--negro:#002F46;--cielo:#F2F8F8;--teal:#396B83;--acento:#A75260;--claro:#F8F5C6;--suave:#E5F1F1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cielo);font-family:Montserrat,Arial,sans-serif;color:var(--carbon)}
.meta{position:relative;height:100vh;min-height:360px;overflow:hidden;container-type:inline-size}
.fondo{position:absolute;inset:0;width:100%;height:100%}
.nube{fill:#fff;animation:nube 28s ease-in-out infinite}.nube.b{animation-duration:38s;animation-delay:-12s}
@keyframes nube{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}
.sol{fill:#EE616B;transform-box:fill-box;transform-origin:center;animation:sol 5s ease-in-out infinite}
@keyframes sol{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.camino{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 16;animation:paso 1.8s linear infinite}
@keyframes paso{to{stroke-dashoffset:-34}}
.caminante{offset-path:path('M300 300 C400 292 470 308 560 300 C620 294 660 298 690 290');offset-rotate:0deg;animation:llega 3s cubic-bezier(.3,.7,.3,1) .3s both}
@keyframes llega{from{offset-distance:0%}to{offset-distance:100%}}
/* La imagen aprobada de la lección, en la meta */
.hito{position:absolute;right:3.2%;top:6%;width:32%;aspect-ratio:1/.86;border-radius:50% 50% 16px 16px;background:#fff;border:3px solid var(--negro);box-shadow:6px 7px 0 var(--negro);overflow:hidden;display:grid;place-items:center;animation:sube .8s cubic-bezier(.2,1.25,.4,1) .2s both}
.hito img{width:100%;height:100%;object-fit:contain;padding:12px 12px 6px;display:block}
@keyframes sube{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.bandera{position:absolute;right:calc(3.2% + 15%);top:calc(6% - 34px);width:52px;height:56px;color:var(--acento);transform-origin:left bottom;animation:ondea 2s ease-in-out infinite}
@keyframes ondea{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
/* Tarjeta */
.tarjeta{position:absolute;left:3.2%;top:7%;width:55%;background:#fff;border:3px solid var(--negro);box-shadow:7px 8px 0 var(--negro);border-radius:6px;padding:18px 24px 18px;animation:sube .7s cubic-bezier(.2,1.1,.4,1) both}
.etq{display:inline-block;background:var(--suave);color:var(--negro);font-size:17px;font-weight:800;padding:3px 12px;border-radius:10px 0 10px 0}
h1{margin:9px 0 3px;font-size:38px;line-height:1.08;font-weight:800;color:var(--negro)}
.frase{margin:0 0 12px;font-size:15.5px;font-weight:500;line-height:1.35}
.logros{display:grid;grid-template-columns:1.05fr .85fr;gap:12px;align-items:stretch}
.dato{border:2px solid var(--carbon);border-radius:8px;padding:9px 13px;display:flex;gap:11px;align-items:center;min-width:0}
.dato i{font-size:27px;color:var(--teal);flex:none}
.dato.nivel i{color:var(--acento);animation:medalla 1s cubic-bezier(.2,1.5,.4,1) 1.2s both}
@keyframes medalla{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.dato small{display:block;font-size:12.5px;font-weight:600}
.dato b{display:block;font-size:20px;font-weight:800;line-height:1.15;color:var(--negro)}
.tramos{margin:12px 0 0;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.tramos span{flex:1;height:9px;max-width:42px;border-radius:5px;background:var(--suave);overflow:hidden;position:relative}
.tramos span.ok::after{content:"";position:absolute;inset:0;background:var(--teal);transform-origin:left;animation:llena .4s ease both;animation-delay:calc(1s + var(--i)*.07s)}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
.tramos em{font-style:normal;margin-left:6px;white-space:nowrap}
.confeti i{position:absolute;top:-16px;left:var(--x);width:8px;height:13px;border-radius:2px;background:var(--c);animation:cae 3.6s ease-in var(--d) both}
@keyframes cae{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(470px) rotate(540deg)}}
/* Pie con el curso y la unidad, como el de las demás páginas de la lección */
.pie{position:absolute;left:0;right:0;bottom:0;min-height:68px;background:#fff;border-top:3px solid var(--negro);display:flex;align-items:center;justify-content:space-between;gap:28px;padding:8px 3.2%}
.pie div{display:flex;align-items:center;gap:12px;min-width:0}
.pie .curso{flex:1 1 52%}.pie .unidad{flex:1 1 44%;justify-content:flex-end;text-align:right}
.pie .chip{flex:none;background:var(--negro);color:#fff;font-size:14px;font-weight:700;padding:4px 10px;border-radius:10px 0 10px 0}
.pie .unidad .chip{background:var(--teal)}
.pie p{margin:0;font-size:13.5px;line-height:1.25;font-weight:700;color:var(--negro)}
@container (max-width:640px){.hito,.bandera{display:none}.tarjeta{left:12px;right:12px;width:auto;top:12px;padding:15px 16px}h1{font-size:30px}.logros{grid-template-columns:1fr}
  .pie{flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px}.pie .unidad{justify-content:flex-start;text-align:left;flex-direction:row}.pie p{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.caminante{offset-distance:100%}.confeti{display:none}}
</style>
</head>
<body>
<main class="meta">
<svg class="fondo" viewBox="0 0 1113 448" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <rect width="1113" height="448" fill="#F2F8F8"/>
  <circle class="sol" cx="685" cy="83" r="30"/>
  <g class="nube"><ellipse cx="660" cy="48" rx="44" ry="13"/><ellipse cx="690" cy="38" rx="26" ry="15"/></g>
  <g class="nube b"><ellipse cx="1000" cy="28" rx="34" ry="10"/></g>
  <path d="M0 300 V206 h64 v-52 h46 v88 h60 v-60 h70 v30 h52 v-84 h58 v70 h50 v-36 h66 v54 h60 v-90 h54 v60 h62 v-28 h48 v48 h70 v-70 h56 v40 h64 v-54 h53 V448 H0 Z" fill="#396B83" opacity=".22" transform="translate(0 -26)"/><path d="M0 300 V206 h64 v-52 h46 v88 h60 v-60 h70 v30 h52 v-84 h58 v70 h50 v-36 h66 v54 h60 v-90 h54 v60 h62 v-28 h48 v48 h70 v-70 h56 v40 h64 v-54 h53 V448 H0 Z" fill="#F8F5C6" opacity=".55" transform="translate(30 -10)"/>
  <rect x="0" y="274" width="1113" height="48" fill="#E5F1F1"/>
  <rect x="0" y="322" width="1113" height="126" fill="#002F46"/><path d="M40 352 H1073" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="38 30" opacity=".8" fill="none"/>
  <path class="camino" d="M300 308 C400 300 470 316 560 308 C620 302 660 306 690 298"/>
  <g class="caminante"><ellipse cx="0" cy="26" rx="13" ry="4" fill="#002F46" opacity=".3"/><circle cx="0" cy="-16" r="8" fill="#002F46"/><path d="M-8 24 L-5 -6 Q0 -10 5 -6 L8 24 Z" fill="#A75260"/></g>
</svg>
<div class="hito"><img src="../comun/fin-leccion/9689a6463830e4bf.png" alt=""></div>
<svg class="bandera" viewBox="0 0 52 56" aria-hidden="true"><path d="M4 56V4" stroke="#002F46" stroke-width="4" stroke-linecap="round"/><path d="M6 6h40l-10 11 10 11H6z" fill="currentColor"/></svg>
<section class="tarjeta">
  <span class="etq">Lección 3</span>
  <h1>Fin de la lección</h1>
  <p class="frase" id="frase"></p>
  <div class="logros">
    <div class="dato nivel"><i class="fas fa-medal" aria-hidden="true"></i><div><small>Nivel alcanzado</small><b id="nivel">Observador</b></div></div>
    <div class="dato"><i class="fas fa-star" aria-hidden="true"></i><div><small>Puntos de esta lección</small><b><span id="puntos">0</span></b></div></div>
  </div>
  <div class="tramos" id="tramos" role="img"></div>
</section>
<footer class="pie">
  <div class="curso"><span class="chip">Curso</span><p>Derecho de petición y acción de tutela</p></div>
  <div class="unidad"><span class="chip">Unidad 2</span><p>Gestión y respuesta del derecho de petición</p></div>
</footer>
<div class="confeti" id="confeti" aria-hidden="true"></div>
</main>
<script>
(function(){
 var CLAVE="dpt-juego-u2-l3",MAX=805,TOTAL=11,N=["Observador", "Analista", "Garante del derecho", "Referente en tutela"],s={};
 try{s=JSON.parse(localStorage.getItem(CLAVE)||'{}')}catch(e){}
 var v=Object.keys(s.v||{}).length,t=Object.keys(s.t||{}).length,p=v*10+t*25,f=p/MAX,k=f>=.8?3:f>=.45?2:f>=.15?1:0,$=function(i){return document.getElementById(i)};
 $('nivel').textContent=N[k];
 $('frase').textContent=p>0?(t>=TOTAL?'Completó todos los tramos de este recorrido.':'Llegó a la meta. Si vuelve a las páginas pendientes, puede sumar más puntos.'):'Recorra las páginas de esta lección para sumar puntos y subir de nivel.';
 var h='';for(var i=0;i<TOTAL;i++)h+='<span class="'+(i<t?'ok':'')+'" style="--i:'+i+'"></span>';
 $('tramos').innerHTML=h+'<em>'+Math.min(t,TOTAL)+' de '+TOTAL+' tramos</em>';$('tramos').setAttribute('aria-label',Math.min(t,TOTAL)+' de '+TOTAL+' tramos superados');
 var q=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(q)$('puntos').textContent=p;else{var ini=performance.now();(function c(a){var x=Math.min(1,(a-ini)/1500);$('puntos').textContent=Math.round(p*x);if(x<1)requestAnimationFrame(c)})(ini);}
 if(p>0&&!q){var C=["#A75260","#396B83","#002F46","#EE616B"],o='';for(var j=0;j<26;j++)o+='<i style="--x:'+(j*3.9+2)+'%;--c:'+C[j%4]+';--d:'+(1.1+(j*7%13)*.09)+'s"></i>';$('confeti').innerHTML=o;}
})();
</script>
</body>
</html>
