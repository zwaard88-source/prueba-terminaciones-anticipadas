"acierto": [], "rotulo": "Unidad 2 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 2, "lesson": 1, "heading": "Lección 2.1. Política de Atención al Ciudadano y derecho de petición", "scenes": [{"layout": "compacta", "segmentos": ["Reconocer los lineamientos institucionales de atención al usuario aplicables a la gestión del derecho de petición en la Fiscalía General de la Nación, con el fin de orientar, recibir y canalizar las solicitudes de manera respetuosa, incluyente y acorde con las competencias institucionales.", "La gestión del derecho de petición no se agota en la aplicación de los términos y reglas previstas en la ley. En la Fiscalía General de la Nación, también se integra a los lineamientos institucionales de atención al usuario, orientados a facilitar el acceso de las personas a los servicios de la Entidad, recibir sus solicitudes por los canales habilitados, brindar información y orientación, y encauzar los requerimientos conforme a las competencias institucionales.", "La Unidad 1 permitió reconocer la naturaleza del derecho de petición, sus modalidades, requisitos, términos y reglas generales de trámite. Esta lección avanza hacia su gestión institucional mediante el estudio de los canales de atención, los valores que orientan la atención a los usuarios, las competencias de los servidores y los lineamientos generales y diferenciales previstos en el Manual de Atención al Usuario.", "La Política de Atención al Ciudadano y el derecho de petición se articulan porque ambos exigen que las personas puedan relacionarse efectivamente con la Entidad. Esta relación implica identificar las necesidades del usuario, suministrar información u orientación dentro del marco de las competencias institucionales, recibir o canalizar las solicitudes y evitar barreras que dificulten el acceso a los servicios de la Fiscalía General de la Nación.", "Los criterios para elaborar respuestas de fondo, claras, completas, congruentes, motivadas y oportunas; las reglas para el manejo de información sensible, reservada y datos personales; y la trazabilidad y comunicación de las respuestas se desarrollarán en las lecciones siguientes de esta unidad."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "sub", "x": "Objetivo de la lección"}, {"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}, {"t": "p", "s": [3], "c": "", "n": 0}, {"t": "p", "s": [4], "c": "", "n": 0}], "items": [{"label": "Política de Atención al Ciudadano y derecho de petición", "segs": [0, 1, 2, 3, 4], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Política de Atención al Ciudadano y derecho de petición", "grupo": null, "titulos_fuente": ["Política de Atención al Ciudadano y derecho de petición"], "encabezados": [], "mediacion": "", "rotulos": ["Política de Atención al Ciudadano y derecho de petición"], "titulo_genially": "Política de Atención al Ciudadano y derecho de petición", "complemento_genially": "", "apartado": "Política de Atención al Ciudadano y derecho de petición", "guia": "Lea el contenido."}, {"layout": "rejilla", "segmentos": ["La atención al usuario en la Fiscalía General de la Nación es transversal a todos los procesos en los que existe interacción con las personas usuarias. Su finalidad es contribuir a garantizar el ejercicio efectivo del derecho de acceso a la justicia, mediante mecanismos que permitan recibir solicitudes, brindar información, orientar, remitir y facilitar el acceso a los servicios institucionales.", "El derecho de petición constituye una de las formas mediante las cuales las personas se relacionan con la Entidad. A través de este derecho pueden solicitar, entre otras actuaciones, información, copias, servicios, intervenciones institucionales, reconocimiento de derechos, atención de quejas y reclamos. La gestión adecuada de estas solicitudes requiere que la Entidad reciba la comunicación, identifique su objeto y la canalice o atienda conforme al trámite aplicable.", "La atención al usuario no equivale a decidir de fondo toda solicitud en el momento del contacto. Comprende, según el caso, escuchar o leer la solicitud, analizar la necesidad expuesta, determinar el servicio requerido y orientar, remitir, recibir una denuncia o efectuar la actuación que corresponda dentro de las funciones de la Entidad."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Transversal a todos los procesos", "segs": [0], "obj": "personas"}, {"label": "Una de las formas de relacionarse con la Entidad", "segs": [1], "obj": "documento"}, {"label": "No equivale a decidir de fondo toda solicitud", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "1. Atención al usuario y derecho de petición", "grupo": null, "titulos_fuente": ["1. Atención al usuario y derecho de petición"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Transversal a todos los procesos", "Una de las formas de relacionarse con la Entidad", "No equivale a decidir de fondo toda solicitud"], "titulo_genially": "Atención al usuario y derecho de petición", "complemento_genially": "", "apartado": "1. Atención al usuario y derecho de petición", "bloques_fuente": [71, 74], "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "esquema", "segmentos": ["Los canales de atención son los mecanismos de acceso establecidos por la Fiscalía General de la Nación a través de los cuales los usuarios pueden solicitar los servicios de la Entidad. El Manual de Atención al Usuario reconoce los siguientes canales:", "Canal virtual. Medio digital que permite a los usuarios relacionarse con la Entidad mediante la página web institucional y los servicios habilitados en ella.", "Canal telefónico. Medio de comunicación no presencial a través del cual los usuarios pueden interactuar con servidores, contratistas o colaboradores externos por las líneas telefónicas o similares dispuestas para tal fin.", "Canal escrito. Medio de comunicación mediante correo físico, postal o correo electrónico institucional. Incluye las ventanillas únicas de correspondencia, dispuestas para recibir comunicaciones escritas de los usuarios.", "Canal presencial. Medio de contacto personalizado entre los usuarios y la Entidad en las instalaciones y sedes de la Fiscalía General de la Nación.", "La disponibilidad de diversos canales permite que las personas accedan a los servicios institucionales de acuerdo con sus condiciones y necesidades. La atención debe facilitar el uso del canal pertinente y evitar que las personas sean sometidas a exigencias innecesarias para presentar una solicitud o acceder a orientación."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Canal virtual", "segs": [1], "obj": "computador"}, {"label": "Canal telefónico", "segs": [2], "obj": "telefono"}, {"label": "Canal escrito", "segs": [3], "obj": "documento"}, {"label": "Canal presencial", "segs": [4], "obj": "personas"}, {"label": "La disponibilidad de diversos canales", "segs": [5], "obj": "carpetas"}]}], "rotulo": "Canales de atención", "seccion": "2. Canales de atención", "grupo": null, "titulos_fuente": ["2. Canales de atención"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Canal virtual", "Canal telefónico", "Canal escrito", "Canal presencial", "La disponibilidad de diversos canales"], "titulo_genially": "Canales de atención", "complemento_genially": "", "apartado": "2. Canales de atención", "bloques_fuente": [75, 81], "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "descarga": {"href": "documentos/mapa-u2-l1-p03.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Canales de atención (imagen PNG)", "lamina": true}, "guia": "Recorra el mapa conceptual: haga clic en cada concepto para leer su texto."}, {"layout": "compacta", "segmentos": ["Los valores que orientan la atención a los usuarios por parte de los servidores de la Fiscalía General de la Nación son los establecidos en el Código de Ética de la Entidad y recogidos en el Manual de Atención al Usuario:", "Servicio al bien general. La finalidad de la labor del servidor es la prevalencia del bien general sobre el logro de bienes particulares o personales, promover la justicia, reconocer la igualdad ante la ley y tratar a los demás con equidad e imparcialidad.", "Legalidad. Las acciones del servidor se guían por los principios de legalidad e integridad ética, y deben ser transparentes y abiertas al escrutinio.", "Respeto. Implica reconocer, aceptar, apreciar y valorar las cualidades de las demás personas y sus derechos.", "Confidencialidad. Exige el manejo cuidadoso y responsable de la información reservada de la Entidad, de las personas, las organizaciones y los temas institucionales.", "Conocimiento. La atención al usuario debe sustentarse en un conocimiento adecuado y actualizado de las funciones que corresponden al servidor en la Entidad.", "Compromiso. Es la disposición para cumplir las responsabilidades del trabajo utilizando al máximo las competencias del servidor.", "Calidad. Supone realizar las actividades de manera adecuada, eficaz y productiva, con uso apropiado de los recursos y del tiempo disponible.", "En la gestión del derecho de petición, estos valores orientan la identificación de las necesidades del usuario, el suministro de información oportuna y precisa, la orientación sobre las competencias institucionales, el tratamiento responsable de la información y la atención respetuosa de las solicitudes presentadas por los diferentes canales."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3], [4]]}, {"rot": null, "celdas": [[5], [6], [7]]}], "columnas": 4, "repetidos": []}, {"t": "p", "s": [8], "c": "", "n": 0}], "items": [{"label": "Valores que orientan la atención", "segs": [0, 8], "clase": "flujo", "obj": "documento"}, {"label": "Servicio al bien general", "segs": [1], "clase": "celda", "obj": "personas"}, {"label": "Legalidad", "segs": [2], "clase": "celda", "obj": "libros"}, {"label": "Respeto", "segs": [3], "clase": "celda", "obj": "personas"}, {"label": "Confidencialidad", "segs": [4], "clase": "celda", "obj": "escudo"}, {"label": "Conocimiento", "segs": [5], "clase": "celda", "obj": "libros"}, {"label": "Compromiso", "segs": [6], "clase": "celda", "obj": "documento"}, {"label": "Calidad", "segs": [7], "clase": "celda", "obj": "reloj"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["personas", "computador", "escudo"]}], "rotulo": null, "seccion": "3. Valores que orientan la atención", "grupo": null, "titulos_fuente": ["3. Valores que orientan la atención"], "encabezados": [], "mediacion": "Página compacta: malla de ventanas, lectura en una columna", "rotulos": ["Servicio al bien general", "Legalidad", "Respeto", "Confidencialidad", "Conocimiento", "Compromiso", "Calidad"], "titulo_genially": "Valores que orientan la atención", "complemento_genially": "", "apartado": "3. Valores que orientan la atención", "bloques_fuente": [82, 91], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}, {"layout": "compacta", "segmentos": ["Los servidores que interactúan con usuarios deben identificar sus necesidades, dar respuesta amable y respetuosa a sus inquietudes y buscar la resolución oportuna de sus requerimientos. Asimismo, deben mantener una actitud permanente de servicio, informar y orientar a las víctimas frente a los procesos y sus derechos, proporcionar información oportuna y precisa y ofrecer una atención con enfoque diferencial.", "La orientación consiste en explicar, en lenguaje claro y sencillo, las competencias de la Fiscalía General de la Nación y los requerimientos que la Entidad puede atender. Cuando el asunto sea ajeno a la Entidad, debe brindarse información completa y precisa para que el usuario conozca cómo actuar o qué decisiones adoptar, sugiriendo, cuando sea posible, la opción adecuada de acuerdo con sus necesidades.", "La remisión consiste en informar al usuario sobre las dependencias de la Entidad u otras instituciones que podrían ser competentes para atender su solicitud. Cuando corresponda, también implica poner en conocimiento de dichas dependencias o entidades el requerimiento presentado por el ciudadano, de acuerdo con las reglas aplicables.", "Orientar y remitir no significan decidir sobre el fondo de un asunto que corresponde a otra dependencia o autoridad. Estas actuaciones deben facilitar que la persona identifique el canal, la dependencia competente o el procedimiento procedente, sin atribuir a la Fiscalía facultades que no le corresponden ni crear expectativas sobre decisiones futuras."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}, {"t": "p", "s": [3], "c": "", "n": 0}], "items": [{"label": "Competencias para la atención al usuario", "segs": [0, 1, 2, 3], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["casa", "personas", "reloj"]}], "rotulo": null, "seccion": "4. Competencias para la atención al usuario", "grupo": null, "titulos_fuente": ["4. Competencias para la atención al usuario"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Competencias para la atención al usuario"], "titulo_genially": "Competencias para la atención al usuario", "complemento_genially": "", "apartado": "4. Competencias para la atención al usuario", "bloques_fuente": [92, 96], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}, {"layout": "ruta", "segmentos": ["La atención a los usuarios debe partir de la identificación de sus necesidades a partir de lo que verbalicen, escriban o expresen mediante lengua de señas. De acuerdo con el canal de atención, la gestión comprende escuchar la solicitud o realizar la lectura de la información, analizar la necesidad del usuario y determinar el servicio requerido.", "A través de cualquiera de los canales de atención, se deben observar, entre otras, las siguientes recomendaciones:", "Atender a las personas en su orden de llegada, respetando a quienes requieran prioridad.", "Identificar las necesidades del usuario a partir de lo que verbalice, escriba o exprese mediante lenguaje de señas.", "Brindar una atención completa y exclusiva durante el tiempo del contacto.", "Evitar formular juicios de valor sobre la situación presentada por el usuario.", "No utilizar frases afectuosas u ofensivas hacia los usuarios.", "No crear falsas expectativas frente a posibles situaciones o resultados.", "Estos lineamientos contribuyen a que la atención sea respetuosa y adecuada. No sustituyen las reglas jurídicas que rigen la competencia, los términos y el contenido de las respuestas a derechos de petición; permiten, en cambio, que las personas sean escuchadas, orientadas y canalizadas de manera coherente con sus necesidades y con las competencias institucionales."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Identificar las necesidades de los usuarios", "segs": [0], "obj": "lupa"}, {"label": "Recomendaciones en cualquiera de los canales", "segs": [1, 2, 3, 4], "obj": "personas"}, {"label": "Evitar juicios de valor y falsas expectativas", "segs": [5, 6, 7], "obj": "escudo"}, {"label": "Una atención respetuosa y adecuada", "segs": [8], "obj": "carpetas"}]}], "rotulo": null, "seccion": "5. Lineamientos generales de atención", "grupo": null, "titulos_fuente": ["5. Lineamientos generales de atención"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Identificar las necesidades de los usuarios", "Recomendaciones en cualquiera de los canales", "Evitar juicios de valor y falsas expectativas", "Una atención respetuosa y adecuada"], "titulo_genially": "Lineamientos generales de atención", "complemento_genially": "", "apartado": "5. Lineamientos generales de atención", "bloques_fuente": [97, 106]}, {"layout": "esquema", "segmentos": ["La Fiscalía General de la Nación aplica un enfoque diferencial en la atención a los usuarios, considerando sus necesidades particulares y el contexto desde el cual realizan el requerimiento. El Manual de Atención al Usuario se refiere, entre otras, a las siguientes categorías: edad, discapacidad, pertenencia étnica, identidad de género diversa y orientación sexual.", "El enfoque diferencial exige reconocer que las personas, familias, comunidades, etnias o grupos sociales pueden tener particularidades que hacen necesario proponer acciones de prevención y atención integral frente a situaciones que constituyan riesgo, amenaza o vulneración de sus derechos. La interseccionalidad reconoce la confluencia de múltiples características identitarias que pueden requerir un tratamiento específico y diferenciado.", "En la gestión del derecho de petición, este enfoque se concreta en una atención que considere las barreras de comunicación, acceso, comprensión o movilidad que puedan afectar al usuario. Por ejemplo, la Entidad cuenta con mecanismos de atención que permiten a personas sordas o con hipoacusia recibir orientación, información y presentar peticiones mediante videollamada en Lengua de Señas Colombiana.", "La aplicación del enfoque diferencial no modifica las reglas de competencia, los procedimientos ni los términos legales. Exige que la orientación, la comunicación y el acceso a los canales institucionales se desarrollen de manera que las personas puedan comprender la información, formular sus requerimientos y conocer las actuaciones que se adopten frente a ellos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Necesidades particulares y contexto", "segs": [0], "obj": "personas"}, {"label": "Particularidades de personas, familias y comunidades", "segs": [1], "obj": "escudo"}, {"label": "Barreras de comunicación, acceso, comprensión o movilidad", "segs": [2], "obj": "escalones"}, {"label": "No modifica las reglas de competencia", "segs": [3], "obj": "libros"}]}], "rotulo": null, "seccion": "6. Atención con enfoque diferencial", "grupo": null, "titulos_fuente": ["6. Atención con enfoque diferencial"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Necesidades particulares y contexto", "Particularidades de personas, familias y comunidades", "Barreras de comunicación, acceso, comprensión o movilidad", "No modifica las reglas de competencia"], "titulo_genially": "Atención con enfoque diferencial", "complemento_genially": "", "apartado": "6. Atención con enfoque diferencial", "bloques_fuente": [107, 111], "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "descarga": {"href": "documentos/mapa-u2-l1-p07.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Atención con enfoque diferencial (imagen PNG)", "lamina": true}, "guia": "Recorra el mapa conceptual: haga clic en cada concepto para leer su texto."}, {"layout": "compacta", "segmentos": ["Una persona mayor acude a una sede de la Fiscalía General de la Nación para preguntar por el estado de una solicitud escrita presentada días antes. Manifiesta que no utiliza correo electrónico ni plataformas virtuales y que no comprende a qué dependencia debe dirigirse. La persona encargada de la atención le indica, sin revisar la información disponible, que consulte la página web y presente nuevamente la solicitud por Internet.", "La atención descrita no responde a los lineamientos institucionales. La persona encargada debe identificar la necesidad expuesta, brindar una orientación respetuosa y precisa sobre el canal o la dependencia competente y evitar imponer cargas innecesarias. Si la solicitud ya fue presentada, corresponde orientar sobre la consulta del radicado o sobre el estado que pueda informarse conforme a las competencias y reglas aplicables.", "La edad de la persona y la dificultad manifestada para utilizar canales virtuales requieren considerar las condiciones particulares de atención. Ello no implica garantizar un resultado determinado respecto de la solicitud ni sustituir la decisión de la dependencia competente. Implica facilitar el acceso al canal institucional procedente, proporcionar información comprensible y encauzar el requerimiento de manera adecuada."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": []}, {"t": "sub", "x": "Análisis"}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "Caso de aplicación", "segs": [1, 2], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0], "clase": "celda", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["megafono", "personas", "expediente"]}], "rotulo ión exige identificar la necesidad de la persona, actuar conforme a las competencias institucionales, orientar o remitir cuando corresponda y ofrecer un trato basado en el servicio al bien general, la legalidad, el respeto, la confidencialidad, el conocimiento, el compromiso y la calidad."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}], "items": [{"label": "Idea clave", "segs": [0], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Idea clave", "grupo": null, "titulos_fuente": ["Idea clave"], "encabezados": [], "mediacion": "", "rotulos": ["Idea clave"], "titulo_genially": "Idea clave y conclusión", "complemento_genially": "", "apartado": "Idea clave", "guia": "Lea el contenido.", "ilustracion": "red-portada.webp", "pestana": "Idea clave"}, {"layout": "compacta", "segmentos": ["La Política de Atención al Ciudadano y los lineamientos del Manual de Atención al Usuario permiten comprender que la gestión del derecho de petición empieza con una relación institucional accesible, respetuosa y orientada a las necesidades de las personas. La atención debe facilitar el acceso a los canales disponibles, identificar la solicitud, brindar información u orientación y canalizar el requerimiento conforme a las competencias de la Entidad.", "Los valores institucionales, las competencias de los servidores, los lineamientos generales de atención y el enfoque diferencial orientan la forma en que la Fiscalía se relaciona con los usuarios. Su aplicación contribuye a reducir barreras de acceso, evitar trámites innecesarios y asegurar que las personas conozcan los mecanismos institucionales disponibles para plantear sus necesidades.", "La siguiente lección profundizará en la gestión para la elaboración de respuestas de fondo, motivadas, completas y oportunas, aplicables a los derechos de petición dirigidos a la Fiscalía General de la Nación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "Conclusión", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Conclusión", "grupo": null, "titulos_fuente": ["Conclusión"], "encabezados": [], "mediacion": "", "rotulos": ["Conclusión"], "titulo_genially": "Idea clave y conclusión", "complemento_genially": "", "apartado": "Conclusión", "guia": "Lea el contenido.", "ilustracion": "red-portada.webp", "pestana": "Conclusión"}]}]}</script>
