<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "dpt-juego-u3-l2", "niveles": ["Observador", "Analista", "Garante del derecho", "Referente en tutela"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dpt", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 3 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 3, "lesson": 2, "heading": "Lección 3.2. Identificación de procedencia: subsidiariedad e inmediatez, legitimación por activa y por pasiva", "scenes": [{"layout": "lamina", "segmentos": ["Identificar los requisitos de legitimación por activa y por pasiva, inmediatez y subsidiariedad aplicables a la acción de tutela, con el fin de analizar los hechos, el derecho fundamental invocado y las circunstancias relevantes para determinar su procedencia."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "escalones", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "Objetivo de la lección", "grupo": null, "titulos_fuente": ["Objetivo de la lección"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "Objetivo de la lección", "bloques_fuente": [113, 113]}, {"layout": "compacta", "segmentos": ["La procedencia de la acción de tutela exige verificar, entre otros aspectos, la legitimación en la causa por activa y por pasiva, la inmediatez y la subsidiariedad. Estos requisitos deben examinarse de manera integral y de acuerdo con las circunstancias particulares de cada caso. Su valoración corresponde al juez constitucional y no se reduce a la aplicación mecánica de fórmulas generales."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}], "items": [{"label": "Requisitos de procedencia", "segs": [0], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["expediente", "personas", "lupa"], "escenario": true}], "rotulo": null, "seccion": "Requisitos de procedencia", "grupo": null, "titulos_fuente": ["Requisitos de procedencia"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Requisitos de procedencia"], "titulo_genially": "Requisitos de procedencia", "complemento_genially": "", "apartado": "Requisitos de procedencia", "bloques_fuente": [114, 115], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "red-portada.webp"}, {"layout": "rejilla", "segmentos": ["La legitimación por activa se refiere a la persona que puede presentar la tutela. Por regla general, puede hacerlo quien considera amenazado o vulnerado su derecho, directamente o mediante representante. También existen otras formas permitidas por la ley: por ejemplo, una persona puede actuar como agente oficioso cuando el titular no está en condiciones de promover su propia defensa y esa circunstancia se manifiesta en la solicitud; en este caso, un tercero es quien interpone la tutela, en nombre del aquel que no puede hacerlo. La tutela no exige, como regla general, contratar un abogado para presentarla.", "La legitimación por activa se refiere a la facultad de quién puede promover la acción de tutela en defensa de derechos fundamentales. El artículo 10 del Decreto 2591 de 1991 establece que la acción puede ser ejercida, en todo momento y lugar, por cualquier persona vulnerada o amenazada en uno de sus derechos fundamentales, quien puede actuar por sí misma o por medio de representante. La norma contempla también la agencia oficiosa cuando el titular no está en condiciones de promover su propia defensa (Decreto 2591 de 1991, art. 10).", "El análisis de este requisito exige verificar que quien promueve el amparo tenga un interés cierto, directo y particular respecto de los derechos cuya protección solicita, o que actúe en una de las formas de representación legalmente admitidas. Esta verificación no implica anticipar la decisión sobre el fondo del asunto; permite establecer si la persona que presenta la acción se encuentra habilitada para activar el control constitucional."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Quién puede presentar la tutela", "segs": [0], "obj": "personas"}, {"label": "Lo que dice el artículo 10 del Decreto 2591", "segs": [1], "obj": "libros"}, {"label": "Un interés cierto, directo y particular", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "Legitimación por activa", "grupo": null, "titulos_fuente": ["Legitimación por activa"], "encabezados": [], "mediacion": "", "rotulos": ["Legitimación por activa"], "titulo_genially": "Legitimación por activa", "complemento_genially": "", "apartado": "Legitimación por activa", "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "compacta", "segmentos": ["La legitimación por pasiva exige que la acción se dirija contra la autoridad pública o, en los casos legalmente previstos, contra el particular cuya acción u omisión se identifica como causa de la amenaza o vulneración del derecho fundamental. Este requisito exige establecer si la entidad accionada tiene relación con los hechos alegados y si cuenta con competencia, atribuciones o capacidad material para adoptar medidas orientadas a cesar la afectación o restablecer el derecho.", "Ejemplo. Una persona afirma que presentó una petición ante una dependencia y no obtuvo respuesta. Para comprender quiénes intervienen, se identifica a la persona que reclama la protección del derecho de petición y a la autoridad a la que atribuye la falta de respuesta.", "Para el servidor que recibe la comunicación, estos conceptos sirven para reconocer a los intervinientes y localizar los antecedentes. No lo autorizan a rechazar el requerimiento judicial porque considere que el solicitante no está legitimado o que su dependencia no causó la afectación. Esas circunstancias deben ponerse en conocimiento de la instancia competente para la respuesta institucional; la decisión corresponde al juez. En el caso de la Fiscalía General de la Nación, la identificación de la legitimación por pasiva requiere verificar la dependencia responsable de la actuación cuestionada, la naturaleza administrativa o misional de la conducta alegada y la existencia de competencias institucionales relacionadas con los hechos objeto de tutela."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}], "items": [{"label": "Legitimación por pasiva", "segs": [0, 1], "clase": "flujo", "obj": "documento"}, {"label": "Para el servidor que recibe la comunicación", "segs": [2], "clase": "celda", "obj": "escudo"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Legitimación por pasiva", "grupo": null, "titulos_fuente": ["Legitimación por pasiva"], "encabezados": [], "mediacion": "", "rotulos": ["Legitimación por pasiva"], "titulo_genially": "Legitimación por pasiva", "complemento_genially": "", "apartado": "Legitimación por pasiva", "guia": "Lea el contenido y abra el recuadro."}, {"layout": "compacta", "segmentos": ["La tutela busca proteger derechos de manera inmediata. Por esa razón, el juez examina si la persona acudió a ella dentro de un tiempo razonable frente a la amenaza o vulneración que alega. A esta relación entre los hechos y el momento de solicitar protección se le llama inmediatez.", "Ejemplo. Una persona solicita protección por una actuación ocurrida meses atrás. Esa fecha, por sí sola, no permite concluir que la tutela es tardía: puede haber una afectación que continúa o circunstancias que expliquen la demora. Corresponde al juez valorar si el plazo es razonable en el caso concreto.", "No existe un término general de caducidad de la tutela. Por ello, no es correcto afirmar que toda tutela presentada después de un número fijo de días o meses debe rechazarse. El juez considera las circunstancias: cuándo ocurrieron los hechos, si la afectación continúa, qué obstáculos tuvo la persona para acudir a la justicia y si existen razones que expliquen el tiempo transcurrido.", "No debe confundirse la inmediatez con el plazo para responder un requerimiento judicial. La primera se refiere al tiempo en que la persona acude a la tutela; el segundo, al tiempo que el despacho concede para atender su comunicación. Aunque un servidor considere antiguos los hechos, debe canalizar el requerimiento oportunamente y aportar las fechas y soportes que correspondan a sus funciones.", "La Constitución y el Decreto 2591 de 1991 no establecen un término de caducidad para presentar la acción de tutela. No obstante, la jurisprudencia constitucional ha desarrollado el requisito de inmediatez, según el cual la acción debe interponerse dentro de un plazo razonable contado desde la ocurrencia de los hechos que originan la presunta amenaza o vulneración.", "La inmediatez se deriva de la finalidad de protección urgente e inmediata del mecanismo. Su análisis no se reduce a una verificación aritmética del tiempo transcurrido, sino que exige valorar las circunstancias del caso, las razones de la demora, la persistencia de la afectación, la situación de vulnerabilidad de la persona y la posible incidencia sobre derechos de terceros o sobre la seguridad jurídica.", "La Corte Constitucional ha precisado que el plazo razonable debe apreciarse en cada caso concreto. La ausencia de un término fijo no autoriza a promover la acción de tutela sin conexión temporal con los hechos que se consideran lesivos. A su vez, el transcurso del tiempo no determina por sí solo la improcedencia cuando existen circunstancias que justifican la presentación posterior o cuando la vulneración se mantiene en el tiempo."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "sub", "x": "¿por qué importa el tiempo transcurrido?"}, {"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Inmediatez", "segs": [0, 1], "clase": "flujo", "obj": "documento"}, {"label": "No hay un término fijo", "segs": [2], "clase": "celda", "obj": "reloj"}, {"label": "No es el plazo del requerimiento", "segs": [3], "clase": "celda", "obj": "documento"}, {"label": "Lo que ha dicho la Corte", "segs": [4, 5, 6], "clase": "celda", "obj": "libros"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Inmediatez", "grupo": null, "titulos_fuente": ["Inmediatez"], "encabezados": [], "mediacion": "", "rotulos": ["Inmediatez"], "titulo_genially": "Inmediatez", "complemento_genially": "", "apartado": "Inmediatez", "guia": "Lea el ejemplo y abra cada recuadro."}, {"layout": "esquema", "segmentos": ["La tutela no está diseñada para reemplazar todos los procesos judiciales ni para permitir que se eluda, sin justificación, la vía que el ordenamiento prevé para resolver un conflicto. Su carácter subsidiario significa que el juez debe examinar si existe otro mecanismo judicial capaz de proteger el derecho en las circunstancias del caso.", "La existencia de otro proceso no impide automáticamente la tutela. Deben distinguirse tres situaciones: (i) no existe otro medio judicial de protección; (ii) existe, pero no resulta idóneo o eficaz para proteger el derecho en el caso concreto; o (iii) existe un medio idóneo y eficaz, pero se necesita una protección transitoria para evitar un perjuicio irremediable.", "Un mecanismo es idóneo cuando puede resolver el problema y proteger el derecho comprometido. Es eficaz cuando, atendidas las circunstancias de la persona y del caso, puede brindar una protección efectiva. Un perjuicio irremediable no es cualquier molestia o inconveniente: supone un riesgo de daño inminente y grave que exige medidas urgentes y una protección que no puede posponerse. Su valoración corresponde al juez. Ejemplo. Frente a una controversia que puede discutirse en un proceso judicial ordinario, no basta con indicar que ese proceso existe. Debe examinarse si permite proteger efectivamente el derecho y si la persona enfrenta un riesgo que justifique una intervención urgente. Estas verificaciones requieren valorar las circunstancias concretas; no pueden resolverse mediante una fórmula automática.", "Para quienes no tienen a cargo la valoración jurídica o la defensa institucional, comprender la subsidiariedad significa reconocer por qué pueden solicitarse antecedentes sobre otros procesos y sobre la situación del solicitante. No significa exigir al ciudadano que agote cualquier trámite antes de recibir su comunicación, ni omitir la remisión de una tutela porque se conoce otra vía judicial La subsidiariedad constituye una condición central de procedencia. Conforme al artículo 86 de la Constitución Política y al numeral 1 del artículo 6 del Decreto 2591 de 1991, la tutela no procede cuando existan otros recursos o medios de defensa judiciales, salvo que se utilice como mecanismo transitorio para evitar un perjuicio irremediable (Constitución Política de Colombia, 1991, art. 86; Decreto 2591 de 1991, art. 6). El examen de subsidiariedad exige determinar si existe otro mecanismo judicial y si dicho mecanismo resulta idóneo y eficaz para proteger los derechos fundamentales en las circunstancias particulares del caso. La existencia formal de un medio judicial no excluye automáticamente la procedencia de la tutela; el juez debe analizar si ese mecanismo ofrece una protección adecuada y oportuna frente a la afectación alegada. Cuando existe un medio ordinario idóneo y eficaz, la tutela es improcedente como mecanismo principal. De manera excepcional, puede proceder como mecanismo transitorio cuando se demuestre la existencia de un perjuicio irremediable."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "No reemplaza todos los procesos", "segs": [0], "obj": "libros"}, {"label": "Tres situaciones", "segs": [1], "obj": "carpetas"}, {"label": "Idóneo, eficaz y perjuicio irremediable", "segs": [2], "obj": "lupa"}, {"label": "Para quien no hace la defensa", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Subsidiariedad", "grupo": null, "titulos_fuente": ["Subsidiariedad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Subsidiariedad"], "titulo_genially": "Subsidiariedad", "complemento_genially": "", "apartado": "Subsidiariedad", "guia": "Recorra el mapa conceptual: haga clic en cada concepto para leer su texto.", "objeto_raiz": "balanza", "objetos_raiz": ["balanza", "personas", "documento"], "descarga": {"href": "documentos/mapa-u3-l2-p06.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Subsidiariedad (imagen PNG)", "lamina": true}}, {"layout": "esquema", "segmentos": ["La existencia de otro medio de defensa judicial no excluye, de manera absoluta, el uso de la tutela. El artículo 86 constitucional permite su utilización como mecanismo transitorio para evitar un perjuicio irremediable. En este supuesto, el juez constitucional debe establecer si la afectación alegada requiere una medida urgente mientras la persona acude o continúa ante el mecanismo judicial ordinario.", "La procedencia transitoria no convierte la tutela en un mecanismo alternativo de resolución definitiva de controversias. Su finalidad consiste en adoptar una medida de protección provisional frente a una afectación que, por su inminencia, gravedad, urgencia e impostergabilidad, no puede esperar la decisión del medio judicial ordinario.", "El perjuicio irremediable no se configura ante cualquier afectación o inconveniente. Exige demostrar que el daño tiene características que justifican la intervención urgente del juez constitucional. La jurisprudencia ha empleado cuatro criterios para valorar su existencia:", "Inminencia: el daño debe estar próximo a ocurrir; no basta la formulación de una hipótesis remota o eventual.", "Gravedad: la afectación debe tener una intensidad significativa sobre los derechos fundamentales o sobre las condiciones de vida de la persona.", "Urgencia: las medidas requeridas deben ser inmediatas para evitar o mitigar el daño.", "Impostergabilidad: la intervención no puede esperar la decisión que se adopte a través de los mecanismos judiciales ordinarios."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Un mecanismo transitorio", "segs": [0, 1], "obj": "reloj"}, {"label": "El perjuicio irremediable", "segs": [2], "obj": "escudo"}, {"label": "Inminencia", "segs": [3], "obj": "lupa"}, {"label": "Gravedad", "segs": [4], "obj": "personas"}, {"label": "Urgencia", "segs": [5], "obj": "telefono"}, {"label": "Impostergabilidad", "segs": [6], "obj": "documento"}]}], "rotulo": null, "seccion": "Tutela como mecanismo transitorio y perjuicio irremediable", "grupo": null, "titulos_fuente": ["Tutela como mecanismo transitorio y perjuicio irremediable"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Un mecanismo transitorio", "El perjuicio irremediable", "Inminencia", "Gravedad", "Urgencia", "Impostergabilidad"], "titulo_genially": "Tutela como mecanismo transitorio y perjuicio irremediable", "complemento_genially": "", "apartado": "Tutela como mecanismo transitorio y perjuicio irremediable", "bloques_fuente": [130, 137], "objeto_raiz": "tribunal", "objetos_raiz": ["tribunal", "personas", "documento"], "descarga": {"href": "documentos/mapa-u3-l2-p07.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Tutela como mecanismo transitorio y perjuicio irremediable (imagen PNG)", "lamina": true}}, {"layout": "compacta", "segmentos": ["La legitimación, la inmediatez y la subsidiariedad son condiciones que delimitan la procedencia de la acción de tutela. Su análisis exige atender a los hechos, al derecho fundamental invocado, a la conducta atribuida, a la capacidad de la autoridad accionada para adoptar medidas de protección y a las circunstancias concretas de la persona que solicita el amparo.", "La siguiente lección desarrolla reglas jurisprudenciales básicas sobre tutela contra autoridades públicas, tutela contra providencias judiciales, cosa juzgada constitucional, temeridad y especial protección constitucional."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Conclusión", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["megafono", "personas", "expediente"]}], "rotulo": null, "seccion": "Conclusión", "grupo": null, "titulos_fuente": ["Conclusión"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Conclusión"], "titulo_genially": "Conclusión", "complemento_genially": "", "apartado": "Conclusión", "bloques_fuente": [138, 140], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}, {"layout": "compacta", "segmentos": ["Antes de analizar los requisitos de procedencia de una acción de tutela, conviene verificar:", "¿Cuál es el derecho fundamental presuntamente amenazado o vulnerado?", "¿La situación plantea un riesgo inminente, grave, urgente e impostergable?", "¿Existen otros medios judiciales y resultan idóneos y eficaces en las circunstancias concretas?", "¿La persona enfrenta condiciones de edad, discapacidad, pertenencia étnica, privación de la libertad, condición de víctima u otra circunstancia de especial protección constitucional?", "¿Las condiciones particulares de la persona inciden en el análisis de subsidiariedad, inmediatez o perjuicio irremediable?", "¿La controversia exige valorar la procedencia de una medida transitoria para proteger un derecho mientras se adopta la decisión de fondo?", "¿Los hechos descritos permiten identificar una amenaza actual o una vulneración susceptible de protección constitucional?"], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "chequeo", "i": [1, 2, 3, 4, 5, 6, 7]}], "items": [{"label": "Lista de verificación", "segs": [0], "clase": "flujo", "obj": "documento"}, {"label": "¿Cuál es el derecho fundamental presuntamente amenazado o", "segs": [1], "clase": "chequeo", "obj": "documento"}, {"label": "¿La situación plantea un riesgo inminente, grave, urgente", "segs": [2], "clase": "chequeo", "obj": "documento"}, {"label": "¿Existen otros medios judiciales y resultan idóneos y", "segs": [3], "clase": "chequeo", "obj": "documento"}, {"label": "¿La persona enfrenta condiciones de edad, discapacidad, pertenencia", "segs": [4], "clase": "chequeo", "obj": "documento"}, {"label": "¿Las condiciones particulares de la persona inciden en", "segs": [5], "clase": "chequeo", "obj": "documento"}, {"label": "¿La controversia exige valorar la procedencia de una", "segs": [6], "clase": "chequeo", "obj": "documento"}, {"label": "¿Los hechos descritos permiten identificar una amenaza actual", "segs": [7], "clase": "chequeo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["personas", "documento", "carpetas"]}], "rotulo": null, "seccion": "Lista de verificación", "grupo": null, "titulos_fuente": ["Lista de verificación"], "encabezados": [], "mediacion": "Página compacta: lista de verificación con simulación, lectura en una columna", "rotulos": ["Lista de verificación"], "titulo_genially": "Lista de verificación", "complemento_genially": "", "apartado": "Lista de verificación", "bloques_fuente": [141, 149], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "descarga": {"href": "documentos/lista-u3-l2-p09.pdf", "rotulo": "Clic para descargar la lista", "nombre": "Lista de verificación (PDF)"}}]}</script>
