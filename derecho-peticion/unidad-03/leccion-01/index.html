<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "dpt-juego-u3-l1", "niveles": ["Observador", "Analista", "Garante del derecho", "Referente en tutela"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dpt", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 3 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 3, "lesson": 1, "heading": "Lección 3.1. Acción de tutela como mecanismo de protección de derechos fundamentales", "scenes": [{"layout": "lamina", "segmentos": ["Los apartados que siguen presentan la acción de tutela desde su fundamento constitucional, su finalidad de protección inmediata y su relación general con las acciones u omisiones de las autoridades públicas.\n\nReconocer la naturaleza constitucional, la finalidad y el alcance de la acción de tutela como mecanismo de protección inmediata de los derechos fundamentales, con el fin de identificar los elementos iniciales de una situación que puede ser sometida al control del juez constitucional."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "escudo", "acomp": ["tribunal", "documento"]}]}], "rotulo": null, "seccion": "Objetivo de la lección", "grupo": null, "titulos_fuente": ["Objetivo de la lección"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "Objetivo de la lección", "bloques_fuente": [73, 73], "textoFijo": true}, {"layout": "esquema", "segmentos": ["El artículo 86 de la Constitución Política consagra la acción de tutela como un mecanismo judicial orientado a obtener la protección inmediata de los derechos constitucionales fundamentales cuando resulten vulnerados o amenazados por la acción u omisión de una autoridad pública. La disposición constitucional prevé también su procedencia frente a particulares en los casos definidos por la ley.", "La tutela se caracteriza por su naturaleza preferente y sumaria. Estas características se relacionan con la necesidad de proporcionar una respuesta judicial eficaz frente a una amenaza o vulneración actual de derechos fundamentales. Sin embargo, su carácter expedito no implica que proceda automáticamente ante cualquier inconformidad con una actuación administrativa, judicial o funcional. La procedencia depende de que se satisfagan los requisitos constitucionales, legales y jurisprudenciales que delimitan su uso.", "El Decreto 2591 de 1991 reglamenta la acción de tutela y dispone, en su artículo 5, que procede contra toda acción u omisión de las autoridades públicas que haya vulnerado, vulnere o amenace vulnerar un derecho fundamental. La identificación de una presunta afectación exige establecer la conducta atribuida a la autoridad, el derecho fundamental invocado, la relación entre ambos elementos y la capacidad de la autoridad accionada para cesar la vulneración o adoptar medidas de protección.", "Para la Fiscalía General de la Nación, la tutela puede relacionarse con actuaciones administrativas, con la atención de solicitudes ciudadanas, con el acceso a información, con deberes de protección de derechos fundamentales o con otras actuaciones institucionales que, según las circunstancias del caso, puedan ser objeto de control constitucional. El hecho de que una tutela sea presentada contra la Entidad no permite anticipar la existencia de una vulneración ni releva a la dependencia competente del deber de responder al requerimiento judicial, aportar la información pertinente y ejecutar las órdenes que eventualmente se impartan."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El artículo 86 de la Constitución Política", "segs": [0], "obj": "libros"}, {"label": "Naturaleza preferente y sumaria", "segs": [1], "obj": "reloj"}, {"label": "El Decreto 2591 de 1991", "segs": [2], "obj": "documento"}, {"label": "Para la Fiscalía General de la Nación", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Naturaleza constitucional de la acción de tutela", "grupo": null, "titulos_fuente": ["Naturaleza constitucional de la acción de tutela"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El artículo 86 de la Constitución Política", "Naturaleza preferente y sumaria", "El Decreto 2591 de 1991", "Para la Fiscalía General de la Nación"], "titulo_genially": "Naturaleza constitucional de la acción de tutela", "complemento_genially": "", "apartado": "Naturaleza constitucional de la acción de tutela", "bloques_fuente": [74, 78], "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "documento", "carpetas"], "guia": "Recorra el mapa conceptual: haga clic en cada concepto para leer su texto.", "descarga": {"href": "documentos/mapa-u3-l1-p03.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Naturaleza constitucional de la acción de tutela (imagen PNG)", "lamina": true}}, {"layout": "rejilla", "segmentos": ["La finalidad de la acción de tutela es asegurar una protección judicial inmediata de los derechos fundamentales. Esta finalidad determina que el juez constitucional examine, en primer lugar, si el asunto plantea una controversia de relevancia constitucional y si existe una amenaza o vulneración susceptible de protección mediante este mecanismo.", "La tutela no es un mecanismo destinado a reemplazar de manera ordinaria los procedimientos administrativos, los recursos previstos por la ley, los medios de control ante la jurisdicción de lo contencioso administrativo ni los mecanismos procesales propios de otras jurisdicciones. El inciso tercero del artículo 86 constitucional establece que la acción procede cuando la persona no disponga de otro medio de defensa judicial, salvo que se utilice como mecanismo transitorio para evitar un perjuicio irremediable.", "Por tanto, el análisis de la tutela exige distinguir entre: (i) la existencia de un desacuerdo con una decisión o actuación institucional; (ii) la existencia de medios judiciales ordinarios para controvertirla; y (iii) la configuración de circunstancias excepcionales que justifiquen la intervención urgente del juez constitucional. Esta distinción preserva el carácter subsidiario de la tutela y evita que se convierta en una instancia adicional para revisar asuntos que deben tramitarse por los mecanismos judiciales ordinarios.", "La comprensión general del mecanismo permite reconocer que su activación se relaciona con actuaciones institucionales que pueden incidir directamente en la garantía de derechos fundamentales."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Una protección judicial inmediata", "segs": [0], "obj": "escudo"}, {"label": "No reemplaza de manera ordinaria los procedimientos", "segs": [1], "obj": "carpetas"}, {"label": "El análisis de la tutela exige distinguir", "segs": [2], "obj": "lupa"}, {"label": "Actuaciones que inciden en los derechos fundamentales", "segs": [3], "obj": "personas"}]}], "rotulo": null, "seccion": "Finalidad y alcance del mecanismo", "grupo": null, "titulos_fuente": ["Finalidad y alcance del mecanismo"], "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["Una protección judicial inmediata", "No reemplaza de manera ordinaria los procedimientos", "El análisis de la tutela exige distinguir", "Actuaciones que inciden en los derechos fundamentales"], "titulo_genially": "Finalidad y alcance del mecanismo", "complemento_genially": "", "apartado": "Finalidad y alcance del mecanismo", "bloques_fuente": [79, 83], "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "compara", "segmentos": ["La acción de tutela procede contra las acciones u omisiones de las autoridades públicas que vulneren o amenacen vulnerar derechos fundamentales. Esta regla comprende actuaciones administrativas, decisiones u omisiones relacionadas con la atención de solicitudes, la prestación de servicios, el acceso a información, el cumplimiento de deberes funcionales y otros comportamientos institucionales que tengan incidencia directa en la protección de derechos fundamentales.", "La procedencia de la tutela contra una autoridad pública no elimina la necesidad de aplicar los requisitos generales expuestos. El juez constitucional debe verificar la legitimación, la inmediatez y la subsidiariedad, además de establecer la existencia de una amenaza o vulneración susceptible de protección. Las autoridades accionadas, por su parte, deben responder los requerimientos judiciales con información completa, verificable y pertinente, sin perjuicio de las reservas legales que deban invocarse de manera motivada.", "En el marco de la Fiscalía General de la Nación, las tutelas relacionadas con el derecho de petición evidencian la importancia de que las solicitudes ciudadanas sean resueltas de fondo, dentro de los términos legales y con evidencia de su comunicación. Una respuesta tardía, incompleta, incongruente, inmotivada o no comunicada puede constituir el supuesto fáctico de una acción de tutela por presunta afectación del derecho fundamental de petición."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Acciones u omisiones de las autoridades públicas", "segs": [0], "obj": "documento", "ilus": "norma-competencia.webp"}, {"label": "Los requisitos generales se aplican", "segs": [1], "obj": "lupa", "ilus": "radicacion-terminos.webp"}, {"label": "Tutelas relacionadas con el derecho de petición", "segs": [2], "obj": "personas", "ilus": "dialogo-autoridades.webp"}]}], "rotulo": null, "seccion": "Tutela contra autoridades públicas", "grupo": null, "titulos_fuente": ["Tutela contra autoridades públicas"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["Acciones u omisiones de las autoridades públicas", "Los requisitos generales se aplican", "Tutelas relacionadas con el derecho de petición"], "titulo_genially": "Tutela contra autoridades públicas", "complemento_genially": "", "apartado": "Tutela contra autoridades públicas", "bloques_fuente": [84, 87], "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "giro", "segmentos": ["El análisis inicial de una tutela exige individualizar los hechos narrados por la persona accionante, el derecho fundamental cuya protección solicita, la actuación u omisión que atribuye a la autoridad o al particular y la relación que afirma entre esa conducta y la afectación alegada.", "La sola discrepancia con una decisión, la inconformidad frente a una interpretación normativa o la pretensión de sustituir un procedimiento ordinario no permiten, por sí mismas, concluir que existe una vulneración susceptible de amparo. La controversia debe plantear una cuestión de relevancia constitucional, vinculada con la amenaza o vulneración de un derecho fundamental."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Individualizar los hechos y el derecho", "segs": [0], "obj": "lupa"}, {"label": "La sola discrepancia con una decisión", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Identificación inicial del problema constitucional", "grupo": null, "titulos_fuente": ["Identificación inicial del problema constitucional"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Individualizar los hechos y el derecho", "La sola discrepancia con una decisión"], "titulo_genially": "Identificación inicial del problema constitucional", "complemento_genially": "", "apartado": "Identificación inicial del problema constitucional", "bloques_fuente": [88, 90]}, {"layout": "compacta", "segmentos": ["Una persona presenta una petición escrita ante la Fiscalía General de la Nación solicitando información sobre el estado de una comunicación anterior. Transcurrido el término legal, no recibe respuesta ni evidencia de que la Entidad haya comunicado una decisión. Posteriormente, presenta acción de tutela y solicita el amparo de su derecho fundamental de petición.", "El caso plantea, en principio, una controversia relacionada con el derecho de petición. La persona que formuló la solicitud y que alega no haber recibido respuesta cuenta con legitimación por activa para promover el amparo de su propio derecho. La Fiscalía General de la Nación, como autoridad destinataria de la petición y competente para responderla, puede estar legitimada por pasiva.", "La inmediatez debe analizarse teniendo en cuenta la fecha de la solicitud, el vencimiento del término legal y el momento de presentación de la tutela. La subsidiariedad requiere valorar si existe otro medio judicial idóneo y eficaz para obtener la protección inmediata del derecho de petición frente a la ausencia de respuesta.", "Ante una tutela de esta naturaleza, resulta relevante verificar si la solicitud fue recibida, tramitada, resuelta y comunicada conforme a las reglas aplicables. La gestión institucional del requerimiento judicial, la elaboración del informe y la acreditación de las actuaciones se desarrollarán en la Unidad 4."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": []}, {"t": "sub", "x": "Análisis"}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}, {"t": "p", "s": [3], "c": "", "n": 0}], "items": [{"label": "Caso de aplicación", "segs": [1, 2, 3], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0], "clase": "celda", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["personas", "paquete", "camara"], "escenario": true}], "rotulo": null, "seccion": "Caso de aplicación", "grupo": null, "titulos_fuente": ["Caso de aplicación", "Situación", "Análisis"], "encabezados": [], "mediacion": "Página compacta: malla de ventanas, lectura en una columna, subtítulos de la ficha", "rotulos": ["Situación", "Análisis", "Situación"], "titulo_genially": "Caso de aplicación", "complemento_genially": "", "apartado": "Caso de aplicación", "bloques_fuente": [91, 97], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "radicacion-terminos.webp", "casosAudio": [{"id": "u3l1c1", "titulo": "Caso de aplicación: la petición sin respuesta que llega a tutela", "url": "../comun/casos/index.html?caso=u3l1c1"}]}, {"layout": "compacta", "segmentos": ["Antes de emitir una respuesta o adoptar una decisión institucional que pueda incidir en derechos fundamentales, conviene verificar:", "¿La dependencia o el servidor tiene competencia para decidir o responder?", "¿Se identificaron todos los asuntos planteados y los derechos potencialmente involucrados?", "¿Se revisaron los antecedentes, los documentos y las pruebas relevantes?", "¿La decisión explica las razones de hecho y de derecho que la sustentan?", "¿Se verificaron las reglas especiales de reserva, protección de datos y acceso a la información?", "¿La respuesta contempla las condiciones particulares de la persona y posibles barreras de acceso?", "¿Se indicaron los canales, recursos o mecanismos pertinentes cuando la solicitud debe tramitarse por otra vía?", "¿La decisión se comunicará por un medio idóneo y quedará respaldada con evidencia de entrega?"], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "chequeo", "i": [1, 2, 3, 4, 5, 6, 7, 8]}], "items": [{"label": "Lista de verificación para decisiones y respuestas", "segs": [0], "clase": "flujo", "obj": "documento"}, {"label": "¿La dependencia o el servidor tiene competencia para", "segs": [1], "clase": "chequeo", "obj": "documento"}, {"label": "¿Se identificaron todos los asuntos planteados y los", "segs": [2], "clase": "chequeo", "obj": "documento"}, {"label": "¿Se revisaron los antecedentes, los documentos y las", "segs": [3], "clase": "chequeo", "obj": "documento"}, {"label": "¿La decisión explica las razones de hecho y", "segs": [4], "clase": "chequeo", "obj": "documento"}, {"label": "¿Se verificaron las reglas especiales de reserva, protección", "segs": [5], "clase": "chequeo", "obj": "documento"}, {"label": "¿La respuesta contempla las condiciones particulares de la", "segs": [6], "clase": "chequeo", "obj": "documento"}, {"label": "¿Se indicaron los canales, recursos o mecanismos pertinentes", "segs": [7], "clase": "chequeo", "obj": "documento"}, {"label": "¿La decisión se comunicará por un medio idóneo", "segs": [8], "clase": "chequeo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["megafono", "personas", "expediente"]}], "rotulo": null, "seccion": "Lista de verificación para decisiones y respuestas", "grupo": null, "titulos_fuente": ["Lista de verificación para decisiones y respuestas"], "encabezados": [], "mediacion": "Página compacta: lista de verificación con simulación, lectura en una columna", "rotulos": ["Lista de verificación para decisiones y respuestas"], "titulo_genially": "Lista de verificación para decisiones y respuestas", "complemento_genially": "", "apartado": "Lista de verificación para decisiones y respuestas", "bloques_fuente": [98, 107], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "descarga": {"href": "documentos/lista-u3-l1-p08.pdf", "rotulo": "Clic para descargar la lista", "nombre": "Lista de verificación para decisiones y respuestas (PDF)"}}, {"layout": "compacta", "segmentos": ["La acción de tutela es un mecanismo de protección inmediata de derechos fundamentales, pero su procedencia se encuentra delimitada por requisitos constitucionales y jurisprudenciales. La legitimación permite identificar a quien puede promover la acción y a la autoridad llamada a responder; la inmediatez preserva la finalidad urgente del amparo; y la subsidiariedad evita que la tutela sustituya los medios judiciales ordinarios, salvo en los eventos excepcionales previstos por el ordenamiento.", "La comprensión de estos requisitos permite a los servidores de la Fiscalía General de la Nación identificar el alcance de los requerimientos de tutela, aportar información pertinente al proceso judicial y adoptar medidas oportunas frente a actuaciones u omisiones que puedan afectar derechos fundamentales. La siguiente lección desarrollará los requisitos de legitimación por activa y por pasiva, inmediatez y subsidiariedad, así como la tutela como mecanismo transitorio para evitar un perjuicio irremediable."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Conclusión", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["personas", "documento", "carpetas"]}], "rotulo": null, "seccion": "Conclusión", "grupo": null, "titulos_fuente": ["Conclusión"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Conclusión"], "titulo_genially": "Conclusión", "complemento_genially": "", "apartado": "Conclusión", "bloques_fuente": [108, 110], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}]}</script>
