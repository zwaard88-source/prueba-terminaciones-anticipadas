<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-curso-inicio", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Inicio del curso"}, "leccion_rotulo": "Inicio del curso", "unit": 0, "lesson": 1, "heading": "Inicio del curso", "scenes": [{"layout": "fichas", "segmentos": ["Bienvenidos y bienvenidas al curso Investigación y judicialización de delitos contra el medio ambiente y los recursos naturales, un espacio de actualización y profundización orientado al fortalecimiento de las competencias de los servidores misionales que participan en la investigación y judicialización de conductas que afectan el medio ambiente y los recursos naturales.", "La protección del medio ambiente constituye uno de los desafíos actuales para la administración de justicia, en particular frente a fenómenos como la deforestación, la explotación ilícita de yacimientos mineros y la participación de estructuras de crimen organizado en actividades que generan graves afectaciones ambientales y sociales. En este contexto, la investigación de los delitos ambientales requiere una comprensión integral del marco jurídico, del territorio, de las dinámicas criminales y de los elementos técnicos y probatorios necesarios para la construcción de casos sólidos.", "Existe una falta de identificación de las problemáticas y dinámicas asociadas a la investigación y judicialización de delitos contra el medio ambiente y los recursos naturales, en especial de aquellas relacionadas con la explotación ilegal de yacimientos mineros y la deforestación bajo dinámicas propias de estructuras de crimen organizado, como el manejo de sus finanzas y la obtención ilícita de bienes con estos recursos.", "Se requiere una metodología apropiada para abordar estrategias investigativas con objetivos probatorios y valoración de los elementos materiales probatorios que permitan reducir el porcentaje de casos que llegan a juicio oral y favorecer la terminación anticipada de casos construidos de forma adecuada.", "A lo largo del curso se abordan diferentes herramientas jurídicas, investigativas y procesales con el fin de que el participante analice los delitos contra el medio ambiente y los recursos naturales, diseñe estrategias de investigación, valore elementos materiales probatorios y evidencia física, fortalezca la construcción de hipótesis y objetivos probatorios, y reconozca alternativas de justicia restaurativa y terminación anticipada del proceso."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Bienvenida", "segs": [0], "obj": "personas"}, {"label": "El desafío para la administración de justicia", "segs": [1], "obj": "escudo"}, {"label": "Lo que hace falta identificar", "segs": [2], "obj": "lupa"}, {"label": "Una metodología para investigar", "segs": [3], "obj": "carpetas"}, {"label": "Lo que aborda el curso", "segs": [4], "obj": "libros"}]}], "rotulo": null, "seccion": "Bienvenida al curso", "grupo": null, "titulos_fuente": [], "encabezados": [], "rotulos": ["Bienvenida", "El desafío para la administración de justicia", "Lo que hace falta identificar", "Una metodología para investigar", "Lo que aborda el curso"], "titulo_genially": "Bienvenida al curso", "complemento_genially": "", "apartado": "", "ilustracion": "ijda-daniela-curso-inicio.webp"}, {"layout": "fichas", "segmentos": ["El curso, que consta de cinco unidades, se desarrolla bajo modalidad virtual y con carácter autónomo. Tiene una intensidad total de 48 horas, distribuidas de la siguiente manera:", "a) 8 horas de acompañamiento del formador.", "b) 40 horas de trabajo autónomo del estudiante.", "La metodología combina el estudio de contenidos jurídicos y técnicos con el análisis de casos, la revisión de normativa y jurisprudencia, las actividades de aplicación y los ejercicios orientados a la construcción de estrategias investigativas y de judicialización. Se espera una participación activa del estudiante en las actividades propuestas y una aplicación práctica de los conocimientos adquiridos a situaciones relacionadas con la investigación de delitos ambientales.", "El proceso de evaluación está orientado a verificar el logro de las competencias desarrolladas durante el curso.", "La evaluación contempla una actividad final integradora, consistente en un cuestionario final, que corresponde al 100 % de la valoración del curso. Este instrumento permitirá valorar los niveles de comprensión, análisis, síntesis y pensamiento crítico frente a los contenidos y situaciones abordadas durante las diferentes unidades.", "Las actividades desarrolladas durante el curso tendrán un carácter formativo que permitirá al participante prepararse para la evaluación final y transferir los conocimientos adquiridos a situaciones propias de su ejercicio funcional.", "Este curso constituye una oportunidad para fortalecer una mirada jurídica, investigativa, técnica e interdisciplinaria frente a los delitos que afectan el medio ambiente y los recursos naturales. Se invita a los participantes a relacionar los contenidos con sus experiencias y contextos de trabajo, promoviendo investigaciones más sólidas, articuladas y orientadas a resultados.", "¡Le damos la bienvenida al curso Investigación y judicialización de delitos contra el medio ambiente y los recursos naturales!"], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Cinco unidades y 48 horas", "segs": [0, 1, 2], "obj": "reloj"}, {"label": "Metodología", "segs": [3], "obj": "computador"}, {"label": "Evaluación", "segs": [4, 5, 6], "obj": "documento"}, {"label": "Una mirada interdisciplinaria", "segs": [7, 8], "obj": "planta"}]}], "rotulo": null, "seccion": "Cómo funciona el curso", "grupo": null, "titulos_fuente": [], "encabezados": [], "rotulos": ["Cinco unidades y 48 horas", "Metodología", "Evaluación", "Una mirada interdisciplinaria"], "titulo_genially": "Cómo funciona el curso", "complemento_genially": "", "apartado": ""}, {"layout": "fichas", "segmentos": ["Al finalizar el curso, el participante será capaz de analizar, diseñar, aplicar y valorar herramientas jurídicas e investigativas para fortalecer la investigación y judicialización de los delitos contra el medio ambiente y los recursos naturales en el marco de la normativa y la política criminal colombiana. Así, las competencias a desarrollar son:", "1. Aplico el marco normativo, institucional y dogmático de protección de los recursos naturales, así como evaluar la intervención del derecho penal y del Sistema Nacional Ambiental (SINA) frente a los daños ecológicos y las dinámicas de explotación ilícita, con el fin de proponer soluciones jurídicas fundamentadas en los principios de la Constitución ecológica y la defensa de la sociedad en riesgo.", "2. Analizo la estructura de los delitos contra el medio ambiente en Colombia a partir de la integración de los principios penales, el régimen jurídico de los recursos naturales y la normativa internacional, además de revisar su eficacia y aplicación frente a fenómenos de macrocriminalidad ambiental, como la extracción ilícita de minerales, la deforestación y el accionar de grupos armados organizados, con el fin de diagnosticar vacíos normativos o diseñar estrategias jurídicas de contención.", "3. Implemento estrategias de investigación y judicialización de delitos contra el medio ambiente, integrando procedimientos de policía judicial, técnicas especiales de investigación y análisis de contexto de criminalidad organizada, para garantizar el adecuado manejo probatorio y pericial en la construcción de los hechos jurídicamente relevantes.", "4. Aplico los enfoques, principios y mecanismos de la justicia restaurativa en el proceso penal colombiano frente a los delitos ambientales y promover la participación activa de las víctimas y las comunidades para diseñar soluciones orientadas a la reparación, restauración y compensación efectiva del daño ecológico.", "5. Comprendo los mecanismos de terminación anticipada del proceso penal colombiano (principio de oportunidad, preacuerdos y allanamientos) en la judicialización de delitos ambientales, de manera que se garantice el rigor normativo y jurisprudencial y se condicione su procedencia a la efectiva reparación integral del daño ecológico causado, con el fin de condicionar su procedencia a la efectiva reparación integral del daño ecológico causado."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Al finalizar el curso", "segs": [0], "obj": "escalones"}, {"label": "1. Aplico el marco normativo e institucional", "segs": [1], "obj": "libros"}, {"label": "2. Analizo la estructura de los delitos ambientales", "segs": [2], "obj": "lupa"}, {"label": "3. Implemento estrategias de investigación", "segs": [3], "obj": "huella"}, {"label": "4. Aplico la justicia restaurativa", "segs": [4], "obj": "personas"}, {"label": "5. Comprendo la terminación anticipada", "segs": [5], "obj": "expediente"}]}], "rotulo": null, "seccion": "Competencias que desarrollará", "grupo": null, "titulos_fuente": [], "encabezados": [], "rotulos": ["Al finalizar el curso", "1. Aplico el marco normativo e institucional", "2. Analizo la estructura de los delitos ambientales", "3. Implemento estrategias de investigación", "4. Aplico la justicia restaurativa", "5. Comprendo la terminación anticipada"], "titulo_genially": "Competencias que desarrollará", "complemento_genially": "", "apartado": ""}, {"layout": "esquema", "segmentos": ["Se abordan las principales problemáticas ambientales asociadas a la deforestación, la explotación ilícita y la participación de grupos armados, así como los fundamentos constitucionales, jurídicos e institucionales de la protección penal del medio ambiente.", "Se estudian los principios del derecho penal ambiental, el régimen jurídico de los recursos naturales, las normas internacionales y la estructura de los principales tipos penales relacionados con la protección del medio ambiente.", "Se desarrollan herramientas para la dirección de la investigación, la construcción de hechos jurídicamente relevantes, la formulación de hipótesis y objetivos probatorios, las actuaciones de policía judicial, las técnicas especiales de investigación y la articulación con investigaciones de crimen organizado y finanzas.", "Se analiza el daño ambiental, la participación de víctimas y comunidades, y los mecanismos de reparación, restauración y compensación aplicables a estos delitos.", "Se estudian el principio de oportunidad, los preacuerdos y negociaciones, el allanamiento a cargos y otros mecanismos de terminación anticipada, con base en la reparación integral del daño ambiental."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Unidad 1. Desafíos del derecho penal ambiental y la Constitución ecológica", "segs": [0], "obj": "planta"}, {"label": "Unidad 2. Aplicación del derecho penal ambiental y afectación de los recursos naturales en Colombia", "segs": [1], "obj": "libros"}, {"label": "Unidad 3. Estrategias y técnicas de investigación en los delitos ambientales", "segs": [2], "obj": "lupa"}, {"label": "Unidad 4. La justicia restaurativa en el marco del proceso penal colombiano y su aplicación a los delitos contra el medio ambiente y los recursos naturales", "segs": [3], "obj": "personas"}, {"label": "Unidad 5. Mecanismos de terminación anticipada, negociación y reparación integral en el proceso penal ambiental", "segs": [4], "obj": "escalones"}]}], "rotulo": null, "seccion": "Las cinco unidades del curso", "grupo": null, "titulos_fuente": [], "encabezados": [], "rotulos": ["Unidad 1. Desafíos del derecho penal ambiental y la Constitución ecológica", "Unidad 2. Aplicación del derecho penal ambiental y afectación de los recursos naturales en Colombia", "Unidad 3. Estrategias y técnicas de investigación en los delitos ambientales", "Unidad 4. La justicia restaurativa en el marco del proceso penal colombiano y su aplicación a los delitos contra el medio ambiente y los recursos naturales", "Unidad 5. Mecanismos de terminación anticipada, negociación y reparación integral en el proceso penal ambiental"], "titulo_genially": "Las cinco unidades del curso", "complemento_genially": "", "apartado": ""}, {"layout": "fichas", "segmentos": ["Criterios de certificación del curso Para optar a la certificación del curso, los participantes adscritos a la entidad deben cumplir previamente con las siguientes condiciones:", "1. Asistencia y conexión activa: cumplir con un mínimo del 85% de participación y permanencia en las aulas virtuales o en laboratorios virtuales interactivos.", "2. Oportunidad operativa: cumplir con la totalidad de los entregables y simulaciones programadas en la agenda académica dentro de los términos establecidos.", "b) Producto integrador evaluativo: alcanzar una calificación mínima de 80/100 según la rúbrica institucional en las actividades y productos descritos al culminar cada unidad de aprendizaje."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloque
