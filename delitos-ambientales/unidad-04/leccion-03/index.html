 la indemnización social correspondiente.", "La autoridad penal puede imponer varias acciones de reparación integral que cobijan lo concerniente a la compensación (asociada a los bienes y servicios ambientales afectados) y la indemnización (afectación al patrimonio), de manera que el infractor tiene la obligación de compensar el impacto ambiental ilícito negativo causado con su infracción-delito en el proceso penal."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una orden del juez, no un acuerdo", "segs": [0], "obj": "libros"}, {"label": "La solicitud de las víctimas", "segs": [1], "obj": "escudo"}, {"label": "Compensación e indemnización", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Incidente de reparación integral – reparación integral", "grupo": null, "titulos_fuente": ["1. Incidente de reparación integral – reparación integral"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una orden del juez, no un acuerdo", "La solicitud de las víctimas", "Compensación e indemnización"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "1. Incidente de reparación integral – reparación integral", "objeto_raiz": "libros", "objetos_raiz": ["libros", "reloj", "tribunal"], "escenario": {"bioma": "comunidad", "camino": "llano"}, "bloques_fuente": [123, 125], "textoFijo": true, "ilustracion": "ijda-daniela-u4-l3.webp"}, {"layout": "giro", "segmentos": ["Para Devis Echandía (1974), la medida cautelar implica “el derecho a iniciar un procedimiento para que se adopten las medidas judiciales necesarias para el aseguramiento de la satisfacción de un derecho material, o para su defensa; es decir, para que se realice un proceso cautelar” (p. 142).", "Del mismo modo, López Blanco (2004, p. 81) considera que las medidas cautelares son:", "Providencias que, ya de oficio, o a petición de parte, puede adoptar el juez respecto de personas, pruebas o bienes que resulten afectados por la demora y tendentes a asegurar el cabal cumplimiento de las determinaciones que se adopten por el juez y, especialmente, de la sentencia una vez ejecutoriada.", "Finalmente, Azula Camacho (2000) las define como “el conjunto de actuaciones que tienden a garantizar los resultados que se persiguen en otro. En términos más sencillos, evita que los resultados perseguidos en un proceso sean ilusorios o ineficaces” (p. 61).", "Se observa entonces que las medidas cautelares se definen de acuerdo con la finalidad que cumplen, que no es otra que garantizar la efectividad de las decisiones judiciales."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Devis Echandía (1974)", "segs": [0], "obj": "escalones"}, {"label": "López Blanco (2004)", "segs": [1, 2], "obj": "libros"}, {"label": "Azula Camacho (2000)", "segs": [3], "obj": "reloj"}, {"label": "Lo que tienen en común", "segs": [4], "obj": "escudo"}]}], "rotulo": null, "seccion": "2. Medidas cautelares como garantía de reparación", "grupo": null, "titulos_fuente": ["2. Medidas cautelares como garantía de reparación"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Devis Echandía (1974)", "López Blanco (2004)", "Azula Camacho (2000)", "Lo que tienen en común"], "titulo_genially": "2. Medidas cautelares como garantía de reparación", "complemento_genially": "", "apartado": "2. Medidas cautelares como garantía de reparación", "bloques_fuente": [128, 132], "pestana": "Qué son", "pestanas": [{"layout": "giro", "segmentos": ["Para Devis Echandía (1974), la medida cautelar implica “el derecho a iniciar un procedimiento para que se adopten las medidas judiciales necesarias para el aseguramiento de la satisfacción de un derecho material, o para su defensa; es decir, para que se realice un proceso cautelar” (p. 142).", "Del mismo modo, López Blanco (2004, p. 81) considera que las medidas cautelares son:", "Providencias que, ya de oficio, o a petición de parte, puede adoptar el juez respecto de personas, pruebas o bienes que resulten afectados por la demora y tendentes a asegurar el cabal cumplimiento de las determinaciones que se adopten por el juez y, especialmente, de la sentencia una vez ejecutoriada.", "Finalmente, Azula Camacho (2000) las define como “el conjunto de actuaciones que tienden a garantizar los resultados que se persiguen en otro. En términos más sencillos, evita que los resultados perseguidos en un proceso sean ilusorios o ineficaces” (p. 61).", "Se observa entonces que las medidas cautelares se definen de acuerdo con la finalidad que cumplen, que no es otra que garantizar la efectividad de las decisiones judiciales."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Devis Echandía (1974)", "segs": [0], "obj": "escalones"}, {"label": "López Blanco (2004)", "segs": [1, 2], "obj": "libros"}, {"label": "Azula Camacho (2000)", "segs": [3], "obj": "reloj"}, {"label": "Lo que tienen en común", "segs": [4], "obj": "escudo"}]}], "rotulo": null, "seccion": "2. Medidas cautelares como garantía de reparación", "grupo": null, "titulos_fuente": ["2. Medidas cautelares como garantía de reparación"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Devis Echandía (1974)", "López Blanco (2004)", "Azula Camacho (2000)", "Lo que tienen en común"], "titulo_genially": "2. Medidas cautelares como garantía de reparación", "complemento_genially": "", "apartado": "2. Medidas cautelares como garantía de reparación", "bloques_fuente": [128, 132], "pestana": "Qué son", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 2. Medidas cautelares como garantía de reparación.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "2. Medidas cautelares como garantía de reparación"}}, {"layout": "esquema", "segmentos": ["Por su parte, Arcila Salazar (2013) enuncia varias características de las medidas cautelares:", "a) Son actos de naturaleza jurisdiccional en la medida que solo competen al juez o a quienes ejercen funciones jurisdiccionales de manera transitoria, como es el caso de los árbitros y algunas autoridades administrativas como la Superintendencia de Industria y Comercio o los inspectores de Policía. Lo que se quiere indicar es que por más que haya certeza de la existencia del derecho y que sea evidente el peligro que corre el mismo por el transcurso del tiempo, no les está permitido a los particulares que bajo el modelo de un Estado de derecho actúen por su propia mano y realicen directamente los actos conducentes a garantizar la sentencia.", "b) Son instrumentales, toda vez que la medida cautelar no constituye un fin en sí misma, sino que está al servicio del proceso y, en especial, de la sentencia, ya que busca garantizar anticipadamente sus efectos.", "c) Son provisionales, ya que se justifican siempre y cuando subsistan las razones que dieron lugar a su decreto y perdurarán cuando más hasta el momento en que se dicte la sentencia.", "d) Son mutables, elemento distintivo directamente relacionado con el carácter provisional de las cautelas, pues si se modifican de manera sustancial las condiciones fácticas que dieron lugar a su decreto, bien puede pedirse que igualmente se altere la medida cautelar, ya sea porque se necesita reforzar aún más las garantías de la futura sentencia o porque la cautela se ha tornado excesiva o innecesaria. Esta característica es importante porque en ocasiones los jueces no acceden al decreto de una medida cautelar, porque consideran que la misma debe permanecer inalterada hasta que se dicte la sentencia definitiva, circunstancia que puede acarrear graves perjuicios para la parte demandada. Esta posición carece de fundamento, pues nada impide que después de decretada la medida cautelar el juez la pueda modificar de oficio o a petición de parte, si en algún momento del proceso la misma es, o se hace, innecesaria o excesiva.", "e) No requieren la vinculación previa del demandado, tal como lo señala Alsina (2001), “la providencia precautoria se dicta inaudita parte, pero ello no implica violar el principio de bilateralidad, pues permite a la parte adversa, una vez cumplida, discutir su procedencia y extensión” (p. 505). No se necesita entonces ni vincular ni oír al demandado para que se decrete la medida cautelar, y esto es así porque precisamente lo que se busca con algunas de las medidas cautelares es actuar antes de que el demandado tenga conocimiento de la acción que se adelanta en su contra, para evitar que este altere de tal manera la situación inicial que se haga imposible el cumplimiento de la sentencia, como ocurre cuando el deudor empieza a sustraer sus bienes."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a) Jurisdiccionales (Arcila Salazar)", "segs": [0, 1], "obj": "tribunal"}, {"label": "b) Instrumentales", "segs": [2, 3], "obj": "libros"}, {"label": "d) Mutables", "segs": [4], "obj": "escudo"}, {"label": "e) Sin vinculación previa del demandado", "segs": [5], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Medidas cautelares como garantía de reparación", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a) Jurisdiccionales (Arcila Salazar)", "b) Instrumentales", "d) Mutables", "e) Sin vinculación previa del demandado"], "titulo_genially": "2. Medidas cautelares como garantía de reparación", "complemento_genially": "", "apartado": "2. Medidas cautelares como garantía de reparación", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "tribunal", "documento"], "escenario": {"bioma": "ciudad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [133, 138], "pestana": "Características a) a e)", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 2. Medidas cautelares como garantía de reparación.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "2. Medidas cautelares como garantía de reparación"}}, {"layout": "fichas", "segmentos": ["f) Son taxativas, es decir, que solo se podrán decretar medidas cautelares en aquellos eventos en que expresamente lo autorice la ley. Esta nota distintiva se justifica en la medida en que la cautela lesiona o, por lo menos, limita significativamente los derechos de la parte demandada y por ello debe el legislador autorizar previamente su decreto. En este punto es importante considerar la distinción que hace López Blanco (2004) entre taxatividad e innominatividad, ya que en varias obras se suelen confundir estos dos elementos.", "Tal como se expuso, cuando se dice que las medidas cautelares son taxativas, se está indicando que las mismas requieren de una norma que las contemple de antemano, pero cuando la norma no solo autoriza que se decrete la medida cautelar, sino que, además, señala el proceso y regula la medida que se debe practicar, la misma adquiere el carácter de nominativa, como ocurre, por ejemplo, con el embargo en los procesos ejecutivos o la inscripción de la demanda en algunos procesos de conocimiento. Con todo, existen otros procesos donde se autoriza al juez para ordenar la cautela que estime pertinente. En este caso, se cumple con el requisito de taxatividad, pero la medida cautelar será innominada, pues el legislador dejó al criterio del juez la elección del medio idóneo para garantizar la efectividad de la sentencia: es lo que sucede en las acciones populares, como se profundizará más adelante.", "g) Para decretar la medida cautelar debe verificarse el cumplimiento de dos requisitos: el fumus boni iuris (apariencia de buen derecho) y el temor o posibilidad de daño jurídico. En cuanto al fumus boni iuris o apariencia de derecho, se requiere para la práctica de la medida cautelar que exista una probabilidad o verosimilitud del derecho. Así lo exponen Serra Domínguez y Ramos Méndez (1974, p. 37):", "Es necesario que el peticionario presente pruebas de las que resulten la posible existencia de un derecho en el demandante, que prima facie (a primera vista) lleve a la conclusión al juez de que, de no discutirse esa apariencia inicial, el demandante tiene la razón y así deberá manifestarlo en su decisión final, pero ese primer estudio tiene algo de duda que corresponde al demandado hacer efectiva. (p. 37)", "h) Pueden ser conservatorias o innovatorias, aunque se puede pensar que las medidas cautelares siempre están dirigidas a mantener el statu quo (estado actual de las cosas) y, por ende, solo pueden estar encaminadas a conservar las cosas o las personas en el estado en que se encuentran al momento de iniciar el proceso. Sin embargo, tal afirmación se cae por su propio peso si se tiene presente que la finalidad de la medida cautelar es garantizar la efectividad de la sentencia. Para hacer efectiva la decisión judicial, en ocasiones se requiere conservar las cosas en su estado inicial, pero hay eventos en los que se necesita alterar ese statu quo para hacer prevalecer el derecho sustancial protegido."], "parrafo": [0, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "f) Taxativas", "segs": [0], "obj": "documento"}, {"label": "Qué significa que sean taxativas", "segs": [1], "obj": "carpetas"}, {"label": "g) Requisitos para decretarlas", "segs": [2, 3], "obj": "reloj"}, {"label": "h) Conservatorias o innovatorias", "segs": [4], "obj": "personas"}]}], "rotulo": null, "seccion": "2. Medidas cautelares como garantía de reparación", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["f) Taxativas", "Qué significa que sean taxativas", "g) Requisitos para decretarlas", "h) Conservatorias o innovatorias"], "titulo_genially": "2. Medidas cautelares como garantía de reparación", "complemento_genially": "", "apartado": "2. Medidas cautelares como garantía de reparación", "bloques_fuente": [139, 142], "pestana": "Características f) a h)", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 2. Medidas cautelares como garantía de reparación.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "2. Medidas cautelares como garantía de reparación"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 2. Medidas cautelares como garantía de reparación.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "2. Medidas cautelares como garantía de reparación"}}, {"layout": "esquema", "segmentos": ["Las dos normas que plasman el espíritu del ordenamiento ambiental y garantizan la efectiva protección de los bienes que tienen bajo su tutela son la coadyuvancia y las medidas cautelares en las acciones populares, reguladas en el capítulo VI de la Ley 472 de 1998.", "En principio, el artículo 2 de la misma ley otorgó a los y las jueces la facultad de actuar, aunque no se haya verificado la existencia de un daño, al indicar que “las acciones populares se ejercen para evitar el daño contingente, hacer cesar el peligro, la amenaza, la vulneración o agravio sobre los derechos e intereses colectivos, o restituir las cosas a su estado anterior cuando fuere posible” (Ley 472 de 1998).", "Adicionalmente, el artículo 25 cumple con el requisito taxativo de las medidas cautelares, al autorizar al juez su decreto en los siguientes términos:", "Antes de ser notificada la demanda y en cualquier estado del proceso podrá el juez, de oficio o a petición de parte, decretar, debidamente motivadas, las medidas previas que estime pertinentes para prevenir un daño inminente o para hacer cesar el que se hubiere causado. (Ley 472 de 1998)", "La justicia restaurativa en los delitos ambientales no tiene que esperar hasta el final de un juicio o a que un juez dicte una condena para actuar. Su verdadero valor está en usarla como una herramienta rápida y preventiva: la Fiscalía puede negociar o suspender el caso desde el principio (usando figuras como el principio de oportunidad o los preacuerdos) a cambio de que el responsable repare el daño de forma inmediata. Esto evita procesos largos y asegura que la naturaleza y las comunidades sanen antes de que el daño sea irreversible.", "Para que estas salidas anticipadas funcionen, los planes de reparación no pueden ser simples promesas. Deben ser acciones reales, medibles y supervisadas por expertos. A continuación, se presentan ejemplos prácticos de cómo se aplican estos planes según el tipo de delito:"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Coadyuvancia y medidas cautelares", "segs": [0], "obj": "libros"}, {"label": "Artículo 2: actuar sin daño verificado", "segs": [1], "obj": "reloj"}, {"label": "Artículo 25: decreto de medidas", "segs": [2, 3], "obj": "tribunal"}, {"label": "Restaurar sin esperar la condena", "segs": [4], "obj": "documento"}, {"label": "Acciones reales y medibles", "segs": [5], "obj": "carpetas"}]}], "rotulo": null, "seccion": "3. Ejemplos en el marco normativo colombiano", "grupo": null, "titulos_fuente": ["3. Ejemplos en el marco normativo colombiano"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Coadyuvancia y medidas cautelares", "Artículo 2: actuar sin daño verificado", "Artículo 25: decreto de medidas", "Restaurar sin esperar la condena", "Acciones reales y medibles"], "titulo_genially": "3. Ejemplos en el marco normativo colombiano", "complemento_genially": "", "apartado": "3. Ejemplos en el marco normativo colombiano", "objeto_raiz": "libros", "objetos_raiz": ["libros", "escudo", "documento"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [144, 149], "pestana": "Coadyuvancia y medidas cautelares", "pestanas": [{"layout": "esquema", "segmentos": ["Las dos normas que plasman el espíritu del ordenamiento ambiental y garantizan la efectiva protección de los bienes que tienen bajo su tutela son la coadyuvancia y las medidas cautelares en las acciones populares, reguladas en el capítulo VI de la Ley 472 de 1998.", "En principio, el artículo 2 de la misma ley otorgó a los y las jueces la facultad de actuar, aunque no se haya verificado la existencia de un daño, al indicar que “las acciones populares se ejercen para evitar el daño contingente, hacer cesar el peligro, la amenaza, la vulneración o agravio sobre los derechos e intereses colectivos, o restituir las cosas a su estado anterior cuando fuere posible” (Ley 472 de 1998).", "Adicionalmente, el artículo 25 cumple con el requisito taxativo de las medidas cautelares, al autorizar al juez su decreto en los siguientes términos:", "Antes de ser notificada la demanda y en cualquier estado del proceso podrá el juez, de oficio o a petición de parte, decretar, debidamente motivadas, las medidas previas que estime pertinentes para prevenir un daño inminente o para hacer cesar el que se hubiere causado. (Ley 472 de 1998)", "La justicia restaurativa en los delitos ambientales no tiene que esperar hasta el final de un juicio o a que un juez dicte una condena para actuar. Su verdadero valor está en usarla como una herramienta rápida y preventiva: la Fiscalía puede negociar o suspender el caso desde el principio (usando figuras como el principio de oportunidad o los preacuerdos) a cambio de que el responsable repare el daño de forma inmediata. Esto evita procesos largos y asegura que la naturaleza y las comunidades sanen antes de que el daño sea irreversible.", "Para que estas salidas anticipadas funcionen, los planes de reparación no pueden ser simples promesas. Deben ser acciones reales, medibles y supervisadas por expertos. A continuación, se presentan ejemplos prácticos de cómo se aplican estos planes según el tipo de delito:"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Coadyuvancia y medidas cautelares", "segs": [0], "obj": "libros"}, {"label": "Artículo 2: actuar sin daño verificado", "segs": [1], "obj": "reloj"}, {"label": "Artículo 25: decreto de medidas", "segs": [2, 3], "obj": "tribunal"}, {"label": "Restaurar sin esperar la condena", "segs": [4], "obj": "documento"}, {"label": "Acciones reales y medibles", "segs": [5], "obj": "carpetas"}]}], "rotulo": null, "seccion": "3. Ejemplos en el marco normativo colombiano", "grupo": null, "titulos_fuente": ["3. Ejemplos en el marco normativo colombiano"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Coadyuvancia y medidas cautelares", "Artículo 2: actuar sin daño verificado", "Artículo 25: decreto de medidas", "Restaurar sin esperar la condena", "Acciones reales y medibles"], "titulo_genially": "3. Ejemplos en el marco normativo colombiano", "complemento_genially": "", "apartado": "3. Ejemplos en el marco normativo colombiano", "objeto_raiz": "libros", "objetos_raiz": ["libros", "escudo", "documento"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [144, 149], "pestana": "Coadyuvancia y medidas cautelares", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 3. Ejemplos en el marco normativo colombiano.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "3. Ejemplos en el marco normativo colombiano"}}, {"layout": "cuadro", "segmentos": ["Limpieza especializada:", "El responsable asume de inmediato los costos y trabajos para extraer la contaminación del río o la tierra. El beneficio penal solo se otorga si las autoridades ambientales certifican que el lugar quedó realmente limpio.", "Recuperación económica local:", "Se debe indemnizar a las personas afectadas (como los pescadores) y financiar nuevos proyectos para que puedan trabajar y sobrevivir mientras el ecosistema recupera su equilibrio.", "Vigilancia continua:", "El infractor debe pagar auditorías periódicas a sus operaciones durante varios años para demostrar que corrigió sus fallas y garantizar que no vuelva a suceder.", "Reconstrucción del terreno:", "Como requisito previo para detener el proceso penal, el responsable debe cerrar los túneles mineros y tapar las grandes zanjas, nivelando la tierra para evitar deslizamientos y accidentes.", "Reforestación garantizada:", "No basta con sembrar unas cuantas plantas. Se exige plantar árboles nativos de esa zona específica y cuidarlos de tres a cinco años, asegurando que el bosque vuelva a crecer y sobrevivir por sí mismo.", "Entrega de maquinaria:", "Cuando participan grupos criminales, se les exige entregar al Estado sus retroexcavadoras, motobombas y equipos para desarmar por completo su capacidad de seguir destruyendo el medio ambiente.", "Mantenimiento de refugios:", "El procesado debe entregar dinero, medicinas o alimentos a los centros de rescate y valoración de las autoridades ambientales para ayudar a curar a los animales que fueron incautados.", "Regreso al hábitat:", "Se exige financiar toda la logística necesaria para devolver a los animales a su entorno natural. Esto incluye ponerles rastreadores o usar biólogos para confirmar que las especies logran adaptarse y sobrevivir libres."], "parrafo": [0, 2, 4, 6, 8, 10, 12, 14], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "cuadro", "columnas": ["Medida", "En qué consiste"], "titulo": [], "items": [{"label": "Agua y suelo: limpieza especializada", "segs": [0, 1, 2, 3], "celdas": [{"grupo": "Contaminación del agua y el suelo (ej. derrames de petróleo o químicos)"}, [0, 1], [2, 3]]}, {"label": "Agua y suelo: vigilancia continua", "segs": [4, 5], "celdas": [{"grupo": "Contaminación del agua y el suelo (ej. derrames de petróleo o químicos)"}, [4, 5]]}, {"label": "Minería y deforestación: reconstrucción", "segs": [6, 7, 8, 9], "celdas": [{"grupo": "Minería ilegal y deforestación masiva"}, [6, 7], [8, 9]]}, {"label": "Minería y deforestación: entrega de maquinaria", "segs": [10, 11], "celdas": [{"grupo": "Minería ilegal y deforestación masiva"}, [10, 11]]}, {"label": "Fauna y madera: refugios", "segs": [12, 13, 14, 15], "celdas": [{"grupo": "Tráfico de animales silvestres y madera"}, [12, 13], [14, 15]]}]}], "rotulo": null, "seccion": "3. Ejemplos en el marco normativo colombiano", "grupo": null, "titulos_fuente": ["3. Ejemplos en el marco normativo colombiano"], "encabezados": [], "mediacion": "Cuadro de la ficha a la vista: el encabezado de columnas fijo y las filas por partes, con «Seguir leyendo».", "rotulos": ["Agua y suelo: limpieza especializada", "Agua y suelo: vigilancia continua", "Minería y deforestación: reconstrucción", "Minería y deforestación: entrega de maquinaria", "Fauna y madera: refugios"], "titulo_genially": "3. Ejemplos en el marco normativo colombiano", "complemento_genially": "", "apartado": "3. Ejemplos en el marco normativo colombiano", "bloques_fuente": [151, 160], "pestana": "Planes de reparación por delito", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 3. Ejemplos en el marco normativo colombiano.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "3. Ejemplos en el marco normativo colombiano"}}], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 3. Ejemplos en el marco normativo colombiano.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "3. Ejemplos en el marco normativo colombiano"}}], "cuadroAjuste": true}</script>
