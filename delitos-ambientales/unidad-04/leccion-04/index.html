<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u4-l4", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 4 · Lección 4"}, "leccion_rotulo": "Lección 4", "unit": 4, "lesson": 4, "heading": "Lección 4: Criterios para la aplicación de la justicia restaurativa en la investigación y judicialización de delitos ambientales", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Establecer pautas dogmáticas, metodológicas y de política criminal que sirvan de insumo a fiscales y jueces para la aprobación e implementación de salidas restaurativas en investigaciones ambientales complejas.", "La Resolución 0-0211 de 2025 de la Fiscalía General de la Nación, mediante la cual se crea la Unidad de Justicia Restaurativa y se adopta la estrategia de justicia restaurativa de la entidad, concibe esta herramienta como parte de una justicia penal transformadora, centrada en las personas, orientada a la convivencia pacífica, la rehabilitación del infractor, la reparación de las víctimas y la reconstrucción del tejido social.", "A partir de este marco, en la investigación y judicialización de delitos ambientales pueden identificarse los siguientes criterios orientadores:", "a) Participación activa de las víctimas y las comunidades: la justicia restaurativa debe garantizar la participación de las víctimas y reconocer el papel de las comunidades en la resolución del conflicto. La estrategia de la Fiscalía busca otorgar un rol protagónico a víctimas, responsables y comunidades, priorizando el restablecimiento de los derechos de las primeras. En los delitos ambientales, este criterio adquiere especial importancia cuando la afectación trasciende a una persona individual y compromete comunidades, territorios o intereses colectivos.", "En este contexto, es importante tener en cuenta que, en los delitos ambientales, las víctimas no se limitan necesariamente a las personas naturales o a las comunidades directamente afectadas, pues el daño también puede recaer sobre el medio ambiente y los recursos naturales, cuya afectación compromete intereses colectivos y difusos. Esta particularidad plantea desafíos para la aplicación de mecanismos restaurativos como la conciliación, prevista en el artículo 522 de la Ley 906 de 2004, y la mediación, regulada en el artículo 523 de la misma ley, en la medida en que la naturaleza colectiva o difusa de algunos daños puede dificultar la identificación y participación directa de todos los sujetos afectados."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "lupa"}, {"label": "Resolución 0-0211 de 2025", "segs": [1], "obj": "escudo"}, {"label": "a) Participación de víctimas y comunidades", "segs": [2, 3], "obj": "documento"}, {"label": "Víctimas más allá de las personas", "segs": [4], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 4: Criterios para la aplicación de la justicia restaurativa en la investigación y judicialización de delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Objetivo", "Resolución 0-0211 de 2025", "a) Participación de víctimas y comunidades", "Víctimas más allá de las personas"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "documento", "carpetas"], "escenario": {"bioma": "campo", "camino": "llano"}, "bloques_fuente": [162, 166], "textoFijo": true, "ilustracion": "ijda-daniela-u4-l4.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p44"}}, {"layout": "fichas", "segmentos": ["Por ello, en estos casos, la justicia restaurativa debe comprenderse también desde una perspectiva ambiental y colectiva, orientada no solo al restablecimiento de los derechos de las víctimas identificables, sino a la restauración del daño ecológico, la recuperación de los recursos naturales afectados y la recomposición de las relaciones sociales y comunitarias alteradas por la conducta.", "b) Reconocimiento de la responsabilidad y de las consecuencias del delito: la estrategia busca promover que el responsable acepte su responsabilidad y reconozca su comportamiento y sus consecuencias, como presupuesto para generar resultados restaurativos y abordar los conflictos que subyacen a la conducta delictiva. En materia ambiental, ello permite orientar el proceso no solamente hacia la sanción de la conducta, sino también hacia el reconocimiento de la afectación causada y la adopción de compromisos restaurativos.", "c) Reparación integral y restablecimiento de derechos: La estrategia parte de la necesidad de garantizar la reparación integral y el restablecimiento de los derechos de las víctimas. La propia resolución recuerda que corresponde a la Fiscalía promover medidas de restablecimiento y reparación integral, y garantizar la protección de las víctimas. En los delitos ambientales, este criterio exige considerar las consecuencias producidas sobre el ambiente y sobre las personas o comunidades afectadas, articulando las medidas restaurativas que resulten procedentes.", "d) Enfoque territorial y diferencial: la resolución establece que las capacidades institucionales para la justicia restaurativa deben desarrollarse con enfoque territorial y diferencial, de manera que los procesos puedan adaptarse a las particularidades culturales y sociales de cada territorio. Este criterio resulta especialmente relevante en investigaciones ambientales, en las que pueden encontrarse pueblos indígenas, comunidades étnicas, comunidades campesinas y otras poblaciones con relaciones particulares con el territorio y los recursos naturales."], "parrafo": [1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una perspectiva ambiental y colectiva", "segs": [0], "obj": "reloj"}, {"label": "b) Reconocimiento de la responsabilidad", "segs": [1], "obj": "documento"}, {"label": "c) Reparación integral", "segs": [2], "obj": "escudo"}, {"label": "d) Enfoque territorial y diferencial", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 4: Criterios para la aplicación de la justicia restaurativa en la investigación y judicialización de delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una perspectiva ambiental y colectiva", "b) Reconocimiento de la responsabilidad", "c) Reparación integral", "d) Enfoque territorial y diferencial"], "titulo_genially": "Criterios orientadores (Resolución 0-0211 de 2025)", "complemento_genially": "", "apartado": "", "bloques_fuente": [166, 169], "pestana": "Criterios a) a d)", "pestanas": [{"layout": "fichas", "segmentos": ["Por ello, en estos casos, la justicia restaurativa debe comprenderse también desde una perspectiva ambiental y colectiva, orientada no solo al restablecimiento de los derechos de las víctimas identificables, sino a la restauración del daño ecológico, la recuperación de los recursos naturales afectados y la recomposición de las relaciones sociales y comunitarias alteradas por la conducta.", "b) Reconocimiento de la responsabilidad y de las consecuencias del delito: la estrategia busca promover que el responsable acepte su responsabilidad y reconozca su comportamiento y sus consecuencias, como presupuesto para generar resultados restaurativos y abordar los conflictos que subyacen a la conducta delictiva. En materia ambiental, ello permite orientar el proceso no solamente hacia la sanción de la conducta, sino también hacia el reconocimiento de la afectación causada y la adopción de compromisos restaurativos.", "c) Reparación integral y restablecimiento de derechos: La estrategia parte de la necesidad de garantizar la reparación integral y el restablecimiento de los derechos de las víctimas. La propia resolución recuerda que corresponde a la Fiscalía promover medidas de restablecimiento y reparación integral, y garantizar la protección de las víctimas. En los delitos ambientales, este criterio exige considerar las consecuencias producidas sobre el ambiente y sobre las personas o comunidades afectadas, articulando las medidas restaurativas que resulten procedentes.", "d) Enfoque territorial y diferencial: la resolución establece que las capacidades institucionales para la justicia restaurativa deben desarrollarse con enfoque territorial y diferencial, de manera que los procesos puedan adaptarse a las particularidades culturales y sociales de cada territorio. Este criterio resulta especialmente relevante en investigaciones ambientales, en las que pueden encontrarse pueblos indígenas, comunidades étnicas, comunidades campesinas y otras poblaciones con relaciones particulares con el territorio y los recursos naturales."], "parrafo": [1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una perspectiva ambiental y colectiva", "segs": [0], "obj": "reloj"}, {"label": "b) Reconocimiento de la responsabilidad", "segs": [1], "obj": "documento"}, {"label": "c) Reparación integral", "segs": [2], "obj": "escudo"}, {"label": "d) Enfoque territorial y diferencial", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 4: Criterios para la aplicación de la justicia restaurativa en la investigación y judicialización de delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una perspectiva ambiental y colectiva", "b) Reconocimiento de la responsabilidad", "c) Reparación integral", "d) Enfoque territorial y diferencial"], "titulo_genially": "Criterios orientadores (Resolución 0-0211 de 2025)", "complemento_genially": "", "apartado": "", "bloques_fuente": [166, 169], "pestana": "Criterios a) a d)", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Criterios orientadores (Resolución 0-0211 de 2025).pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "Criterios orientadores (Resolución 0-0211 de 2025)"}}, {"layout": "giro", "segmentos": ["e) Articulación con modelos de justicia propia y comunitaria: la estrategia contempla expresamente una ruta de articulación entre el modelo de justicia restaurativa de la Fiscalía y los modelos de justicia propia y comunitaria. Por ello, cuando la investigación ambiental involucre comunidades con sistemas propios de organización y resolución de conflictos, la actuación restaurativa deberá considerar los mecanismos de articulación institucional que correspondan.", "f) Articulación institucional y seguimiento: la estrategia prevé rutas nacionales, seccionales y especializadas, así como mecanismos de articulación intra e interinstitucional y de seguimiento de los resultados de las rutas restaurativas. En materia ambiental, esto permite vincular la actuación de la Fiscalía con las autoridades y actores que tengan competencias o conocimientos relevantes para la caracterización del daño, la reparación, la restauración y el seguimiento de los compromisos adquiridos.", "En síntesis, la aplicación de la justicia restaurativa frente a delitos ambientales debe orientarse, de acuerdo con la estrategia institucional de la Fiscalía General de la Nación, hacia:", "Participación → Reconocimiento de responsabilidad → Reparación → Enfoque territorial y diferencial → Articulación comunitaria e institucional → Seguimiento", "La justicia restaurativa en materia ambiental no se limita a buscar una respuesta frente al responsable de la conducta. Busca generar condiciones para reconocer el daño, garantizar la participación de quienes resultaron afectados y construir respuestas orientadas a la reparación, el restablecimiento y la transformación de las condiciones que dieron lugar al conflicto."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "e) Justicia propia y comunitaria", "segs": [0], "obj": "lupa"}, {"label": "f) Articulación y seguimiento", "segs": [1], "obj": "camara"}, {"label": "En síntesis", "segs": [2, 3], "obj": "documento"}, {"label": "Lo que busca la justicia restaurativa ambiental", "segs": [4], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 4: Criterios para la aplicación de la justicia restaurativa en la investigación y judicialización de delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["e) Justicia propia y comunitaria", "f) Articulación y seguimiento", "En síntesis", "Lo que busca la justicia restaurativa ambiental"], "titulo_genially": "Criterios orientadores (Resolución 0-0211 de 2025)", "complemento_genially": "", "apartado": "", "bloques_fuente": [170, 174], "pestana": "Criterios e) y f) y síntesis", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Criterios orientadores (Resolución 0-0211 de 2025).pdf"}, "mapaMental": {"src": "documentos/mapa-
