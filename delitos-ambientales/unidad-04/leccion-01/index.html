<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u4-l1", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 4 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 4, "lesson": 1, "heading": "Lección 1: La justicia restaurativa en el marco del proceso penal colombiano aplicada a los delitos contra el medio ambiente y los recursos naturales", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Comprender los fundamentos constitucionales, legales y dogmáticos de la justicia restaurativa dentro del proceso penal colombiano, identificando sus condiciones de procedibilidad y aplicabilidad frente a las conductas punibles ambientales."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "La justicia restaurativa en el marco del proceso penal colombiano aplicada a los delitos contra el medio ambiente y los recursos naturales", "segs": [0], "obj": "documento", "acomp": ["carpetas", "lupa"]}]}], "rotulo": null, "seccion": "Lección 1: La justicia restaurativa en el marco del proceso penal colombiano aplicada a los delitos contra el medio ambiente y los recursos naturales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["La justicia restaurativa en el marco del proceso penal colombiano aplicada a los delitos contra el medio ambiente y los recursos naturales"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "ilustracion": "ijda-daniela-u4-l1.webp", "bloques_fuente": [29, 29], "textoFijo": true, "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p41"}}, {"layout": "esquema", "segmentos": ["El derecho penal ha sido concebido tradicionalmente como un mecanismo de control social que responde a las conductas criminales con sanciones y antecedentes penales. Sin embargo, esta área del derecho ha evolucionado hacia una concepción en la que también son importantes la reparación de los perjuicios causados a las víctimas, la reintegración del victimario a la comunidad y la asunción de responsabilidad del autor por el daño causado con su conducta.", "Actualmente, fiscales y jueces pueden remitir los conflictos penales de baja lesividad que cumplan con los requisitos legales a los programas de justicia restaurativa que se creen con fundamento en la regulación, para evitar así que los daños causados al medio ambiente queden sin resolver."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Más allá de la sanción", "segs": [0], "obj": "escudo"}, {"label": "La remisión a programas restaurativos", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 1: La justicia restaurativa en el marco del proceso penal colombiano aplicada a los delitos contra el medio ambiente y los recursos naturales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Más allá de la sanción", "La remisión a programas restaurativos"], "titulo_genially": "La justicia restaurativa en el proceso penal", "complemento_genially": "", "apartado": "", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "comunidad", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [32, 33]}, {"layout": "fichas", "segmentos": ["La justicia restaurativa conlleva una visión alternativa del tratamiento del conflicto, con miras a superar las limitaciones propias del sistema de justicia formal, asociadas a su incapacidad para resolver las causas subyacentes a la conflictividad, satisfacer los intereses de la víctima, lograr una verdadera reinserción del ofensor y dar tratamiento efectivo a todos los casos (Fiscalía General de la Nación, 2020).", "Por su parte, la ley penal define la justicia restaurativa como “todo proceso en el que la víctima y el imputado, acusado o sentenciado participan conjuntamente de forma activa en la resolución de cuestiones derivadas del delito en busca de un resultado restaurativo, con o sin la participación de un facilitador” (Ley 906 de 2004, art. 518). Esta definición es consonante con los conceptos dados por el Consejo Económico y Social de las Naciones Unidas y la Corte Constitucional en la materia.", "Conforme a lo anterior, la restauración podrá ser material o simbólica, según las necesidades de las víctimas, quienes pueden encontrar en el perdón una manera de ver resarcido su sufrimiento. Así las cosas, la reparación económica no será la única opción de los sujetos pasivos de las conductas (Guevara Villarreal, 2013).", "Del mismo modo, el modelo de justicia restaurativa no centra sus esfuerzos únicamente en la sanción de quien cometió la ofensa, sino que busca que este último pueda reconciliarse con la sociedad a través del reconocimiento de su reprochable conducta y del reencuentro con el otro como víctima y como sociedad en conjunto, en el entendido de que la comisión del delito se desarrolla en un contexto social a partir del cual sea factible encontrar respuesta al injusto. Estos procesos permiten que los actores del conflicto reconcilien, mejoren y subsanen el mal ocasionado, y prosigan adelante en sus vidas (Alcaldía de Bogotá, 2015)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una visión alternativa del conflicto", "segs": [0], "obj": "escudo"}, {"label": "La definición legal", "segs": [1], "obj": "libros"}, {"label": "Restauración material o simbólica", "segs": [2], "obj": "personas"}, {"label": "Más que sancionar: reintegrar", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Concepto de la justicia restaurativa", "grupo": null, "titulos_fuente": ["1. Concepto de la justicia restaurativa"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una visión alternativa del conflicto", "La definición legal", "Restauración material o simbólica", "Más que sancionar: reintegrar"], "titulo_genially": "1. Concepto de la justicia restaurativa", "complemento_genially": "", "apartado": "1. Concepto de la justicia restaurativa", "bloques_fuente": [35, 38], "pestana": "Qué es y qué define la ley", "pestanas": [{"layout": "fichas", "segmentos": ["La justicia restaurativa conlleva una visión alternativa del tratamiento del conflicto, con miras a superar las limitaciones propias del sistema de justicia formal, asociadas a su incapacidad para resolver las causas subyacentes a la conflictividad, satisfacer los intereses de la víctima, lograr una verdadera reinserción del ofensor y dar tratamiento efectivo a todos los casos (Fiscalía General de la Nación, 2020).", "Por su parte, la ley penal define la justicia restaurativa como “todo proceso en el que la víctima y el imputado, acusado o sentenciado participan conjuntamente de forma activa en la resolución de cuestiones derivadas del delito en busca de un resultado restaurativo, con o sin la participación de un facilitador” (Ley 906 de 2004, art. 518). Esta definición es consonante con los conceptos dados por el Consejo Económico y Social de las Naciones Unidas y la Corte Constitucional en la materia.", "Conforme a lo anterior, la restauración podrá ser material o simbólica, según las necesidades de las víctimas, quienes pueden encontrar en el perdón una manera de ver resarcido su sufrimiento. Así las cosas, la reparación económica no será la única opción de los sujetos pasivos de las conductas (Guevara Villarreal, 2013).", "Del mismo modo, el modelo de justicia restaurativa no centra sus esfuerzos únicamente en la sanción de quien cometió la ofensa, sino que busca que este último pueda reconciliarse con la sociedad a través del reconocimiento de su reprochable conducta y del reencuentro con el otro como víctima y como sociedad en conjunto, en el entendido de que la comisión del delito se desarrolla en un contexto social a partir del cual sea factible encontrar respuesta al injusto. Estos procesos permiten que los actores del conflicto reconcilien, mejoren y subsanen el mal ocasionado, y prosigan adelante en sus vidas (Alcaldía de Bogotá, 2015)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una visión alternativa del conflicto", "segs": [0], "obj": "escudo"}, {"label": "La definición legal", "segs": [1], "obj": "libros"}, {"label": "Restauración material o simbólica", "segs": [2], "obj": "personas"}, {"label": "Más que sancionar: reintegrar", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Concepto de la justicia restaurativa", "grupo": null, "titulos_fuente": ["1. Concepto de la justicia restaurativa"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una visión alternativa del conflicto", "La definición legal", "Restauración material o simbólica", "Más que sancionar: reintegrar"], "titulo_genially": "1. Concepto de la justicia restaurativa", "complemento_genially": "", "apartado": "1. Concepto de la justicia restaurativa", "bloques_fuente": [35, 38], "pestana": "Qué es y qué define la ley", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Concepto de la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Concepto de la justicia restaurativa"}}, {"layout": "esquema", "segmentos": ["El modelo restaurativo, según Guevara Villarreal (2022), permite:", "Una lectura más amplia del delito, contemplando las necesidades y los contextos de cada uno de los sujetos del conflicto, esto es, tanto del autor como del Estado, la víctima y la comunidad, para construir justicia a través del diálogo y el consenso entre las partes. Así las cosas, comprender el vehículo que motivó al agresor a llevar a cabo la conducta punible posibilita brindar respuestas de manera más certera y efectiva, relacionando las necesidades de las partes en el proceso y la manera en que ellas puedan servir de ayuda para resolver el conflicto en armonía y paz. Es así como este modelo despoja un poco el papel que ejerce el Estado en el modelo de justicia retributiva, en el cual se establece una relación entre el infractor y la sociedad a través de los organismos del Estado que imponen una sanción, con la cual se espera que el victimario cambie su comportamiento a partir de una experiencia de reclusión."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El modelo según Guevara Villarreal (2022)", "segs": [0], "obj": "documento"}, {"label": "Una lectura más amplia del delito", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "1. Concepto de la justicia restaurativa", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El modelo según Guevara Villarreal (2022)", "Una lectura más amplia del delito"], "titulo_genially": "1. Concepto de la justicia restaurativa", "complemento_genially": "", "apartado": "1. Concepto de la justicia restaurativa", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "personas", "documento"], "escenario": {"bioma": "campo", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [39, 40], "pestana": "Lo que permite el modelo", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Concepto de la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Concepto de la justicia restaurativa"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Concepto de la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Concepto de la justicia restaurativa"}}, {"layout": "giro", "segmentos": ["Arévalo Infante (2018) menciona que la justicia ambiental nace de la experiencia norteamericana de los años ochenta, cuando:", "Un estudio demostró que tres de cada cuatro depósitos de desechos peligrosos se localizaban en comunidades afroamericanas, lo que hizo saltar en la mesa de debate la discusión sobre la desigualdad (discriminación) respecto del riesgo ambiental y las formas como debe repararse. (p. 1)", "La particularidad del derecho ambiental es que en él la valoración de los daños ambientales no solo concibe el patrimonio individual de la persona, sino que se debe atender a criterios sociales, ecológicos, económicos, culturales, etc. Ello atiende a derechos colectivos e intergeneracionales, los cuales, por sus características, dificultan el reconocimiento de detrimentos de esos bienes materiales ambientales.", "Finalmente, los principios que guían las prácticas de justicia restaurativa, como las definiciones relacionales del daño, la participación, la reparación de los daños y la recuperación, son principios esenciales en el proceso de creación de una justicia medioambiental."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Origen: Arévalo Infante (2018)", "segs": [0, 1], "obj": "reloj"}, {"label": "Daño individual y colectivo", "segs": [2], "obj": "personas"}, {"label": "Principios que se encuentran", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Aceptación de justicia ambiental", "grupo": null, "titulos_fuente": ["2. Aceptación de justicia ambiental"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Origen: Arévalo Infante (2018)", "Daño individual y colectivo", "Principios que se encuentran"], "titulo_genially": "2. Aceptación de justicia ambiental", "complemento_genially": "", "apartado": "2. Aceptación de justicia ambiental", "bloques_fuente": [42, 45]}, {"layout": "esquema", "segmentos": ["En materia penal ambiental, la jurisprudencia de la Sala de Casación Penal de la Corte Suprema de Justicia ha desarrollado el concepto de daño en los recursos naturales a partir de la necesidad de demostrar una afectación concreta sobre el bien jurídico protegido. En este sentido, el daño no se identifica simplemente con el incumplimiento de una obligación administrativa o ambiental, sino que requiere establecer una afectación real y efectiva de los recursos naturales, vinculada causalmente con la conducta investigada.", "La Sentencia SP5664-2021 constituye un referente fundamental en esta materia. La Corte diferenció los delitos de peligro de aquellos que tienen naturaleza de lesión y señaló que el delito de daño en los recursos naturales pertenece a esta última categoría. Asimismo, explicó que, tratándose de bienes jurídicos colectivos, la lesividad de las conductas ambientales puede comprenderse a partir de la teoría del efecto acumulativo, pues determinadas acciones individuales pueden adquirir relevancia cuando se consideran sus efectos sobre el ecosistema en su conjunto.", "Esta diferenciación resulta relevante para la investigación, pues permite distinguir entre una conducta que genera un riesgo o tiene aptitud para afectar el ambiente y aquella que produce efectivamente un daño susceptible de ser atribuido penalmente. En la Sentencia SP045-2026 la Corte reitera que en el delito de daño en los recursos naturales se requiere una alteración perceptible en el mundo exterior, así como un nexo causal entre la conducta y el resultado producido.", "La Sentencia SP247-2024 desarrolla con mayor precisión esta exigencia al señalar que el daño real y efectivo puede establecerse a partir de la disminución de la calidad, cantidad o disponibilidad del recurso natural. La providencia también destaca la necesidad de acreditar el nexo causal entre la acción u omisión y el daño producido, así como el incumplimiento de la normatividad ambiental cuando este constituye un elemento del tipo penal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El daño en la jurisprudencia penal", "segs": [0], "obj": "libros"}, {"label": "Sentencia SP5664-2021", "segs": [1], "obj": "reloj"}, {"label": "Riesgo o daño: por qué importa", "segs": [2], "obj": "lupa"}, {"label": "Sentencia SP247-2024", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "grupo": null, "titulos_fuente": ["3. El daño ambiental desde la perspectiva de la justicia restaurativa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El daño en la jurisprudencia penal", "Sentencia SP5664-2021", "Riesgo o daño: por qué importa", "Sentencia SP247-2024"], "titulo_genially": "3. El daño ambiental desde la justicia restaurativa", "complemento_genially": "", "apartado": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "objeto_raiz": "libros", "objetos_raiz": ["libros", "reloj", "documento"], "escenario": {"bioma": "comunidad", "camino": "meandro"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [47, 50], "pestana": "Peligro y lesión en la jurisprudencia", "pestanas": [{"layout": "esquema", "segmentos": ["En materia penal ambiental, la jurisprudencia de la Sala de Casación Penal de la Corte Suprema de Justicia ha desarrollado el concepto de daño en los recursos naturales a partir de la necesidad de demostrar una afectación concreta sobre el bien jurídico protegido. En este sentido, el daño no se identifica simplemente con el incumplimiento de una obligación administrativa o ambiental, sino que requiere establecer una afectación real y efectiva de los recursos naturales, vinculada causalmente con la conducta investigada.", "La Sentencia SP5664-2021 constituye un referente fundamental en esta materia. La Corte diferenció los delitos de peligro de aquellos que tienen naturaleza de lesión y señaló que el delito de daño en los recursos naturales pertenece a esta última categoría. Asimismo, explicó que, tratándose de bienes jurídicos colectivos, la lesividad de las conductas ambientales puede comprenderse a partir de la teoría del efecto acumulativo, pues determinadas acciones individuales pueden adquirir relevancia cuando se consideran sus efectos sobre el ecosistema en su conjunto.", "Esta diferenciación resulta relevante para la investigación, pues permite distinguir entre una conducta que genera un riesgo o tiene aptitud para afectar el ambiente y aquella que produce efectivamente un daño susceptible de ser atribuido penalmente. En la Sentencia SP045-2026 la Corte reitera que en el delito de daño en los recursos naturales se requiere una alteración perceptible en el mundo exterior, así como un nexo causal entre la conducta y el resultado producido.", "La Sentencia SP247-2024 desarrolla con mayor precisión esta exigencia al señalar que el daño real y efectivo puede establecerse a partir de la disminución de la calidad, cantidad o disponibilidad del recurso natural. La providencia también destaca la necesidad de acreditar el nexo causal entre la acción u omisión y el daño producido, así como el incumplimiento de la normatividad ambiental cuando este constituye un elemento del tipo penal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El daño en la jurisprudencia penal", "segs": [0], "obj": "libros"}, {"label": "Sentencia SP5664-2021", "segs": [1], "obj": "reloj"}, {"label": "Riesgo o daño: por qué importa", "segs": [2], "obj": "lupa"}, {"label": "Sentencia SP247-2024", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "grupo": null, "titulos_fuente": ["3. El daño ambiental desde la perspectiva de la justicia restaurativa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El daño en la jurisprudencia penal", "Sentencia SP5664-2021", "Riesgo o daño: por qué importa", "Sentencia SP247-2024"], "titulo_genially": "3. El daño ambiental desde la justicia restaurativa", "complemento_genially": "", "apartado": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "objeto_raiz": "libros", "objetos_raiz": ["libros", "reloj", "documento"], "escenario": {"bioma": "comunidad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [47, 50], "pestana": "Peligro y lesión en la jurisprudencia", "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · 3. El daño ambiental desde la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "3. El daño ambiental desde la justicia restaurativa"}}, {"layout": "fichas", "segmentos": ["La misma decisión ofrece un criterio particularmente útil para la investigación: el daño debe ser medible, cuantificable y verificable. En el caso analizado, la Corte concluyó que no se había demostrado con suficiencia la existencia de daños sobre determinados recursos, pues los elementos probatorios no permitían establecer una disminución verificable de su calidad, cantidad o disponibilidad.", "Este criterio ha sido reiterado en decisiones posteriores. En la Sentencia SP1418-2025 la Corte volvió a caracterizar el daño en los recursos naturales como un delito de lesión, destacando como elemento relevante la existencia de un daño real y efectivo, cuya determinación puede realizarse atendiendo a la disminución de la calidad, cantidad o disponibilidad del recurso afectado.", "La jurisprudencia también muestra la importancia de distinguir entre la existencia del daño y su atribución al responsable. En la Sentencia SP045-2026, aunque se documentaron afectaciones ambientales en el lugar investigado, la Corte concluyó que los elementos de prueba no permitían establecer, más allá de toda duda razonable, que estas fueran atribuibles a la persona procesada. La Sala llamó especialmente la atención sobre la necesidad de diferenciar los daños producidos por la conducta investigada de aquellos que pudieran corresponder a pasivos ambientales anteriores o a actividades de mitigación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Medible, cuantificable y verificable", "segs": [0], "obj": "libros"}, {"label": "Sentencia SP1418-2025", "segs": [1], "obj": "reloj"}, {"label": "Existencia y atribución del daño", "segs": [2], "obj": "expediente"}]}], "rotulo": null, "seccion": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Medible, cuantificable y verificable", "Sentencia SP1418-2025", "Existencia y atribución del daño"], "titulo_genially": "3. El daño ambiental desde la justicia restaurativa", "complemento_genially": "", "apartado": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "bloques_fuente": [51, 53], "pestana": "Un daño medible y atribuible", "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · 3. El daño ambiental desde la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "3. El daño ambiental desde la justicia restaurativa"}}], "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · 3. El daño ambiental desde la justicia restaurativa.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "3. El daño ambiental desde la justicia restaurativa"}}, {"layout": "lamina", "segmentos": ["Temática Central: Justicia restaurativa, prueba técnica del daño ambiental y nexo causal.", "Competencia a desarrollar: Capacidad para diferenciar un \"pasivo ambiental\" histórico de un daño actual, y estructurar un plan de reparación técnica para un preacuerdo procesal.", "Público Objetivo: Estudiantes de clínica jurídica, judicantes o fiscales en formación."], "parrafo": [0, 1, 2], "vineta": [0, 1, 2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Título del Caso: El Río y la Fábrica: Midiendo el Daño para Reparar.", "segs": [0, 1, 2], "obj": "reloj", "acomp": ["expediente", "documento"]}]}], "rotulo": null, "seccion": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "grupo": null, "titulos_fuente": ["3. El daño ambiental desde la perspectiva de la justicia restaurativa"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Título del Caso: El Río y la Fábrica: Midiendo el Daño para Reparar."], "titulo_genially": "Caso: el río y la fábrica", "complemento_genially": "", "apartado": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "bloques_fuente": [56, 58], "pestana": "El caso", "pestanas": [{"layout": "lamina", "segmentos": ["Temática Central: Justicia restaurativa, prueba técnica del daño ambiental y nexo causal.", "Competencia a desarrollar: Capacidad para diferenciar un \"pasivo ambiental\" histórico de un daño actual, y estructurar un plan de reparación técnica para un preacuerdo procesal.", "Público Objetivo: Estudiantes de clínica jurídica, judicantes o fiscales en formación."], "parrafo": [0, 1, 2], "vineta": [0, 1, 2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Título del Caso: El Río y la Fábrica: Midiendo el Daño para Reparar.", "segs": [0, 1, 2], "obj": "reloj", "acomp": ["expediente", "documento"]}]}], "rotulo": null, "seccion": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "grupo": null, "titulos_fuente": ["3. El daño ambiental desde la perspectiva de la justicia restaurativa"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Título del Caso: El Río y la Fábrica: Midiendo el Daño para Reparar."], "titulo_genially": "Caso: el río y la fábrica", "complemento_genially": "", "apartado": "3. El daño ambiental desde la perspectiva de la justicia restaurativa", "bloques_fuente": [56, 58], "pestana": "El caso", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · Caso: el río y la fábrica.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "Caso: el río y la fábrica"}}, {"layout": "esquema", "segmentos": ["Una empresa agrícola dedicada a la producción a gran escala es investigada por la Fiscalía tras ser sorprendida desviando sus aguas residuales, sin tratamiento previo, directamente hacia un río local.", "El argumento de la defensa: La empresa se niega a reparar el río argumentando la existencia de un \"pasivo ambiental\". Demuestran que el río ya estaba altamente contaminado desde hace diez años debido a los relaves de una antigua mina de oro abandonada río arriba."], "parrafo": [0, 1], "vineta": [1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Los vertimientos de la empresa", "segs": [0], "obj": "documento"}, {"label": "El argumento de la defensa", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "1. Contexto Fáctico (Los Hechos)", "grupo": null, "titulos_fuente": ["1. Contexto Fáctico (Los Hechos)"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Los vertimientos de la empresa", "El argumento de la defensa"], "titulo_genially": "Caso: el río y la fábrica", "complemento_genially": "", "apartado": "1. Contexto Fáctico (Los Hechos)", "objeto_raiz": "personas", "objetos_raiz": ["personas", "documento", "carpetas"], "escenario": {"bioma": "rio", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [60, 61], "pestana": "1. Los hechos", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · Caso: el río y la fábrica.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "Caso: el río y la fábrica"}}, {"layout": "fichas", "segmentos": ["El problema jurídico: Según la jurisprudencia de la Corte Suprema (ej. SP5664-2021), el daño a los recursos naturales es un \"delito de lesión\". La Fiscalía no puede imputar responsabilidad penal basándose únicamente en la violación de la norma administrativa (desviar el agua sin permiso), ni obligar a la empresa a limpiar la contaminación histórica de la mina.", "La prueba clave (El Peritaje): La Fiscalía introduce un dictamen técnico de la autoridad ambiental que establece una medición matemática. El estudio prueba que, exactamente a partir del tubo de desagüe de la empresa agrícola, el nivel de oxígeno del agua disminuyó un 30% adicional y desaparecieron dos especies específicas de peces que aún sobrevivían a la contaminación minera."], "parrafo": [0, 1], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "El problema jurídico", "segs": [0], "obj": "libros"}, {"label": "La prueba clave: el peritaje", "segs": [1], "obj": "expediente"}]}], "rotulo": null, "seccion": "2. El Reto Dogmático y Probatorio", "grupo": null, "titulos_fuente": ["2. El Reto Dogmático y Probatorio"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["El problema jurídico", "La prueba clave: el peritaje"], "titulo_genially": "Caso: el río y la fábrica", "complemento_genially": "", "apartado": "2. El Reto Dogmático y Probatorio", "bloques_fuente": [63, 64], "pestana": "2. El reto probatorio", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · Caso: el río y la fábrica.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "Caso: el río y la fábrica"}}, {"layout": "esquema", "segmentos": ["Al contar con un daño medible, cuantificable y verificable (el 30% de oxígeno y las dos especies), la Fiscalía logra aislar la responsabilidad de la empresa del pasivo ambiental histórico.", "El Preacuerdo: Se suspende la etapa de juicio oral a cambio de un plan de reparación estrictamente proporcional al daño causado.", "El Plan de Reparación:", "1. Construcción inmediata de una planta de tratamiento de aguas residuales en la fábrica.", "2. Ejecución de un programa técnico de repoblamiento exclusivo para las dos especies de peces afectadas, bajo supervisión de la autoridad ambiental."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Un daño medible", "segs": [0], "obj": "reloj"}, {"label": "El preacuerdo y el plan de reparación", "segs": [1, 2, 3, 4], "obj": "escalones"}]}], "rotulo": null, "seccion": "3. La Solución a través de la Justicia Restaurativa", "grupo": null, "titulos_fuente": ["3. La Solución a través de la Justicia Restaurativa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Un daño medible", "El preacuerdo y el plan de reparación"], "titulo_genially": "Caso: el río y la fábrica", "complemento_genially": "", "apartado": "3. La Solución a través de la Justicia Restaurativa", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "escalones", "documento"], "escenario": {"bioma": "comunidad", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [66, 70], "pestana": "3. La solución restaurativa", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · Caso: el río y la fábrica.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "Caso: el río y la fábrica"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · Caso: el río y la fábrica.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "Caso: el río y la fábrica"}}, {"layout": "esquema", "segmentos": ["Estos criterios jurisprudenciales tienen especial relevancia para una aproximación de justicia restaurativa en materia ambiental. Si la respuesta al delito busca trascender la sanción y orientarse hacia la recuperación del bien afectado, resulta indispensable determinar previamente qué fue afectado, cuál era su estado anterior, cuál fue la magnitud del daño, cuáles fueron sus consecuencias y qué posibilidades existen de recuperación o restauración.", "En esta perspectiva, la caracterización jurisprudencial del daño cumple una función que trasciende lo estrictamente probatorio. La determinación de la calidad, cantidad o disponibilidad del recurso afectado puede constituir un punto de partida para identificar las medidas necesarias para su recuperación o, cuando esta no sea posible en su totalidad, para definir las alternativas de reparación o compensación que correspondan.", "La jurisprudencia permite advertir que no toda intervención sobre un recurso natural constituye necesariamente un daño penalmente relevante. En la Sentencia SP247-2024, por ejemplo, la Corte concluyó que determinadas intervenciones sobre un recurso hídrico no habían producido una alteración demostrable de su calidad, cantidad o disponibilidad, razón por la cual no se acreditó el resultado exigido por el tipo penal. Por ello, desde una perspectiva restaurativa, la investigación debe procurar una caracterización integral del daño, que permita establecer tanto su dimensión jurídica como sus características ecológicas. Esto exige articular la investigación penal con elementos técnicos y científicos que permitan determinar el estado del recurso, la magnitud de la afectación, su evolución y las posibilidades de recuperación.", "En términos prácticos, la valoración del daño debería permitir responder:", "¿Qué recurso o ecosistema fue afectado? → ¿Cuál era su estado previo? → ¿Qué alteración se produjo? → ¿Cuál es su magnitud? → ¿Es medible y verificable? → ¿Cuál es el vínculo causal con la conducta investigada? → ¿Puede restaurarse? → ¿Qué medidas de reparación, restauración o compensación resultan adecuadas?", "La jurisprudencia analizada permite comprender que la justicia restaurativa ambiental parte de una adecuada identificación y valoración del daño. La sanción penal constituye una respuesta frente a la conducta delictiva, mientras que la perspectiva restaurativa permite orientar las actuaciones hacia las consecuencias producidas sobre los recursos naturales, procurando su recuperación y la atención de las afectaciones generadas."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta":
