<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u4-l2", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 4 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 4, "lesson": 2, "heading": "Lección 2: Participación de las víctimas, comunidades y demás actores en los procesos restaurativos ambientales", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Identificar los roles, garantías y formas de articulación de las víctimas directas, comunidades afectadas, entidades públicas y autoridades ambientales en los procesos de diálogo y mediación restaurativa. La protección del medio ambiente involucra un bien jurídico de naturaleza colectiva, por lo que sus afectaciones pueden trascender a personas individualmente consideradas y alcanzar a comunidades, ecosistemas, otras especies y generaciones futuras. En consecuencia, los procesos orientados a la reparación y restauración ambiental deben reconocer la participación de quienes resultan afectados y considerar las particularidades sociales, culturales y territoriales de las comunidades involucradas.", "La Corte Constitucional ha señalado que la protección del ambiente tiene una dimensión de corresponsabilidad con las generaciones futuras y que, precisamente por el carácter colectivo del bien jurídico ambiental, los perjudicados pueden ser difusos y no necesariamente identificables de manera individual. En el Auto A-1346 de 2023, la Corte estudió un caso relacionado con el pueblo Nasa y destacó que la reforestación del área afectada podía constituir un mecanismo idóneo de reparación del daño a los recursos naturales y al medio ambiente, al tiempo que representaba una alternativa de justicia con enfoque restaurativo propuesta desde la propia comunidad.", "Este pronunciamiento resulta especialmente relevante, porque permite comprender que la restauración ambiental no necesariamente debe limitarse a una medida impuesta desde una perspectiva exclusivamente institucional. En contextos en los que existen comunidades étnicas afectadas, sus conocimientos, prácticas culturales, autoridades y formas propias de comprender la relación con el territorio pueden constituir elementos relevantes para definir las medidas de restauración."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "escudo"}, {"label": "Corresponsabilidad con las generaciones futuras", "segs": [1], "obj": "libros"}, {"label": "La restauración no es solo una medida impuesta", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 2: Participación de las víctimas, comunidades y demás actores en los procesos restaurativos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Objetivo", "Corresponsabilidad con las generaciones futuras", "La restauración no es solo una medida impuesta"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "llano"}, "bloques_fuente": [79, 81], "textoFijo": true, "ilustracion": "ijda-daniela-u4-l2.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p42"}}, {"layout": "fichas", "segmentos": ["La jurisprudencia constitucional ha desarrollado una protección reforzada para los pueblos indígenas y comunidades afrodescendientes cuando las actividades o decisiones ambientales pueden afectar directamente sus territorios, formas de vida o prácticas culturales. La Corte ha señalado que el territorio de los pueblos étnicos no puede entenderse únicamente como un espacio geográfico, sino también como un espacio cultural en el que se desarrollan sus formas de vida, organización, identidad y relación con la naturaleza.", "Cuando una actuación ambiental puede generar una afectación directa sobre estas comunidades, la consulta previa constituye un mecanismo fundamental de participación. La Corte ha explicado que, ante afectaciones ambientales que recaen sobre pueblos indígenas o afrodescendientes, la justicia ambiental adquiere una dimensión diferenciada, pues las cargas ambientales pueden producir consecuencias no solamente ecológicas, sino también sociales, culturales, económicas y políticas para estas comunidades.", "La Sentencia SU-123 de 2018 resulta particularmente relevante al vincular la consulta previa con la justicia ambiental. La Corte explica que esta última comprende, entre otros elementos, una dimensión participativa, que exige la intervención activa y significativa de las personas y comunidades afectadas por las decisiones ambientales. En el caso de los pueblos indígenas y tribales, dicha participación adquiere características diferenciadas cuando existe afectación directa.", "En la misma línea, la Sentencia C-300 de 2021 señaló que la justicia ambiental comprende dos componentes estrechamente relacionados: la justicia distributiva, orientada al reparto equitativo de las cargas y beneficios ambientales, y la justicia participativa, que exige abrir espacios para que las personas afectadas puedan intervenir efectivamente en las decisiones ambientales, en condiciones de igualdad frente al conocimiento técnico.", "Este criterio resulta especialmente importante en los procesos restaurativos ambientales: la participación de las comunidades no debe entenderse únicamente como el suministro de información, sino como una posibilidad efectiva de incidir en la identificación de las afectaciones, las medidas de reparación y restauración y las alternativas para evitar su repetición."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Protección reforzada", "segs": [0], "obj": "libros"}, {"label": "La consulta previa", "segs": [1], "obj": "documento"}, {"label": "Sentencia SU-123 de 2018", "segs": [2], "obj": "personas"}, {"label": "Sentencia C-300 de 2021", "segs": [3], "obj": "carpetas"}, {"label": "Participar no es solo informar", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "1. Participación de pueblos indígenas y comunidades étnicas", "grupo": null, "titulos_fuente": ["1. Participación de pueblos indígenas y comunidades étnicas"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Protección reforzada", "La consulta previa", "Sentencia SU-123 de 2018", "Sentencia C-300 de 2021", "Participar no es solo informar"], "titulo_genially": "1. Participación de pueblos indígenas y comunidades étnicas", "complemento_genially": "", "apartado": "1. Participación de pueblos indígenas y comunidades étnicas", "bloques_fuente": [83, 87], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Participación de pueblos indígenas y comunidades étnicas.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Participación de pueblos indígenas y comunidades étnicas"}}, {"layout": "esquema", "segmentos": ["En materia ambiental, la noción de víctima presenta una particularidad: el daño puede recaer sobre un bien jurídico colectivo, por lo que no siempre es posible identificar previamente a todas las personas afectadas. El Auto A-1346 de 2023 reconoce expresamente esta característica al señalar que los perjudicados pueden ser difusos e involucrar no solamente a las personas, sino también a los ecosistemas, otras especies y las generaciones futuras.", "Esta característica permite comprender la participación de las víctimas ambientales desde una perspectiva amplia. Además de las personas que experimentan una afectación directa (por ejemplo, comunidades que dependen de un río, bosque o territorio para su subsistencia), pueden existir intereses colectivos relacionados con la conservación del ecosistema y con las condiciones ambientales que deben preservarse para las generaciones futuras.", "Los procesos restaurativos deben procurar identificar quiénes resultaron afectados, cómo se produjo la afectación y cuáles son sus necesidades y expectativas frente a la restauración, con especial consideración por las comunidades que mantienen una relación cultural, económica o espiritual con el territorio."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Un bien jurídico colectivo", "segs": [0], "obj": "reloj"}, {"label": "Víctimas en sentido amplio", "segs": [1], "obj": "escudo"}, {"label": "Qué deben identificar los procesos", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "2. La víctima colectiva y el ambiente como bien jurídico colectivo", "grupo": null, "titulos_fuente": ["2. La víctima colectiva y el ambiente como bien jurídico colectivo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Un bien jurídico colectivo", "Víctimas en sentido amplio", "Qué deben identificar los procesos"], "titulo_genially": "2. La víctima colectiva", "complemento_genially": "", "apartado": "2. La víctima colectiva y el ambiente como bien jurídico colectivo", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "escudo", "personas"], "escenario": {"bioma": "norma", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [89, 91]}, {"layout": "esquema", "segmentos": ["A partir de estos criterios jurisprudenciales, la participación en procesos restaurativos ambientales puede organizarse a partir de cuatro preguntas:", "¿Quiénes fueron afectados? → ¿Cómo afectó el daño su territorio, forma de vida o relación con el ambiente? → ¿Qué medidas consideran necesarias para restaurar el daño? → ¿Cómo pueden participar en su implementación y seguimiento?", "En particular, cuando se encuentren involucrados pueblos indígenas o comunidades étnicas, será necesario considerar sus autoridades, conocimientos tradicionales, prácticas culturales y mecanismos propios de relación con el territorio, así como los estándares constitucionales de participación y consulta previa cuando resulten aplicables. La jurisprudencia reciente también ha resaltado la necesidad de articular las competencias de las autoridades indígenas y las autoridades ambientales estatales bajo principios de coordinación, concurrencia y participación.", "Para mayor ilustración de este tema se presenta el siguiente caso práctico (virtualizar de forma animada):", "El Escenario Una empresa fachada, vinculada a una red de criminalidad organizada, ingresó maquinaria pesada al territorio del Resguardo Indígena \"Río Sagrado\" (ficticio) para extraer oro. La actividad contaminó con mercurio las fuentes hídricas y destruyó zonas de bosque donde la comunidad recolectaba plantas medicinales. La Fiscalía interviene y los procesados buscan acogerse a un Principio de Oportunidad reparando el daño.", "Para construir el plan de reparación, la Fiscalía y la autoridad ambiental no pueden decidir solas; deben coordinarse con el Cabildo Gobernador (autoridad indígena) aplicando las cuatro preguntas orientadoras:"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Las cuatro preguntas", "segs": [0, 1, 2, 3], "obj": "camara"}, {"label": "Caso práctico: «Raíces profundas»", "segs": [4, 5], "obj": "escalones"}]}], "rotulo": "Orientación para la investigación y la restauración", "seccion": "3. Orientación para la investigación y la restauración", "grupo": null, "titulos_fuente": ["3. Orientación para la investigación y la restauración"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Las cuatro preguntas", "Caso práctico: «Raíces profundas»"], "titulo_genially": "3. Orientación para la investigación y la restauración", "complemento_genially": "", "apartado": "3. Orientación para la investigación y la restauración", "objeto_raiz": "libros", "objetos_raiz": ["libros", "reloj", "lupa"], "escenario": {"bioma": "campo", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [93, 99]}, {"layout": "empareja", "segmentos": ["Físicamente: Las 120 familias indígenas del resguardo que dependen del río para su consumo de agua y pesca.", "Cultural y espiritualmente: Los médicos tradicionales (sabedores o jaibanás), quienes perdieron el acceso a un área del bosque considerada sagrada para sus rituales de sanación."], "parrafo": [0, 1], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Físicamente", "segs": [0], "obj": "documento", "nombre_texto": "Físicamente"}, {"label": "Cultural y espiritualmente", "segs": [1], "obj": "corazon", "nombre_texto": "Cultural y espiritualmente"}]}], "rotulo": null, "seccion": "1. ¿Quiénes fueron afectados?", "grupo": null, "titulos_fuente": ["1. ¿Quiénes fueron afectados?"], "encabezados": interrumpió la transmisión de conocimientos ancestrales, pues los sabedores ya no tienen dónde enseñar a los jóvenes sobre botánica tradicional.", "3. ¿Qué medidas consideran necesarias para restaurar el daño? Aquí se une la ciencia estatal con el saber tradicional (concurrencia de autoridades):", "Restauración occidental: El procesado debe financiar la extracción técnica del mercurio y la estabilización de los suelos bajo la supervisión de la Corporación Autónoma Regional (CAR).", "Restauración tradicional: La reforestación no se hace con cualquier semilla comercial, sino con especies endémicas y plantas medicinales específicas exigidas por los sabedores. Además, el procesado debe financiar los rituales de \"armonización y limpieza espiritual\" del territorio, ya que para la comunidad el río quedó energéticamente contaminado."], "parrafo": [0, 1, 2, 3], "vineta": [0, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Un daño a la cosmovisión", "segs": [0, 1], "obj": "reloj"}, {"label": "Restauración occidental", "segs": [2], "obj": "documento"}, {"label": "Restauración tradicional", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2. ¿Cómo afectó el daño su territorio, forma de vida o relación con el ambiente?", "grupo": null, "titulos_fuente": ["2. ¿Cómo afectó el daño su territorio, forma de vida o relación con el ambiente?"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Un daño a la cosmovisión", "Restauración occidental", "Restauración tradicional"], "titulo_genially": "Caso «Raíces profundas»: las cuatro preguntas", "complemento_genially": "", "apartado": "2. ¿Cómo afectó el daño su territorio, forma de vida o relación con el ambiente?", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "tala", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [104, 107], "pestana": "¿Cómo afectó el daño?", "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · Caso «Raíces profundas»: las cuatro preguntas.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "Caso «Raíces profundas»: las cuatro preguntas"}}, {"layout": "giro", "segmentos": ["Vigilancia propia: En lugar de enviar inspectores estatales todos los meses, el plan de reparación establece que la Guardia Indígena será dotada con equipos de monitoreo de agua. Ellos serán los veedores directos.", "Certificación conjunta: Para que el Juez declare que el infractor cumplió el acuerdo y se cierre el caso penal, el informe final debe llevar dos firmas: la del perito de la autoridad ambiental estatal y el aval del Cabildo Gobernador indígena.", "El Resultado Procesal Al aplicar este enfoque, el Estado respeta el estándar de consulta previa y participación. El plan de reparación deja de ser una imposición legal externa y se convierte en un proceso de justicia restaurativa real, que sana tanto la tierra como el tejido cultural de la comunidad étnica."], "parrafo": [0, 1, 2], "vineta": [0, 1], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Vigilancia propia", "segs": [0], "obj": "camara"}, {"label": "Certificación conjunta", "segs": [1], "obj": "tribunal"}, {"label": "El resultado procesal", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "4. ¿Cómo pueden participar en su implementación y seguimiento?", "grupo": null, "titulos_fuente": ["4. ¿Cómo pueden participar en su implementación y seguimiento?"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Vigilancia propia", "Certificación conjunta", "El resultado procesal"], "titulo_genially": "Caso «Raíces profundas»: las cuatro preguntas", "complemento_genially": "", "apartado": "4. ¿Cómo pueden participar en su implementación y seguimiento?", "bloques_fuente": [109, 111], "pestana": "¿Cómo participan?", "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · Caso «Raíces profundas»: las cuatro preguntas.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "Caso «Raíces profundas»: las cuatro preguntas"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · Caso «Raíces profundas»: las cuatro preguntas.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "Caso «Raíces profundas»: las cuatro preguntas"}}, {"layout": "esquema", "segmentos": ["Desde la postura antropocéntrica se argumenta que el deterioro ambiental no constituye una lesión o peligro de un bien jurídico, ya que solo será relevante si lo que se pone en peligro es la vida o la salud de las personas. En cambio, quienes defienden la postura ecocéntrica conciben al medio ambiente como un bien jurídico independiente que merece protección jurídica autónoma, más allá de que sea útil o beneficie o afecte su explotación.", "En la ética antropocéntrica, el hombre como centro y eje del universo utiliza a la ciencia y a la tecnología como instrumentos para sujetar el mundo natural a sus fines, necesidades e intereses particulares. En ese sentido, la naturaleza no posee un valor propio, sino uno instrumental, asignado y reconocido, en la medida en que proporciona las condiciones y los bienes materiales para el logro y desarrollo de la vida humana. Debido a ello, es la relación del hombre con la naturaleza la que debe estar regulada por el deber ético de cuidar y preservar el entorno natural para asegurar el futuro desarrollo humano y social.", "Por contraparte, en la ética ambiental ecocéntrica el hombre es un miembro más de la comunidad biosfera y comparte un destino común con las otras especies y elementos de la Tierra. La naturaleza posee un valor en sí misma, que adquiere por el simple hecho de existir y poseer dinámica y vida propia, considerándosela un fin en sí mismo, una potencia que genera las condiciones de vida en general, cuyos elementos participan y contribuyen en ese proceso, por lo cual tienen derecho intrínseco de vivir y desarrollarse en la biosfera, debiendo el hombre reconocerse como un elemento más, respetando a los otros miembros de la misma.", "Con respecto a este tema, Paula Cresci (2018) señala lo siguiente:", "A nivel nacional e internacional, se ha realizado una serie de esfuerzos con el objetivo de lograr que el impacto del hombre sobre la naturaleza no termine con ella. Ya sea mediante convenios, declaraciones, tratados internacionales, leyes, etc., actualmente se cuenta con una gran cantidad de normativa que apunta a proteger la naturaleza. Pero ¿es esto realmente así? ¿Esta normativa busca proteger a la naturaleza o al hombre para que este pueda explotarla? Es en este sentido que me pregunto: ¿son estos esfuerzos suficientes, considerando que el eje de la protección de la mayoría de la normativa positiva es el hombre y no la naturaleza?"], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La postura antropocéntrica", "segs": [0], "obj": "escudo"}, {"label": "La ética antropocéntrica", "segs": [1], "obj": "documento"}, {"label": "La ética ecocéntrica", "segs": [2], "obj": "carpetas"}, {"label": "Paula Cresci (2018)", "segs": [3, 4], "obj": "lupa"}]}], "rotulo": null, "seccion": "4. Posturas ecocéntricas y antropocéntricas", "grupo": null, "titulos_fuente": ["4. Posturas ecocéntricas y antropocéntricas"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La postura antropocéntrica", "La ética antropocéntrica", "La ética ecocéntrica", "Paula Cresci (2018)"], "titulo_genially": "4. Posturas ecocéntricas y antropocéntricas", "complemento_genially": s_fuente": [113, 117], "pestana": "Antropocentrismo y ecocentrismo", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 4. Posturas ecocéntricas y antropocéntricas.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "4. Posturas ecocéntricas y antropocéntricas"}}, {"layout": "fichas", "segmentos": ["La autora considera fundamental en ese sentido recuperar la dimensión ética del medio ambiente, la cual puede contribuir a construir e impulsar una estrategia de desarrollo sustentable pertinente y factible, que tienda a mejorar las condiciones de vida y el equilibrio entre el desarrollo y la naturaleza. La ética del medio ambiente aborda esta dimensión desde diversas perspectivas teóricas, que plantean alternativas para conocer y comprender la complejidad que encierra el medio ambiente, tomando en cuenta la crisis actual presente a nivel planetario.", "La ética ambiental surge también por el cuestionamiento de las consecuencias del progreso científico sobre la vida, que si bien ha permitido una mayor expectativa y una mejor calidad de vida en los seres humanos, también trae consecuencias importantes. El Informe Geo del PNUMA del año 2000 destaca que los problemas son varios: cambios climáticos, pérdida de la capa de ozono, escasez del agua dulce, contaminación del agua potable y del aire, deterioro del suelo, deforestación y desertificación, alteración de ecosistemas, desastres naturales, acumulación de desechos y sustancias tóxicas, agotamiento de los recursos naturales, pérdida de la biodiversidad, inseguridad alimentaria, pobreza, urbanización desordenada, guerras y conflictos, entre otros.", "En este orden, se analiza la normativa positiva vigente de diversos países latinoamericanos y cómo su visión antropocéntrica o ecocéntrica impacta sobre la protección de las especies y la biodiversidad en general."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{
