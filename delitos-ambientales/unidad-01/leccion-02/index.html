cabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo", "Desarrollo"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [97, 98], "textoFijo": true, "ilustracion": "ijda-daniela-u1-l2.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p12"}}, {"layout": "esquema", "segmentos": ["Para el caso colombiano, la Corte Constitucional manifiesta que en la Carta Política de 1991 se encuentra una verdadera Constitución ecológica, del mismo rango que las de orden económico, social y cultural, en tanto que:", "Al lado del conjunto de principios que la Constitución dedica a las relaciones económicas deben situarse una serie de disposiciones de no menos trascendencia encaminadas a asegurar una protección básica a la vida humana considerada como un valor en sí, al margen del uso que se haga de los recursos humanos en atención a fines políticos y económicos. Se da así entrada a una nueva dimensión de las garantías constitucionales cuyo núcleo esencial se halla en la protección de la libertad personal y de los demás derechos fundamentales vinculados de diversa manera a la misma y que se manifiesta, ante todo, en un conjunto de reglas generales tendentes a crear una situación ambiental que facilite lo más posible el ejercicio de las libertades individuales. (Sentencia C-259 de 2014, num. 5.1.11)", "A su vez, agrega Amaya Navas (2016) que:", "La preocupación sobre el medio ambiente ha encontrado espacio en la parte dogmática de las constituciones, mediante la consagración de un nuevo derecho de contenido económico y social: el derecho al ambiente sano y a la calidad de vida, al que se suele impregnar de una funcionalidad compleja a partir de su configuración —simultánea, por cierto— de derecho y de deber (puesto que incorpora la obligación de conservar el medio ambiente que se tiene derecho a disfrutar). De ahí su consagración como uno de los principios rectores de la política económica y social.", "Sin embargo, tras la conquista de la Constitución de 1991, opina Canosa Usera que la generosidad en esas proclamaciones constitucionales no siempre asegura la protección de los bienes tutelados. Ese riesgo de caer en lo semántico pesa sobre todas las constituciones, en especial sobre las de los países en desarrollo que, por lo demás, suelen ser más generosas en las proclamaciones."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La Constitución ecológica (Corte Constitucional)", "segs": [0], "obj": "libros"}, {"label": "Sentencia C-259 de 2014", "segs": [1], "obj": "escudo"}, {"label": "El ambiente en las constituciones (Amaya Navas)", "segs": [2, 3], "obj": "documento"}, {"label": "Proclamar no basta (Canosa Usera)", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "1. Profundización y definición", "grupo": null, "titulos_fuente": ["1. Profundización y definición"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La Constitución ecológica (Corte Constitucional)", "Sentencia C-259 de 2014", "El ambiente en las constituciones (Amaya Navas)", "Proclamar no basta (Canosa Usera)"], "titulo_genially": "1. Profundización y definición", "complemento_genially": "", "apartado": "1. Profundización y definición", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [102, 106], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Profundización y definición.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Profundización y definición"}}, {"layout": "esquema", "segmentos": ["El artículo 2 de la Constitución Política de Colombia (1991) establece los fines esenciales del Estado, entre los que se encuentran servir a la comunidad, promover la prosperidad general y garantizar la efectividad de los principios, derechos y deberes consagrados en la Constitución. Asimismo, contempla la importancia de facilitar la participación ciudadana en las decisiones que afectan a las personas y en los distintos ámbitos de la vida nacional, así como de defender la independencia, mantener la integridad territorial y asegurar la convivencia pacífica y la vigencia de un orden justo.", "De igual manera, este artículo señala que las autoridades de la República tienen el deber de proteger a todas las personas residentes en Colombia, garantizando el respeto de su vida, honra, bienes, creencias y demás derechos y libertades. También establece que las instituciones deben contribuir al cumplimiento de los deberes sociales del Estado y de los particulares. En conjunto, estas disposiciones orientan la actuación de las autoridades públicas hacia la protección de los derechos, el bienestar general y la construcción de una sociedad basada en la convivencia pacífica y el respeto del orden constitucional.", "Desde varios puntos de vista, esta norma tiene implicaciones ambientales directas:", "a) Participación ciudadana: en la medida en que se facilita “la participación de todos en las decisiones que los afectan”, Amaya (2003a) sostiene que las decisiones administrativas de contenido ambiental generan consecuencias jurídicas que repercuten en el vivir cotidiano. La consagración de un Estado social de derecho (Constitución Política, 2001, art. 1) puntualiza el carácter participativo del régimen democrático, lo que convierte la participación en un postulado concreto de decisiones que afectan la relación con los recursos naturales.", "b) Integridad territorial y física: la referencia que hace el artículo 1 de la Constitución Política (2001) a “mantener la integridad territorial” no solo hace alusión a la soberanía política frente a agresores, sino a la conservación de la integridad física y ecológica de la Nación. El patrimonio ecológico debe ser protegido como fin esencial del Estado.", "c) Protección de la vida: el mandato de proteger a las personas en su vida reafirma que la salvaguardia de la vida está en la esencia de la protección ambiental (este artículo recoge parte del histórico artículo 16 de la Constitución de 1886)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Artículo 2: fines esenciales del Estado", "segs": [0], "obj": "escudo"}, {"label": "El deber de protección de las autoridades", "segs": [1], "obj": "puertaAbierta"}, {"label": "a) Participación ciudadana", "segs": [2, 3], "obj": "documento"}, {"label": "b) Integridad territorial y física", "segs": [4], "obj": "carpetas"}, {"label": "c) Protección de la vida", "segs": [5], "obj": "personas"}]}], "rotulo": null, "seccion": "2. Fines esenciales del Estado", "grupo": null, "titulos_fuente": ["2. Fines esenciales del Estado"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Artículo 2: fines esenciales del Estado", "El deber de protección de las autoridades", "a) Participación ciudadana", "b) Integridad territorial y física", "c) Protección de la vida"], "titulo_genially": "2. Fines esenciales del Estado", "complemento_genially": "", "apartado": "2. Fines esenciales del Estado", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "escalones", "documento"], "escenario": {"bioma": "comunidad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [108, 113], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Fines esenciales del Estado.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Fines esenciales del Estado"}}, {"layout": "esquema", "segmentos": ["El Artículo 79 de la Carta Política (1991) establece:", "Todas las personas tienen derecho a gozar de un ambiente sano. La ley garantizará la participación de la comunidad en las decisiones que puedan afectarlo. Es deber del Estado proteger la diversidad e integridad del ambiente, conservar las áreas de especial importancia ecológica y fomentar la educación para el logro de estos fines.", "En palabras de Amaya (2003b), esto representa una norma sin precedentes en la historia constitucional del país (no obstante, en el artículo 7 del Decreto Ley 2811 de 1974 ya se había consagrado una fórmula similar). Este derecho colectivo de tercera generación supera la noción puramente subjetiva, al otorgarse su titularidad a toda la comunidad.", "La Corte Constitucional ha anotado al respecto:", "Desde el plano ético, se construye un principio biocéntrico que considera al hombre como parte de la naturaleza, otorgándoles, a ambos, valor. Desde el plano económico, el sistema productivo ya no puede extraer recursos ni producir desechos ilimitadamente, debiendo sujetarse al interés social, al ambiente y al patrimonio cultural de la nación; encuentra, además, como límites el bien común y la dirección general a cargo del Estado […]. En el plano jurídico el derecho y el Estado no solamente deben proteger la dignidad y la libertad del hombre frente a otros hombres, sino ante la amenaza que representa la explotación y el agotamiento de los recursos naturales; para lo cual deben elaborar nuevos valores, normas, técnicas jurídicas y principios donde prime la tutela de los valores colectivos frente a los valores individuales. (Sala Plena, Sentencia C-671 de 2002, M. P. Eduardo Montealegre Lynett, num. VI.2)", "Como concluye Amaya (2003a):", "El derecho a disfrutar y a vivir en un ambiente sano […] es considerado como un derecho humano básico y, en opinión de algunos, como un prerrequisito y fundamento para el ejercicio de otros derechos humanos, económicos y políticos. Es necesario aceptar que un ambiente sano es condición sine qua non de la vida misma. (p. 116)"], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Artículo 79 de la Carta Política", "segs": [0, 1], "obj": "escudo"}, {"label": "Una norma sin precedentes (Amaya, 2003b)", "segs": [2], "obj": "libros"}, {"label": "El principio biocéntrico (Corte Constitucional)", "segs": [3, 4], "obj": "documento"}, {"label": "Un derecho humano básico (Amaya, 2003a)", "segs": [5, 6], "obj": "escalones"}]}], "rotulo": null, "seccion": "3. Derecho a gozar de un ambiente sano", "grupo": null, "titulos_fuente": ["3. Derecho a gozar de un ambiente sano"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Artículo 79 de la Carta Política", "Una norma sin precedentes (Amaya, 2003b)", "El principio biocéntrico (Corte Constitucional)", "Un derecho humano básico (Amaya, 2003a)"], "titulo_genially": "3. Derecho a gozar de un ambiente sano", "complemento_genially": "", "apartado": "3. Derecho a gozar de un ambiente sano", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "personas", "documento"], "escenario": {"bioma": "norma", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [115, 121], "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3. Derecho a gozar de un ambiente sano.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3. Derecho a gozar de un ambiente sano"}}], "cuadroAjuste": true}</script>
