[], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo", "Desarrollo"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [180, 181], "textoFijo": true, "ilustracion": "ijda-daniela-u1-l5.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p15"}}, {"layout": "esquema", "segmentos": ["Acosta y Galvis (2014) señalan que el artículo 2 de la Ley 23 de 1973 contemplaba el daño ambiental como la lesión a la atmósfera y los recursos renovables. Posteriormente, el artículo 42 de la Ley 99 de 1993 amplió el concepto a todo lo que “afecte el normal funcionamiento de los ecosistemas o la renovabilidad de sus recursos y componentes”.", "Por otro lado, la Corte Suprema de Justicia definió el daño ambiental como “todo detrimento causado al ambiente, bien público resultante de la conjunción de sus distintos elementos, susceptible de protección autónoma, mesura o proyección patrimonial, y derecho colectivo perteneciente a toda la comunidad” (Sentencia de 16 de mayo de 2011, Rad. 20001-3103-005-2005-00025-01)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Ley 23 de 1973 (Acosta y Galvis)", "segs": [0], "obj": "libros"}, {"label": "Definición de la Corte Suprema", "segs": [1], "obj": "reloj"}]}], "rotulo": null, "seccion": "1. Concepto de daño ambiental", "grupo": null, "titulos_fuente": ["1. Concepto de daño ambiental"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Ley 23 de 1973 (Acosta y Galvis)", "Definición de la Corte Suprema"], "titulo_genially": "1. Concepto de daño ambiental", "complemento_genially": "", "apartado": "1. Concepto de daño ambiental", "objeto_raiz": "libros", "objetos_raiz": ["libros", "reloj", "documento"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [183, 184]}, {"layout": "giro", "segmentos": ["a) Daño ambiental puro (o ecológico puro): es aquel ajeno a una persona determinada. Afecta al ecosistema en sí mismo y a la comunidad en general. No recae sobre patrimonios individuales, sino sobre la calidad de vida de los seres vivientes y la biodiversidad.", "b) Daño ambiental impuro (o indirecto): refiere a las consecuencias o repercusiones indirectas que el detrimento ambiental genera en la salud, la vida o los bienes particulares de una persona individualmente considerada y que la legitiman para exigir indemnización patrimonial.", "c) Daño colectivo: es el experimentado por una comunidad o grupo social. No es la mera suma de daños individuales, sino la lesión al interés colectivo y a la función social de la naturaleza.", "d) Daño moral colectivo: comprende la aflicción anímica, espiritual y la vulneración de la cosmovisión de una comunidad (por ejemplo, pueblos indígenas o tribales) cuando se destruye un entorno natural sagrado o vital.", "e) Daño continuado y daño progresivo: el daño continuado resulta de la acumulación en el tiempo de múltiples acciones menores. Cuando esta acumulación satura la capacidad del ecosistema y genera un detrimento cualitativamente mayor que la suma de sus partes se configura un daño progresivo."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Daño ambiental puro (o ecológico puro)", "segs": [0], "obj": "reloj"}, {"label": "Daño ambiental impuro (o indirecto)", "segs": [1], "obj": "personas"}, {"label": "Daño colectivo", "segs": [2], "obj": "documento"}, {"label": "Daño moral colectivo", "segs": [3], "obj": "escalones"}, {"label": "Daño continuado y daño progresivo", "segs": [4], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2. Tipología del daño ambiental", "grupo": null, "titulos_fuente": ["2. Tipología del daño ambiental"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Daño ambiental puro (o ecológico puro)", "Daño ambiental impuro (o indirecto)", "Daño colectivo", "Daño moral colectivo", "Daño continuado y daño progresivo"], "titulo_genially": "2. Tipología del daño ambiental", "complemento_genially": "", "apartado": "2. Tipología del daño ambiental", "bloques_fuente": [186, 190], "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Tipología del daño ambiental"}}, {"layout": "linea", "segmentos": ["Entre enero de 2022 y agosto de 2025, una mina ilegal ubicada en la zona rural de Condoto, Chocó, desarrolló actividades de extracción de oro mediante el uso de retroexcavadoras y mercurio. Los residuos de la actividad minera eran descargados en una quebrada que desembocaba en el río Condoto.", "Inicialmente, los habitantes observaron cambios en la turbidez del agua. Con el paso del tiempo, disminuyeron las poblaciones de peces, desapareció parte de la vegetación ribereña y se acumularon sedimentos. En julio de 2025, un análisis de la autoridad ambiental detectó contaminación por mercurio en el agua y en varias especies de peces.", "Como consecuencia, Rosa Caicedo, una pescadora de la zona, perdió su principal fuente de ingresos, mientras que su nieto Samuel presentó concentraciones elevadas de mercurio y requirió atención médica. Además, las familias de la comunidad dejaron de utilizar el río para pescar, bañarse y abastecerse de agua.", "La afectación también impidió que el Consejo Comunitario Nueva Esperanza realizara su ceremonia anual de homenaje a sus antepasados junto al río, un espacio fundamental para la memoria, la identidad y la relación espiritual de la comunidad con el territorio."], "parrafo": [0, 1, 2, 3], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques":
