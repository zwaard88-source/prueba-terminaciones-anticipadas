 panel.", "rotulos": ["Objetivo", "Desarrollo"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [168, 169], "textoFijo": true, "ilustracion": "ijda-daniela-u1-l4.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p14"}}, {"layout": "linea", "segmentos": ["En Colombia la designación de ecosistemas como sujetos de derechos representa un giro en la forma de comprender jurídicamente la relación entre los seres humanos y la naturaleza, pues supera la concepción exclusivamente antropocéntrica y avanza hacia aproximaciones biocéntricas y ecocéntricas. Bajo esta perspectiva, determinados ecosistemas dejan de ser considerados únicamente como bienes u objetos de protección y pasan a ser reconocidos como entidades titulares de derechos relacionados con su protección, conservación, mantenimiento y restauración.", "El hito inicial lo marcó la Corte Constitucional mediante la Sentencia T-622 de 2016 (M. P. Jorge Iván Palacio Palacio), que reconoció al río Atrato, su cuenca y sus afluentes como una entidad sujeto de derechos a la protección, conservación, mantenimiento y restauración a cargo del Estado y de las comunidades étnicas. La decisión se produjo en el contexto de la grave afectación ambiental ocasionada, entre otros factores, por actividades de minería ilegal y el uso de sustancias tóxicas como el mercurio.", "Posteriormente la Corte Suprema de Justicia, Sala de Casación Civil, mediante la Sentencia STC-4360 de 2018 (M. P. Luis Armando Tolosa Villabona), reconoció a la Amazonía colombiana como entidad sujeto de derechos, titular de protección, conservación, mantenimiento y restauración a cargo del Estado y de las entidades territoriales que la integran. En este caso, el reconocimiento estuvo estrechamente relacionado con la problemática de la deforestación, el cambio climático y la necesidad de adoptar medidas institucionales coordinadas para enfrentar su deterioro.", "A partir de estos precedentes, distintos órganos judiciales han extendido esta perspectiva de protección a otros ecosistemas del territorio nacional. Entre los ecosistemas reconocidos como sujetos de derechos se encuentran el río Cauca, el río Magdalena, el río Quindío, el río Pance, el río La Plata, el río Otún, los ríos Coello, Combeima y Cocora, el páramo de Pisba, el complejo de páramos Las Hermosas, el Parque Nacional Natural Los Nevados, la Amazonía colombiana, la vía parque Isla de Salamanca, el valle del Cocora y la laguna de Tota."], "parrafo": [0, 1, 2, 3], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Un giro en la relación con la naturaleza", "segs": [0], "obj": "personas"}, {"label": "Sentencia T-622 de 2016: el río Atrato", "segs": [1], "obj": "libros"}, {"label": "STC-4360 de 2018: la Amazonía", "segs": [2], "obj": "escudo"}, {"label": "Otros ecosistemas reconocidos", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Evolución jurisprudencial y reconocimiento de derechos", "grupo": null, "titulos_fuente": ["1. Evolución jurisprudencial y reconocimiento de derechos"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Un giro en la relación con la naturaleza", "Sentencia T-622 de 2016: el río Atrato", "STC-4360 de 2018: la Amazonía", "Otros ecosistemas reconocidos"], "titulo_genially": "1. Evolución jurisprudencial y reconocimiento de derechos", "complemento_genially": "", "apartado": "1. Evolución jurisprudencial y reconocimiento de derechos", "bloques_fuente": [171, 174], "pestana": "Los hitos: Atrato y Amazonía", "pestanas": [{"layout": "linea", "segmentos": ["En Colombia la designación de ecosistemas como sujetos de derechos representa un giro en la forma de comprender jurídicamente la relación entre los seres humanos y la naturaleza, pues supera la concepción exclusivamente antropocéntrica y avanza hacia aproximaciones biocéntricas y ecocéntricas. Bajo esta perspectiva, determinados ecosistemas dejan de ser considerados únicamente como bienes u objetos de protección y pasan a ser reconocidos como entidades titulares de derechos relacionados con su protección, conservación, mantenimiento y restauración.", "El hito inicial lo marcó la Corte Constitucional mediante la Sentencia T-622 de 2016 (M. P. Jorge Iván Palacio Palacio), que reconoció al río Atrato, su cuenca y sus afluentes como una entidad sujeto de derechos a la protección, conservación, mantenimiento y restauración a cargo del Estado y de las comunidades étnicas. La decisión se produjo en el contexto de la grave afectación ambiental ocasionada, entre otros factores, por actividades de minería ilegal y el uso de sustancias tóxicas como el mercurio.", "Posteriormente la Corte Suprema de Justicia, Sala de Casación Civil, mediante la Sentencia STC-4360 de 2018 (M. P. Luis Armando Tolosa Villabona), reconoció a la Amazonía colombiana como entidad sujeto de derechos, titular de protección, conservación, mantenimiento y restauración a cargo del Estado y de las entidades territoriales que la integran. En este caso, el reconocimiento estuvo estrechamente relacionado con la problemática de la deforestación, el cambio climático y la necesidad de adoptar medidas institucionales coordinadas para enfrentar su deterioro.", "A partir de estos precedentes, distintos órganos judiciales han extendido esta perspectiva de protección a otros ecosistemas del territorio nacional. Entre los ecosistemas reconocidos como sujetos de derechos se encuentran el río Cauca, el río Magdalena, el río Quindío, el río Pance, el río La Plata, el río Otún, los ríos Coello, Combeima y Cocora, el páramo de Pisba, el complejo de páramos Las Hermosas, el Parque Nacional Natural Los Nevados, la Amazonía colombiana, la vía parque Isla de Salamanca, el valle del Cocora y la laguna de Tota."], "parrafo": [0, 1, 2, 3], "guia": "Recorra cada momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Un giro en la relación con la naturaleza", "segs": [0], "obj": "personas"}, {"label": "Sentencia T-622 de 2016: el río Atrato", "segs": [1], "obj": "libros"}, {"label": "STC-4360 de 2018: la Amazonía", "segs": [2], "obj": "escudo"}, {"label": "Otros ecosistemas reconocidos", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Evolución jurisprudencial y reconocimiento de derechos", "grupo": null, "titulos_fuente": ["1. Evolución jurisprudencial y reconocimiento de derechos"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Un giro en la relación con la naturaleza", "Sentencia T-622 de 2016: el río Atrato", "STC-4360 de 2018: la Amazonía", "Otros ecosistemas reconocidos"], "titulo_genially": "1. Evolución jurisprudencial y reconocimiento de derechos", "complemento_genially": "", "apartado": "1. Evolución jurisprudencial y reconocimiento de derechos", "bloques_fuente": [171, 174], "pestana": "Los hitos: Atrato y Amazonía", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Evolución jurisprudencial y reconocimiento de derechos.pdf"}}, {"layout": "esquema", "segmentos": ["Este desarrollo jurisprudencial también supone un cambio en la manera de comprender las obligaciones estatales frente a la protección ambiental. Las decisiones judiciales no se limitan al reconocimiento abstracto de derechos, sino que imparten órdenes dirigidas a la formulación e implementación de planes de acción, mecanismos de seguimiento, participación de las comunidades y coordinación entre distintas autoridades. En el caso del río Atrato, por ejemplo, la Corte ordenó la creación de una comisión de guardianes y dispuso la adopción de medidas para enfrentar la minería ilegal, entre las que se incluyeron acciones de judicialización de las personas y organizaciones responsables.", "El reconocimiento de la naturaleza como sujeto de derechos adquiere especial relevancia para la investigación y judicialización de los delitos ambientales, pues permite comprender que la afectación de un ecosistema no necesariamente se agota en el perjuicio causado a personas determinadas. La investigación penal debe considerar según las características de cada caso la dimensión ecológica del daño, las características del ecosistema afectado, las actividades que generaron su deterioro y las posibles afectaciones conexas a comunidades, territorios y otros derechos protegidos.", "La evolución jurisprudencial permite identificar una concepción de la protección ambiental en la que la conservación, prevención, restauración y recuperación de los ecosistemas constituyen finalidades jurídicamente relevantes. Esta perspectiva resulta particularmente importante en investigaciones relacionadas con actividades como la minería ilegal, la deforestación y otras formas de criminalidad que producen afectaciones sobre los recursos naturales y los ecosistemas, y exige una actuación articulada de las autoridades ambientales, investigativas y judiciales.", "Para efectos del curso este desarrollo jurisprudencial permite introducir una idea central: el reconocimiento de determinados ecosistemas como sujetos de derechos no sustituye la protección penal del medio ambiente, sino que aporta un marco jurídico para comprender la dimensión y las consecuencias de las conductas que los afectan, así como la necesidad de orientar las actuaciones institucionales hacia su protección, conservación y restauración."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Órdenes, planes y guardianes", "segs": [0], "obj": "camara"}, {"label": "Relevancia para la investigación penal", "segs": [1], "obj": "reloj"}, {"label": "Conservar, prevenir y restaurar", "segs": [2], "obj": "libros"}, {"label": "La idea central del curso", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "1. Evolución jurisprudencial y reconocimiento de derechos", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Órdenes, planes y guardianes", "Relevancia para la investigación penal", "Conservar, prevenir y restaurar", "La idea central del curso"], "titulo_genially": "1. Evolución jurisprudencial y reconocimiento de derechos", "complemento_genially": "", "apartado": "1. Evolución jurisprudencial y reconocimiento de derechos", "objeto_raiz": "libros", "objetos_raiz": ["libros", "escudo", "documento"], "escenario": {"bioma": "rio", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [175, 178], "pestana": "Qué cambia para la investigación", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Evolución jurisprudencial y reconocimiento de derechos.pdf"}}], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Evolución jurisprudencial y reconocimiento de derechos.pdf"}}], "cuadroAjuste": true}</script>
