<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u1-l1", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 1 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 1, "lesson": 1, "heading": "Lección 1: Problemáticas de daño al medio ambiente (deforestación, explotación ilícita y la vinculación de grupos armados)", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Comprender las principales problemáticas asociadas al daño ambiental en el contexto de la sociedad del riesgo e identificar los retos jurídicos derivados de las nuevas dinámicas productivas y ambientales, así como el papel del derecho penal en la protección del medio ambiente y los recursos naturales, a partir del análisis del bien jurídico protegido y de los delitos de peligro.", "Desarrollo: Para desarrollar el tema, se realizan las siguientes preguntas orientadoras que promueven un proceso de concienciación a través de un enlace dinámico:"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "reloj"}, {"label": "Desarrollo", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1: Problemáticas de daño al medio ambiente (deforestación, explotación ilícita y la vinculación de grupos armados)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo", "Desarrollo"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [34, 35], "textoFijo": true, "ilustracion": "ijda-daniela-u1-l1.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p11"}}, {"layout": "esquema", "segmentos": ["Para contrarrestar estos flagelos delictivos, surge el derecho penal ambiental como una tendencia internacional enfocada en la protección del medio ambiente.", "La protección del medio ambiente y el aseguramiento de su preservación representan en la actualidad un objetivo social fundamental, en los ámbitos estatal e internacional. Para afrontar la tutela de estos intereses, el Estado va a recurrir a sus instrumentos jurídicos sancionatorios, tanto a los administrativos como a los penales. Desde esta expansión sancionatoria en la esfera del derecho penal medioambiental hay que tener en cuenta que la experiencia del derecho penal clásico, con la protección de la vida, salud e integridad física y la propiedad, no encuentra respuestas apropiadas a las nuevas formas de amenaza. […] Sin embargo, se observa cada vez con mayor escepticismo la ampliación del derecho penal del medio ambiente. (Sessano, 2002, pp. 5–6)"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Surge el derecho penal ambiental", "segs": [0], "obj": "escudo"}, {"label": "La protección ambiental, objetivo social (Sessano)", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1: Problemáticas de daño al medio ambiente (deforestación, explotación ilícita y la vinculación de grupos armados)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Surge el derecho penal ambiental", "La protección ambiental, objetivo social (Sessano)"], "titulo_genially": "Introducción: el derecho penal ambiental", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "escudo", "documento"], "escenario": {"bioma": "tala", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [60, 61]}, {"layout": "esquema", "segmentos": ["En las sociedades actuales, la producción social de riqueza va acompañada de una creciente producción social del riesgo, lo cual genera consecuencias políticas y económicas claras que caracterizan un peculiar estado intermedio entre la seguridad y la destrucción de la sociedad moderna. Para Ulrich Beck (2002), transitamos la “fase del desarrollo de la sociedad moderna en que los riesgos sociales, políticos e individuales tienden cada vez más a escapar a las instituciones de control y protección de la sociedad industrial” (citado en Pérez Flores, 2015, pp. 172–173). Con ello se configura lo que él denomina sociedad de riesgo.", "Adicionalmente, según señala Ortega (2011):", "Con esta expresión, Beck se refiere a un estado de desarrollo en el que las bases de la organización social ya no solo son la administración y distribución de los recursos, sino, fundamentalmente, la distribución de los riesgos. En palabras suyas: “Mientras que en la sociedad industrial la ‘lógica’ de la producción de riqueza domina a la lógica de la producción de riesgos, en la sociedad del riesgo se invierte esta relación”.", "A continuación, afirma que los riesgos “modernos” no son del todo calculables; además, sus daños son difícilmente imputables a alguien en particular y, lo que es peor, pueden resultar irreparables. Lo trascendente de todo ello es que los nuevos peligros “traen como consecuencia que la realidad se perciba y estructure a nivel cognitivo de acuerdo a un esquema de seguridad y riesgo”. (pp. 77–78)", "Con todo lo anterior, se entiende que Beck propone:", "1. La necesidad de establecer mecanismos compensatorios, de la misma forma en que el Estado asistencial tuvo que subvenir a los desajustes e injusticias de la sociedad industrial. 2. Un compromiso muy serio con el equilibrio ecológico, que ya no puede calificarse de mal menor, desde el momento en que la naturaleza no es una simple sierva del progreso (citado en Ortega, 2011, p. 78)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Riqueza y producción social del riesgo", "segs": [0], "obj": "escalones"}, {"label": "El concepto de Beck según Ortega (2011)", "segs": [1, 2], "obj": "carpetas"}, {"label": "Riesgos modernos: ni calculables ni imputables", "segs": [3], "obj": "reloj"}, {"label": "Lo que propone Beck", "segs": [4, 5], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Sociedad de riesgo", "grupo": null, "titulos_fuente": ["1. Sociedad de riesgo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Riqueza y producción social del riesgo", "El concepto de Beck según Ortega (2011)", "Riesgos modernos: ni calculables ni imputables", "Lo que propone Beck"], "titulo_genially": "1. Sociedad de riesgo", "complemento_genially": "", "apartado": "1. Sociedad de riesgo", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "ciudad", "camino": "meandro"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [63, 68], "pestana": "La sociedad del riesgo según Beck", "pestanas": [{"layout": "esquema", "segmentos": ["En las sociedades actuales, la producción social de riqueza va acompañada de una creciente producción social del riesgo, lo cual genera consecuencias políticas y económicas claras que caracterizan un peculiar estado intermedio entre la seguridad y la destrucción de la sociedad moderna. Para Ulrich Beck (2002), transitamos la “fase del desarrollo de la sociedad moderna en que los riesgos sociales, políticos e individuales tienden cada vez más a escapar a las instituciones de control y protección de la sociedad industrial” (citado en Pérez Flores, 2015, pp. 172–173). Con ello se configura lo que él denomina sociedad de riesgo.", "Adicionalmente, según señala Ortega (2011):", "Con esta expresión, Beck se refiere a un estado de desarrollo en el que las bases de la organización social ya no solo son la administración y distribución de los recursos, sino, fundamentalmente, la distribución de los riesgos. En palabras suyas: “Mientras que en la sociedad industrial la ‘lógica’ de la producción de riqueza domina a la lógica de la producción de riesgos, en la sociedad del riesgo se invierte esta relación”.", "A continuación, afirma que los riesgos “modernos” no son del todo calculables; además, sus daños son difícilmente imputables a alguien en particular y, lo que es peor, pueden resultar irreparables. Lo trascendente de todo ello es que los nuevos peligros “traen como consecuencia que la realidad se perciba y estructure a nivel cognitivo de acuerdo a un esquema de seguridad y riesgo”. (pp. 77–78)", "Con todo lo anterior, se entiende que Beck propone:", "1. La necesidad de establecer mecanismos compensatorios, de la misma forma en que el Estado asistencial tuvo que subvenir a los desajustes e injusticias de la sociedad industrial. 2. Un compromiso muy serio con el equilibrio ecológico, que ya no puede calificarse de mal menor, desde el momento en que la naturaleza no es una simple sierva del progreso (citado en Ortega, 2011, p. 78)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Riqueza y producción social del riesgo", "segs": [0], "obj": "escalones"}, {"label": "El concepto de Beck según Ortega (2011)", "segs": [1, 2], "obj": "carpetas"}, {"label": "Riesgos modernos: ni calculables ni imputables", "segs": [3], "obj": "reloj"}, {"label": "Lo que propone Beck", "segs": [4, 5], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Sociedad de riesgo", "grupo": null, "titulos_fuente": ["1. Sociedad de riesgo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Riqueza y producción social del riesgo", "El concepto de Beck según Ortega (2011)", "Riesgos modernos: ni calculables ni imputables", "Lo que propone Beck"], "titulo_genially": "1. Sociedad de riesgo", "complemento_genially": "", "apartado": "1. Sociedad de riesgo", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "ciudad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [63, 68], "pestana": "La sociedad del riesgo según Beck", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Sociedad de riesgo.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Sociedad de riesgo"}}, {"layout": "fichas", "segmentos": ["Entre las características más importantes de esta sociedad del riesgo que afectan al sistema normativo, pueden destacarse las siguientes:", "a) Potencialidad de los peligros actuales: existe un cambio en el potencial de los peligros actuales en relación con los de otras épocas. La sociedad actual se caracteriza por la existencia de riesgos artificiales, es decir, aquellos producidos por la actividad humana, a diferencia de lo que acontecía en el pasado, cuando los riesgos provenían de la propia naturaleza. Los riesgos actuales no solo son más peligrosos, sino que amenazan a cantidades indeterminadas de personas e incluso a la existencia en general.", "Adicionalmente, mientras los riesgos naturales solo pueden ser imputados a la naturaleza, los riesgos industriales actuales parten de una decisión en el campo industrial o económico (con ánimo de lucro), lo que invita a reflexionar, tanto a las personas como a las empresas implicadas, sobre la imputación y la atribución de responsabilidad por las consecuencias indeseadas. Sin embargo, algunos riesgos (ecológicos, atómicos, biotecnológicos, entre otros) no se pueden conducir tan fácilmente hacia los estándares de control, pues suprimen los pilares básicos del cálculo de riesgos y de seguridad, lo que inevitablemente genera desconfianza.", "Un dato importante que destaca Beck es el hecho de que este último tipo de riesgos, al contrario de lo que ocurría con los tradicionales de la sociedad industrial primaria, no son imputables según las reglas vigentes de la causalidad, la culpabilidad y la responsabilidad.", "b) Complejidad organizativa de las relaciones de responsabilidad: en la medida en que la sociedad se hace más compleja, perfeccionada e intercambiable, el individuo piensa que su responsabilidad es menor porque considera que su contribución al conjunto es mínima. Esta percepción induce a suponer que la responsabilidad se ramifica cada vez más a través de procesos en los que contribuyen muchas personas (por ejemplo, la eliminación de residuos que por acumulación individual pueden devenir nocivos). En este sentido, los ciudadanos en realidad mantienen una vaga y difusa relación con el hecho individual, de manera que solo al forzar mucho los conceptos se puede vincular la producción del daño o el peligro a la imputación por ello."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "a) Potencialidad de los peligros actuales", "segs": [0, 1], "obj": "documento"}, {"label": "Riesgos naturales y riesgos industriales", "segs": [2], "obj": "personas"}, {"label": "Riesgos que escapan a la causalidad", "segs": [3], "obj": "carpetas"}, {"label": "b) Complejidad organizativa de la responsabilidad", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "1. Sociedad de riesgo", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["a) Potencialidad de los peligros actuales", "Riesgos naturales y riesgos industriales", "Riesgos que escapan a la causalidad", "b) Complejidad organizativa de la responsabilidad"], "titulo_genially": "1. Sociedad de riesgo", "complemento_genially": "", "apartado": "1. Sociedad de riesgo", "bloques_fuente": [69, 73], "pestana": "Rasgos que afectan al sistema normativo", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Sociedad de riesgo.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Sociedad de riesgo"}}, {"layout": "esquema", "segmentos": ["A partir de la paradoja de que el riesgo afecta de modo involuntario a las personas, pero tiene siempre su origen en una decisión humana, esta situación de responsabilidad se produce, en unos casos, como consecuencia de múltiples acciones individuales y, en otros, por la sistemática divergencia entre la producción del riesgo y la afectación de este en sociedades funcionalmente diferenciadas.", "c) Sensación de inseguridad subjetiva, independiente de los peligros reales: en una sociedad en la que sus miembros viven más seguros de los peligros o riesgos tradicionales y naturales, paradójicamente se genera una creciente sensación subjetiva de inseguridad. En estas condiciones, las exigencias de la seguridad jurídica deben estar encaminadas no solo a la protección objetiva frente a riesgos para disuadir tales conductas, sino también a la posibilidad de garantizar la confianza en la efectividad de dicha seguridad.", "Esta relación riesgo–inseguridad provoca que los individuos reclamen del Estado, de manera creciente, la prevención frente al riesgo y la provisión de seguridad como únicas salidas viables de tal círculo vicioso. Si hay algo que caracteriza a la sociedad del riesgo es la necesidad de seguridad y la sensación o impresión de inseguridad. Siendo así, es importante subrayar que de esta manera el logro de la seguridad se convierte en un motivo dominante de la ordenación de la vida jurídica.", "Tal exigencia de seguridad puede convertirse en un problema si esas demandas se canalizan exclusivamente hacia el derecho, pues este se vería forzado a expandir sus contornos para el control de nuevos peligros. Debe advertirse lo inadecuado de que el derecho asumiera ese papel, que no le pertenece de modo prioritario ni mucho menos exclusivo, pues ello devendría en una intervención jurídica excesiva y, a la postre, en un “Estado de prevención o Estado preventivo” (Ortega, 2011, p. 80)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Riesgo involuntario, origen humano", "segs": [0], "obj": "personas"}, {"label": "c) Sensación de inseguridad subjetiva", "segs": [1], "obj": "escudo"}, {"label": "La demanda de seguridad al Estado", "segs": [2], "obj": "documento"}, {"label": "El riesgo de expandir el derecho", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "1. Sociedad de riesgo", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Riesgo involuntario, origen humano", "c) Sensación de inseguridad subjetiva", "La demanda de seguridad al Estado", "El riesgo de expandir el derecho"], "titulo_genially": "1. Sociedad de riesgo", "complemento_genially": "", "apartado": "1. Sociedad de riesgo", "objeto_raiz": "personas", "objetos_raiz": ["personas", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [74, 77], "pestana": "Inseguridad y expansión del derecho", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Sociedad de riesgo.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Sociedad de riesgo"}}], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Sociedad de riesgo.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Sociedad de riesgo"}}, {"layout": "esquema", "segmentos": ["Pese a que muchas de las actividades que generan riesgos actuales no son necesariamente nuevas, sí puede constatarse que hoy tienen un potencial de daño más elevado. Ortega (2011) afirma al respecto que “no es novedoso que el derecho reaccione frente al riesgo, pero sí lo es la transformación sustantiva tanto del contenido de las medidas de prevención como de los criterios o referencias que adoptan” (p. 81), y agrega que se puede “considerar que la sociedad del riesgo genera en el derecho dos grupos de cambios: primero, crea nuevos ámbitos de actuación jurídica y, segundo, existe una callada, pero incesante tendencia a la prevención de riesgos” (p. 82).", "Paralelamente, el autor enumera las técnicas preventivas de las que se vale el ordenamiento jurídico para hacer frente a los nuevos riesgos: a) establecimiento de delitos e infracciones de riesgo, b) creación de bienes jurídicos de contenido difuso o bienes jurídicos macrosociales, c) modificaciones a la prueba de la relación causal, d) generación de nuevo contenido y alcance de las tradicionales autorizaciones, e) introducción de estudios técnicos y científicos anteriores (como estudios de impacto ambiental), f) introducción de “cláusulas técnicas” (permanente adaptación tecnológica para la prevención de riesgos), g) establecimiento y ampliación de las medidas preventivas de seguridad, h) mayor acceso social a la información, i) establecimiento de instrumentos presupuestarios, j) creación de unidades especiales de protección contra riesgos, k) utilización de instrumentos económicos fiscales y l) mayor participación social en la vigilancia de los bienes colectivos puestos en riesgo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Riesgos no nuevos, pero más dañinos", "segs": [0], "obj": "reloj"}, {"label": "Técnicas preventivas del ordenamiento", "segs": [1], "obj": "expediente"}]}], "rotulo": null, "seccion": "2. Retos jurídicos", "grupo": null, "titulos_fuente": ["2. Retos jurídicos"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Riesgos no nuevos, pero más dañinos", "Técnicas preventivas del ordenamiento"], "titulo_genially": "2. Retos jurídicos", "complemento_genially": "", "apartado": "2. Retos jurídicos", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "ciudad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [79, 80]}, {"layout": "fichas", "segmentos": ["La modernización ecológica, concepto que aparece a partir de la década de los ochenta, incorpora nuevas teorías en este campo a partir de una lectura distinta tanto de los principios tradicionales del sistema industrial y productivo como de su proceso evolutivo (Climent, 2006).", "En respuesta a las crecientes problemáticas ambientales derivadas de la industria, la modernización ecológica se erige como una alternativa al proceso de desindustrialización, que por sus repercusiones económicas y laborales goza de muy poca adhesión social.", "En todo caso, el surgimiento de nuevos ámbitos de riesgos exige del derecho una nueva forma de actuar."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "La modernización ecológica", "segs": [0], "obj": "documento"}, {"label": "Una alternativa a la desindustrialización", "segs": [1, 2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "3. Riesgos productivos y nuevas estrategias ecoambientales", "grupo": null, "titulos_fuente": ["3. Riesgos productivos y nuevas estrategias ecoambientales"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["La modernización ecológica", "Una alternativa a la desindustrialización"], "titulo_genially": "3. Riesgos productivos y nuevas estrategias ecoambientales", "complemento_genially": "", "apartado": "3. Riesgos productivos y nuevas estrategias ecoambientales", "bloques_fuente": [82, 82]}, {"layout": "esquema", "segmentos": ["Tanto la irrupción de la modernidad en el pensamiento filosófico y científico como las nuevas tecnologías que diversifican y dinamizan los mercados evolucionan de manera paralela con la prevalencia y especial protección de los derechos humanos, dentro de los cuales se contempla de marea reiterada el derecho a un medio ambiente sano. Nuestro ordenamiento jurídico no es ajeno a esta protección, de ahí la importancia de comprender el concepto a partir de todos sus componentes integrativos y la naturaleza dogmática del medio ambiente como bien jurídico tutelado de carácter supraindividual y suprapatrimonial. Esta perspectiva fundamenta la legitimidad y los límites de la intervención del ius puniendi estatal.", "Debido a que los recursos provenientes del medio físico y natural se entienden como materia prima para satisfacer las necesidades humanas, Ekerlin (1997) los define como capital que se gasta rápidamente, noción que apunta a la acción de comprar un presente barato al costo de un futuro caro.", "Por su parte, el Código nacional de recursos naturales renovables y de protección del medio ambiente de Colombia (Decreto Ley 2811 de 1974) reconoce el valor social de los recursos al señalar que “el ambiente es patrimonio común de la humanidad y necesario para la supervivencia y el desarrollo económico y social de los pueblos” (art. 2). Respecto a sus condiciones de uso, el artículo 45 de este estatuto establece que “se procurará que la transformación industrial de bienes obtenidos en la explotación de recursos se haga dentro de la región en que estos existen”, mientras que el artículo 42 destaca la responsabilidad de la Nación sobre estos bienes: “pertenecen a la Nación los recursos naturales renovables y demás elementos ambientales”.", "En cuanto a los recursos naturales no renovables, el artículo 332 de la Constitución Política de Colombia indica: “El Estado es propietario del subsuelo y de los recursos naturales no renovables”. A su vez, el texto constitucional compensa la explotación de estos recursos mediante una contraprestación denominada regalía (art. 360), cuyo sistema de distribución se realiza de manera proporcional al número de habitantes, las necesidades básicas insatisfechas y la asignación a proyectos de infraestructura y fondos de estabilización macroeconómica (Ley 1530 de 2012)."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Modernidad, mercados y ambiente sano", "segs": [0], "obj": "escudo"}, {"label": "Los recursos como capital (Ekerlin)", "segs": [1], "obj": "documento"}, {"label": "Código de Recursos Naturales (Decreto Ley 2811)", "segs": [2], "obj": "libros"}, {"label": "Recursos no renovables (art. 332 C. P.)", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "4. Medio ambiente y recursos naturales como objeto de protección del derecho penal", "grupo": null, "titulos_fuente": ["4. Medio ambiente y recursos naturales como objeto de protección del derecho penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Modernidad, mercados y ambiente sano", "Los recursos como capital (Ekerlin)", "Código de Recursos Naturales (Decreto Ley 2811)", "Recursos no renovables (art. 332 C. P.)"], "titulo_genially": "4. El ambiente como objeto de protección penal", "complemento_genially": "", "apartado": "4. Medio ambiente y recursos naturales como objeto de protección del derecho penal", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "documento", "carpetas"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [84, 87], "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 4. El ambiente como objeto de protección penal.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "4. El ambiente como objeto de protección penal"}}, {"layout": "esquema", "segmentos": ["Al analizar sucintamente los problemas técnicos y dogmáticos planteados por los tipos penales que protegen el medio ambiente se puede constatar que queda en entredicho la actual eficacia de las normas penales para conseguir una adecuada tutela ambiental. Ahora bien, que la protección penal no constituya el único o mejor instrumento para salvaguardar determinados intereses ecológicos no significa que esta tutela no se ofrezca desde diversos tipos penales. En primer lugar, es necesario determinar el objeto de protección de la norma. En segundo lugar, resulta clave analizar de qué manera se dispensa desde el Código Penal la tutela al medio ambiente, tanto de forma directa como indirecta.", "El ordenamiento jurídico en general y el derecho penal en particular tienden a proteger todos aquellos bienes jurídicos trascendentales para la vida individual y el desarrollo armónico de la colectividad. De allí surge la necesidad de contar con instrumentos que materialicen el ius puniendi del Estado, no solo en el ámbito administrativo (como la Ley 1333 de 2009), sino a través de sanciones penales. El derecho a la calidad de vida y al medio ambiente constituye un objetivo irrenunciable, del cual emana la idea predominante de proteger el entorno como una salvaguarda de la salud y la vida de los habitantes (Sessano, 2002)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "¿Es eficaz la tutela penal ambiental?", "segs": [0], "obj": "escudo"}, {"label": "Por qué el derecho penal protege el ambiente", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "5. Análisis del bien jurídico protegido", "grupo": null, "titulos_fuente": ["5. Análisis del bien jurídico protegido"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["¿Es eficaz la tutela penal ambiental?", "Por qué el derecho penal protege el ambiente"], "titulo_genially": "5 y 6. Bien jurídico protegido y delitos de peligro", "complemento_genially": "", "apartado": "5. Análisis del bien jurídico protegido", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "lupa", "documento"], "escenario": {"bioma": "ladera", "camino": "meandro"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [89, 90], "pestana": "Bien jurídico protegido", "pestanas": [{"layout": "esquema", "segmentos": ["Al analizar sucintamente los problemas técnicos y dogmáticos planteados por los tipos penales que protegen el medio ambiente se puede constatar que queda en entredicho la actual eficacia de las normas penales para conseguir una adecuada tutela ambiental. Ahora bien, que la protección penal no constituya el único o mejor instrumento para salvaguardar determinados intereses ecológicos no significa que esta tutela no se ofrezca desde diversos tipos penales. En primer lugar, es necesario determinar el objeto de protección de la norma. En segundo lugar, resulta clave analizar de qué manera se dispensa desde el Código Penal la tutela al medio ambiente, tanto de forma directa como indirecta.", "El ordenamiento jurídico en general y el derecho penal en particular tienden a proteger todos aquellos bienes jurídicos trascendentales para la vida individual y el desarrollo armónico de la colectividad. De allí surge la necesidad de contar con instrumentos que materialicen el ius puniendi del Estado, no solo en el ámbito administrativo (como la Ley 1333 de 2009), sino a través de sanciones penales. El derecho a la calidad de vida y al medio ambiente constituye un objetivo irrenunciable, del cual emana la idea predominante de proteger el entorno como una salvaguarda de la salud y la vida de los habitantes (Sessano, 2002)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "¿Es eficaz la tutela penal ambiental?", "segs": [0], "obj": "escudo"}, {"label": "Por qué el derecho penal protege el ambiente", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "5. Análisis del bien jurídico protegido", "grupo": null, "titulos_fuente": ["5. Análisis del bien jurídico protegido"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["¿Es eficaz la tutela penal ambiental?", "Por qué el derecho penal protege el ambiente"], "titulo_genially": "5 y 6. Bien jurídico protegido y delitos de peligro", "complemento_genially": "", "apartado": "5. Análisis del bien jurídico protegido", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "lupa", "documento"], "escenario": {"bioma": "ladera", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [89, 90], "pestana": "Bien jurídico protegido", "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 5 y 6. Bien jurídico protegido y delitos de peligro.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "5 y 6. Bien jurídico protegido y delitos de peligro"}}, {"layout": "fichas", "segmentos": ["Gómez (2015) identifica los delitos de peligro como aquellas conductas ilícitas que entrañan peligro para los bienes jurídicos protegidos. Son diferentes a los delitos de lesión, que para su constitución demandan un daño real sobre un bien jurídico penalmente protegido.", "Los delitos de peligro concreto exigen que se demuestre la existencia del peligro efectivamente corrido, de modo que si este no se produce es solo por casualidad. Estos delitos requieren un juicio de imputación en el que se verifique la producción de un resultado de peligro, casi siempre para la vida o la salud humana, desde una perspectiva ex post (posterior al hecho).", "También pueden configurarse delitos de peligro abstracto o presunto, referidos a conductas que, a pesar de su naturaleza riesgosa, no exigen que se demuestre la existencia de un peligro efectivo. En este caso no resulta necesario demostrar ex post que el comportamiento posee capacidad lesiva frente a algún bien jurídico protegido. Este tipo de delitos recibe críticas respecto a su validación, las cuales apuntan al quiebre sobre principios básicos del derecho penal, como los de lesividad y legalidad o seguridad jurídica. Esto abre la posibilidad de incriminación de meras infracciones administrativas que, por sí solas, no implican necesariamente un peligro sobre bien jurídico protegido. En todo caso, la protección de bienes jurídicos colectivos mediante la configuración de los delitos de peligro abstracto no implica aceptar el desmantelamiento de las garantías penales.", "Por lo tanto, debido a que normalmente suponen la peligrosidad y, por ello, solo se requiere la constatación de la acción típica, este grupo de delitos permanece consagrado en el Código Penal.", "En el campo de la protección ambiental se adopta, en general, la forma del peligro abstracto debido a la necesidad de regular determinadas conductas desde una etapa previa a la intervención clásica del derecho penal, que solo opera después de que se ha lesionado un bien jurídico. Esto se relaciona en especial con el deterioro del medio ambiente y el aumento de riesgos asociados a un desarrollo tecnológico e industrial desmedido y desregularizado que pone en peligro a las generaciones futuras. Sin embargo, es necesario reconocer que en este ámbito tienen mayor efectividad las sanciones de intervención administrativa, por lo que el derecho penal funciona más como una herramienta simbólica de refuerzo que como una solución real a las problemáticas ambientales."], "parrafo": [0, 1, 2, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Qué son los delitos de peligro (Gómez)", "segs": [0], "obj": "reloj"}, {"label": "Peligro concreto", "segs": [1], "obj": "corazon"}, {"label": "Peligro abstracto o presunto", "segs": [2], "obj": "documento"}, {"label": "Por qué se mantienen", "segs": [3], "obj": "libros"}, {"label": "El peligro abstracto en lo ambiental", "segs": [4], "obj": "escudo"}]}], "rotulo": null, "seccion": "6. Delitos de peligro", "grupo": null, "titulos_fuente": ["6. Delitos de peligro"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Qué son los delitos de peligro (Gómez)", "Peligro concreto", "Peligro abstracto o presunto", "Por qué se mantienen", "El peligro abstracto en lo ambiental"], "titulo_genially": "5 y 6. Bien jurídico protegido y delitos de peligro", "complemento_genially": "", "apartado": "6. Delitos de peligro", "bloques_fuente": [92, 95], "pestana": "Delitos de peligro", "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 5 y 6. Bien jurídico protegido y delitos de peligro.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "5 y 6. Bien jurídico protegido y delitos de peligro"}}], "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 5 y 6. Bien jurídico protegido y delitos de peligro.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "5 y 6. Bien jurídico protegido y delitos de peligro"}}], "cuadroAjuste": true}</
