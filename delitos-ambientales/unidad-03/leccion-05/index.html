<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u3-l5", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 3 · Lección 5"}, "leccion_rotulo": "Lección 5", "unit": 3, "lesson": 5, "heading": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Comprender los requisitos técnico-científicos, procedimentales y la valoración probatoria del dictamen pericial en delitos ambientales para coordinar eficazmente con el CTI y entidades públicas especializadas.", "Énfasis temático complementario: Intervención de peritos del CTI, institutos científicos y entidades públicas especializadas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "escalones", "nombre_texto": "Objetivo"}, {"label": "Énfasis temático complementario", "segs": [1], "obj": "documento", "nombre_texto": "Énfasis temático complementario"}]}], "rotulo": null, "seccion": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Emparejar término y descripción; al acertar se lee el texto completo.", "rotulos": ["Objetivo", "Énfasis temático complementario"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [135, 136], "textoFijo": true, "ilustracion": "ijda-daniela-u3-l5.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p35"}}, {"layout": "esquema", "segmentos": ["A pesar de la adaptación de las reglas del sistema tradicional de responsabilidad civil, la principal limitante para aplicar dicha responsabilidad a los daños ambientales es el requerimiento de probar el daño, ya que este tiene características específicas que no facilitan dicha prueba. Se requiere una estrategia diferente para la imputación de la responsabilidad, basada en la idea del riesgo generado por ciertas actividades, como fundamento para asignarles la responsabilidad aun cuando el daño no haya sucedido. Es necesario construir un nuevo sistema de responsabilidad por daños ambientales que no dependa del sistema de responsabilidad civil. El régimen propuesto debe ser estructurado para extender la responsabilidad por daños ambientales a quien pueda generarlos por el riesgo latente en torno al desarrollo de ciertas actividades.", "Al momento de valorar las pruebas, el juez o jueza que esté al frente de un juicio por daño ambiental debe tener en cuenta el principio actori incumbit probatio, que exige que la falta, el daño y el perjuicio sean establecidos con certeza, pues no basta solo con indicios. No se puede comprometer la responsabilidad de la persona indiciada sino únicamente cuando la prueba lo acredite. Mediante esta prueba, cuyo contenido es técnico, se aporta información relevante y concisa para determinar si se generó o no un daño ambiental, al tiempo que pueden exponerse planteamientos, conclusiones y resultados que, según la apreciación de quien tenga funciones de juzgador, se consideren como hechos ciertos.", "Uno de los problemas más complejos en el dictamen pericial relativo al delito contra el medio ambiente y la ordenación del territorio es el que se refiere a la valoración del daño generado, muchas veces solicitada directa y expresamente por el juzgado. Determinar dicha valoración en un ámbito comercial, economicista, técnico o jurídico constituye solo el primer nivel de estudio de este complejo problema.", "En primer lugar, se trata de una dificultad conceptual, pues el término valoración goza, en el ámbito jurídico ambiental, de importantes y precisos matices. No es difícil diferenciar entre el valor de un bien y su valor de reposición cuando ha sido dañado, como tampoco lo es diferenciar el costo de la restauración de un espacio alterado por la contaminación del aire de la afectación que la misma generó sobre la salud de las personas. Pero, más allá de la simple intuición, cada una de estas perspectivas está soportada por su correspondiente concepción técnica, que no siempre permite establecer una relación biunívoca entre un bien y un precio monetario, aunque se estima que sí permite asignar un valor a cada bien ambiental."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El límite: probar el nexo causal", "segs": [0], "obj": "reloj"}, {"label": "La carga de la prueba (actori incumbit probatio)", "segs": [1], "obj": "tribunal"}, {"label": "El problema de la valoración", "segs": [2], "obj": "documento"}, {"label": "Una dificultad conceptual", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El límite: probar el nexo causal", "La carga de la prueba (actori incumbit probatio)", "El problema de la valoración", "Una dificultad conceptual"], "titulo_genially": "Valoración pericial del daño ambiental", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "expediente", "documento"], "escenario": {"bioma": "campo", "camino": "asciende"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [139, 142], "pestana": "Carga y causalidad", "pestanas": [{"layout": "esquema", "segmentos": ["A pesar de la adaptación de las reglas del sistema tradicional de responsabilidad civil, la principal limitante para aplicar dicha responsabilidad a los daños ambientales es el requerimiento de probar el daño, ya que este tiene características específicas que no facilitan dicha prueba. Se requiere una estrategia diferente para la imputación de la responsabilidad, basada en la idea del riesgo generado por ciertas actividades, como fundamento para asignarles la responsabilidad aun cuando el daño no haya sucedido. Es necesario construir un nuevo sistema de responsabilidad por daños ambientales que no dependa del sistema de responsabilidad civil. El régimen propuesto debe ser estructurado para extender la responsabilidad por daños ambientales a quien pueda generarlos por el riesgo latente en torno al desarrollo de ciertas actividades.", "Al momento de valorar las pruebas, el juez o jueza que esté al frente de un juicio por daño ambiental debe tener en cuenta el principio actori incumbit probatio, que exige que la falta, el daño y el perjuicio sean establecidos con certeza, pues no basta solo con indicios. No se puede comprometer la responsabilidad de la persona indiciada sino únicamente cuando la prueba lo acredite. Mediante esta prueba, cuyo contenido es técnico, se aporta información relevante y concisa para determinar si se generó o no un daño ambiental, al tiempo que pueden exponerse planteamientos, conclusiones y resultados que, según la apreciación de quien tenga funciones de juzgador, se consideren como hechos ciertos.", "Uno de los problemas más complejos en el dictamen pericial relativo al delito contra el medio ambiente y la ordenación del territorio es el que se refiere a la valoración del daño generado, muchas veces solicitada directa y expresamente por el juzgado. Determinar dicha valoración en un ámbito comercial, economicista, técnico o jurídico constituye solo el primer nivel de estudio de este complejo problema.", "En primer lugar, se trata de una dificultad conceptual, pues el término valoración goza, en el ámbito jurídico ambiental, de importantes y precisos matices. No es difícil diferenciar entre el valor de un bien y su valor de reposición cuando ha sido dañado, como tampoco lo es diferenciar el costo de la restauración de un espacio alterado por la contaminación del aire de la afectación que la misma generó sobre la salud de las personas. Pero, más allá de la simple intuición, cada una de estas perspectivas está soportada por su correspondiente concepción técnica, que no siempre permite establecer una relación biunívoca entre un bien y un precio monetario, aunque se estima que sí permite asignar un valor a cada bien ambiental."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El límite: probar el nexo causal", "segs": [0], "obj": "reloj"}, {"label": "La carga de la prueba (actori incumbit probatio)", "segs": [1], "obj": "tribunal"}, {"label": "El problema de la valoración", "segs": [2], "obj": "documento"}, {"label": "Una dificultad conceptual", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El límite: probar el nexo causal", "La carga de la prueba (actori incumbit probatio)", "El problema de la valoración", "Una dificultad conceptual"], "titulo_genially": "Valoración pericial del daño ambiental", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "expediente", "documento"], "escenario": {"bioma": "campo", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [139, 142], "pestana": "Carga y causalidad", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Valoración pericial del daño ambiental.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "Valoración pericial del daño ambiental"}}, {"layout": "fichas", "segmentos": ["La concepción técnica no coincide necesariamente con la identificación jurídica del bien ambiental, pues aquella admite más de una única y estricta delimitación. En este sentido, puede ser válida la propuesta de Reátegui (2014) que señala que, en todo caso, los bienes jurídicos no son tales porque se hayan catalogado de manera abstracta en una norma jurídica, sino porque representan presupuestos indispensables para la vida en común.", "El problema lo constituye la caracterización del daño ambiental, cuyas consecuencias no solo abarcan a los bienes de naturaleza pública, como sería el equilibrio de los ecosistemas y la biodiversidad, sino que incluyen los perjuicios a derechos e intereses legítimos de terceros. Esto ha llevado a pronunciamientos en este sentido, pero ciñendo la reparación a meras subsanaciones de daños sobre el bien concreto, sin contemplar, por no ser mensurable, la repercusión sobre las funciones y estructura de los ecosistemas dañados.", "Existen diferentes orientaciones doctrinales para calificar los daños sobre el medio ambiente: unas lo hacen desde la perspectiva de su temporalidad, otras de la magnitud, de la acumulación o sinergia asimilables, de la toxicidad o peligrosidad, de la persistencia de sus efectos, del riesgo que comportan o de su relación con otros bienes, como los de carácter patrimonial. Esta delimitación no siempre casa bien con los elementos básicos del llamado derecho de daños, según el cual el daño debe ser siempre cierto, efectivo, determinable, evaluable, individualizable y no puramente eventual o hipotético.", "Por ejemplo, si se supone una explotación a cielo abierto en cuya actividad se cometen hechos tipificados como delito y el juzgado precisa una valoración de la afección, se llega a resultados diferentes si se pretende asignar un precio a cada bien dañado o si se pretende determinar el costo de la restauración del lugar. En el primer caso, resulta complejo asignar, por ejemplo, precio a los elementos de fauna dañados ante la indeterminación de hasta dónde alcanza la afectación, ya que la misma puede referirse a la pérdida de individuos, a la disminución del tamaño de la población, a la pérdida de funcionalidad del grupo, a las repercusiones que genera sobre otra especie depredadora de la primera o presa de la misma, al valor emblemático o de conservación, o a su importancia en razón al grado de amenaza e inclusión en catálogos de protección de especies."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Lo técnico y lo jurídico no coinciden", "segs": [0], "obj": "documento"}, {"label": "Caracterizar el daño ambiental", "segs": [1], "obj": "reloj"}, {"label": "Cómo califica la doctrina los daños", "segs": [2], "obj": "libros"}, {"label": "Ejemplo: explotación a cielo abierto", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Lo técnico y lo jurídico no coinciden", "Caracterizar el daño ambiental", "Cómo califica la doctrina los daños", "Ejemplo: explotación a cielo abierto"], "titulo_genially": "Valoración pericial del daño ambiental", "complemento_genially": "", "apartado": "", "bloques_fuente": [143, 146], "pestana": "Caracterizar el daño", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Valoración pericial del daño ambiental.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "Valoración pericial del daño ambiental"}}, {"layout": "esquema", "segmentos": ["Así, se encuentran atributos que pueden formar parte de la valoración, no solo para este elemento zoológico, sino para cualesquiera de los afectados, incluso entes inertes, como el suelo o la calidad del aire o del agua.", "Es interesante en este sentido la propuesta presentada por la Comisión Económica de Naciones Unidas para América Latina y el Caribe para estimar los daños ambientales causados genéricamente por un huracán. Si bien esta aportación tiene un objetivo diferente al que se plantea, no deja de ser relevante al estimar que los daños vienen dados por la afectación al acervo ambiental, medida a partir de su valor de mercado cuando este existe, o de las inversiones en restauración, a lo que se une la consideración de los daños indirectos, que incluyen la pérdida de ingresos durante la misma restauración. En estos se pone el acento, por tratarse de una clara apuesta por la valoración como suma de varias acepciones y alcances del daño. La propuesta consiste en estimar en términos de mercado el valor del bien cuando sea posible e ir añadiendo los aspectos cuantificables que permitan delimitar un perfil de valoración final.", "No obstante, no se tiene en cuenta otro de los elementos significativos de los que se está hablando, que tiene que ver con la pérdida de elementos estructurales y funcionales del medio ambiente."], "parrafo": [1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Atributos que entran en la valoración", "segs": [0], "obj": "documento"}, {"label": "La propuesta de la CEPAL", "segs": [1], "obj": "reloj"}, {"label": "Lo que la propuesta no considera", "segs": [2], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 5: La prueba pericial en materia procesal penal frente a los delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Atributos que entran en la valoración", "La propuesta de la CEPAL", "Lo que la propuesta no considera"], "titulo_genially": "Valoración pericial del daño ambiental", "complemento_genially": "", "apartado": "", "objeto_raiz": "expediente", "objetos_raiz": ["expediente", "documento", "carpetas"], "escenario": {"bioma": "rio", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [146, 147], "pestana": "Atributos y propuesta de la CEPAL", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Valoración pericial del daño ambiental.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "Valoración pericial del daño ambiental"}}], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · Valoración pericial del daño ambiental.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "Valoración pericial del daño ambiental"}}, {"layout": "fichas", "segmentos": ["El dictamen ambiental es un documento elaborado por un perito ambiental, destinado a facilitar al juez o jueza la información clara y precisa sobre una situación o acontecimiento ambiental objeto de conflicto entre dos o más partes.", "El dictamen pericial muestra detalladamente la situación y los hechos acaecidos, y finaliza con unas conclusiones detalladas. Una propiedad esencial en un buen dictamen pericial ambiental es su redacción clara, rigurosa y comprensible para personas no especializadas en cuestiones ambientales. El dictamen debe aportar la información relevante, pero a la vez evitar los aspectos intrascendentes y el exceso de tecnicismos que dificulten la total comprensión del escrito. El principal objetivo de este singular documento es transmitir una información veraz, exacta y comprensible a quien ejerza como juez.", "El dictamen pericial en materia ambiental constituye una herramienta de apoyo técnico y científico para la investigación y judicialización de conductas que afectan el medio ambiente y los recursos naturales. Su elaboración está a cargo de profesionales con formación y experiencia relacionadas con la materia objeto de análisis, particularmente en el manejo de escenas ambientales y la identificación, recolección y valoración de los elementos materiales probatorios y la evidencia física (EMP y EF). Según las características del caso y el alcance del análisis requerido, podrán intervenir profesionales de distintas disciplinas, como biología, química, ingeniería ambiental, ingeniería de minas, ingeniería química e ingeniería forestal, entre otras. El alcance y las conclusiones del concepto pericial dependerán del perfil académico, la experiencia y las competencias técnicas del profesional que lo emita.", "En el juicio oral, el dictamen se incorpora y sustenta mediante el testimonio del perito, quien deberá explicar los procedimientos realizados, los fundamentos técnicos y científicos de sus conclusiones y su relación con los elementos examinados."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Qué es el dictamen ambiental", "segs": [0], "obj": "tribunal"}, {"label": "Qué debe mostrar", "segs": [1], "obj": "personas"}, {"label": "Apoyo técnico a la investigación", "segs": [2], "obj": "lupa"}, {"label": "El dictamen en el juicio oral", "segs": [3], "obj": "escalones"}]}], "rotulo": null, "seccion": "1. Dictamen pericial", "grupo": null, "titulos_fuente": ["1. Dictamen pericial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Qué es el dictamen ambiental", "Qué debe mostrar", "Apoyo técnico a la investigación", "El dictamen en el juicio oral"], "titulo_genially": "1. Dictamen pericial", "complemento_genially": "", "apartado": "1. Dictamen pericial", "bloques_fuente": [149, 151], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Dictamen pericial.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Dictamen pericial"}}], "cuadroAjuste": true}</script>
