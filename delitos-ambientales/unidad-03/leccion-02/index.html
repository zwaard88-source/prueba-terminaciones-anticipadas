a física frente a cada problema probatorio.", "2. Examen de legalidad: permite verificar que la evidencia haya sido obtenida y aducida respetando los derechos fundamentales, la reserva judicial y los requisitos de admisibilidad, lo que previene exclusiones procesales o nulidades.", "3. Examen de suficiencia: pretende analizar si el conjunto probatorio permite alcanzar los estándares de conocimiento exigidos por el legislador (inferencia razonable para imputar o asegurar, probabilidad de verdad para acusar, y certeza más allá de duda razonable para condenar).", "4. Examen de coherencia y corroboración: permite establecer si los elementos materiales probatorios y la evidencia física son consistentes entre sí y guardan correspondencia con la hipótesis de investigación. Para ello, se examina si los distintos elementos se respaldan, complementan o contradicen, y si existen inconsistencias que deban ser esclarecidas.", "5. ¿Qué falta y cómo conseguirlo?: hay que orientar la dirección estratégica de la investigación criminal hacia el esclarecimiento de los vacíos probatorios mediante actos idóneos y con plena viabilidad criminalística.", "La adopción rigurosa de esta metodología de evaluación transforma la persecución penal de un ejercicio de intuición o inercia burocrática a una actividad científica y garantista. Además, permite depurar oportunamente los casos mediante figuras de terminación anticipada (preclusión o principio de oportunidad) o blindar el juicio oral con estándares óptimos de calidad probatoria y argumentativa.", "5. ¿Qué falta y cómo conseguirlo?: hay que orientar la dirección estratégica de la investigación criminal hacia el esclarecimiento de los vacíos probatorios mediante actos idóneos y con plena viabilidad criminalística."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "1. Examen de utilidad (pertinencia)", "segs": [0], "obj": "lupa"}, {"label":
