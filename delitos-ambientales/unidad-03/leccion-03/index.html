icacia. No obstante, al restringir de manera directa derechos fundamentales como la intimidad, la libertad, el secreto de las comunicaciones o el patrimonio, su aplicación no es discrecional: exige una estricta sujeción a los principios de necesidad, ponderación y legalidad (artículo 27 de la Ley 906 de 2004), así como reserva judicial o control previo, esto para blindar el proceso contra la impunidad y evitar excesos punitivos contrarios al estado constitucional de derecho."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "lupa"}, {"label": "Herramientas que afectan derechos", "segs": [1], "obj": "libros"}, {"label": "Por qué son indispensables", "segs": [2], "obj": "puertaAbierta"}]}], "rotulo": null, "seccion": "Lección 3: Procedimientos de policía judicial aplicados a la investigación de delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Objetivo", "Herramientas que afectan derechos", "Por qué son indispensables"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [72, 74], "textoFijo": true, "ilustracion": "ijda-daniela-u3-l3.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p33"}}, {"layout": "cuadro", "segmentos": ["Autoriza la interceptación mediante grabación u otros medios técnicos de las comunicaciones telefónicas, radiotelemáticas, mensajes de texto o transmisiones de datos que utilicen el espectro electromagnético, con el propósito de descubrir fuentes de prueba o ubicar a presuntos autores o partícipes.", "Norma reguladora: artículo 235 de la Ley 906 de 2004 (requiere orden previa de un o una fiscal y control posterior ante juez de control de garantías).", "Faculta a la Fiscalía para ordenar la interceptación, retención y examen
