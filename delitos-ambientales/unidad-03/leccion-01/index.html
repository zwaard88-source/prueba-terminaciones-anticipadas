<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u3-l1", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 3 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 3, "lesson": 1, "heading": "Lección 1: Dirección de la investigación y estrategia de judicialización en delitos ambientales y las consecuencias de no realizar actividades investigativas adecuadamente", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Formular programas metodológicos estructurados y planes de priorización de casos para la judicialización efectiva de delitos ambientales e identificar las consecuencias jurídicas y disciplinarias derivadas de una defectuosa dirección de la investigación penal."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Dirección de la investigación y estrategia de judicialización en delitos ambientales y las consecuencias de no realizar actividades investigativas adecuadamente", "segs": [0], "obj": "lupa", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "Lección 1: Dirección de la investigación y estrategia de judicialización en delitos ambientales y las consecuencias de no realizar actividades investigativas adecuadamente", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Dirección de la investigación y estrategia de judicialización en delitos ambientales y las consecuencias de no realizar actividades investigativas adecuadamente"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "ilustracion": "ijda-daniela-u3-l1.webp", "bloques_fuente": [26, 26], "textoFijo": true, "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p31"}}, {"layout": "esquema", "segmentos": ["El programa metodológico es el plan de trabajo estratégico y flexible que elabora la Policía Judicial, bajo la dirección y coordinación del fiscal asignado, inmediatamente después de tener conocimiento de la comisión de una conducta punible. Su propósito fundamental es orientar la investigación criminal hacia la demostración de la hipótesis delictiva, la recolección, aseguramiento y embalaje de los elementos materiales probatorios y la evidencia física, lo que garantiza el respeto de los derechos fundamentales.", "Conforme a la Ley 906 de 2004 y la línea doctrinal de la Sala de Casación Penal de la Corte Suprema de Justicia, este instrumento no constituye una simple sugerencia administrativa, sino un estándar de debida diligencia investigativa. Su obligatoriedad y estructura se desprenden de varios ejes normativos e interpretativos:", "a) Dirección funcional (artículos 200 del Código de Procedimiento Penal y 250 de la Constitución Política de Colombia): radica en cabeza de la Fiscalía General de la Nación la conducción de la investigación, lo que implica que el o la fiscal no solo recibe los informes, sino que dirige de forma estratégica su evaluación, además de aprobar y supervisar el programa metodológico propuesto por los investigadores.", "b) Planeación frente a la improvisación: el programa metodológico evita la persecución penal errática. Obliga a fijar hipótesis delictivas claras, determinar las tareas específicas a realizar, los responsables de ejecutarlas, los plazos razonables y los objetivos probatorios que se pretende alcanzar.", "c) Control y dinamismo: al ser un documento dinámico, se actualiza conforme evolucionan los hallazgos investigativos. Su adecuada planeación es la base para sustentar posteriormente la necesidad, pertinencia y conducencia de solicitudes ante el juez de control de garantías (por ejemplo, imputaciones, capturas, allanamientos o medidas de aseguramiento)."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Qué es el programa metodológico", "segs": [0], "obj": "lupa"}, {"label": "No es un formato: Ley 906 y la Corte", "segs": [1], "obj": "libros"}, {"label": "a) Dirección funcional", "segs": [2], "obj": "expediente"}, {"label": "b) Planeación frente a la improvisación", "segs": [3], "obj": "reloj"}, {"label": "c) Control y dinamismo", "segs": [4], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "1. Programa metodológico", "grupo": null, "titulos_fuente": ["1. Programa metodológico"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Qué es el programa metodológico", "No es un formato: Ley 906 y la Corte", "a) Dirección funcional", "b) Planeación frente a la improvisación", "c) Control y dinamismo"], "titulo_genially": "1. Programa metodológico", "complemento_genially": "", "apartado": "1. Programa metodológico", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "personas", "documento"], "escenario": {"bioma": "campo", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [34, 39], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Programa metodológico.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Programa metodológico"}}, {"layout": "fichas", "segmentos": ["El éxito de la investigación penal moderna es incompatible con la labor aislada. La complejidad de la criminalidad contemporánea exige un modelo de equipo interdisciplinario e interagencial por las siguientes razones:", "a) Diversidad de saberes técnicos y científicos: la investigación de delitos complejos (corrupción, criminalidad organizada, delitos ambientales, financieros o informáticos) supera la formación jurídica tradicional. Se requiere la articulación simbiótica entre fiscal e investigadores de campo, analistas financieros, peritos forenses, médicos legistas y especialistas técnicos. Cada profesional aporta una perspectiva analítica indispensable para descifrar la evidencia.", "b) Corresponsabilidad y división del trabajo: la carga operativa y cognitiva de una indagación o investigación formal es inmensa. El trabajo en equipo permite distribuir roles de manera eficiente: mientras el fiscal traza la estrategia jurídica y de política criminal del caso, la Policía Judicial ejecuta las labores de campo, vigilancia y entrevistas, optimizando los tiempos procesales y evitando la pérdida de información crítica.", "c) Mitigación de sesgos cognitivos: la discusión colegiada dentro del equipo investigador debilita las hipótesis apresuradas o los sesgos de confirmación (la tendencia a buscar únicamente pruebas que respalden una sospecha inicial). Someter las líneas investigativas al debate interno garantiza mayor solidez probatoria y previene fallas estructurales que puedan derivar en nulidades o en la ineficacia de las pruebas en el juicio oral.", "d) Garantía de debida diligencia y respeto a derechos: un equipo coordinado bajo la dirección de la Fiscalía asegura que cada actuación restrictiva de derechos fundamentales se ajuste estrictamente al principio de proporcionalidad y legalidad. Esto reduce el margen de error institucional frente a la cadena de custodia y los protocolos técnico-científicos.", "El programa metodológico concebido como producto de un esfuerzo colectivo estructurado hace que la investigación criminal pase de ser un ejercicio de intuición policial a una metodología científica de persecución penal, lo que blinda el juicio oral con pruebas lícitas, útiles y conducentes."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "a) Un modelo de equipo interdisciplinario", "segs": [0, 1], "obj": "lupa"}, {"label": "b) Corresponsabilidad y división del trabajo", "segs": [2], "obj": "camara"}, {"label": "c) Mitigación de sesgos cognitivos", "segs": [3], "obj": "escudo"}, {"label": "d) Debida diligencia y derechos", "segs": [4], "obj": "carpetas"}, {"label": "Del instinto a la estrategia", "segs": [5], "obj": "expediente"}]}], "rotulo": null, "seccion": "2. Indispensabilidad del trabajo en equipo", "grupo": null, "titulos_fuente": ["2. Indispensabilidad del trabajo en equipo"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["a) Un modelo de equipo interdisciplinario", "b) Corresponsabilidad y división del trabajo", "c) Mitigación de sesgos cognitivos", "d) Debida diligencia y derechos", "Del instinto a la estrategia"], "titulo_genially": "2. Indispensabilidad del trabajo en equipo", "complemento_genially": "", "apartado": "2. Indispensabilidad del trabajo en equipo", "bloques_fuente": [41, 46], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Indispensabilidad del trabajo en equipo.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Indispensabilidad del trabajo en equipo"}}], "cuadroAjuste": true}</script>
