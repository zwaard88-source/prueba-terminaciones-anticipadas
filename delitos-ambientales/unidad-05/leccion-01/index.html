naturales"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "ilustracion": "ijda-daniela-u5-l1.webp", "bloques_fuente": [28, 28], "textoFijo": true, "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p51"}}, {"layout": "esquema", "segmentos": ["Rodríguez Valenzuela (2020) considera que en materia ambiental las formas clásicas del derecho penal deben verse desde otra óptica, respecto de lo cual menciona que:", "La implementación del Sistema Penal Acusatorio en Colombia conllevó no solo a una serie de reformas constitucionales, sino a un cambio en los roles que en desarrollo de este representa el órgano persecutor. Dentro de las nuevas facultades previstas, se encuentra la posibilidad, por parte de la Fiscalía General de la Nación, de suspender, interrumpir o renunciar al ejercicio de la acción penal, conforme a lo previsto en los artículos 321 a 330 de la Ley 906 de 2004, así como lo reglamentado por la Resolución 04155 de 2016, proferida por el fiscal general de la nación.", "Por su parte, los bienes jurídicos objeto de protección, cuya reglamentación corresponde de manera exclusiva al legislador, abarcan igualmente la protección de bienes jurídicos de carácter colectivo, tales como los recursos naturales y el medio ambiente, situación que evidencia la necesaria sanción penal de dichos actos, teniendo en consideración que las sanciones administrativas previstas ya no son suficientes. (p. 1)", "No obstante, las investigaciones de carácter penal referentes a los recursos naturales y el medio ambiente encuentran en la práctica un sinnúmero de dificultades, entre ellas, la suficiente recolección de elementos materiales probatorios y los análisis de laboratorio, que impiden llevar hasta el final y con excelentes resultados la culminación de los procesos penales.", "En ese sentido, las terminaciones anticipadas constituyen mecanismos propios del sistema penal acusatorio mediante los cuales el proceso puede concluir sin necesidad de agotar todas las etapas del juicio oral. Su fundamento se encuentra en la posibilidad de obtener una respuesta penal anticipada a partir de la aceptación de responsabilidad, siempre que se respeten las garantías fundamentales y los presupuestos establecidos por la ley."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Otra óptica para lo ambiental (Rodríguez Valenzuela)", "segs": [0, 1], "obj": "documento"}, {"label": "Los bienes jurídicos protegidos", "segs": [2], "obj": "escudo"}, {"label": "Las dificultades de la investigación", "segs": [3], "obj": "lupa"}, {"label": "Qué son las terminaciones anticipadas", "segs": [4], "obj": "escalones"}]}], "rotulo": null, "seccion": "1. Nociones preliminares en el contexto penal", "grupo": null, "titulos_fuente": ["1. Nociones preliminares en el contexto penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Otra óptica para lo ambiental (Rodríguez Valenzuela)", "Los bienes jurídicos protegidos", "Las dificultades de la investigación", "Qué son las terminaciones anticipadas"], "titulo_genially": "1. Nociones preliminares en el contexto penal", "complemento_genially": "", "apartado": "1. Nociones preliminares en el contexto penal", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "ciudad", "camino": "asciende"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [30, 34], "pestana": "Lo ambiental en el derecho penal", "pestanas": [{"layout": "esquema", "segmentos": ["Rodríguez Valenzuela (2020) considera que en materia ambiental las formas clásicas del derecho penal deben verse desde otra óptica, respecto de lo cual menciona que:", "La implementación del Sistema Penal Acusatorio en Colombia conllevó no solo a una serie de reformas constitucionales, sino a un cambio en los roles que en desarrollo de este representa el órgano persecutor. Dentro de las nuevas facultades previstas, se encuentra la posibilidad, por parte de la Fiscalía General de la Nación, de suspender, interrumpir o renunciar al ejercicio de la acción penal, conforme a lo previsto en los artículos 321 a 330 de la Ley 906 de 2004, así como lo reglamentado por la Resolución 04155 de 2016, proferida por el fiscal general de la nación.", "Por su parte, los bienes jurídicos objeto de protección, cuya reglamentación corresponde de manera exclusiva al legislador, abarcan igualmente la protección de bienes jurídicos de carácter colectivo, tales como los recursos naturales y el medio ambiente, situación que evidencia la necesaria sanción penal de dichos actos, teniendo en consideración que las sanciones administrativas previstas ya no son suficientes. (p. 1)", "No obstante, las investigaciones de carácter penal referentes a los recursos naturales y el medio ambiente encuentran en la práctica un sinnúmero de dificultades, entre ellas, la suficiente recolección de elementos materiales probatorios y los análisis de laboratorio, que impiden llevar hasta el final y con excelentes resultados la culminación de los procesos penales.", "En ese sentido, las terminaciones anticipadas constituyen mecanismos propios del sistema penal acusatorio mediante los cuales el proceso puede concluir sin necesidad de agotar todas las etapas del juicio oral. Su fundamento se encuentra en la posibilidad de obtener una respuesta penal anticipada a partir de la aceptación de responsabilidad, siempre que se respeten las garantías fundamentales y los presupuestos establecidos por la ley."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Otra óptica para lo ambiental (Rodríguez Valenzuela)", "segs": [0, 1], "obj": "documento"}, {"label": "Los bienes jurídicos protegidos", "segs": [2], "obj": "escudo"}, {"label": "Las dificultades de la investigación", "segs": [3], "obj": "lupa"}, {"label": "Qué son las terminaciones anticipadas", "segs": [4], "obj": "escalones"}]}], "rotulo": null, "seccion": "1. Nociones preliminares en el contexto penal", "grupo": null, "titulos_fuente": ["1. Nociones preliminares en el contexto penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Otra óptica para lo ambiental (Rodríguez Valenzuela)", "Los bienes jurídicos protegidos", "Las dificultades de la investigación", "Qué son las terminaciones anticipadas"], "titulo_genially": "1. Nociones preliminares en el contexto penal", "complemento_genially": "", "apartado": "1. Nociones preliminares en el contexto penal", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "ciudad", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [30, 34], "pestana": "Lo ambiental en el derecho penal", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Nociones preliminares en el contexto penal.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Nociones preliminares en el contexto penal"}}, {"layout": "esquema", "segmentos": ["La utilización de estos mecanismos supone una renuncia consciente a determinadas facultades propias del juicio oral. En particular, cuando la persona procesada acepta voluntariamente su responsabilidad, renuncia a ser juzgado públicamente y a ejercer las prerrogativas inherentes al debate ordinario, razón por la cual la jurisprudencia ha reconocido el principio de no retractación respecto de aquello que fue libre, consciente e informadamente aceptado (Auto AP3873-2025). No obstante, ello no significa que la terminación anticipada opere automáticamente ni que la aceptación sustituya las exigencias propias de una decisión judicial. La existencia de un mecanismo abreviado no permite prescindir de la verificación judicial de los presupuestos de la responsabilidad penal ni convertir la aceptación de la persona procesada en una fuente autónoma de condena. Por el contrario, corresponde al juez verificar que la actuación reúna las condiciones necesarias para emitir una sentencia condenatoria.", "En este sentido, la Sentencia SP322-2025 resulta particularmente relevante al establecer que, frente a una pretensión de condena anticipada, el juez o jueza debe verificar, entre otros aspectos, que exista una hipótesis fáctica suficientemente clara, que la calificación jurídica no sea manifiestamente ilegal y que la hipótesis planteada por la Fiscalía cuente con respaldo en los elementos materiales probatorios y demás información legalmente incorporada. Asimismo, debe comprobar que el acuerdo respete los límites constitucionales y legales.", "Esta exigencia fue reafirmada por la Corte en la SP298-2026, al señalar que, en los eventos de condena derivada de un preacuerdo, el estándar probatorio aplicable no corresponde al propio del juicio oral, pero sí debe existir un mínimo de prueba que permita sustentar la responsabilidad penal, de acuerdo con el momento procesal y las exigencias legales. De esta manera, la terminación anticipada no elimina la necesidad de contar con un fundamento probatorio para la decisión condenatoria.", "A su vez, la SP322-2025 evidencia que el adecuado desarrollo de estos mecanismos depende de una correcta construcción de los hechos jurídicamente relevantes desde la imputación. La delimitación clara y suficiente de la hipótesis fáctica adquiere especial importancia porque constituye el referente sobre el cual se estructura posteriormente la actuación procesal y, en los casos de terminación anticipada, la sentencia condenatoria. Por ello, los errores sustanciales de la Fiscalía en la construcción de la premisa fáctica o en su calificación jurídica pueden comprometer la validez de la actuación."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una renuncia consciente al juicio", "segs": [0], "obj": "libros"}, {"label": "Sentencia SP322-2025", "segs": [1], "obj": "tribunal"}, {"label": "Sentencia SP298-2026", "segs": [2], "obj": "expediente"}, {"label": "Hechos jurídicamente relevantes desde la imputación", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Nociones preliminares en el contexto penal", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una renuncia consciente al juicio", "Sentencia SP322-2025", "Sentencia SP298-2026", "Hechos jurídicamente relevantes desde la imputación"], "titulo_genially": "1. Nociones preliminares en el contexto penal", "complemento_genially": "", "apartado": "1. Nociones preliminares en el contexto penal", "objeto_raiz": "personas", "objetos_raiz": ["personas", "documento", "carpetas"], "escenario": {"bioma": "norma", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [35, 38], "pestana": "Renuncias y control del juez", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Nociones preliminares en el contexto penal.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Nociones preliminares en el contexto penal"}}, {"layout": "fichas", "segmentos": ["En consecuencia, la finalidad de las terminaciones anticipadas puede entenderse desde una doble perspectiva: por una parte, permiten una respuesta penal más ágil cuando existe aceptación de responsabilidad o consenso entre las partes; por otra, exigen que dicha respuesta permanezca sometida al control judicial, al principio de legalidad y a las garantías fundamentales. No se trata, entonces, de una simple reducción de las etapas del proceso, sino de una forma especial de terminación en la que la celeridad debe estar acompañada de condiciones que permitan preservar la legitimidad de la decisión.", "En la investigación y judicialización de los delitos contra el medio ambiente y los recursos naturales, una terminación anticipada deberá partir de una adecuada delimitación de los hechos jurídicamente relevantes, del correspondiente respaldo probatorio y del control judicial sobre la legalidad de la actuación. En particular, la investigación deberá permitir establecer con suficiente claridad qué conducta se realizó, cuál fue el daño o afectación ambiental, quién intervino en ella y cuál fue su grado."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Una doble finalidad", "segs": [0], "obj": "escudo"}, {"label": "Partir de una buena delimitación", "segs": [1], "obj": "tribunal"}]}], "rotulo": null, "seccion": "1. Nociones preliminares en el contexto penal", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Una doble finalidad", "Partir de una buena delimitación"], "titulo_genially": "1. Nociones preliminares en el contexto penal", "complemento_genially": "", "apartado": "1. Nociones preliminares en el contexto penal", "bloques_fuente": [39, 40], "pestana": "Finalidad de las terminaciones", "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Nociones preliminares en el contexto penal.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Nociones preliminares en el contexto penal"}}], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · 1. Nociones preliminares en el contexto penal.pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. Nociones preliminares en el contexto penal"}}, {"layout": "giro", "segmentos": ["La Ley 906 de 2004 contempla las principales reglas aplicables a las terminaciones anticipadas. Entre las disposiciones relevantes se encuentran:", "a) Artículo 293: regula los efectos de la aceptación de la imputación y establece que, verificada la manifestación libre, consciente y voluntaria del imputado, el juez debe proceder conforme a las reglas de la sentencia anticipada.", "b) Artículo 327: establece el deber de la Fiscalía de aportar los elementos materiales probatorios, de evidencia física e información legalmente obtenida que permitan sustentar la pretensión de condena anticipada.", "c) Artículo 348: establece las finalidades de los preacuerdos y negociaciones: humanizar la actuación procesal y la pena, obtener pronta y cumplida justicia, solucionar los conflictos sociales derivados del delito, propiciar la reparación integral de los perjuicios y permitir la participación del imputado en la definición de su caso.", "d) Artículo 349: establece los eventos de improcedencia de acuerdos o negociaciones cuando el delito haya generado un incremento patrimonial, hasta tanto se cumplan las condiciones de reintegro previstas por la norma."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Ley 906 de 2004: artículo 293", "segs": [0, 1], "obj": "libros"}, {"label": "b) Artículo 327", "segs": [2], "obj": "expediente"}, {"label": "c) Artículo 348", "segs": [3], "obj": "personas"}, {"label": "d) Artículo 349", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Marco normativo", "grupo": null, "titulos_fuente": ["2. Marco normativo"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Ley 906 de 2004: artículo 293", "b) Artículo 327", "c) Artículo 348", "d) Artículo 349"], "titulo_genially": "2. Marco normativo (Ley 906 de 2004)", "complemento_genially": "", "apartado": "2. Marco normativo", "bloques_fuente": [53, 57], "pestana": "Artículos 293 a 349", "pestanas": [{"layout": "giro", "segmentos": ["La Ley 906 de 2004 contempla las principales reglas aplicables a las terminaciones anticipadas. Entre las disposiciones relevantes se encuentran:", "a) Artículo 293: regula los efectos de la aceptación de la imputación y establece que, verificada la manifestación libre, consciente y voluntaria del imputado, el juez debe proceder conforme a las reglas de la sentencia anticipada.", "b) Artículo 327: establece el deber de la Fiscalía de aportar los elementos materiales probatorios, de evidencia física e información legalmente obtenida que permitan sustentar la pretensión de condena anticipada.", "c) Artículo 348: establece las finalidades de los preacuerdos y negociaciones: humanizar la actuación procesal y la pena, obtener pronta y cumplida justicia, solucionar los conflictos sociales derivados del delito, propiciar la reparación integral de los perjuicios y permitir la participación del imputado en la definición de su caso.", "d) Artículo 349: establece los eventos de improcedencia de acuerdos o negociaciones cuando el delito haya generado un incremento patrimonial, hasta tanto se cumplan las condiciones de reintegro previstas por la norma."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Ley 906 de 2004: artículo 293", "segs": [0, 1], "obj": "libros"}, {"label": "b) Artículo 327", "segs": [2], "obj": "expediente"}, {"label": "c) Artículo 348", "segs": [3], "obj": "personas"}, {"label": "d) Artículo 349", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Marco normativo", "grupo": null, "titulos_fuente": ["2. Marco normativo"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Ley 906 de 2004: artículo 293", "b) Artículo 327", "c) Artículo 348", "d) Artículo 349"], "titulo_genially": "2. Marco normativo (Ley 906 de 2004)", "complemento_genially": "", "apartado": "2. Marco normativo", "bloques_fuente": [53, 57], "pestana": "Artículos 293 a 349", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Marco normativo (Ley 906 de 2004).pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Marco normativo (Ley 906 de 2004)"}}, {"layout": "empareja", "segmentos": ["e) Artículos 350 y 351: regulan los preacuerdos desde la formulación de imputación, sus modalidades y los efectos de la aceptación de cargos.", "f) Artículo 352: regula los preacuerdos posteriores a la presentación de la acusación y antes del interrogatorio del acusado al inicio del juicio oral.", "g) Artículo 354: establece reglas comunes, entre ellas la necesidad de asistencia del defensor para la validez de los acuerdos.", "h) Artículo 381: establece la regla general sobre el conocimiento necesario para proferir sentencia condenatoria, cuya aplicación debe distinguirse de los estándares propios de las terminaciones anticipadas, conforme a la jurisprudencia reciente de la Sala de Casación Penal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Artículos 350 y 351", "segs": [0], "obj": "documento", "nombre_texto": "Artículos 350 y 351"}, {"label": "Artículo 352", "segs": [1], "obj": "carpetas", "nombre_texto": "Artículo 352"}, {"label": "Artículo 354", "segs": [2], "obj": "lupa", "nombre_texto": "Artículo 354"}, {"label": "Artículo 381", "segs": [3], "obj": "libros", "nombre_texto": "Artículo 381"}]}], "rotulo": null, "seccion": "2. Marco normativo", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Emparejar término y descripción; al acertar se lee el texto completo.", "rotulos": ["Artículos 350 y 351", "Artículo 352", "Artículo 354", "Artículo 381"], "titulo_genially": "2. Marco normativo (Ley 906 de 2004)", "complemento_genially": "", "apartado": "2. Marco normativo", "bloques_fuente": [58, 61], "pestana": "Artículos 350 a 381", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Marco normativo (Ley 906 de 2004).pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Marco normativo (Ley 906 de 2004)"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Marco normativo (Ley 906 de 2004).pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Marco normativo (Ley 906 de 2004)"}}, {"layout": "esquema", "segmentos": ["La jurisprudencia reciente de la Sala de Casación Penal de la Corte Suprema de Justicia ha precisado algunos criterios fundamentales para la aplicación de estas disposiciones.", "a) Diferenciación entre aceptación de cargos y preacuerdos: la aceptación o allanamiento a cargos y los preacuerdos constituyen formas de terminación anticipada, pero no deben confundirse. La aceptación unilateral supone una manifestación libre, consciente e informada de la persona procesada respecto de los cargos formulados, mientras que el preacuerdo surge de la negociación y el consenso con la Fiscalía. La Corte ha resaltado que ambas figuras implican una renuncia a determinadas facultades propias del juicio oral, particularmente a la práctica y controversia probatoria (AP3873-2025).", "En el ámbito de los delitos ambientales y la criminalidad organizada, la diferenciación entre estas figuras procesales adquiere un valor estratégico fundamental para asegurar la justicia restaurativa. Mientras que el allanamiento a cargos opera como una sujeción pasiva a la imputación que otorga rebajas punitivas tarifadas por la ley sin garantizar intrínsecamente acciones correctivas sobre el territorio, los preacuerdos habilitan un margen de negociación bilateral indispensable. A través de este consenso, el ente acusador puede condicionar la concesión de beneficios penales a la reparación del ecosistema, exigiendo la ejecución de planes técnicos de recuperación ambiental y la indemnización de las comunidades impactadas.", "Asimismo, en fenómenos como la minería ilegal o la deforestación a gran escala, el preacuerdo trasciende la simple dosificación de la pena, consolidándose como un instrumento procesal para exigir la devolución del incremento patrimonial ilícito y desarticular los aparatos financieros que sostienen la degradación ambiental."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La jurisprudencia de la Sala Penal", "segs": [0], "obj": "libros"}, {"label": "a) Aceptación de cargos y preacuerdos", "segs": [1], "obj": "casa"}, {"label": "Su valor en delitos ambientales", "segs": [2], "obj": "escudo"}, {"label": "Más que dosificar la pena", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "3. Criterios jurisprudenciales", "grupo": null, "titulos_fuente": ["3. Criterios jurisprudenciales"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La jurisprudencia de la Sala Penal", "a) Aceptación de cargos y preacuerdos", "Su valor en delitos ambientales", "Más que dosificar la pena"], "titulo_genially": "3. Criterios jurisprudenciales", "complemento_genially": "", "apartado": "3. Criterios jurisprudenciales", "objeto_raiz": "casa", "objetos_raiz": ["casa", "libros", "documento"], "escenario": {"bioma": "tala", "camino": "llano"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [94, 96], "pestana": "a) Aceptación y preacuerdo", "pestanas": [{"layout": "esquema", "segmentos": ["La jurisprudencia reciente de la Sala de Casación Penal de la Corte Suprema de Justicia ha precisado algunos criterios fundamentales para la aplicación de estas disposiciones.", "a) Diferenciación entre aceptación de cargos y preacuerdos: la aceptación o allanam "documento"}]}], "rotulo": null, "seccion": "3. Criterios jurisprudenciales", "grupo": null, "titulos_fuente": ["3. Criterios jurisprudenciales"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La jurisprudencia de la Sala Penal", "a) Aceptación de cargos y preacuerdos", "Su valor en delitos ambientales", "Más que dosificar la pena"], "titulo_genially": "3. Criterios jurisprudenciales", "complemento_genially": "", "apartado": "3. Criterios jurisprudenciales", "objeto_raiz": "casa", "objetos_raiz": ["casa", "libros", "documento"], "escenario": {"bioma": "tala", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [94, 96], "pestana": "a) Aceptación y preacuerdo", "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3. Criterios jurisprudenciales.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3. Criterios jurisprudenciales"}}, {"layout": "fichas", "segmentos": ["b) Control judicial y límites de la Fiscalía: la terminación anticipada no excluye el control del juez. En la SP322-2025 la Corte precisó que, al decidir sobre una condena anticipada, el juez debe verificar aspectos como la corrección de la calificación jurídica y el cumplimiento de las reglas que gobiernan los preacuerdos. También recordó que la Fiscalía debe estructurar adecuadamente los hechos jurídicamente relevantes, pues estos constituyen el referente de la sentencia condenatoria en los casos de terminación anticipada.", "c) Necesidad de respaldo probatorio: la aceptación de responsabilidad no es, por sí sola, suficiente para sustentar una condena. En la SP298-2026 la Corte precisó que debe existir un mínimo de elementos materiales probatorios que permita inferir la autoría o participación y la tipicidad. Para las terminaciones anticipadas, el estándar de conocimiento corresponde a la inferencia razonable en el escenario de la imputación o a la probabilidad de verdad cuando ya se ha formulado acusación, sin que sea exigible el estándar de conocimiento propio del juicio oral.", "d) No retractación y fuerza vinculante: una vez el juez ha verificado la legalidad de la aceptación o del acuerdo y constatado que no existen vicios del consentimiento ni afectación de garantías fundamentales, opera el principio de no retractación. En consecuencia, no resulta procedente utilizar posteriormente los recursos para controvertir la responsabilidad que fue libremente aceptada (AP3873- 2025).", "En materia de delitos ambientales, estos criterios adquieren especial relevancia: la terminación anticipada no puede construirse sobre una hipótesis fáctica deficiente, una calificación jurídica inadecuada o una investigación insuficiente. La correcta determinación de los hechos y su respaldo probatorio son especialmente importantes cuando se pretende establecer la naturaleza, alcance y responsables de una afectación ambiental."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "b) Control judicial y límites de la Fiscalía", "segs": [0], "obj": "libros"}, {"label": "c) Respaldo probatorio", "segs": [1], "obj": "lupa"}, {"label": "d) No retractación", "segs": [2], "obj": "escudo"}, {"label": "Lo que significa en delitos ambientales", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "3. Criterios jurisprudenciales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["b) Control judicial y límites de la Fiscalía", "c) Respaldo probatorio", "d) No retractación", "Lo que significa en delitos ambientales"], "titulo_genially": "3. Criterios jurisprudenciales", "complemento_genially": "", "apartado": "3. Criterios jurisprudenciales", "bloques_fuente": [97, 100], "pestana": "b) a d) Control, prueba y no retractación", "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3. Criterios jurisprudenciales.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3. Criterios jurisprudenciales"}}], "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3. Criterios jurisprudenciales.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3. Criterios jurisprudenciales"}}, {"layout": "esquema", "segmentos": ["El principio de oportunidad constituye una excepción al postulado de legalidad. Consiste, de acuerdo con lo normado en el artículo 250 de la Carta Magna, en la suspensión, interrupción o renuncia de la persecución penal, en los casos que establezca la ley, conforme a la política criminal del Estado. Dicho artículo establece:", "La Fiscalía General de la Nación está obligada a adelantar el ejercicio de la acción penal y realizar la investigación de los hechos que revistan las características de un delito que lleguen a su conocimiento por medio de denuncia, petición especial, querella o de oficio, siempre y cuando medien suficientes motivos y circunstancias fácticas que indiquen la posible existencia del mismo. No podrá, en consecuencia, suspender, interrumpir, ni renunciar a la persecución penal, salvo en los casos que establezca la ley para la aplicación del principio de oportunidad regulado dentro del marco de la política criminal del Estado, el cual estará sometido al control de legalidad por parte del juez que ejerza las funciones de control de garantías. Se exceptúan los delitos cometidos por miembros de la Fuerza Pública en servicio activo y en relación con el mismo servicio.", "Dado que el artículo 321 de la Ley 906 de 2004 establece la dependencia de la aplicación del principio de oportunidad a la política criminal del Estado, y que la protección y promoción del medio ambiente no constituyen un bien absoluto, es factible que la Fiscalía aplique el principio de oportunidad sin contrariar las disposiciones constitucionales acerca de la prevención, mitigación, reparación y punición (Sentencia C-259 del 2016), y sin vulnerar el principio de legalidad constitucional (Constitución, 1991, art. 250). Esto es viable puesto que, pese a no haber imposición de sanción, a través del principio de oportunidad se permite resarcir o mitigar los daños causados al ambiente y a los recursos naturales.", "De acuerdo con la mencionada sentencia, el fin del principio de oportunidad es:", "La racionalización de la función jurisdiccional penal, por ejemplo, con miras a reducir la carga de la justicia ante causas que no implican un riesgo social significativo, para facilitar la reinserción social de los autores de ciertas conductas punibles, o para centralizar las investigaciones en casos de mayor entidad jurídica” (núm. 6.6.3).", "En este sentido, cada caso y cada delito debe ser analizado desde su componente económico, social y ambiental, para que el Estado logre “garantizar el equilibrio entre el desarrollo económico y el uso razonable de la oferta ambiental” (núm. 6.7.1.1), así como las condiciones laborales de las personas y la efectiva protección de los recursos naturales renovables y no renovables, de modo que así sea posible “tomar medidas que mitiguen, compensen o corrijan los efectos generados, como ocurre con los sistemas de planificación ambiental ideados en el ordenamiento jurídico” (núm. 6.7.1.1)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una excepción a la legalidad", "segs": [0], "obj": "documento"}, {"label": "La obligación de la Fiscalía", "segs": [1], "obj": "lupa"}, {"label": "Artículo 321 y política criminal", "segs": [2], "obj": "libros"}, {"label": "Los fines del principio", "segs": [3, 4], "obj": "carpetas"}, {"label": "Análisis económico, social y ambiental", "segs": [5], "obj": "escudo"}]}], "rotulo": null, "seccion": "4. Concepto del principio de oportunidad", "grupo": null, "titulos_fuente": ["4. Concepto del principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una excepción a la legalidad", "La obligación de la Fiscalía", "Artículo 321 y política criminal", "Los fines del principio", "Análisis económico, social y ambiental"], "titulo_genially": "4. Concepto del principio de oportunidad", "complemento_genially": "", "apartado": "4. Concepto del principio de oportunidad", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "campo", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [102, 107], "lectura": {"href": "documentos/lectura-p05.pdf", "nombre": "Lectura · 4. Concepto del principio de oportunidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "4. Concepto del principio de oportunidad"}}, {"layout": "esquema", "segmentos": ["Las causales en las cuales procede la aplicación del principio de oportunidad se encuentran señaladas en el artículo 324 de la Ley 906 de 2004, modificado por el artículo 2 de la Ley 1312 de 2009. Para el caso ambiental, corresponde a las siguientes:", "a) Causal séptima: la norma establece que se aplica “cuando proceda la suspensión del procedimiento a prueba en el marco de la justicia restaurativa y como consecuencia de este se cumpla con las condiciones impuestas” (Ley 906, 2004, art. 324). Esta causal implica, de un lado, el análisis de los mecanismos de justicia restaurativa (conciliación y mediación) y, por otra parte, el cumplimiento de una serie de condiciones que, a discrecionalidad del fiscal de conocimiento, podrán ser impuestas por un periodo de tiempo a prueba y, de ser verificado su cumplimiento, solicitar la extinción de la acción penal, como se ha indicado, ante el juez de control de garantías. Dichas condiciones se encuentran previstas en el artículo 326 de la mencionada ley.", "Siendo así, la aplicación del principio de oportunidad permite al infractor a reivindicarse con la sociedad cumpliendo una serie de condiciones y, en igual medida, le garantiza a la víctima esos derechos a la verdad, al acceso a una justicia y por ende a una reparación a través de la reivindicación que, como consecuencia de los hechos, debe hacer la persona procesada frente a la víctima y luego frente a la sociedad. Con esto no solamente se propende por una oportunidad que evita la imposición de una sentencia de carácter condenatorio, sino que además permite al investigado reintegrarse a la sociedad (Rodríguez Valenzuela, 2020).", "b) Causal decimotercera: Se aplica “cuando se afecten mínimamente bienes colectivos, siempre y cuando se dé la reparación integral y pueda deducirse que el hecho no volverá a presentarse” (Ley 906, 2004, art. 324). Bajo esta causal se establecen las siguientes características: en primer lugar, se trata de la aplicación del principio de oportunidad de forma exclusiva a punibles que protegen un bien jurídico de carácter colectivo, por ejemplo, los delitos contra los recursos naturales y el medio ambiente; en segundo lugar, cabe señalar que, si bien se evidencia una afectación al bien jurídico, esta debe ser mínima; en cuanto a la víctima, y como tercer elemento, esta debe ser reparada y, por último, deberá deducirse que el hecho no volverá a presentarse (Rodríguez Valenzuela, 2020).", "Esta causal en igual medida será analizada más adelante en profundidad, teniendo en cuenta que en su enunciación el objeto de protección corresponde a los recursos naturales y, por ende, a la temática central de la presente investigación."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Artículo 324 de la Ley 906", "segs": [0], "obj": "libros"}, {"label": "a) Causal séptima", "segs": [1], "obj": "lupa"}, {"label": "Reivindicarse con la sociedad", "segs": [2], "obj": "escudo"}, {"label": "b) Causal decimotercera", "segs": [3, 4], "obj": "documento"}]}], "rotulo": null, "seccion": "5. Causas de procedibilidad", "grupo": null, "titulos_fuente": ["5. Causas de procedibilidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Artículo 324 de la Ley 906", "a) Causal séptima", "Reivindicarse con la sociedad", "b) Causal decimotercera"], "titulo_genially": "5. Causas de procedibilidad", "complemento_genially": "", "apartado": "5. Causas de procedibilidad", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "llano"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [109, 111], "pestana": "Causales séptima y decimotercera", "pestanas": [{"layout": "esquema", "segmentos": ["Las causales en las cuales procede la aplicación del principio de oportunidad se encuentran señaladas en el artículo 324 de la Ley 906 de 2004, modificado por el artículo 2 de la Ley 1312 de 2009. Para el caso ambiental, corresponde a las siguientes:", "a) Causal séptima: la norma establece que se aplica “cuando proceda la suspensión del procedimiento a prueba en el marco de la justicia restaurativa y como consecuencia de este se cumpla con las condiciones impuestas” (Ley 906, 2004, art. 324). Esta causal implica, de un lado, el análisis de los mecanismos de justicia restaurativa (conciliación y mediación) y, por otra parte, el cumplimiento de una serie de condiciones que, a discrecionalidad del fiscal de conocimiento, podrán ser impuestas por un periodo de tiempo a prueba y, de ser verificado su cumplimiento, solicitar la extinción de la acción penal, como se ha indicado, ante el juez de control de garantías. Dichas condiciones se encuentran previstas en el artículo 326 de la mencionada ley.", "Siendo así, la aplicación del principio de oportunidad permite al infractor a reivindicarse con la sociedad cumpliendo una serie de condiciones y, en igual medida, le garantiza a la víctima esos derechos a la verdad, al acceso a una justicia y por ende a una reparación a través de la reivindicación que, como consecuencia de los hechos, debe hacer la persona procesada frente a la víctima y luego frente a la sociedad. Con esto no solamente se propende por una oportunidad que evita la imposición de una sentencia de carácter condenatorio, sino que además permite al investigado reintegrarse a la sociedad (Rodríguez Valenzuela, 2020).", "b) Causal decimotercera: Se aplica “cuando se afecten mínimamente bienes colectivos, siempre y cuando se dé la reparación integral y pueda deducirse que el hecho no volverá a presentarse” (Ley 906, 2004, art. 324). Bajo esta causal se establecen las siguientes características: en primer lugar, se trata de la aplicación del principio de oportunidad de forma exclusiva a punibles que protegen un bien jurídico de carácter colectivo, por ejemplo, los delitos contra los recursos naturales y el medio ambiente; en segundo lugar, cabe señalar que, si bien se evidencia una afectación al bien jurídico, esta debe ser mínima; en cuanto a la víctima, y como tercer elemento, esta debe ser reparada y, por último, deberá deducirse que el hecho no volverá a presentarse (Rodríguez Valenzuela, 2020).", "Esta causal en igual medida será analizada más adelante en profundidad, teniendo en cuenta que en su enunciación el objeto de protección corresponde a los recursos naturales y, por ende, a la temática central de la presente investigación."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Artículo 324 de la Ley 906", "segs": [0], "obj": "libros"}, {"label": "a) Causal séptima", "segs": [1], "obj": "lupa"}, {"label": "Reivindicarse con la sociedad", "segs": [2], "obj": "escudo"}, {"label": "b) Causal decimotercera", "segs": [3, 4], "obj": "documento"}]}], "rotulo": null, "seccion": "5. Causas de procedibilidad", "grupo": null, "titulos_fuente": ["5. Causas de procedibilidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Artículo 324 de la Ley 906", "a) Causal séptima", "Reivindicarse con la sociedad", "b) Causal decimotercera"], "titulo_genially": "5. Causas de procedibilidad", "complemento_genially": "", "apartado": "5. Causas de procedibilidad", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [109, 111], "pestana": "Causales séptima y decimotercera", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 5. Causas de procedibilidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "5. Causas de procedibilidad"}}, {"layout": "fichas", "segmentos": ["Resulta pertinente advertir que, en las investigaciones adelantadas contra estructuras criminales vinculadas a fenómenos delictivos como la minería ilegal, es frecuente evaluar la aplicación del principio de oportunidad bajo la causal 4, referida a la colaboración eficaz con la administración de justicia. En estos escenarios, el ente acusador suele estructurar la hipótesis delictiva en torno al concierto para delinquir agravado —cuyo bien jurídico tutelado es la seguridad pública—, el cual concurre pero difiere de los delitos que atentan contra los recursos naturales y el medio ambiente. En ese sentido, es jurídicamente viable viabilizar esta causal frente al entramado criminal, siempre y cuando se acredite el cumplimiento estricto de los siguientes requisitos:", "Aporte de información esencial y eficaz: El procesado debe suministrar elementos materiales probatorios, evidencia física o información trascendental que permita la desarticulación efectiva de la banda u organización criminal, o que evite que la explotación ilícita y otros delitos conexos continúen ejecutándose.", "Límite temporal (Oportunidad procesal): La colaboración y la consecuente solicitud de aplicación del principio deben materializarse de manera oportuna, teniendo como límite máximo antes de dar inicio a la audiencia de juzgamiento.", "Garantía de reparación integral a las víctimas: En el contexto de la minería ilegal y los delitos ambientales concurrentes, se exige demostrar la reparación integral o un compromiso serio para garantizarla. Esto incluye necesariamente acciones orientadas a la mitigación, compensación o restauración del daño causado a los recursos naturales, articuladas con las autoridades ambientales competentes.", "Juicio de proporcionalidad e interés público: La renuncia o suspensión de la persecución penal frente al colaborador debe ser estrictamente proporcional y necesaria frente al beneficio que obtiene la justicia al desmantelar la estructura criminal, ponderando la grave afectación que dicha organización generaba tanto a la seguridad pública como al ecosistema."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Colaboración de estructuras criminales", "segs": [0], "obj": "lupa"}, {"label": "Información esencial y eficaz", "segs": [1], "obj": "expediente"}, {"label": "Límite temporal", "segs": [2], "obj": "tribunal"}, {"label": "Reparación integral a las víctimas", "segs": [3], "obj": "reloj"}, {"label": "Proporcionalidad e interés público", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "5. Causas de procedibilidad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Colaboración de estructuras criminales", "Información esencial y eficaz", "Límite temporal", "Reparación integral a las víctimas", "Proporcionalidad e interés público"], "titulo_genially": "5. Causas de procedibilidad", "complemento_genially": "", "apartado": "5. Causas de procedibilidad", "bloques_fuente": [112, 116], "pestana": "Colaboración de estructuras criminales", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 5. Causas de procedibilidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "5. Causas de procedibilidad"}}], "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 5. Causas de procedibilidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "5. Causas de procedibilidad"}}, {"layout": "esquema", "segmentos": ["Según Rodríguez Valenzuela (2020), los principios básicos para la interpretación y orientación al momento de aplicar el principio de oportunidad son los siguientes:", "a) Principio de proporcionalidad: la aplicación del principio de oportunidad debe observar el principio de proporcionalidad, de conformidad con el artículo 250 de la Constitución Política y el artículo 327 de la Ley 906 de 2004, en concordancia con las disposiciones que regulan su procedencia y control judicial. Su aplicación exige valorar la idoneidad, necesidad y proporcionalidad en sentido estricto de la decisión, teniendo en cuenta los fines constitucionales y legales del mecanismo, los intereses de las víctimas, la sociedad y los demás intervinientes en el proceso penal.", "En este análisis, el test de proporcionalidad permite evaluar si la decisión de aplicar el principio de oportunidad resulta adecuada para alcanzar el propósito perseguido, si no existe otra medida menos restrictiva que permita lograrlo y si los beneficios que se esperan obtener justifican las afectaciones que pueda generar la decisión."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a) Principio de proporcionalidad", "segs": [0, 1], "obj": "libros"}, {"label": "El test de proporcionalidad", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "6. Principios básicos para la interpretación del principio de oportunidad", "grupo": null, "titulos_fuente": ["6. Principios básicos para la interpretación del principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a) Principio de proporcionalidad", "El test de proporcionalidad"], "titulo_genially": "6. Principios para interpretar el principio de oportunidad", "complemento_genially": "", "apartado": "6. Principios básicos para la interpretación del principio de oportunidad", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "norma", "camino": "meandro"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [118, 122], "pestana": "a) Proporcionalidad", "pestanas": [{"layout": "esquema", "segmentos": ["Según Rodríguez Valenzuela (2020), los principios básicos para la interpretación y orientación al momento de aplicar el principio de oportunidad son los siguientes:", "a) Principio de proporcionalidad: la aplicación del principio de oportunidad debe observar el principio de proporcionalidad, de conformidad con el artículo 250 de la Constitución Política y el artículo 327 de la Ley 906 de 2004, en concordancia con las disposiciones que regulan su procedencia y control judicial. Su aplicación exige valorar la idoneidad, necesidad y proporcionalidad en sentido estricto de la decisión, teniendo en cuenta los fines constitucionales y legales del mecanismo, los intereses de las víctimas, la sociedad y los demás intervinientes en el proceso penal.", "En este análisis, el test de proporcionalidad permite evaluar si la decisión de aplicar el principio de oportunidad resulta adecuada para alcanzar el propósito perseguido, si no existe otra medida menos restrictiva que permita lograrlo y si los beneficios que se esperan obtener justifican las afectaciones que pueda generar la decisión."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a) Principio de proporcionalidad", "segs": [0, 1], "obj": "libros"}, {"label": "El test de proporcionalidad", "segs": [2], "obj": "lupa"}]}], "rotulo": null, "seccion": "6. Principios básicos para la interpretación del principio de oportunidad", "grupo": null, "titulos_fuente": ["6. Principios básicos para la interpretación del principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a) Principio de proporcionalidad", "El test de proporcionalidad"], "titulo_genially": "6. Principios para interpretar el principio de oportunidad", "complemento_genially": "", "apartado": "6. Principios básicos para la interpretación del principio de oportunidad", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "norma", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [118, 122], "pestana": "a) Proporcionalidad", "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 6. Principios para interpretar el principio de oportunidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "6. Principios para interpretar el principio de oportunidad"}}, {"layout": "esquema", "segmentos": ["Ejemplo práctico: inmunidad total e inmunidad parcial En una investigación por explotación ilícita de yacimientos mineros que involucra a varios integrantes de una estructura criminal, la Fiscalía identifica a un colaborador que aporta información relevante sobre los responsables de financiar y dirigir la actividad, así como sobre la ubicación de los recursos económicos obtenidos.", "Inmunidad total: podría analizarse cuando la colaboración del investigado resulte determinante para alcanzar los fines previstos en la causal de aplicación del principio de oportunidad y se justifique, conforme a los requisitos legales, la renuncia a la persecución penal respecto de los delitos comprendidos en la decisión.", "Inmunidad parcial: podría considerarse cuando la colaboración sea relevante, pero la renuncia a la persecución penal deba limitarse a determinados delitos, mientras se mantiene la persecución respecto de otras conductas punibles que no están comprendidas en el beneficio. En ambos escenarios, la decisión debe estar debidamente motivada y sometida a los controles correspondientes. En materia ambiental, además, deben valorarse las afectaciones ocasionadas a los recursos naturales y las medidas de reparación o restauración que resulten jurídicamente procedentes."], "parrafo": [0, 1, 2], "vineta": [1, 2], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El caso del colaborador", "segs": [0], "obj": "carpetas"}, {"label": "Inmunidad total", "segs": [1], "obj": "escalones"}, {"label": "Inmunidad parcial", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "6. Principios básicos para la interpretación del principio de oportunidad", "grupo": null, "titulos_fuente": ["6. Principios básicos para la interpretación del principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El caso del colaborador", "Inmunidad total", "Inmunidad parcial"], "titulo_genially": "6. Principios para interpretar el principio de oportunidad", "complemento_genially": "", "apartado": "6. Principios básicos para la interpretación del principio de oportunidad", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "norma", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [118, 122], "casosAudio": [{"id": "c51", "titulo": "Ejemplo práctico: inmunidad total e inmunidad parcial", "url": "../comun/casos/index.html?caso=c51"}], "pestana": "Ejemplo: inmunidad total y parcial", "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 6. Principios para interpretar el principio de oportunidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "6. Principios para interpretar el principio de oportunidad"}}, {"layout": "fichas", "segmentos": ["b) Discrecionalidad: siguiendo el orden previsto en la Resolución 561 de 2024 y la Resolución 351 de 2025 , el principio de oportunidad es una facultad discrecional de la Fiscalía General de la Nación, conforme al artículo 2 de la primera , lo cual se instala dentro de la legalidad, lejos de la arbitrariedad, pero permitiendo márgenes de acción a las autoridades públicas, quienes pueden elegir, seleccionar y priorizar su actividad por tiempos, medidas, intensidades, etc., para llevar a cabo su función de la mejor manera posible, orientados —en este caso— a las finalidades legítimas de la política criminal.", "c) Oportunidad procesal: se podrá aplicar la figura del principio de oportunidad en cualquier etapa del proceso.", "d) Derechos de las víctimas: la participación de las víctimas en la aplicación de la figura refiere a que, en su condición de víctimas, deben tener conocimiento de su aplicación, efectos y contenidos, e informar su posición frente a la solicitud y trámite del principio de oportunidad, con base en lo previsto en el artículo 7 de la resolución objeto de análisis.", "e) Causales: son los supuestos de hecho con base en los cuales se aplica el principio de oportunidad y corresponde a los estrictamente señalados en el artículo 324 de la Ley 906 de 2004 y sus modificaciones, conforme a lo previsto a su vez en el artículo 8 de la la Resolución 561 de 2024"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "b) Discrecionalidad", "segs": [0], "obj": "carpetas"}, {"label": "c) Oportunidad procesal", "segs": [1], "obj": "escalones"}, {"label": "d) Derechos de las víctimas", "segs": [2], "obj": "escudo"}, {"label": "e) Causales", "segs": [3], "obj": "libros"}]}], "rotulo": null, "seccion": "6. Principios básicos para la interpretación del principio de oportunidad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["b) Discrecionalidad", "c) Oportunidad procesal", "d) Derechos de las víctimas", "e) Causales"], "titulo_genially": "6. Principios para interpretar el principio de oportunidad", "complemento_genially": "", "apartado": "6. Principios básicos para la interpretación del principio de oportunidad", "bloques_fuente": [123, 127], "pestana": "b) a e) Los demás principios", "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 6. Principios para interpretar el principio de oportunidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "6. Principios para interpretar el principio de oportunidad"}}], "lectura": {"href": "documentos/lectura-p07.pdf", "nombre": "Lectura · 6. Principios para interpretar el principio de oportunidad.pdf"}, "mapaMental": {"src": "documentos/mapa-p07.png", "titulo": "6. Principios para interpretar el principio de oportunidad"}}, {"layout": "esquema", "segmentos": ["En atención a lo anteriormente expuesto, el principio de oportunidad en materia de delitos contra el ambiente podría ser invocado:", "a) Dentro de la justicia restaurativa, habiendo cumplido las condiciones impuestas, relacionadas con la reparación integral a las víctimas. Las corporaciones autónomas regionales, secretarías de ambiente o entes similares exigen una serie de acciones, es decir, el desarrollo de actividades que restablezcan el bien jurídico afectado y conlleven a la resocialización de los procesados.", "b) En los casos de menor lesividad y culpabilidad de los numerales 12 y 13."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a) Dentro de la justicia restaurativa", "segs": [0, 1], "obj": "escudo"}, {"label": "b) Menor lesividad y culpabilidad", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "7. Escenarios de aplicación", "grupo": null, "titulos_fuente": ["7. Escenarios de aplicación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a) Dentro de la justicia restaurativa", "b) Menor lesividad y culpabilidad"], "titulo_genially": "7 y 8. Escenarios de aplicación y características", "complemento_genially": "", "apartado": "7. Escenarios de aplicación", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "asciende"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [129, 131], "pestana": "Escenarios de aplicación", "pestanas": [{"layout": "esquema", "segmentos": ["En atención a lo anteriormente expuesto, el principio de oportunidad en materia de delitos contra el ambiente podría ser invocado:", "a) Dentro de la justicia restaurativa, habiendo cumplido las condiciones impuestas, relacionadas con la reparación integral a las víctimas. Las corporaciones autónomas regionales, secretarías de ambiente o entes similares exigen una serie de acciones, es decir, el desarrollo de actividades que restablezcan el bien jurídico afectado y conlleven a la resocialización de los procesados.", "b) En los casos de menor lesividad y culpabilidad de los numerales 12 y 13."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a) Dentro de la justicia restaurativa", "segs": [0, 1], "obj": "escudo"}, {"label": "b) Menor lesividad y culpabilidad", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "7. Escenarios de aplicación", "grupo": null, "titulos_fuente": ["7. Escenarios de aplicación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a) Dentro de la justicia restaurativa", "b) Menor lesividad y culpabilidad"], "titulo_genially": "7 y 8. Escenarios de aplicación y características", "complemento_genially": "", "apartado": "7. Escenarios de aplicación", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [129, 131], "pestana": "Escenarios de aplicación", "mapaMental": {"src": "documentos/mapa-p08.png", "titulo": "7 y 8. Escenarios de aplicación y características"}}, {"layout": "fichas", "segmentos": ["Las características generales del principio de oportunidad, de acuerdo con la Sentencia C-387 de 2014, son las siguientes:", "a) Debe ser aplicado en el marco de la política criminal del Estado.", "b) Es una figura de aplicación excepcional y reglada.", "c) Las causales de aplicación deben establecerse por el legislador de manera clara, precisa e inequívoca y estar conformes a la Constitución.", "d) Su regulación debe ser compatible con la vigencia de un orden justo, el principio de legalidad y los derechos de las víctimas."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "a) En el marco de la política criminal", "segs": [0, 1], "obj": "libros"}, {"label": "b) a d) Excepcional, reglada y controlada", "segs": [2, 3, 4], "obj": "reloj"}]}], "rotulo": null, "seccion": "8. Características", "grupo": null, "titulos_fuente": ["8. Características"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["a) En el marco de la política criminal", "b) a d) Excepcional, reglada y controlada"], "titulo_genially": "7 y 8. Escenarios de aplicación y características", "complemento_genially": "", "apartado": "8. Características", "bloques_fuente": [133, 137], "pestana": "Características (C-387 de 2014)", "mapaMental": {"src": "documentos/mapa-p08.png", "titulo": "7 y 8. Escenarios de aplicación y características"}}], "mapaMental": {"src": "documentos/mapa-p08.png", "titulo": "7 y 8. Escenarios de aplicación y características"}}, {"layout": "linea", "segmentos": ["Para ver la aplicación del principio se recomienda el estudio del caso Lizama, donde la Fiscalía General de la Nación logró un acuerdo sin precedentes en defensa de los recursos naturales y el medio ambiente. La aplicación del principio permitió un trabajo de tres años, donde se realizó: limpieza, tratamiento y monitoreo de los cuerpos de agua, obras de protección y defensa de los ecosistemas, adecuación del área donde se registró el afloramiento de hidrocarburos, rehabilitación de la vegetación y las llanuras de las zonas ribereñas, creación de viveros con plantas nativas, reincorporación de fauna silvestre y microorganismos necesarios para la conservación de los ecosistemas, y capacitaciones a la comunidad, entre otras actividades.", "El estudio de caso citado se resume en lo siguiente:", "“El pasado 2 de marzo de 2018, el pozo Lizama 158, de propiedad de Ecopetrol S.A. vertió más de 1.000 barriles de crudo a la quebrada La Lizama y Caño Muerto. Por tal razón, se presentó una descarga de hidrocarburos al Río Sogamoso, generando un impacto ecológico y un grave daño a los recursos naturales. Debido a este grave suceso, murieron más de 3.600 especies entre aves, mamíferos y reptiles. Además de una afectación a la fauna íctica, a razón de 11.000 peces muertos, dentro del área protegida del DRMI Yariguies.” (https://sansilvestregreen.com/)", "El principio de oportunidad fue aprobado porque se logró demostrar fehacientemente la comisión de delitos ambientales por parte de Ecopetrol y su reincidencia histórica, lo que permitió el reconocimiento formal e inédito de los pescadores y comerciantes como víctimas dentro del proceso penal. Este estatus de víctimas habilitó la aplicación de la justicia restaurativa frente a la Fiscalía, garantizando no solo la indemnización económica de las comunidades afectadas, sino también la imposición de una sanción por 3.800 millones de pesos y la exigencia de un plan de recuperación ambiental a tres años de la mano con la ANLA."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "El acuerdo del caso Lizama", "segs": [0], "obj": "libros"}, {"label": "Lo que pasó en el pozo Lizama 158", "segs": [1, 2], "obj": "reloj"}, {"label": "Por qué se aprobó", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "9. Caso concreto en donde se vio su aplicación", "grupo": null, "titulos_fuente": ["9. Caso concreto en donde se vio su aplicación"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["El acuerdo del caso Lizama", "Lo que pasó en el pozo Lizama 158", "Por qué se aprobó"], "titulo_genially": "9. Caso Lizama", "complemento_genially": "", "apartado": "9. Caso concreto en donde se vio su aplicación", "bloques_fuente": [139, 142], "lectura": {"href": "documentos/lectura-p09.pdf", "nombre": "Lectura · 9. Caso Lizama.pdf"}}], "cuadroAjuste": true}</script>
