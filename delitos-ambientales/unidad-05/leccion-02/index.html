<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u5-l2", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 5 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 5, "lesson": 2, "heading": "Lección 2: Preacuerdos y negociaciones entre la Fiscalía y el imputado en materia ambiental", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Diseñar parámetros de negociación procesal que garanticen la legalidad del preacuerdo y protejan el interés colectivo, con el fin de asegurar que las concesiones penales otorgadas por el Estado se correspondan de manera proporcional con la asunción de responsabilidad y la mitigación del daño ambiental.", "Los preacuerdos y negociaciones constituyen mecanismos propios del Sistema Penal Acusatorio establecido por la Ley 906 de 2004, mediante los cuales la Fiscalía y el imputado o acusado pueden llegar a acuerdos que conduzcan a la terminación del proceso. El artículo 348 establece como finalidades de estos mecanismos la humanización de la actuación procesal y de la pena, la obtención de una pronta y cumplida justicia, la solución de los conflictos sociales derivados del delito, la reparación integral de los perjuicios ocasionados y la participación del imputado en la definición de su caso.", "En cuanto a su contenido, los artículos 350 y 351 de la mencionada ley permiten que los acuerdos recaigan, entre otros aspectos, sobre los términos de la imputación, los hechos imputados y sus consecuencias, así como sobre la eliminación de alguna causal de agravación punitiva o de algún cargo específico, dentro de los límites establecidos por el ordenamiento jurídico. La ley contempla, además, diferentes oportunidades procesales para su celebración y establece que los preacuerdos aprobados vinculan al juez de conocimiento, salvo que desconozcan o quebranten garantías fundamentales.", "La jurisprudencia de la Sala de Casación Penal de la Corte Suprema de Justicia ha precisado que los preacuerdos no pueden entenderse simplemente como una forma de terminar rápidamente un proceso. Su utilización debe responder a las finalidades previstas por el legislador y armonizarse con los principios y garantías que gobiernan el sistema acusatorio. En la Sentencia SP8666-2017, la Corte señaló que estos instrumentos deben ser resultado de la articulación de los principios y valores que orientan la política criminal y no estar dirigidos exclusivamente a obtener la terminación del proceso."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "reloj"}, {"label": "Qué son los preacuerdos", "segs": [1], "obj": "libros"}, {"label": "Su contenido (arts. 350 y 351)", "segs": [2], "obj": "personas"}, {"label": "No son solo una forma de terminar", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 2: Preacuerdos y negociaciones entre la Fiscalía y el imputado en materia ambiental", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Objetivo", "Qué son los preacuerdos", "Su contenido (arts. 350 y 351)", "No son solo una forma de terminar"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "personas", "documento"], "escenario": {"bioma": "norma", "camino": "llano"}, "bloques_fuente": [144, 147], "textoFijo": true, "ilustracion": "ijda-daniela-u5-l2.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p52"}}, {"layout": "fichas", "segmentos": ["Asimismo, la Corte ha reconocido que el objeto de los preacuerdos puede comprender los hechos imputados y sus consecuencias, siempre que exista una aceptación libre, consciente, espontánea y voluntaria por parte de la persona procesada y un mínimo de respaldo probatorio. Así lo explicó la Sala en AP, Rad. 41570, al analizar el objeto susceptible de convenio bajo los artículos 348, 350, 351 y 352 de la Ley 906 de 2004.", "Un aspecto especialmente relevante para la Fiscalía es que la posibilidad de negociar no equivale a una facultad ilimitada para modificar la realidad fáctica o jurídica del caso. La Corte ha precisado que la Fiscalía puede acudir a las modalidades previstas legalmente para obtener beneficios punitivos, pero la calificación jurídica utilizada en el acuerdo debe guardar correspondencia con los hechos efectivamente acreditados. En la Sentencia SP359-2022 la Sala reiteró que es posible utilizar una determinada calificación jurídica para efectos punitivos en los términos permitidos por la ley, pero sin desconocer la conducta realmente cometida."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "El objeto de los preacuerdos", "segs": [0], "obj": "libros"}, {"label": "Negociar no es modificar los hechos", "segs": [1], "obj": "carpetas"}]}], "rotulo": null, "seccion": "Lección 2: Preacuerdos y negociaciones entre la Fiscalía y el imputado en materia ambiental", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["El objeto de los preacuerdos", "Negociar no es modificar los hechos"], "titulo_genially": "Los preacuerdos en la jurisprudencia", "complemento_genially": "", "apartado": "", "bloques_fuente": [148, 149]}, {"layout": "esquema", "segmentos": ["En los procesos por delitos contra el medio ambiente y los recursos naturales, estas reglas adquieren especial importancia. El carácter negociable de una actuación penal no significa que puedan desconocerse la naturaleza del bien jurídico afectado, la realidad del daño ambiental, los derechos de las víctimas o las finalidades de protección ambiental.", "En un eventual preacuerdo relacionado con delitos ambientales, la Fiscalía debe articular las finalidades propias de la justicia premial con la obligación de garantizar una respuesta adecuada frente al daño ocasionado. Esto resulta particularmente relevante cuando el acuerdo contempla mecanismos de reparación, pues el propio artículo 348 incorpora la reparación integral de los perjuicios entre las finalidades de los preacuerdos, mientras que el artículo 351 establece reglas sobre las reparaciones efectivas a la víctima que puedan derivarse del acuerdo.", "Además, cuando el delito haya producido un incremento patrimonial derivado de la conducta punible, debe tenerse presente la regla del artículo 349 de la Ley 906 de 2004, según la cual no puede celebrarse el acuerdo hasta que se haya reintegrado, por lo menos, el 50 % del valor equivalente al incremento percibido y se asegure el recaudo del remanente."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Negociable no es disponible", "segs": [0], "obj": "reloj"}, {"label": "Justicia premial y reparación", "segs": [1], "obj": "escudo"}, {"label": "La regla del artículo 349", "segs": [2], "obj": "libros"}]}], "rotulo": null, "seccion": "1. Aplicación en materia ambiental", "grupo": null, "titulos_fuente": ["1. Aplicación en materia ambiental"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Negociable no es disponible", "Justicia premial y reparación", "La regla del artículo 349"], "titulo_genially": "1. Aplicación en materia ambiental", "complemento_genially": "", "apartado": "1. Aplicación en materia ambiental", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [160, 162]}], "cuadroAjuste": true}</script>
