<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u5-l3", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 5 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 5, "lesson": 3, "heading": "Lección 3: Allanamiento a cargos y aceptación de responsabilidad en delitos ambientales", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Evaluar las implicaciones procesales y sustanciales de la aceptación unilateral de cargos en los delitos ambientales y determinar los beneficios punitivos aplicables según la etapa procesal y los requisitos de legalidad exigidos por el juez de conocimiento."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Allanamiento a cargos y aceptación de responsabilidad en delitos ambientales", "segs": [0], "obj": "tribunal", "acomp": ["escalones", "documento"]}]}], "rotulo": null, "seccion": "Lección 3: Allanamiento a cargos y aceptación de responsabilidad en delitos ambientales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Allanamiento a cargos y aceptación de responsabilidad en delitos ambientales"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "ilustracion": "ijda-daniela-u5-l3.webp", "bloques_fuente": [164, 164], "textoFijo": true, "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p53"}}, {"layout": "esquema", "segmentos": ["El allanamiento a cargos o aceptación unilateral de responsabilidad es una forma de terminación anticipada del proceso penal prevista en la Ley 906 de 2004. A diferencia de los preacuerdos, en los que existe una negociación entre la Fiscalía y la persona procesada, el allanamiento supone que el imputado o acusado acepta los cargos sin que exista una transacción sobre estos, con los efectos procesales y punitivos previstos por la ley.", "La figura aparece principalmente en el artículo 288, numeral 3, respecto de la formulación de imputación; en el artículo 293, que regula el procedimiento cuando existe aceptación de la imputación; en el artículo 356, para la audiencia preparatoria; y en el artículo 367, respecto de la aceptación al inicio del juicio oral.", "La aceptación debe producirse de manera libre, consciente, voluntaria e informada, con asistencia de la defensa y con conocimiento de sus consecuencias jurídicas. La Ley 906 contempla esta aceptación como una manifestación de voluntad de la persona procesada que permite prescindir de determinadas etapas del debate procesal y obtener los beneficios punitivos correspondientes a la oportunidad en que se produce."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Qué es el allanamiento a cargos", "segs": [0], "obj": "casa"}, {"label": "Dónde está en la Ley 906", "segs": [1], "obj": "tribunal"}, {"label": "Libre, consciente e informada", "segs": [2], "obj": "libros"}]}], "rotulo": null, "seccion": "1. Normativa", "grupo": null, "titulos_fuente": ["1. Normativa"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Qué es el allanamiento a cargos", "Dónde está en la Ley 906", "Libre, consciente e informada"], "titulo_genially": "1. Normativa", "complemento_genially": "", "apartado": "1. Normativa", "objeto_raiz": "casa", "objetos_raiz": ["casa", "libros", "personas"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [166, 168]}, {"layout": "fichas", "segmentos": ["La jurisprudencia constitucional ha diferenciado expresamente el allanamiento a cargos de los preacuerdos y negociaciones. En la Sentencia T-091 de 2006, la Corte Constitucional explicó que ambos constituyen formas de terminación anticipada, pero tienen estructuras diferentes: mientras los preacuerdos requieren un consenso entre Fiscalía y persona procesada, el allanamiento constituye una aceptación unilateral de los cargos, sin que exista una negociación sobre estos.", "Esta distinción fue reiterada en la Sentencia T-713 de 2007, en la que se reconoció que el sistema acusatorio de la Ley 906 de 2004 contempla dos formas diferenciadas de terminación anticipada: el allanamiento o aceptación unilateral de los cargos y los preacuerdos y negociaciones. La Corte destacó, entre otros elementos, que en ambos casos debe existir control judicial y preservarse las garantías fundamentales de la persona procesada.", "La aceptación de responsabilidad, por tanto, no equivale por sí sola a una condena automática. La Corte ha señalado que, aunque la persona procesada acepta los cargos y renuncia a controvertirlos en el juicio, la decisión condenatoria debe estar respaldada por elementos probatorios que permitan al juez alcanzar el grado de conocimiento exigido para condenar. En este sentido, la Sentencia T-1026 de 2006 precisó que la figura parte de la presunción de inocencia y que la aceptación debe estar acompañada del correspondiente respaldo probatorio.", "En esa misma línea, la Corte Suprema de Justicia ha señalado que la aprobación judicial de la aceptación de cargos constituye un presupuesto de la sentencia anticipada y que el juez debe ejercer un verdadero control sobre la actuación. Entre los pronunciamientos identificados se encuentran SP367-2021, sobre la aprobación de la manifestación de culpabilidad; SP2442-2021, sobre el control judicial del allanamiento; y SP3002-2020, también relacionado con el control del juez frente a la aceptación de cargos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Allanamiento y preacuerdo no son lo mismo", "segs": [0], "obj": "casa"}, {"label": "Sentencia T-713 de 2007", "segs": [1], "obj": "libros"}, {"label": "No es una condena automática", "segs": [2], "obj": "tribunal"}, {"label": "La aprobación judicial", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Concepto jurisprudencial", "grupo": null, "titulos_fuente": ["2. Concepto jurisprudencial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Allanamiento y preacuerdo no son lo mismo", "Sentencia T-713 de 2007", "No es una condena automática", "La aprobación judicial"], "titulo_genially": "2. Concepto jurisprudencial", "complemento_genially": "", "apartado": "2. Concepto jurisprudencial", "bloques_fuente": [170, 173], "pestana": "Allanamiento y preacuerdo", "pestanas": [{"layout": "fichas", "segmentos": ["La jurisprudencia constitucional ha diferenciado expresamente el allanamiento a cargos de los preacuerdos y negociaciones. En la Sentencia T-091 de 2006, la Corte Constitucional explicó que ambos constituyen formas de terminación anticipada, pero tienen estructuras diferentes: mientras los preacuerdos requieren un consenso entre Fiscalía y persona procesada, el allanamiento constituye una aceptación unilateral de los cargos, sin que exista una negociación sobre estos.", "Esta distinción fue reiterada en la Sentencia T-713 de 2007, en la que se reconoció que el sistema acusatorio de la Ley 906 de 2004 contempla dos formas diferenciadas de terminación anticipada: el allanamiento o aceptación unilateral de los cargos y los preacuerdos y negociaciones. La Corte destacó, entre otros elementos, que en ambos casos debe existir control judicial y preservarse las garantías fundamentales de la persona procesada.", "La aceptación de responsabilidad, por tanto, no equivale por sí sola a una condena automática. La Corte ha señalado que, aunque la persona procesada acepta los cargos y renuncia a controvertirlos en el juicio, la decisión condenatoria debe estar respaldada por elementos probatorios que permitan al juez alcanzar el grado de conocimiento exigido para condenar. En este sentido, la Sentencia T-1026 de 2006 precisó que la figura parte de la presunción de inocencia y que la aceptación debe estar acompañada del correspondiente respaldo probatorio.", "En esa misma línea, la Corte Suprema de Justicia ha señalado que la aprobación judicial de la aceptación de cargos constituye un presupuesto de la sentencia anticipada y que el juez debe ejercer un verdadero control sobre la actuación. Entre los pronunciamientos identificados se encuentran SP367-2021, sobre la aprobación de la manifestación de culpabilidad; SP2442-2021, sobre el control judicial del allanamiento; y SP3002-2020, también relacionado con el control del juez frente a la aceptación de cargos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Allanamiento y preacuerdo no son lo mismo", "segs": [0], "obj": "casa"}, {"label": "Sentencia T-713 de 2007", "segs": [1], "obj": "libros"}, {"label": "No es una condena automática", "segs": [2], "obj": "tribunal"}, {"label": "La aprobación judicial", "segs": [3], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Concepto jurisprudencial", "grupo": null, "titulos_fuente": ["2. Concepto jurisprudencial"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Allanamiento y preacuerdo no son lo mismo", "Sentencia T-713 de 2007", "No es una condena automática", "La aprobación judicial"], "titulo_genially": "2. Concepto jurisprudencial", "complemento_genially": "", "apartado": "2. Concepto jurisprudencial", "bloques_fuente": [170, 173], "pestana": "Allanamiento y preacuerdo", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Concepto jurisprudencial.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Concepto jurisprudencial"}}, {"layout": "esquema", "segmentos": ["Por otra parte, la irretractabilidad no significa que desaparezca completamente la posibilidad de controvertir la sentencia. La Sala ha precisado que, después de una aceptación de cargos, el interés para recurrir se encuentra restringido y puede ejercerse, entre otros eventos, frente a vicios del consentimiento, vulneración de garantías fundamentales o aspectos relacionados con la pena y su determinación o cumplimiento. Esta regla ha sido reiterada, entre otras, en AP346-2022, SP3961-2022 y AP1082-2024.", "Finalmente, la Sala de Casación Penal de la Corte Suprema de Justicia, en Auto AP3873-2025, señaló que la aceptación de cargos realizada de manera libre, informada y consciente impide a la persona procesada retractarse posteriormente de la responsabilidad admitida. La Corte explica que esta limitación se justifica por la propia naturaleza de la justicia penal abreviada y porque la aceptación implica la renuncia al juicio público y a determinadas facultades procesales, entre ellas la posibilidad de solicitar y controvertir pruebas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Lo que se puede controvertir", "segs": [0], "obj": "libros"}, {"label": "Auto AP3873-2025", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "2. Concepto jurisprudencial", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Lo que se puede controvertir", "Auto AP3873-2025"], "titulo_genially": "2. Concepto jurisprudencial", "complemento_genially": "", "apartado": "2. Concepto jurisprudencial", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "campo", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [174, 175], "pestana": "Irretractabilidad", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Concepto jurisprudencial.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Concepto jurisprudencial"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 2. Concepto jurisprudencial.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "2. Concepto jurisprudencial"}}, {"layout": "giro", "segmentos": ["En materia de delitos contra el medio ambiente y los recursos naturales, el allanamiento conserva las mismas reglas generales de la Ley 906 de 2004. La especialidad ambiental se encuentra, principalmente, en el contenido de los cargos que son aceptados y en las consecuencias que debe considerar la Fiscalía al momento de estructurar la actuación.", "Así, cuando la aceptación recaiga sobre conductas como deforestación, promoción y financiación de la deforestación o extracción ilícita de yacimiento minero y otros, la Fiscalía deberá haber construido previamente una imputación jurídicamente adecuada, sustentada en los hechos jurídicamente relevantes y en los elementos materiales probatorios disponibles.", "Además, la terminación anticipada no hace desaparecer las consecuencias derivadas del daño ambiental. En los casos en que exista una víctima identificable o afectaciones colectivas, deberán observarse sus derechos y las reglas de reparación que resulten aplicables."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Las mismas reglas generales", "segs": [0], "obj": "casa"}, {"label": "Deforestación y minería", "segs": [1], "obj": "expediente"}, {"label": "El daño no desaparece", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "3. Aplicación a los delitos ambientales", "grupo": null, "titulos_fuente": ["3. Aplicación a los delitos ambientales"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Las mismas reglas generales", "Deforestación y minería", "El daño no desaparece"], "titulo_genially": "3. Aplicación a los delitos ambientales", "complemento_genially": "", "apartado": "3. Aplicación a los delitos ambientales", "bloques_fuente": [177, 179]}], "cuadroAjuste": true}</script>
