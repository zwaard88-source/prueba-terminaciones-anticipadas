<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-ambientales", "paleta": {"marino": "#003C5A", "teal": "#489084", "oxido": "#E46042", "coral": "#CC4824", "crema": "#EBE35C", "niebla": "#A2D2CC", "hielo": "#CBD8DD", "celeste": "#8AAEBA", "madera": "#421200", "piso": "#A59F17", "gris": "#A4A4A4", "amarillo": "#EBE35C"}, "anclas": {}, "respiro": 360, "pagina": 440, "juego": {"clave": "ijda-juego-u5-l4", "niveles": ["Observador", "Explorador", "Guardián", "Protector del ambiente"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ijda", "partirComas": true, "bitacora": true, "rellenoHoja": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 5 · Lección 4"}, "leccion_rotulo": "Lección 4", "unit": 5, "lesson": 4, "heading": "Lección 4: Reparación integral del daño ambiental como criterio para la aplicación de terminaciones anticipadas", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo: Analizar los mecanismos procesales de reparación integral del daño ambiental y su articulación con las figuras de terminación anticipada del proceso penal, considerando sus presupuestos jurídicos, implicaciones procesales y posibilidades de recuperación ecosistémica, más allá de la respuesta estrictamente punitiva.", "En el ámbito de los delitos ambientales, enfrentamos actualmente al importante dilema normativo según el cual el Código de Procedimiento Penal limita la aplicación de ciertas salidas alternas, toda vez que los delitos ambientales no son querellables, sino investigables de oficio, lo que impide la conciliación preprocesal. Además, la mediación no aplica a delitos que afectan bienes jurídicos colectivos como el medio ambiente. Ante este escenario, el legislador y la Fiscalía han encontrado en el principio de oportunidad la herramienta idónea y estratégica para desplazar el foco desde la punición hacia la reparación efectiva del daño ambiental, logrando descongestión judicial y una rápida protección de los ecosistemas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo", "segs": [0], "obj": "reloj"}, {"label": "El dilema normativo", "segs": [1], "obj": "libros"}]}], "rotulo": null, "seccion": "Lección 4: Reparación integral del daño ambiental como criterio para la aplicación de terminaciones anticipadas", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Objetivo", "El dilema normativo"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "comunidad", "camino": "llano"}, "bloques_fuente": [191, 192], "textoFijo": true, "ilustracion": "ijda-daniela-u5-l4.webp", "pildora": {"audio": "documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p54"}}, {"layout": "fichas", "segmentos": ["De acuerdo con los desarrollos constitucionales y la jurisprudencia, la reparación integral va más allá de la simple indemnización monetaria (De Zubiría Posada, 2019). En el contexto de los delitos ambientales, esta reparación implica abordar tanto el daño ambiental puro (la afectación directa al ecosistema) como el daño ambiental impuro o consecutivo (afectación a personas o comunidades derivadas del daño). Los componentes de esta reparación integral aplicados al entorno ambiental son:", "a) Restitución: es la medida principal. Busca retornar el ecosistema a su estado anterior (ej. reforestación, remediación de suelos, recuperación de fuentes hídricas).", "b) Indemnización: compensación pecuniaria por los perjuicios económicamente evaluables (daño emergente y lucro cesante) ocasionados a terceros.", "c) Rehabilitación: atención médica, psicológica o social a las comunidades directamente afectadas por la contaminación.", "d) Satisfacción: medidas de carácter simbólico, como el reconocimiento público de responsabilidad, campañas de educación ecológica y la difusión de la verdad.", "e) Garantías de no repetición: reformas corporativas, implementación de programas de cumplimiento (compliance ambiental) y adopción de mejores tecnologías para asegurar que la conducta no vuelva a ocurrir."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Más que indemnizar: a) restitución", "segs": [0, 1], "obj": "libros"}, {"label": "b) Indemnización", "segs": [2], "obj": "reloj"}, {"label": "c) Rehabilitación", "segs": [3], "obj": "corazon"}, {"label": "d) Satisfacción", "segs": [4], "obj": "documento"}, {"label": "e) Garantías de no repetición", "segs": [5], "obj": "escudo"}]}], "rotulo": null, "seccion": "1. ¿Qué es la reparación integral en materia ambiental?", "grupo": null, "titulos_fuente": ["1. ¿Qué es la reparación integral en materia ambiental?"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Más que indemnizar: a) restitución", "b) Indemnización", "c) Rehabilitación", "d) Satisfacción", "e) Garantías de no repetición"], "titulo_genially": "1. ¿Qué es la reparación integral en materia ambiental?", "complemento_genially": "", "apartado": "1. ¿Qué es la reparación integral en materia ambiental?", "bloques_fuente": [194, 199], "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1. ¿Qué es la reparación integral en materia ambiental?"}}, {"layout": "esquema", "segmentos": ["Ante la restricción de figuras como la conciliación preprocesal, el principio de oportunidad (Ley 906 de 2004, art. 324) se convierte en la vía procesal por excelencia para terminar anticipadamente la persecución penal en delitos ambientales, siempre y cuando esté condicionada a la reparación. Las causales más relevantes en esta materia son:", "a) Causal 7: procede cuando se suspende el procedimiento a prueba en el marco de la justicia restaurativa y se cumplen las condiciones impuestas. En este caso, el investigado debe presentar un plan de restauración (ej. siembra de árboles, limpieza de un cuerpo de agua) que, tras ser aprobado y verificado, extingue la acción penal.", "b) Causal 13: se aplica cuando se afectan mínimamente bienes colectivos, siempre y cuando se dé la reparación integral y se deduzca que el hecho no volverá a presentarse (garantía de no repetición).", "El éxito de esta aplicación radica en que la propuesta técnica de reparación debe ser robusta, medible y financieramente viable, demostrando a la Fiscalía y al juez de control de garantías que la sociedad y el ecosistema ganan más con la reparación inmediata que con un largo juicio."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El principio de oportunidad como vía", "segs": [0, 1], "obj": "libros"}, {"label": "b) Causal 13", "segs": [2], "obj": "escudo"}, {"label": "Una propuesta técnica robusta", "segs": [3], "obj": "tribunal"}]}], "rotulo": null, "seccion": "2. La reparación integral y el principio de oportunidad", "grupo": null, "titulos_fuente": ["2. La reparación integral y el principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El principio de oportunidad como vía", "b) Causal 13", "Una propuesta técnica robusta"], "titulo_genially": "2. La reparación integral y el principio de oportunidad", "complemento_genially": "", "apartado": "2. La reparación integral y el principio de oportunidad", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "campo", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [201, 204]}, {"layout": "fichas", "segmentos": ["La estrategia de defensa y reparación en la Ley 906 de 2004 no puede verse aislada, sino que debe articularse con el régimen sancionatorio administrativo. La reforma del año 2024 incorporó el artículo 18A a la Ley 1333 de 2009, permitiendo la suspensión y terminación anticipada del procedimiento sancionatorio ambiental bajo la misma lógica: si el presunto infractor corrige o compensa adecuadamente el daño, el proceso se suspende y eventualmente termina sin declaratoria de responsabilidad.", "Esto transforma un riesgo jurídico (la sanción penal y administrativa) en un riesgo técnico-financiero (el costo y ejecución estricta del plan de medidas ambientales), lo que permite a las empresas una gestión integral del riesgo corporativo y reputacional."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Articularse con lo administrativo", "segs": [0], "obj": "libros"}, {"label": "De riesgo jurídico a riesgo técnico", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "3. El espejo administrativo: la suspensión y terminación anticipada", "grupo": null, "titulos_fuente": ["3. El espejo administrativo: la suspensión y terminación anticipada"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Articularse con lo administrativo", "De riesgo jurídico a riesgo técnico"], "titulo_genially": "3. El espejo administrativo", "complemento_genially": "", "apartado": "3. El espejo administrativo: la suspensión y terminación anticipada", "bloques_fuente": [206, 207]}, {"layout": "empareja", "segmentos": ["a) Prioridad restaurativa: la Ley 906 de 2004, interpretada sistemáticamente con la normativa ambiental, demuestra que el sistema favorece la recuperación del ecosistema por encima del simple castigo carcelario.", "b) Estrategia integral: solicitar el principio de oportunidad no es evadir la justicia, sino asumir la responsabilidad desde una óptica técnica. Es una decisión empresarial y jurídica racional.", "c) Eficiencia judicial: al aplicar estas salidas, se descongestiona el aparato judicial, garantizando una pronta protección de los derechos colectivos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "empareja", "items": [{"label": "Prioridad restaurativa", "segs": [0], "obj": "libros", "nombre_texto": "Prioridad restaurativa"}, {"label": "Estrategia integral", "segs": [1], "obj": "documento", "nombre_texto": "Estrategia integral"}, {"label": "Eficiencia judicial", "segs": [2], "obj": "escudo", "nombre_texto": "Eficiencia judicial"}]}], "rotulo": null, "seccion": "4. Conclusiones y visión estratégica", "grupo": null, "titulos_fuente": ["4. Conclusiones y visión estratégica"], "encabezados": [], "mediacion": "Emparejar término y descripción; al acertar se lee el texto completo.", "rotulos": ["Prioridad restaurativa", "Estrategia integral", "Eficiencia judicial"], "titulo_genially": "4. Conclusiones y visión estratégica", "complemento_genially": "", "apartado": "4. Conclusiones y visión estratégica", "bloques_fuente": [209, 211]}], "cuadroAjuste": true}</script>
