enially": "", "apartado": "1. Tipificación específica por la Ley 2111 de 2021", "bloques_fuente": [179, 179], "pestana": "Los artículos 330 y 330A", "pestanas": [{"layout": "fichas", "segmentos": ["Anteriormente visibilizada de forma indirecta, la deforestación fue elevada a delito autónomo en el artículo 330 del Código Penal, sancionando a quien tale, queme, corte o destruya masas arbóreas o bosques naturales sin permiso de autoridad competente.", "Asimismo, el artículo 330A penaliza de manera agravada a quien financie, dirija u ordene la acaparación de tierras mediante la tala masiva."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Artículo 330: la deforestación como delito autónomo", "segs": [0], "obj": "libros"}, {"label": "Artículo 330A: promoción y financiación", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "1. Tipificación específica por la Ley 2111 de 2021", "grupo": null, "titulos_fuente": ["1. Tipificación específica por la Ley 2111 de 2021"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Artículo 330: la deforestación como delito autónomo", "Artículo 330A: promoción y financiación"], "titulo_genially": "1 y 2. Tipificación y mirada investigativa", "complemento_genially": "", "apartado": "1. Tipificación específica por la Ley 2111 de 2021", "bloques_fuente": [179, 179], "pestana": "Los artículos 330 y 330A", "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1 y 2. Tipificación y mirada investigativa"}}, {"layout": "esquema", "segmentos": ["La diferenciación entre los artículos 330 y 330A resulta relevante para orientar la investigación. Mientras el artículo 330 se concentra en las conductas que producen de manera directa la afectación del bosque natural, el artículo 330A permite dirigir la investigación hacia las personas que promueven, financian, dirigen, facilitan o se benefician económicamente de la deforestación.", "Por ello, la investigación no debe limitarse a establecer quién ejecutó materialmente la tala o destrucción del bosque, sino que debe avanzar en la identificación de los diferentes actores que intervienen en el fenómeno, la finalidad de la actividad y los posibles beneficios económicos derivados de ella.", "Pregunta para reflexionar: ¿Quién está detrás de la deforestación? Identificar al autor material puede ser solo el primer paso. ¿Qué información se necesitaría para establecer quién promovió, financió, dirigió o se benefició de la actividad?"], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "330 y 330A: qué cambia para investigar", "segs": [0], "obj": "lupa"}, {"label": "Más allá del autor material", "segs": [1], "obj": "documento"}, {"label": "Pregunta para reflexionar", "segs": [2], "obj": "escalones"}]}], "rotulo": null, "seccion": "2. Una mirada desde la investigación penal", "grupo": null, "titulos_fuente": ["2. Una mirada desde la investigación penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["330 y 330A: qué cambia para investigar", "Más allá del autor material", "Pregunta para reflexionar"], "titulo_genially": "1 y 2. Tipificación y mirada investigativa", "complemento_genially": "", "apartado": "2. Una mirada desde la investigación penal", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "personas", "documento"], "escenario": {"bioma": "campo", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [218, 220], "pestana": "Una mirada desde la investigación", "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1 y 2. Tipificación y mirada investigativa"}}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "1 y 2. Tipificación y mirada investigativa"}}, {"layout": "fichas", "segmentos": ["La investigación de la deforestación no debe limitarse a establecer la existencia de un área de bosque afectada. Para avanzar hacia la identificación de responsabilidades penales es necesario comprender por qué ocurre la deforestación, quiénes intervienen, qué actividades la impulsan y quiénes obtienen beneficios de ella.", "En este sentido, el análisis de las causas y agentes de la deforestación constituye un punto de partida para orientar las hipótesis investigativas y determinar las actuaciones de policía judicial que resulten pertinentes. El Instituto de Hidrología, Meteorología y Estudios Ambientales (IDEAM) cuenta con lineamientos para la caracterización de las causas y agentes de la deforestación en Colombia."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Más que un área de bosque afectada", "segs": [0], "obj": "lupa"}, {"label": "Causas y agentes como punto de partida", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": null, "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Más que un área de bosque afectada", "Causas y agentes como punto de partida"], "titulo_genially": "3. Comprender el fenómeno", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "bloques_fuente": [222, 223]}, {"layout": "esquema", "segmentos": ["La deforestación no responde a una única causa. En Colombia, este fenómeno se encuentra asociado a diferentes actividades y dinámicas que transforman el bosque natural y que, dependiendo de las circunstancias, pueden estar relacionadas con actividades económicas ilegales, apropiación y transformación del territorio y estructuras de criminalidad organizada.", "Entre los principales motores de la deforestación se encuentran:", "a) Acaparamiento de tierras y praderización, transformación del bosque para apropiarse, ocupar o consolidar el control sobre extensiones de tierra, con frecuencia mediante la apertura de áreas de bosque y su posterior conversión en pastizales.", "b) Ganadería extensiva, establecimiento o ampliación de áreas destinadas a la actividad ganadera mediante la eliminación de cobertura boscosa.", "c) Cultivos de uso ilícito, transformación de áreas boscosas para establecer cultivos vinculados a economías ilícitas.", "d) Apertura y ampliación de vías o infraestructura ilegal, eliminación de cobertura vegetal para facilitar acceso, transporte, ocupación o explotación de determinados territorios.", "e) Explotación ilícita de minerales, intervención y remoción de la cobertura boscosa asociada a actividades de exploración y explotación minera desarrolladas al margen de las autorizaciones legales.", "f) Aprovechamiento y comercialización ilegal de madera, extracción de recursos forestales sin las autorizaciones correspondientes o mediante el incumplimiento de la normativa aplicable."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una sola causa no basta", "segs": [0], "obj": "documento"}, {"label": "a) Acaparamiento y praderización", "segs": [1, 2], "obj": "carpetas"}, {"label": "b) a e) Ganadería, cultivos y más", "segs": [3, 4, 5, 6], "obj": "lupa"}, {"label": "f) Madera ilegal", "segs": [7], "obj": "expediente"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": "3.1. Motores de la deforestación", "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "3.1. Motores de la deforestación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una sola causa no basta", "a) Acaparamiento y praderización", "b) a e) Ganadería, cultivos y más", "f) Madera ilegal"], "titulo_genially": "3.1 a 3.3. Motores, investigación y agentes", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "tala", "camino": "asciende"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [226, 233], "pestana": "Motores de la deforestación", "pestanas": [{"layout": "esquema", "segmentos": ["La deforestación no responde a una única causa. En Colombia, este fenómeno se encuentra asociado a diferentes actividades y dinámicas que transforman el bosque natural y que, dependiendo de las circunstancias, pueden estar relacionadas con actividades económicas ilegales, apropiación y transformación del territorio y estructuras de criminalidad organizada.", "Entre los principales motores de la deforestación se encuentran:", "a) Acaparamiento de tierras y praderización, transformación del bosque para apropiarse, ocupar o consolidar el control sobre extensiones de tierra, con frecuencia mediante la apertura de áreas de bosque y su posterior conversión en pastizales.", "b) Ganadería extensiva, establecimiento o ampliación de áreas destinadas a la actividad ganadera mediante la eliminación de cobertura boscosa.", "c) Cultivos de uso ilícito, transformación de áreas boscosas para establecer cultivos vinculados a economías ilícitas.", "d) Apertura y ampliación de vías o infraestructura ilegal, eliminación de cobertura vegetal para facilitar acceso, transporte, ocupación o explotación de determinados territorios.", "e) Explotación ilícita de minerales, intervención y remoción de la cobertura boscosa asociada a actividades de exploración y explotación minera desarrolladas al margen de las autorizaciones legales.", "f) Aprovechamiento y comercialización ilegal de madera, extracción de recursos forestales sin las autorizaciones correspondientes o mediante el incumplimiento de la normativa aplicable."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una sola causa no basta", "segs": [0], "obj": "documento"}, {"label": "a) Acaparamiento y praderización", "segs": [1, 2], "obj": "carpetas"}, {"label": "b) a e) Ganadería, cultivos y más", "segs": [3, 4, 5, 6], "obj": "lupa"}, {"label": "f) Madera ilegal", "segs": [7], "obj": "expediente"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": "3.1. Motores de la deforestación", "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "3.1. Motores de la deforestación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una sola causa no basta", "a) Acaparamiento y praderización", "b) a e) Ganadería, cultivos y más", "f) Madera ilegal"], "titulo_genially": "3.1 a 3.3. Motores, investigación y agentes", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "objeto_raiz": "documento", "objetos_raiz": ["documento", "carpetas", "lupa"], "escenario": {"bioma": "tala", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [226, 233], "pestana": "Motores de la deforestación", "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3.1 a 3.3. Motores, investigación y agentes.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3.1 a 3.3. Motores, investigación y agentes"}}, {"layout": "giro", "segmentos": ["La identificación del motor de la deforestación constituye un elemento relevante para orientar la investigación, pues permite formular hipótesis sobre las actividades que dieron origen a la transformación del bosque y sobre los actores que pudieron intervenir en ella.", "Por esta razón, ante un caso de deforestación, no basta con determinar qué área fue afectada y quién ejecutó materialmente la tala.", "Es necesario indagar por la actividad que originó la deforestación, las personas que la promovieron o facilitaron, los recursos utilizados, la finalidad perseguida y los posibles beneficiarios económicos.", "Clave para el investigador: Identificar el motor de la deforestación puede conducir a establecer quién está detrás del hecho, cómo opera la actividad y quién obtiene beneficios de ella."], "parrafo": [0, 1, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "El motor orienta la hipótesis", "segs": [0], "obj": "lupa"}, {"label": "No basta el área y el autor material", "segs": [1], "obj": "documento"}, {"label": "Lo que hay que indagar", "segs": [2], "obj": "personas"}, {"label": "Clave para el investigador", "segs": [3], "obj": "carpetas"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": null, "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["El motor orienta la hipótesis", "No basta el área y el autor material", "Lo que hay que indagar", "Clave para el investigador"], "titulo_genially": "3.1 a 3.3. Motores, investigación y agentes", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "bloques_fuente": [235, 237], "pestana": "Una mirada investigativa", "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3.1 a 3.3. Motores, investigación y agentes.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3.1 a 3.3. Motores, investigación y agentes"}}, {"layout": "fichas", "segmentos": ["La identificación del motor de la deforestación constituye el punto de partida para avanzar hacia la identificación de los actores que intervienen en el fenómeno. Una investigación penal efectiva debe superar la identificación del autor material de la tala y procurar establecer quién promueve, financia, dirige, facilita o se beneficia de la actividad de deforestación. En este sentido, el análisis puede orientarse a partir de cinco preguntas:", "a) ¿Qué actividad se desarrolla? Identifica el motor que está generando la transformación del bosque.", "b) ¿Quiénes intervienen? Identifica a los autores materiales, propietarios, ocupantes, intermediarios, financiadores, facilitadores y demás actores relacionados con la actividad.", "c) ¿Cómo se desarrolla? Establece los medios utilizados, la forma de organización, los recursos empleados y las relaciones entre los diferentes actores.", "d) ¿Para qué se realiza? Determina la finalidad de la deforestación: acaparamiento de tierras, ganadería, cultivos de uso ilícito, minería, infraestructura u otras actividades.", "e) ¿Quién obtiene el beneficio? Identifica a las personas naturales o jurídicas que reciben, administran o disfrutan de los beneficios económicos derivados de la actividad.", "El análisis conjunto de estos elementos permite pasar de la constatación de un daño ambiental a la construcción de una hipótesis sobre la estructura que lo genera o se beneficia de él.", "Deforestación → Motor → Actores → Medios → Finalidad → Beneficio económico → Hipótesis investigativa", "Este enfoque resulta especialmente relevante frente al artículo 330A del Código Penal, pues permite orientar la investigación hacia las diferentes formas de intervención previstas en el tipo penal y no únicamente hacia quien ejecutó materialmente la destrucción del bosque."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "a) Del motor a los actores", "segs": [0, 1], "obj": "lupa"}, {"label": "b) ¿Quiénes intervienen?", "segs": [2, 3, 4, 5], "obj": "documento"}, {"label": "Del daño a la estructura", "segs": [6], "obj": "reloj"}, {"label": "La ruta de la hipótesis", "segs": [7], "obj": "carpetas"}, {"label": "Relevancia frente al 330A", "segs": [8], "obj": "libros"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": "3.3. De la causa al agente", "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "3.3. De la causa al agente"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["a) Del motor a los actores", "b) ¿Quiénes intervienen?", "Del daño a la estructura", "La ruta de la hipótesis", "Relevancia frente al 330A"], "titulo_genially": "3.1 a 3.3. Motores, investigación y agentes", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "bloques_fuente": [240, 248], "pestana": "De la causa al agente", "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3.1 a 3.3. Motores, investigación y agentes.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3.1 a 3.3. Motores, investigación y agentes"}}], "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 3.1 a 3.3. Motores, investigación y agentes.pdf"}, "mapaMental": {"src": "documentos/mapa-p04.png", "titulo": "3.1 a 3.3. Motores, investigación y agentes"}}, {"layout": "esquema", "segmentos": ["La investigación de los delitos de deforestación requiere comprender las características jurídicas, ambientales y territoriales del lugar donde ocurre la afectación. La ubicación del bosque intervenido no constituye únicamente un dato geográfico, sino que permite establecer las condiciones del territorio, identificar las actividades permitidas o restringidas y orientar la investigación sobre los posibles responsables y finalidades de la conducta. Por ello, ante la constatación de un área deforestada, resulta pertinente determinar:", "a) ¿Dónde ocurrió la afectación? Ubicación y delimitación geográfica del área.", "b) ¿Qué tipo de ecosistema o bosque fue afectado?", "c) ¿Cuál es el régimen jurídico y ambiental del territorio? Por ejemplo, si corresponde a un área protegida, reserva forestal u otra zona de especial importancia ambiental.", "d) ¿Qué actividades están permitidas o restringidas en el área?", "e) ¿Qué relación existe entre las características del territorio y el motor de la deforestación identificado?"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Conocer el lugar de la afectación", "segs": [0, 1], "obj": "lupa"}, {"label": "b) a e) Preguntas sobre el territorio", "segs": [2, 3, 4, 5], "obj": "escudo"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": "3.4. Dimensión territorial de la deforestación", "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "3.4. Dimensión territorial de la deforestación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Conocer el lugar de la afectación", "b) a e) Preguntas sobre el territorio"], "titulo_genially": "3.4 y 3.5. Dimensión territorial", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "documento", "carpetas"], "escenario": {"bioma": "campo", "camino": "asciende"}, "guia": "Abra cada pestañ  permite ubicar y delimitar espacialmente el área afectada, así como relacionarla con las características jurídicas y ambientales del territorio."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Cómo pedir estas fuentes", "segs": [0], "obj": "lupa"}, {"label": "a) IDEAM", "segs": [1, 2], "obj": "carpetas"}, {"label": "b) Global Forest Watch", "segs": [3], "obj": "documento"}, {"label": "c) Imágenes satelitales", "segs": [4], "obj": "expediente"}, {"label": "d) Información geográfica", "segs": [5], "obj": "libros"}]}], "rotulo": null, "seccion": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "grupo": "3.7. Herramientas y fuentes de información", "titulos_fuente": ["3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "3.7. Herramientas y fuentes de información"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Cómo pedir estas fuentes", "a) IDEAM", "b) Global Forest Watch", "c) Imágenes satelitales", "d) Información geográfica"], "titulo_genially": "3.6 a 3.8. Prueba técnica y teledetección", "complemento_genially": "", "apartado": "3. Comprender el fenómeno: causas, agentes y dinámicas de la deforestación", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "personas", "carpetas"], "escenario": {"bioma": "norma", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [278, 283], "pestana": "Herramientas y fuentes", "lectura": {"href": "documentos/lectura-p06.pdf", "nombre": "Lectura · 3.6 a 3.8. Prueba técnica y teledetección.pdf"}, "mapaMental": {"src": "documentos/mapa-p06.png", "titulo": "3.6 a 3.8. Prueba técnica y teledetección"}}, {"layout": "fichas", "segmentos": ["La información obtenida mediante teledetección no debe analizarse de manera aislada.", "Los
