"documentos/pildora-objetivo.mp3", "titulo": "Escuche el objetivo", "id": "p23"}}, {"layout": "esquema", "segmentos": ["El delito de explotación ilícita de yacimiento minero y otros materiales, previsto en el artículo 332 del Código Penal, protege los recursos naturales y el medio ambiente, además de sancionar a quien explore, explote o extraiga un yacimiento minero sin permiso de la autoridad competente o incumpliendo la normatividad aplicable. También sanciona a quien explote arena, material pétreo o de arrastre de los cauces y orillas de los ríos por medios capaces de causar graves daños a los recursos naturales o al medio ambiente.", "Es importante precisar que, si bien la extracción ilícita de yacimientos mineros puede concurrir con otras conductas punibles, como la invasión de áreas de especial importancia ecológica, el daño a los recursos naturales o la deforestación, esta lección se centra exclusivamente en el análisis del artículo 332 del Código Penal, sin perjuicio de reconocer las posibles relaciones con otros tipos penales, según las circunstancias del caso, el lugar donde se desarrolla la actividad, su intensidad y su finalidad.", "La Corte Suprema de Justicia precisa que se trata de un tipo penal de sujeto activo indeterminado, cuyo objeto material está constituido por los yacimientos mineros, de materiales pétreos, arena o materiales de arrastre. Asimismo, es un tipo penal compuesto, pues contempla los verbos rectores explorar, explotar y extraer, y es un tipo penal en blanco, en la medida en que su contenido debe integrarse con las normas extrapenales que regulan la actividad minera y ambiental.", "Un aspecto central de la configuración típica consiste en determinar la situación jurídica de la actividad minera. Según el alto tribunal, la conducta puede resultar ilícita por dos razones: porque se desarrolla sin el permiso o título habilitante correspondiente, o porque se ejecuta incumpliendo las condiciones y normas que regulan su ejercicio, aunque exista una autorización. La Corte también ha resaltado que la sola existencia de un título minero no habilita por sí misma la ejecución de todas las actividades de exploración o explotación, pues deben verificarse las demás autorizaciones y requisitos exigibles según el caso.", "Desde el punto de vista de la afectación al bien jurídico, la jurisprudencia caracteriza esta conducta como un delito de peligro abstracto. Siendo así, no es indispensable demostrar que efectivamente se produjo un daño ambiental para que pueda configurarse el tipo penal, basta con que los medios empleados para explorar, explotar o extraer sean capaces de causar graves daños a los recursos naturales o al medio ambiente. Por ello, la explotación ilícita puede concurrir, cuando corresponda, con otros delitos ambientales que protegen el bien jurídico mediante tipos de resultado, como los daños en los recursos naturales o la contaminación ambiental."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Qué protege el artículo 332", "segs": [0], "obj": "libros"}, {"label": "Concurso con otras conductas", "segs": [1], "obj": "reloj"}, {"label": "Sujeto activo y objeto material", "segs": [2], "obj": "personas"}, {"label": "Ilicitud: dos vías", "segs": [3], "obj": "tribunal"}, {"label": "Un delito de peligro abstracto", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3: Extracción ilícita de minerales", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Qué protege el artículo 332", "Concurso con otras conductas", "Sujeto activo y objeto material", "Ilicitud: dos vías", "Un delito de peligro abstracto"], "titulo_genially": "El delito de explotación ilícita (art. 332)", "complemento_genially": "", "apartado": "", "objeto_raiz": "libros", "objetos_raiz": ["libros", "documento", "carpetas"], "escenario": {"bioma": "mina", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [156, 160], "lectura": {"href": "documentos/lectura-p02.pdf", "nombre": "Lectura · El delito de explotación ilícita (art. 332).pdf"}, "mapaMental": {"src": "documentos/mapa-p02.png", "titulo": "El delito de explotación ilícita (art. 332)"}}, {"layout": "fichas", "segmentos": ["La Sentencia SP045-2026 constituye uno de los pronunciamientos más recientes de la Sala de Casación Penal sobre esta conducta. Aunque los hechos fueron juzgados bajo la regulación anterior —artículo 338 de la Ley 599 de 2000—, la Corte precisó que la Ley 2111 de 2021 trasladó el delito al actual artículo 332, sin modificar sus elementos estructurales esenciales.", "La decisión resulta relevante para la investigación porque evidencia que no basta con demostrar la existencia de minería sin autorización o la producción de una afectación ambiental. Por el contrario, es necesario construir y acreditar de manera sólida la relación entre el lugar exacto de la explotación, la actividad desarrollada, las condiciones de autorización o incumplimiento normativo, los medios empleados y la persona que ejecutó o determinó la conducta.", "En el caso analizado, la Corte encontró inconsistencias en la identificación del predio, las coordenadas, los títulos mineros y la atribución de la actividad a la persona procesada. Aunque existían elementos que acreditaban la existencia de actividad extractiva y afectaciones ambientales, estos no permitieron establecer, más allá de toda duda razonable, que el acusado hubiera ejecutado la explotación en las condiciones descritas por la Fiscalía. En consecuencia, la Corte casó la sentencia y lo absolvió.", "Este pronunciamiento ofrece una lección investigativa fundamental: en los casos de explotación ilícita de yacimientos mineros, la investigación debe procurar una georreferenciación precisa del lugar de los hechos, establecer la correspondencia entre el área intervenida y el título o autorización existente, verificar las condiciones bajo las cuales podía desarrollarse la actividad y construir elementos de conocimiento que permitan individualizar al responsable. La propia Corte señaló las dificultades que se generan cuando existen inconsistencias entre las coordenadas, los documentos mineros y la ubicación real del área investigada.", "En esa misma línea, la Sentencia AP8339-2025 destaca la importancia de que los hechos jurídicamente relevantes conserven su núcleo esencial durante las distintas etapas del proceso y de que la responsabilidad se sustente en la valoración conjunta de los medios de prueba. En ese caso, la actividad de explotación ilícita fue acreditada mediante videos, verificaciones policiales y declaraciones de expertos en materia ambiental y minera, entre otros elementos."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Sentencia SP045-2026", "segs": [0], "obj": "libros"}, {"label": "Por qué es relevante", "segs": [1], "obj": "lupa"}, {"label": "Lo que falló en el caso", "segs": [2], "obj": "personas"}, {"label": "La lección investigativa: georreferenciar", "segs": [3], "obj": "carpetas"}, {"label": "Sentencia AP8339-2025", "segs": [4], "obj": "camara"}]}], "rotulo": null, "seccion": "1. Criterio reciente de especial relevancia para la investigación", "grupo": null, "titulos_fuente": ["1. Criterio reciente de especial relevancia para la investigación"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Sentencia SP045-2026", "Por qué es relevante", "Lo que falló en el caso", "La lección investigativa: georreferenciar", "Sentencia AP8339-2025"], "titulo_genially": "1. Criterio reciente para la investigación", "complemento_genially": "", "apartado": "1. Criterio reciente de especial relevancia para la investigación", "bloques_fuente": [162, 166], "lectura": {"href": "documentos/lectura-p03.pdf", "nombre": "Lectura · 1. Criterio reciente para la investigación.pdf"}, "mapaMental": {"src": "documentos/mapa-p03.png", "titulo": "1. Criterio reciente para la investigación"}}, {"layout": "esquema", "segmentos": ["A partir de estos criterios, la investigación de este delito debería orientarse, como mínimo, a establecer los siguientes aspectos:", "Actividad de extracción y beneficio de minerales → lugar exacto de realización → identificación de los responsables de la actividad → ubicación en áreas protegidas o de especial importancia ecológica → identificación del propietario, arrendador o arrendatario del predio → verificación del título minero y la licencia ambiental → forma de ejecución de las actividades → determinación de posibles afectaciones a la salud humana, los recursos naturales o el medio ambiente.", "Para ello, adquieren especial importancia los registros y certificaciones de la autoridad minera y ambiental, la georreferenciación y fijación topográfica, las inspecciones de campo, los informes y conceptos técnicos, los registros fotográficos y audiovisuales, la información sobre títulos y licencias, y los elementos que permitan vincular al investigado con la actividad extractiva.", "La Sentencia SP045-2026 muestra que una investigación técnicamente sólida no debe limitarse a acreditar que hubo minería ilegal en un lugar específico, sino que debe permitir responder con precisión qué se explotó, dónde, cuándo, bajo qué condiciones, con qué medios y quién ejecutó o determinó la actividad ilícita.", "a) Estructura típica e impacto ecosistémico: el artículo 332 del Código Penal sanciona a quien, sin permiso de autoridad competente o en incumplimiento de la normatividad aplicable, explore, extraiga o explote yacimiento minero. La conducta abarca tanto la minería de aluvión (cauces hídricos) como la minería de socavón, que pueden generar impactos severos como la desviación de cauces, la sedimentación masiva y la alteración topográfica irreversible."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Qué debe establecer la investigación", "segs": [0, 1], "obj": "lupa"}, {"label": "Pruebas clave", "segs": [2], "obj": "expediente"}, {"label": "Lo que enseña la SP045-2026", "segs": [3], "obj": "libros"}, {"label": "a) Estructura típica e impacto", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Orientación para la investigación penal", "grupo": null, "titulos_fuente": ["2. Orientación para la investigación penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Qué debe establecer la investigación", "Pruebas clave", "Lo que enseña la SP045-2026", "a) Estructura típica e impacto"], "titulo_genially": "2. Orientación para la investigación penal", "complemento_genially": "", "apartado": "2. Orientación para la investigación penal", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "documento", "carpetas"], "escenario": {"bioma": "campo", "camino": "llano"}, "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido.", "bloques_fuente": [168, 172], "pestana": "Qué establecer y con qué pruebas", "pestanas": [{"layout": "esquema", "segmentos": ["A partir de estos criterios, la investigación de este delito debería orientarse, como mínimo, a establecer los siguientes aspectos:", "Actividad de extracción y beneficio de minerales → lugar exacto de realización → identificación de los responsables de la actividad → ubicación en áreas protegidas o de especial importancia ecológica → identificación del propietario, arrendador o arrendatario del predio → verificación del título minero y la licencia ambiental → forma de ejecución de las actividades → determinación de posibles afectaciones a la salud humana, los recursos naturales o el medio ambiente.", "Para ello, adquieren especial importancia los registros y certificaciones de la autoridad minera y ambiental, la georreferenciación y fijación topográfica, las inspecciones de campo, los informes y conceptos técnicos, los registros fotográficos y audiovisuales, la información sobre títulos y licencias, y los elementos que permitan vincular al investigado con la actividad extractiva.", "La Sentencia SP045-2026 muestra que una investigación técnicamente sólida no debe limitarse a acreditar que hubo minería ilegal en un lugar específico, sino que debe permitir responder con precisión qué se explotó, dónde, cuándo, bajo qué condiciones, con qué medios y quién ejecutó o determinó la actividad ilícita.", "a) Estructura típica e impacto ecosistémico: el artículo 332 del Código Penal sanciona a quien, sin permiso de autoridad competente o en incumplimiento de la normatividad aplicable, explore, extraiga o explote yacimiento minero. La conducta abarca tanto la minería de aluvión (cauces hídricos) como la minería de socavón, que pueden generar impactos severos como la desviación de cauces, la sedimentación masiva y la alteración topográfica irreversible."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Qué debe establecer la investigación", "segs": [0, 1], "obj": "lupa"}, {"label": "Pruebas clave", "segs": [2], "obj": "expediente"}, {"label": "Lo que enseña la SP045-2026", "segs": [3], "obj": "libros"}, {"label": "a) Estructura típica e impacto", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "2. Orientación para la investigación penal", "grupo": null, "titulos_fuente": ["2. Orientación para la investigación penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Qué debe establecer la investigación", "Pruebas clave", "Lo que enseña la SP045-
