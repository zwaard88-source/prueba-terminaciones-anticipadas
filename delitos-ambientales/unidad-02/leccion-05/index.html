icas de afectación", "ilustracion": "ijda-u2-l5-e03.webp", "bloques_fuente": [293, 293], "pestana": "Estrategias típicas"}], "guia": "Abra cada pestaña (A, B, C…) y recorra su contenido."}, {"layout": "esquema", "segmentos": ["La respuesta judicial ante la criminalidad organizada ambiental exige superar el abordaje caso a caso.", "Se requiere el diseño de líneas de investigación estructurales que utilicen la prueba contextual, el análisis de patrones macrodelictivos, la imputación por dominio del hecho en estructuras jerarquizadas y la articulación entre la jurisdicción penal ordinaria y los marcos de justicia transicional."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Superar el caso a caso", "segs": [0], "obj": "documento"}, {"label": "Líneas de investigación estructurales", "segs": [1], "obj": "lupa"}]}], "rotulo": null, "seccion": "3. Metodología de investigación en macrocriminalidad", "grupo": null, "titulos_fuente": ["3. Metodología de investigación en macrocriminalidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Superar el caso a caso", "Líneas de investigación estructurales"], "titulo_genially": "3. Metodología de investigación en macrocriminalidad", "complemento_genially": "", "apartado": "3. Metodología de investigación en macrocriminalidad", "objeto_raiz": "lupa", "objetos_raiz": ["lupa", "expediente", "documento"], "escenario": {"bioma": "campo", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [295, 295]}, {"layout": "linea", "segmentos": ["La investigación de afectaciones ambientales relacionadas con grupos armados organizados requiere identificar posibles conexiones entre hechos que, aunque ocurran en momentos o lugares distintos, podrían responder a una misma dinámica criminal. Para ello, el fiscal puede analizar elementos comunes entre los eventos, tales como la posible participación de los mismos actores, la coincidencia territorial, los patrones de ejecución, las fuentes de financiación, los medios empleados y las relaciones entre los responsables materiales y quienes podrían ejercer funciones de dirección o coordinación.", "En diferentes sectores de una misma región se identifican actividades de extracción ilícita de oro que ocasionan afectaciones a fuentes hídricas y suelos. Aunque los hechos se presentan en predios distintos, la investigación permite advertir posibles coincidencias en las personas que controlan las actividades, los mecanismos de cobro o extorsión, los proveedores de maquinaria y las formas de comercialización del mineral.", "Aspectos por investigar: la identidad de los posibles responsables; los vínculos entre las actividades; la coincidencia de patrones operativos; los flujos financieros; y la posible existencia de una estructura que coordine o se beneficie de estas conductas.", "En distintos tramos de un mismo oleoducto se detectan válvulas ilícitas que ocasionan derrames de hidrocarburos y contaminación de fuentes hídricas y suelos. La repetición de esta modalidad puede justificar el análisis conjunto de los hechos para establecer si existen conexiones entre los responsables, semejanzas en la forma de ejecución, coincidencias temporales o territoriales y posibles relaciones con una estructura criminal.", "Aspectos por investigar: las características y ubicación de las instalaciones ilícitas; la forma de ejecución; la posible coordinación entre los responsables; los patrones temporales y geográficos; y los eventuales vínculos entre estas actividades y las economías ilícitas de una estructura organizada.", "En varias zonas de un parque nacional natural se identifican áreas deforestadas y la instalación de infraestructura presuntamente destinada a facilitar actividades criminales. La investigación puede examinar si existe una relación entre estos hechos a partir de su proximidad geográfica, las características de la intervención, los periodos en que se produjeron y la posible participación de actores comunes.", "Aspectos por investigar: la delimitación de las áreas afectadas; la identificación de patrones de deforestación; la posible conexión con otras actividades ilícitas; la identificación de los beneficiarios de la intervención; y los elementos que permitan establecer eventuales relaciones de coordinación o dirección."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "guia": "Recorra cada momento.", "vineta": [2, 4, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Por qué asociar casos", "segs": [0], "obj": "lupa"}, {"label": "Ejemplo 1. Minería en varios puntos", "segs": [1, 2], "obj": "personas"}, {"label": "Ejemplo 2. Válvulas ilícitas", "segs": [3, 4], "obj": "documento"}, {"label": "Ejemplo 3. Deforestación en un parque", "segs": [5, 6], "obj": "carpetas"}]}], "rotulo": "Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "seccion": "4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "grupo": null, "titulos_fuente": ["4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Por qué asociar casos", "Ejemplo 1. Minería en varios puntos", "Ejemplo 2. Válvulas ilícitas", "Ejemplo 3. Deforestación en un parque"], "titulo_genially": "4. Ejemplos de asociación de casos", "complemento_genially": "", "apartado": "4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "bloques_fuente": [297, 306], "casosAudio": [{"id": "c25a", "titulo": "Ejemplo 1. Extracción ilícita de minerales en varios puntos de un mismo territorio", "url": "../comun/casos/index.html?caso=c25a"}, {"id": "c25b", "titulo": "Ejemplo 2. Instalación de válvulas ilícitas y derrames de hidrocarburos", "url": "../comun/casos/index.html?caso=c25b"}, {"id": "c25c", "titulo": "Ejemplo 3. Deforestación en áreas protegidas para el establecimiento de infraestructura criminal", "url": "../comun/casos/index.html?caso=c25c"}], "lectura": {"href": "documentos/lectura-p04.pdf", "nombre": "Lectura · 4. Ejemplos de asociación de casos.pdf"}}, {"layout": "giro", "segmentos": ["El análisis conjunto de los hechos debe sustentarse en elementos verificables que permitan establecer conexiones relevantes para la investigación. Entre los criterios que pueden examinarse se encuentran:", "Coincidencia de actores: posible participación de las mismas personas o de integrantes de una misma estructura criminal.", "Conexión territorial: hechos ocurridos en una misma zona de influencia o en áreas vinculadas por dinámicas de control territorial.", "Similitud en los patrones de ejecución: coincidencias en los métodos, medios, recursos o procedimientos empleados.", "Conexión temporal: proximidad o continuidad temporal que, junto con otros elementos, pueda indicar una dinámica común.", "Relaciones financieras y logísticas: coincidencias en los beneficiarios, mecanismos de financiación, proveedores o canales de comercialización.", "Posibles vínculos de coordinación o dirección: elementos que permitan investigar si los hechos responden a instrucciones, acuerdos o mecanismos de control atribuibles a integrantes de una estructura organizada.", "La presencia de uno de estos criterios no demuestra por sí sola que los hechos formen parte de una misma estructura o plan criminal. Corresponde al fiscal valorar integralmente los elementos materiales probatorios, la evidencia física y la información legalmente obtenida para formular hipótesis de investigación, establecer las conexiones pertinentes y examinar, cuando haya fundamento para ello, la posible responsabilidad de quienes ejercen funciones de dirección o mando."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [1, 2, 3, 4, 5, 6], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Criterios verificables", "segs": [0, 1], "obj": "lupa"}, {"label": "Conexión territorial", "segs": [2], "obj": "documento"}, {"label": "Patrones de ejecución", "segs": [3], "obj": "escalones"}, {"label": "Conexión temporal", "segs": [4], "obj": "carpetas"}, {"label": "Relaciones financieras y logísticas", "segs": [5], "obj": "documento"}, {"label": "Coordinación o dirección", "segs": [6], "obj": "carpetas"}, {"label": "Un criterio solo no basta", "segs": [7], "obj": "lupa"}]}], "rotulo": null, "seccion": "4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "grupo": "Criterios para analizar la posible asociación de casos", "titulos_fuente": ["4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "Criterios para analizar la posible asociación de casos"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Criterios verificables", "Conexión territorial", "Patrones de ejecución", "Conexión temporal", "Relaciones financieras y logísticas", "Coordinación o dirección", "Un criterio solo no basta"], "titulo_genially": "Criterios para analizar la asociación de casos", "complemento_genially": "", "apartado": "4. Ejemplos de asociación de casos en investigaciones por afectaciones ambientales vinculadas a grupos armados organizados", "bloques_fuente": [308, 312], "mapaMental": {"src": "documentos/mapa-p05.png", "titulo": "Criterios para analizar la asociación de casos"}}], "cuadroAjuste": true}</script>
