dad del preacuerdo", "grupo": null, "titulos_fuente": ["El control de legalidad del preacuerdo"], "encabezados": [], "mediacion": "", "rotulos": ["El control de legalidad del preacuerdo"], "titulo_genially": "El control de legalidad del preacuerdo", "complemento_genially": "", "apartado": "El control de legalidad del preacuerdo", "ilustracion": "norma-competencia.webp", "relleno": "dialogo-autoridades.webp"}, {"layout": "ruta", "segmentos": ["El punto de partida está en los primeros pronunciamientos de la Sala de Casación Penal, en los radicados 21347 y 21954, ambos de 2005, en los cuales se reconoce el carácter vinculante del acuerdo para el juez, pero se establece como límite la protección de las garantías fundamentales.", "Posteriormente, decisiones como los radicados 24531 de 2006, 25300 de 2006 y 25306 de 2008 permiten introducir cuestiones relacionadas con la proporcionalidad de los beneficios, la legalidad de la pena y la imposibilidad de que los errores o actuaciones negligentes de los funcionarios generen derechos sobre acuerdos contrarios al ordenamiento.", "El punto de inflexión estaría en el radicado 34829 de 2011, que permite explicar el tránsito hacia un control material de legalidad, en el cual el juez puede examinar aspectos sustanciales del acuerdo y verificar, entre otros asuntos, que aquello que se negocia sea susceptible de consenso y que no se vulneren garantías fundamentales:", "El examen de los términos del preacuerdo no se limita a la revisión de los requisitos meramente formales, sino que incluye el control de legalidad de lo acordado; es decir, que su función es la de constatar si lo pactado entre el acusador y el imputado o procesado no desconoce garantías fundamentales, o bien si aquello sobre lo que recae es en verdad susceptible de consenso."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Los primeros pronunciamientos (2005)", "segs": [0], "obj": "mazo"}, {"label": "2006 a 2008", "segs": [1], "obj": "mazo"}, {"label": "El punto de inflexión: radicado 34829 de 2011", "segs": [2], "obj": "mazo"}, {"label": "Un control material", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Del control formal al control material", "grupo": null, "titulos_fuente": ["Del control formal al control material"], "encabezados": [], "mediacion": "", "rotulos": ["Del control formal al control material"], "titulo_genially": "Del control formal al control material", "complemento_genially": "", "apartado": "Del control formal al control material", "guia": "Recorra la ruta paso a paso."}, {"layout": "compacta", "segmentos": ["Es por lo anterior por lo que al juez del conocimiento le compete entrar a verificar si existe alguna prohibición, constitucional o legal, que impida celebrar el acuerdo suscrito entre la fiscalía; de evidenciarlo así le asiste el deber de improbar el preacuerdo, pues éste no puede rebasar los límites constitucionales y legales trazados, entre ellos, el principio acusatorio – que le exige observar la separación entre las funciones de acusar y juzgar- y el de imparcialidad.", "Una vez establecido que es imperativo un control material, la pregunta ya no será únicamente qué puede controlar el juez, sino qué debe verificar el fiscal antes de presentar un preacuerdo en sede judicial.", "El control material exige que la acusación consensuada tenga un respaldo probatorio mínimo."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "clave", "n": 0}], "items": [{"label": "Qué verifica el control material", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Qué verifica el control material", "grupo": null, "titulos_fuente": ["Qué verifica el control material"], "encabezados": [], "mediacion": "", "rotulos": ["Qué verifica el control material"], "titulo_genially": "Qué verifica el control material", "complemento_genially": "", "apartado": "Qué verifica el control material", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["verificar que exista una hipótesis fáctica clara, concreta y suficientemente delimitada.", "comprobar que exista un respaldo mínimo que sustente la imputación y la responsabilidad aceptada.", "establecer que la calificación jurídica corresponda a los hechos efectivamente acreditados.", "verificar que el acuerdo mantenga el núcleo fáctico de la imputación/acusación y no introduzca una modificación incompatible con este.", "determinar que aquello que fue acordado sea jurídicamente susceptible de consenso y se encuentre dentro de las facultades de negociación.", "comprobar que el beneficio concedido tenga fundamento legal y respaldo en las circunstancias concretas del caso.", "evaluar que el resultado punitivo derivado del acuerdo sea jurídicamente admisible y guarde correspondencia con la negociación realizada."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3], [4]]}, {"rot": null, "celdas": [[5], [6], [7]]}], "repetidos": [], "columnas": 4}], "items": [{"label": "a. La verificación del juez (1 a 7)", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "1. Hechos jurídicamente relevantes", "segs": [0], "clase": "celda", "obj": "documento"}, {"label": "2. Respaldo probatorio", "segs": [1], "clase": "celda", "obj": "expediente"}, {"label": "3. Adecuación típica", "segs": [2], "clase": "celda", "obj": "libros"}, {"label": "4. Congruencia", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "5. Objeto de negociación", "segs": [4], "clase": "celda", "obj": "carpetas"}, {"label": "6. Beneficio", "segs": [5], "clase": "celda", "obj": "escalones"}, {"label": "7. Proporcionalidad", "segs": [6], "clase": "celda", "obj": "lupa"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "a. La verificación del juez (1 a 7)", "grupo": null, "titulos_fuente": ["a. La verificación del juez (1 a 7)"], "encabezados": [], "mediacion": "", "rotulos": ["a. La verificación del juez (1 a 7)"], "titulo_genially": "a. La verificación del juez (1 a 7)", "complemento_genially": "", "apartado": "a. La verificación del juez (1 a 7)", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["verificar que una misma circunstancia o actuación no haya sido utilizada para reconocer dos veces una ventaja al procesado.", "cuando resulte exigible, comprobar el cumplimiento de las condiciones previstas en el artículo 349 del CPP.", "verificar que las víctimas hayan sido informadas y escuchadas y que sus derechos hayan sido considerados dentro del trámite del preacuerdo.", "comprobar que la aceptación de responsabilidad haya sido libre, consciente, informada y debidamente asesorada.", "identificar si existe alguna restricción legal que limite el beneficio negociado o la procedencia de un subrogado o sustituto penal.", "finalmente, verificar que la consecuencia punitiva acordada corresponda al marco legal aplicable y a la modalidad de negociación utilizada."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}, {"rot": null, "celdas": [[4], [5], [6]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "a. La verificación del juez (8 a 13)", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "8. Ausencia de doble beneficio o de dos rebajas independientes", "segs": [0], "clase": "celda", "obj": "escudo"
