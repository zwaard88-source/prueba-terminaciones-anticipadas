ntadora de la lección", "grupo": null, "titulos_fuente": ["Pregunta orientadora de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Pregunta orientadora de la lección"], "titulo_genially": "Pregunta orientadora de la lección", "complemento_genially": "", "apartado": "Pregunta orientadora de la lección", "ilustracion": "norma-competencia.webp", "relleno": "dialogo-autoridades.webp"}, {"layout": "ruta", "segmentos": ["Esta cuestión es especialmente importante, puesto que las partes pueden celebrar un preacuerdo sobre la responsabilidad y dejar expresamente la dosificación de la pena al juez.", "El artículo 31 del Código Penal establece que, en los eventos de concurso, se parte de la pena correspondiente a la conducta con la sanción más grave y esta puede incrementarse hasta en otro tanto, sin superar los límites legales establecidos.", "La negociación puede involucrar determinadas circunstancias con efectos sobre la punibilidad. Sin embargo, negociar una circunstancia no significa crearla artificialmente.", "determinar los hechos jurídicamente relevantes que sustentan la actuación y que cuentan con respaldo en los elementos disponibles.", "que la ley permita una rebaja “hasta” determinado porcentaje no significa que deba concederse siempre el máximo, la intensidad del beneficio debe estar jurídicamente justificada. Aplicar el sistema de cuartos sobre una pena ya pactada: cuando el objeto del preacuerdo es una pena concreta, no corresponde volver a individualizarla mediante las reglas ordinarias de cuartos."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "a. Fijación de una pena concreta", "segs": [0], "obj": "documento"}, {"label": "b. Los concursos de conductas punibles", "segs": [1], "obj": "carpetas"}, {"label": "c. La negociación no es ficción", "segs": [2], "obj": "escudo"}, {"label": "d. Una metodología de dosificación", "segs": [3], "obj": "escalones"}, {"label": "e. Errores frecuentes", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "Ruta de la lección", "grupo": null, "titulos_fuente": ["Ruta de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Ruta de la lección"], "titulo_genially": "Ruta de la lección", "complemento_genially": "", "apartado": "Ruta de la lección", "guia": "Recorra la ruta paso a paso."}, {"layout": "ruta", "segmentos": ["La pena legalmente prevista, como el marco abstracto establecido por el legislador para la conducta punible, teniendo en cuenta las modificaciones que correspondan por circunstancias específicas del delito, formas de participación, dispositivos amplificadores y demás reglas legales.", "La pena individualizada, la que resultaría de aplicar las reglas ordinarias de individualización previstas en los artículos 60 y 61 del Código Penal. El artículo 60 establece las reglas para determinar los límites mínimo y máximo aplicables cuando existen circunstancias que modifican esos extremos, mientras que el artículo 61 regula la división del ámbito punitivo en cuartos y los criterios que debe considerar el juez para determinar la pena concreta.", "La pena negociada, aquella que puede resultar del consenso entre Fiscalía y defensa cuando la modalidad de preacuerdo permite que la consecuencia punitiva sea objeto de negociación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "1. La pena legalmente prevista", "segs": [0], "obj": "libros"}, {"label": "2. La pena individualizada", "segs": [1], "obj": "balanza"}, {"label": "3. La pena negociada", "segs": [2], "obj": "personas"}]}], "rotulo": null, "seccion": "Tres momentos de la pena", "grupo": null, "titulos_fuente": ["Tres momentos de la pena"], "encabezados": [], "mediacion": "", "rotulos": ["Tres momentos de la pena"], "titulo_genially": "Tres momentos de la pena", "complemento_genially": "", "apartado": "Tres momentos de la pena", "guia": "Recorra la ruta paso a paso."}, {"layout": "esquema", "segmentos": ["el procesado acepta los cargos de manera libre, consciente, voluntaria e informada, sin que exista una negociación con la Fiscalía. En este caso, el beneficio corresponde a la rebaja legalmente prevista para la oportunidad procesal en que se produce la aceptación.", "las partes acuerdan una determinada consecuencia favorable para el procesado a cambio de su aceptación de responsabilidad, dentro de los límites legales y jurisprudenciales aplicables.", "las partes acuerdan la pena que habrá de imponerse, sin perjuicio del control judicial correspondiente y de la verificación de los requisitos legales para su determinación.", "las partes acuerdan los términos de la aceptación y el beneficio, pero dejan para una etapa posterior la determinación concreta de la pena conforme a las reglas de individualización aplicables.", "la negociación puede involucrar la eliminación de un cargo, la supresión de una circunstancia de agravación o una modificación jurídicamente admisible de la calificación, cuando ello constituya la base del beneficio acordado.", "Preacuerdo con utilización de una determinada calificación jurídica exclusivamente para efectos punitivos: los hechos y la responsabilidad aceptados permanecen incólumes, pero las partes toman como referencia una calificación jurídica menos gravosa exclusivamente para determinar la consecuencia punitiva, sin que ello implique necesariamente modificar la imputación fáctica ni la responsabilidad sustancial reconocida.", "un mismo acuerdo puede incorporar más de una de estas modalidades, siempre que cada una se encuentre jurídicamente justificada, sea compatible con las demás y permita identificar con precisión cuál es la concesión realizada por la Fiscalía y cuál es su efecto sobre la determinación de la pena."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Aceptación unilateral de cargos", "segs": [0], "obj": "documento"}, {"label": "Preacuerdo en el que se pacta un beneficio punitivo", "segs": [1], "obj": "balanza"}, {"label": "Preacuerdo en el que se pacta una pena concreta", "segs": [2], "obj": "mazo"}, {"label": "Preacuerdo en el que se difiere la dosificación punitiva", "segs": [3], "obj": "reloj"}, {"label": "Preacuerdo mediante modificación de la imputación o acusación", "segs": [4], "obj": "libros"}, {"label": "Preacuerdo con utilización de una determinada calificación j", "segs": [5], "obj": "lupa"}, {"label": "Combinación de mecanismos", "segs": [6], "obj": "escalones"}]}], "rotulo": null, "seccion": "Las modalidades de negociación", "grupo": null, "titulos_fuente": ["Las modalidades de negociación"], "encabezados": [], "mediacion": "", "rotulos": ["Las modalidades de negociación"], "titulo_genially": "Las modalidades de negociación", "complemento_genially": "", "apartado": "Las modalidades de negociación", "guia": "Recorra el mapa conceptual.", "objeto_raiz": "personas", "objetos_raiz": ["personas", "personas", "documento"], "descarga": {"href": "documentos/mapa.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Las modalidades de negociación (imagen PNG)", "lamina": true}}, {"layout": "compacta", "segmentos": ["La identificación de la modalidad utilizada permite establecer con precisión qué se está negociando, cuál es la contraprestación, sobre qué magnitud se aplica el beneficio y cuál será el efecto de la negociación sobre la pena finalmente impuesta.", "La primera regla práctica entonces es que, antes de calcular la rebaja, se determine exactamente qué se está negociando, ya que primero se determina el objeto del convenio y después se calcula el beneficio.", "Uno de los errores más frecuentes consiste en comenzar la negociación preguntando simplemente qué porcentaje de rebaja se puede ofrecer y ese enfoque es metodológicamente incorrecto. El análisis debería seguir, como mínimo, este orden: hechos, cargos, responsabilidad aceptada, modalidad de preacuerdo, marco punitivo, circunstancias modificadoras, pena de referencia, beneficio negociado, pena final y consecuencias accesorias o subrogados."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "Primero qué se negocia; después cuánto", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Primero qué se negocia; después cuánto", "grupo": null, "titulos_fuente": ["Primero qué se negocia; después cuánto"], "encabezados": [], "mediacion": "", "rotulos": ["Primero qué se negocia; después cuánto"], "titulo_genially": "Primero qué se negocia; después cuánto", "complemento_genially": "", "apartado": "Primero qué se negocia; después cuánto", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["Carlos, funcionario público, es imputado por haber intervenido en la adjudicación irregular de un contrato estatal a cambio de recibir un beneficio económico. La Fiscalía cuenta con elementos probatorios que respaldan la conducta, la participación de Carlos y la existencia del beneficio. Durante la negociación, la defensa manifiesta la intención de aceptar responsabilidad, pero solicita una reducción importante de la consecuencia punitiva. Primero, la Fiscalía debe determinar la pena legalmente prevista. Antes de hablar de porcentajes de rebaja, debe establecer cuál es el delito aplicable, cuál es su marco punitivo y si existen circunstancias que modifiquen sus límites. También debe verificar la forma de participación, los agravantes o atenuantes legalmente procedentes y si existe concurso con otras conductas. Después debe establecer cuál sería la pena individualizada. Una vez definido el marco aplicable, la Fiscalía debe determinar cuál sería la pena que correspondería en un escenario ordinario, aplicando las reglas de los artículos 60 y 61 del Código Penal. Esto permite contar con una pena de referencia antes de entrar propiamente a la negociación. Solo entonces debe determinarse qué se está negociando. La defensa propone inicialmente una reducción del 50 % de la pena. Sin embargo, la Fiscalía advierte que esa propuesta no puede analizarse simplemente como “50 % de descuento”, porque primero debe det erminarse cuál es el objeto del acuerdo. Las partes podrían estar negociando, por ejemplo, la aceptación de los cargos tal como fueron formulados, la eliminación de un agravante, la eliminación de un cargo, una determinada adecuación jurídica para efectos punitivos o directamente una pena concreta. Cada modalidad tiene consecuencias diferentes. La Fiscalía formula entonces una propuesta jurídicamente estructurada. Supongamos que, para este caso, se está formulando cargos por el delito de interés indebido en la celebración de contratos después de realizar la dosificación ordinaria, la pena de referencia sería de 64 meses. La Fiscalía y la defensa acuerdan una modalidad de preacuerdo en la que se mantiene la conducta delictiva, pero se negocia una consecuencia punitiva concreta de 48 meses. En este escenario, la discusión no consiste simplemente en “qué porcentaje de descuento darle al procesado”, sino en establecer si la pena acordada tiene fundamento en el mecanismo de negociación utilizado, respeta los límites legales y puede ser justificada ante el juez. Finalmente, debe verificarse la pena negociada y sus consecuencias. El fiscal debe comprobar que la pena acordada sea coherente con el contenido del preacuerdo, que el beneficio otorgado tenga una contraprestación procesal o sustancial legítima, que no se hayan creado artificialmente circunstancias para disminuir la pena y que la consecuencia final pueda superar el control judicial. Además, debe analizar separadamente si proceden subrogados o sustitutos de la pena, pues la pena negociada no determina automáticamente la procedencia de estos.", "En el marco del anterior proceso descrito, el fiscal debería preguntarse:\n• ¿La Fiscalía debería comenzar la negociación estableciendo el porcentaje de rebaja a ofrecer?\n• ¿Cuál es la diferencia entre la pena legalmente prevista, la pena individualizada y la pena negociada?\n• Si la defensa propone una rebaja del 50 %, ¿qué debería determinar primero la Fiscalía antes de calcular si esa rebaja es jurídicamente posible?\n• ¿Por qué no es lo mismo negociar una pena concreta que eliminar un agravante, eliminar un cargo o utilizar una determinada calificación jurídica para efectos punitivos?", "El caso permite comprender que la dosificación punitiva en los preacuerdos debe partir de una metodología ordenada y no de la negociación anticipada de un porcentaje de reducción. El fiscal debe construir primero una pena de referencia, identificar con precisión el objeto de la negociación y justificar jurídicamente la consecuencia punitiva acordada.", "Antes de formular o aceptar una propuesta, el fiscal debe establecer la pena legalmente prevista, identificar el marco punitivo aplicable y verificar las circunstancias que puedan modificarlo, como los agravantes, atenuantes, la forma de participación y los concursos de conductas punibles. Posteriormente, debe individualizar la pena conforme a las reglas de los artículos 60 y 61 del Código Penal, para determinar cuál sería la consecuencia punitiva en un escenario ordinario. Solo entonces puede identificar qué aspecto será objeto de negociación y cuál es el beneficio que puede concederse dentro de los límites legales. En el ejemplo, si la pena individualizada es de 64 meses y las partes acuerdan una pena concreta de 48 meses, el fiscal no debe limitarse a presentar la diferencia como un porcentaje de descuento, sino explicar cuál es el fundamento jurídico de esa reducción, qué contraprestación recibe la administración de justicia y por qué la pena acordada resulta admisible.", "Una buena práctica consiste en distinguir claramente entre la negociación de una pena concreta, la eliminación de un agravante, la supresión de un cargo o la utilización de una calificación jurídica exclusivamente para efectos punitivos, pues cada modalidad tiene presupuestos y consecuencias diferentes. Finalmente, el fiscal debe comprobar que la pena negociada corresponda a la modalidad de preacuerdo utilizada, que no se hayan introducido circunstancias artificiales para disminuirla y que los beneficios acordados puedan superar el control judicial. También debe examinar separadamente la procedencia de los subrogados y sustitutos penales, sin asumir que la reducción de la pena determina automáticamente su concesión."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3], [4]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Veamos un ejemplo: Carlos y la adjudicación del contrato", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Carlos y la adjudicación del contrato", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Carlos y la adjudicación del contrato"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Carlos y la adjudicación del contrato"], "titulo_genially": "Veamos un ejemplo: Carlos y la adjudicación del contrato", "complemento_genially": "", "apartado": "Veamos un ejemplo: Carlos y la adjudicación del contrato", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "compacta", "segmentos": ["La justicia penal consensuada no supone que toda aceptación de responsabilidad deba recibir automáticamente el máximo beneficio disponible. El procesado no tiene derecho a la rebaja máxima, tiene derecho a que su aceptación sea valorada dentro del régimen legal de beneficios.", "No obstante, debe evitarse un error importante: la gravedad intrínseca del delito no puede utilizarse mecánicamente para convertir la rebaja premial en una segunda dosificación de la pena.", "En otras palabras, la gravedad del delito ayuda a determinar la pena; la utilidad y las circunstancias de la aceptación ayudan a determinar el alcance del beneficio premial. Esta separación conceptual resulta esencial para evitar una doble valoración."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "alerta", "n": 0}, {"t": "p", "s": [2], "c": "regla", "n": 0}], "items": [{"label": "La gravedad del delito no se valora dos veces", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "La gravedad del delito no se valora dos veces", "grupo": null, "titulos_fuente": ["La gravedad del delito no se valora dos veces"], "encabezados": [], "mediacion": "", "rotulos": ["La gravedad del delito no se valora dos veces"], "titulo_genially": "La gravedad del delito no se valora dos veces", "complemento_genially": "", "apartado": "La gravedad del delito no se valora dos veces", "guia": "Lea el contenido."}, {"layout": "compara", "segmentos": ["Desde la imputación hasta antes de la acusación: El artículo 351 del CPP establece que la aceptación de los cargos determinados en la formulación de imputación puede comportar una rebaja hasta de la mitad de la pena imponible. La norma utiliza la expresión “hasta”, por lo que no establece que toda aceptación deba recibir automáticamente una reducción del 50 %. Esto permite hablar de un margen de calibración. Por ejemplo, si la pena de referencia fuera de 100 meses, el marco máximo teórico del beneficio sería: pena: 100 meses; beneficio máximo: 50 meses; pena resultante: 50 meses. Pero el fiscal no está obligado, por ese solo hecho, a conceder 50 meses de descuento. Podría pactar una reducción menor si existen razones jurídicas y político-criminales que la justifiquen.", "Después de presentada la acusación: El artículo 352 del CPP permite los preacuerdos posteriores a la presentación de la acusación y establece una reducción de una tercera parte de la pena imponible."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Desde la imputación hasta antes de la acusación", "segs": [0], "obj": "reloj", "ilus": "norma-competencia.webp"}, {"label": "Después de presentada la acusación", "segs": [1], "obj": "tribunal", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "El momento procesal y el beneficio", "grupo": null, "titulos_fuente": ["El momento procesal y el beneficio"], "encabezados": [], "mediacion": "", "rotulos": ["El momento procesal y el beneficio"], "titulo_genially": "El momento procesal y el beneficio", "complemento_genially": "", "apartado": "El momento procesal y el beneficio", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["Esta cuestión es especialmente importante, puesto que las partes pueden celebrar un preacuerdo sobre la responsabilidad y dejar expresamente la dosificación de la pena al juez. En ese escenario, no existe una pena concreta que vincule al juez.", "(...) Sea del caso reiterar, por tratarse de un tema transversal a los abordados en la presente decisión, que la dosificación de la pena no fue objeto del preacuerdo, sino que las partes consignaron que le correspondía efectuarlo a la autoridad judicial de conocimiento en el ejercicio de su discrecionalidad (Sentencia SP-2491-2024 (Rad. 62354 ) ).", "Esto significa que el fiscal debe distinguir cuidadosamente entre la aceptación de responsabilidad que se da en el marco de determinada pena a imponer y la aceptación que deja la pena a la individualización judicial. Son preacuerdos jurídicamente distintos y producen consecuencias diferentes."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "regla", "n": 0}], "items": [{"label": "a. Fijación de una pena concreta en el preacuerdo", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "a. Fijación de una pena concreta en el preacuerdo", "grupo": null, "titulos_fuente": ["a. Fijación de una pena concreta en el preacuerdo"], "encabezados": [], "mediacion": "", "rotulos": ["a. Fijación de una pena concreta en el preacuerdo"], "titulo_genially": "a. Fijación de una pena concreta en el preacuerdo", "complemento_genially": "", "apartado": "a. Fijación de una pena concreta en el preacuerdo", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["El artículo 31 del Código Penal establece que, en los eventos de concurso, se parte de la pena correspondiente a la conducta con la sanción más grave y esta puede incrementarse hasta en otro tanto, sin superar los límites legales establecidos.", "Se debe entonces individualizar cada conducta y cada delito debe contar con su propia determinación punitiva. Con posterioridad a ello si se debe determinar el incremento por las demás conductas de manera proporcional y motivada, dentro de los límites del Código Penal, donde una metodología de cálculo proporcional puede ser útil para evitar incrementos arbitrarios.", "La regla de “hasta en otro tanto” no significa que siempre deba adicionarse otro tanto completo, pues se trata de un máximo, no de una obligación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "b. Los concursos de conductas punibles", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "b. Los concursos de conductas punibles", "grupo": null, "titulos_fuente": ["b. Los concursos de conductas punibles"], "encabezados": [], "mediacion": "", "rotulos": ["b. Los concursos de conductas punibles"], "titulo_genially": "b. Los concursos de conductas punibles", "complemento_genially": "", "apartado": "b. Los concursos de conductas punibles", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["En virtud de un acuerdo no es posible asignarle a los hechos una calificación jurídica que no corresponda, como, por ejemplo, cuando se pretende darle el carácter de cómplice a quien claramente es autor, o reconocer una circunstancia de menor punibilidad s in ninguna base fáctica”, salvo en aquellos casos en los que se toma como “referencia una calificación jurídica con el único fin de establecer el monto de la pena”.", "El fiscal puede negociar dentro del derecho, pero no puede negociar contra los hechos.", "Si una atenuante no tiene ningún respaldo en la información disponible en la actuación, su reconocimiento como mecanismo puramente artificial para producir una rebaja puede comprometer la legalidad del acuerdo."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "c. La negociación no es ficción", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "c. La negociación no es ficción", "grupo": null, "titulos_fuente": ["c. La negociación no es ficción"], "encabezados": [], "mediacion": "", "rotulos": ["c. La negociación no es ficción"], "titulo_genially": "c. La negociación no es ficción", "complemento_genially": "", "apartado": "c. La negociación no es ficción", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["De esta forma, uno de los aspectos más sofisticados de la dosificación mediante preacuerdos es la posibilidad de utilizar una determinada calificación exclusivamente para efectos punitivos, manteniendo la responsabilidad por el delito realmente cometido. Así, existe una diferencia fundamental entre cambiar artificialmente la responsabilidad y mantener la responsabilidad real y utilizar una referencia punitiva diferente.", "(...) Si bien las partes pueden utilizar como herramienta de negociación una calificación jurídica diversa a la que legalmente correspondiente, ello ha de verse reflejado, en estricto sentido, en la imposición de la sanción penal o fijación de la condena, donde se concreta el beneficio, pero no en la declaratoria de responsabilidad penal (Sentencia SP-670-2025 (Rad. 59449)).", "La primera alternativa es problemática cuando no corresponde con los hechos o con la intervención realmente acreditada, mientras que la segunda puede ser jurídicamente admisible cuando la ficción se utiliza exclusivamente para efectos de punibilidad y dentro del marco permitido por el sistema de preacuerdos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "Calificación para efectos punitivos: qué se puede y qué no", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Calificación para efectos punitivos: qué se puede y qué no", "grupo": null, "titulos_fuente": ["Calificación para efectos punitivos: qué se puede y qué no"], "encabezados": [], "mediacion": "", "rotulos": ["Calificación para efectos punitivos: qué se puede y qué no"], "titulo_genially": "Calificación para efectos punitivos: qué se puede y qué no", "complemento_genially": "", "apartado": "Calificación para efectos punitivos: qué se puede y qué no", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["Con base en el anterior contexto, el fiscal podría preguntarse:", "¿Por qué la Fiscalía no puede aceptar que Julián sea condenado como cómplice si los hechos y las pruebas demuestran que actuó como coautor?", "¿Cuál es la diferencia entre modificar artificialmente la responsabilidad y utilizar una calificación jurídica diferente exclusivamente para efectos punitivos?", "Si no existe ningún respaldo fáctico o probatorio de una situación de ira o intenso dolor, ¿puede incorporarse esa circunstancia al preacuerdo simplemente para reducir la pena?"], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "lista", "s": [1, 2, 3], "n": [0, 0, 0]}], "items": [{"label": "Veamos un ejemplo: Coautoría, complicidad y subrogados", "segs": [0, 1, 2, 3], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Coautoría, complicidad y subrogados", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Coautoría, complicidad y subrogados"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Coautoría, complicidad y subrogados"], "titulo_genially": "Veamos un ejemplo: Coautoría, complicidad y subrogados", "complemento_genially": "", "apartado": "Veamos un ejemplo: Coautoría, complicidad y subrogados", "guia": "Vea el caso y piense en las preguntas antes de pasar al análisis.", "video": {"src": "../comun/videos/c03.mp4", "vtt": "../comun/videos/c03.vtt", "poster": "../comun/videos/c03.jpg", "titulo": "Caso: Coautoría, complicidad y subrogados"}}, {"layout": "compacta", "segmentos": ["El caso permite comprender que la negociación de un preacuerdo no autoriza a modificar artificialmente la responsabilidad penal ni a incorporar circunstancias de atenuación que carezcan de respaldo en los hechos y elementos de conocimiento. En el ejemplo, aunque la defensa propone que Julián sea condenado como cómplice, la Fiscalía debe mantener la atribución de coautoría si esa es la forma de participación que se desprende de los hechos acreditados. Sin embargo, puede explorar la utilización de una calificación jurídica diferente exclusivamente para efectos punitivos, siempre que el acuerdo distinga expresamente la responsabilidad que se reconoce de la referencia utilizada para determinar la pena y respete los límites legales y jurisprudenciales.", "El fiscal debe verificar que la forma de participación atribuida corresponda a los hechos acreditados y que cualquier circunstancia de atenuación invocada tenga fundamento fáctico y probatorio. En ese sentido, no resulta admisible reconocer una situación de ira e intenso dolor únicamente para obtener una reducción punitiva cuando no existen elementos que permitan sustentarla. Asimismo, debe distinguir entre la responsabilidad penal que se reconoce y la calificación jurídica que eventualmente puede utilizarse como referencia exclusivamente para determinar la pena. También debe examinar separadamente los efectos de esa referencia punitiva y los requisitos para acceder a subrogados o sustitutos penales.", "Una buena práctica consiste en delimitar con precisión los hechos aceptados, mantener la coherencia entre estos y la responsabilidad atribuida, identificar qué aspectos pueden negociarse para determinar la consecuencia punitiva y dejar expresamente establecido el alcance de cualquier referencia jurídica más favorable. Finalmente, el fiscal debe diferenciar los efectos de esa referencia punitiva de los requisitos para acceder a subrogados o sustitutos penales, cuya procedencia debe examinarse de manera independiente, atendiendo a las condiciones legales y jurisprudenciales aplicables y sin asumir que la calificación utilizada para dosificar la pena se extiende automáticamente a los demás efectos de la condena."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Análisis del caso: Coautoría, complicidad y subrogados", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "¿Qué permite comprender esta situación?", "segs": [0], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [1], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [2], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Análisis del caso: Coautoría, complicidad y subrogados", "grupo": null, "titulos_fuente": ["Análisis del caso: Coautoría, complicidad y subrogados"], "encabezados": [], "mediacion": "", "rotulos": ["Análisis del caso: Coautoría, complicidad y subrogados"], "titulo_genially": "Análisis del caso: Coautoría, complicidad y subrogados", "complemento_genially": "", "apartado": "Análisis del caso: Coautoría, complicidad y subrogados", "guia": "Abra cada pregunta para leer el análisis.", "ilustracion": "dialogo-autoridades.webp"}, {"layout": "compacta", "segmentos": ["No todo lo matemáticamente posible es admisible. La existencia de un margen legal de negociación no significa que cualquier resultado alcanzable sea necesariamente legítimo.", "Por ello, el fiscal debe formularse tres preguntas: ¿el beneficio tiene fundamento jurídico?, ¿el beneficio tiene fundamento fáctico y probatorio? y ¿el resultado es proporcional frente al estándar de respuesta penal que correspondería en el trámite ordinario?", "Otro problema frecuente consiste en conceder dos beneficios que, en realidad, compensan exactamente la misma circunstancia.", "La doble rebaja por el mismo hecho debe evitarse a toda costa."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}, {"t": "p", "s": [3], "c": "", "n": 0}], "items": [{"label": "No todo lo matemáticamente posible es admisible", "segs": [0, 1, 2, 3], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "No todo lo matemáticamente posible es admisible", "grupo": null, "titulos_fuente": ["No todo lo matemáticamente posible es admisible"], "encabezados": [], "mediacion": "", "rotulos": ["No todo lo matemáticamente posible es admisible"], "titulo_genially": "No todo lo matemáticamente posible es admisible", "complemento_genially": "", "apartado": "No todo lo matemáticamente posible es admisible", "guia": "Lea el contenido."}, {"layout": "ruta", "segmentos": ["determinar los hechos jurídicamente relevantes que sustentan la actuación y que cuentan con respaldo en los elementos disponibles.", "de conformidad con el artículo 381 del CPP, deben de coexistir la responsabilidad penal y la materialización de la conducta delictiva para precisar la autoría o participación, el grado de intervención, las circunstancias relevantes, el concurso de conductas, los agravantes y atenuantes y los delitos efectivamente imputados.", "establecer los límites mínimo y máximo de la pena, las modificaciones legales, las circunstancias que alteren esos límites y las reglas especiales aplicables, conforme a las reglas ordinarias de individualización de los artículos 55, 58, 60 y 61 del Código Penal.", "si se trata de una aceptación unilateral, deberá de tramitarse por la vía del allanamiento a cargo, mientras que un preacuerdo sobre la responsabilidad sí implica una modalidad de negociación, donde se puede dar la eliminación de un agravante o cargo, el uso de una ficción exclusivamente punitiva o el pacto de una pena concreta."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "1. Fijar la realidad fáctica", "segs": [0], "obj": "documento"}, {"label": "2. Determinar los requisitos para condenar", "segs": [1], "obj": "balanza"}, {"label": "3. Determinar el marco punitivo", "segs": [2], "obj": "mazo"}, {"label": "4. Identificar la modalidad de negociación", "segs": [3], "obj": "reloj"}]}], "rotulo": null, "seccion": "d. Una metodología de dosificación (1 a 4)", "grupo": null, "titulos_fuente": ["d. Una metodología de dosificación (1 a 4)"], "encabezados": [], "mediacion": "", "rotulos": ["d. Una metodología de dosificación (1 a 4)"], "titulo_genially": "d. Una metodología de dosificación (1 a 4)", "complemento_genially": "", "apartado": "d. Una metodología de dosificación (1 a 4)", "guia": "Recorra la ruta paso a paso."}, {"layout": "ruta", "segmentos": ["establecer la pena que correspondería mediante las reglas ordinarias de individualización o, cuando las partes puedan pactarla, determinar la pena concreta dentro de los límites jurídicos de la negociación.", "verificar las reglas relativas a prohibiciones o restricciones de beneficios, concurso, circunstancias específicas, prohibición de doble valoración y demás reglas especiales de política criminal.", "determinar la intensidad del beneficio, su porcentaje y la base sobre la cual se aplica, teniendo en cuenta el momento procesal y la justificación de la concesión realizada.", "antes de presentar el preacuerdo, verificar su legalidad, proporcionalidad, respaldo probatorio y coherencia entre hechos, cargos y pena; así como los derechos de las víctimas, la ausencia de dobles beneficios o valoraciones y los efectos sobre subrogados, sustitutos y penas accesorias."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "5. Determinar la pena de referencia", "segs": [0], "obj": "libros"}, {"label": "6. Aplicar las restricciones especiales", "segs": [1], "obj": "lupa"}, {"label": "7. Calcular el beneficio", "segs": [2], "obj": "escalones"}, {"label": "8. Realizar un control de legalidad preventivo", "segs": [3], "obj": "escudo"}]}], "rotulo": null, "seccion": "d. Una metodología de dosificación (5 a 8)", "grupo": null, "titulos_fuente": ["d. Una metodología de dosificación (5 a 8)"], "encabezados": [], "mediacion": "", "rotulos": ["d. Una metodología de dosificación (5 a 8)"], "titulo_genially": "d. Una metodología de dosificación (5 a 8)", "complemento_genially": "", "apartado": "d. Una metodología de dosificación (5 a 8)", "guia": "Recorra la ruta paso a paso."}, {"layout": "rejilla", "segmentos": ["que la ley permita una rebaja “hasta” determinado porcentaje no significa que deba concederse siempre el máximo, la intensidad del beneficio debe estar jurídicamente justificada. Aplicar el sistema de cuartos sobre una pena ya pactada: cuando el objeto del preacuerdo es una pena concreta, no corresponde volver a individualizarla mediante las reglas ordinarias de cuartos.", "la eliminación negociada de una circunstancia de agravación debe mantenerse dentro de las posibilidades legales y no puede utilizarse para alterar arbitrariamente la responsabilidad.", "toda circunstancia con efectos sobre la punibilidad debe contar con respaldo fáctico y probatorio suficiente, no puede incorporarse únicamente para obtener una reducción de pena.", "debe evitarse que un mismo hecho o circunstancia produzca reiteradamente efectos favorables o desfavorables sobre la pena.", "una referencia jurídica más favorable puede utilizarse exclusivamente para efectos de punibilidad, pero no para afirmar una forma de participación o una realidad fáctica que no corresponde.", "la pena negociada y los demás efectos jurídicos de la condena deben analizarse separadamente, pues no necesariamente se determinan a partir de la misma referencia.", "Antes de definir el beneficio, debe verificarse si el caso está sometido a un régimen especial que limite o reduzca las posibilidades de negociación.", "la legalidad de un beneficio no depende solo de su porcentaje individual, deben analizarse conjuntamente todos los beneficios concedidos para evitar que su acumulación produzca un resultado desproporcionado."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "Aplicar automáticamente la rebaja máxima", "segs": [0], "obj": "documento", "ilus": "norma-competencia.webp"}, {"label": "Eliminar artificialmente una agravante", "segs": [1], "obj": "balanza", "ilus": "radicacion-terminos.webp"}, {"label": "Inventar circunstancias atenuantes", "segs": [2], "obj": "mazo", "ilus": "dialogo-autoridades.webp"}, {"label": "Valorar dos veces una misma circunstancia", "segs": [3], "obj": "reloj", "ilus": "comunidad-interes-general.webp"}, {"label": "Confundir ficción punitiva con cambio de responsabilidad", "segs": [4], "obj": "libros", "ilus": "norma-competencia.webp"}, {"label": "Extender automáticamente la ficción a los subrogados", "segs": [5], "obj": "lupa", "ilus": "radicacion-terminos.webp"}, {"label": "Régimen especial", "segs": [6], "obj": "escalones", "ilus": "dialogo-autoridades.webp"}, {"label": "Mirar únicamente el porcentaje de rebaja", "segs": [7], "obj": "escudo", "ilus": "comunidad-interes-general.webp"}]}], "rotulo": null, "seccion": "e. Errores frecuentes en la dosificación", "grupo": null, "titulos_fuente": ["e. Errores frecuentes en la dosificación"], "encabezados": [], "mediacion": "", "rotulos": ["e. Errores frecuentes en la dosificación"], "titulo_genially": "e. Errores frecuentes en la dosificación", "complemento_genially": "", "apartado": "e. Errores frecuentes en la dosificación", "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "compacta", "segmentos": ["La Fiscalía imputa a Carlos un delito cuya pena abstracta está comprendida entre 80 y 160 meses de prisión. En el caso no existen circunstancias que modifiquen esos límites, no hay concurso de conductas punibles. Antes de la presentación del escrito de acusación, Carlos manifiesta su voluntad de aceptar responsabilidad. Después de la negociación, Fiscalía y defensa pactan que la pena que se propondrá al juez será de 90 meses de prisión. Al momento de preparar el acuerdo, el fiscal debe determinar cuál habría sido la pena resultante de la individualización ordinaria, identificar la modalidad de negociación utilizada y establecer si corresponde aplicar el sistema de cuartos o si este resulta desplazado por la pena concreta acordada. También debe verificar la legalidad de la pena negociada y la forma en que se llegó a ella.", "Para verificar este proceso, el fiscal debería preguntarse:\n• ¿Cuál es el marco punitivo aplicable y cuál sería la pena de referencia en una dosificación ordinaria?\n• ¿Qué modalidad de negociación se está utilizando al acordar directamente una pena de 90 meses?\n• Si las partes pactaron una pena concreta, ¿corresponde que el juez vuelva a individualizar esos 90 meses mediante el sistema de cuartos?\n• ¿Qué aspectos debería verificar el fiscal para establecer que los 90 meses acordados son jurídicamente admisibles?\n• ¿Qué cambiaría si las partes acordaran la responsabilidad, pero dejaran expresamente la determinación de la pena a cargo del juez?", "El caso permite comprender que la dosificación punitiva en los preacuerdos depende de la modalidad de negociación utilizada y que no siempre corresponde aplicar el mismo procedimiento para determinar la pena. En el ejemplo, el fiscal debe partir del marco punitivo de 80 a 160 meses, establecer cuál sería la pena resultante de una individualización ordinaria y, posteriormente, identificar el alcance del acuerdo celebrado entre las partes.", "El fiscal debe distinguir entre dos modalidades de negociación. Si Fiscalía y defensa pactan directamente una pena concreta de 90 meses, debe verificar que esa consecuencia punitiva tenga fundamento en la modalidad de negociación utilizada, respete los límites legales y corresponda a una concesión jurídicamente admisible. En cambio, si las partes acuerdan la aceptación de responsabilidad, pero dejan la determinación de la pena a cargo del juez, la individualización judicial debe realizarse conforme a las reglas ordinarias de dosificación, incluido el sistema de cuartos cuando corresponda.", "Una buena práctica consiste en identificar expresamente qué aspecto de la consecuencia punitiva se está negociando, documentar la metodología utilizada para establecer la pena acordada y evitar que el juez tenga que reconstruir una dosificación que las partes ya determinaron mediante el acuerdo. Asimismo, el fiscal debe explicar por qué la pena concreta resulta jurídicamente admisible y cómo se relaciona con la contraprestación obtenida."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3], [4]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Veamos un ejemplo: Carlos y la pena concreta de 90 meses", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Carlos y la pena concreta de 90 meses", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Carlos y la pena concreta de 90 meses"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Carlos y la pena concreta de 90 meses"], "titulo_genially": "Veamos un ejemplo: Carlos y la pena concreta de 90 meses", "complemento_genially": "", "apartado": "Veamos un ejemplo: Carlos y la pena concreta de 90 meses", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "compacta", "segmentos": ["No se negocia primero la cifra para después buscar una justificación, se construye primero la justificación fáctica y jurídica (incluyendo la punitiva) que permita determinar una cifra negociable y defendible.", "Debe determinar primero la estructura jurídica del caso, establecer el marco punitivo, identificar la modalidad de negociación, definir qué puede ser objeto de acuerdo, aplicar las reglas especiales correspondientes y verificar que el resultado sea proporcional y jurídicamente defendible."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Cierre de la lección", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Cierre de la lección", "grupo": null, "titulos_fuente": ["Cierre de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Cierre de la lección"], "titulo_genially": "Cierre de la lección", "complemento_genially": "", "apartado": "Cierre de la lección", "guia": "Lea el contenido.", "ilustracion": "comunidad-interes-general.webp"}]}</script>
