<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "ta-juego-u4-l1", "niveles": ["Observador", "Investigador", "Fiscal en formación", "Referente en terminaciones"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ta", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 4 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 4, "lesson": 1, "heading": "Lección 4.1. Marco normativo y jurisprudencial, finalidades y límites de los preacuerdos", "scenes": [{"layout": "compacta", "segmentos": ["Precisamente en este punto surge uno de los principales problemas que orientará el desarrollo de la Unidad: ¿cómo negociar una solución jurídicamente válida, provechosa y sostenible?", "4.1. Marco normativo, finalidades y límites", "4.2. Técnicas de negociación", "4.3. Dosificación punitiva", "4.4. Control de legalidad"], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "sub", "x": "Las cuatro lecciones de la unidad"}, {"t": "lista", "s": [1, 2, 3, 4], "n": [0, 0, 0, 0]}], "items": [{"label": "Introducción a la unidad 4", "segs": [0, 1, 2, 3, 4], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Introducción a la unidad 4", "grupo": null, "titulos_fuente": ["Introducción a la unidad 4"], "encabezados": [], "mediacion": "", "rotulos": ["Introducción a la unidad 4"], "titulo_genially": "Introducción a la unidad 4", "complemento_genially": "", "apartado": "Introducción a la unidad 4", "guia": "Vea el video de introducción a la unidad.", "video": {"src": "../comun/videos/u4_inicio.mp4", "vtt": "../comun/videos/u4_inicio.vtt", "poster": "../comun/videos/u4_inicio.jpg", "titulo": "Introducción a la unidad 4"}}, {"layout": "lamina", "segmentos": ["En este contexto, surge una pregunta que orienta el estudio de esta unidad: ¿cómo construir un preacuerdo jurídicamente viable, negociar dentro de los límites legales, determinar la consecuencia punitiva y sustentar el acuerdo ante el juez de conocimiento?"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "¿Cómo construir un preacuerdo válido?", "segs": [0], "obj": "balanza", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "Pregunta orientadora de la lección", "grupo": null, "titulos_fuente": ["Pregunta orientadora de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Pregunta orientadora de la lección"], "titulo_genially": "Pregunta orientadora de la lección", "complemento_genially": "", "apartado": "Pregunta orientadora de la lección", "ilustracion": "norma-competencia.webp", "relleno": "dialogo-autoridades.webp"}, {"layout": "ruta", "segmentos": ["El artículo 348 del Código de Procedimiento Penal establece las finalidades que orientan los preacuerdos y las negociaciones.", "Uno de los límites expresamente establecidos por el legislador se encuentra en el artículo 349 del Código de Procedimiento Penal, aplicable a los delitos en los que el sujeto activo hubiese obtenido un incremento patrimonial derivado de la conducta delictiva.", "Otro ámbito especialmente relevante de la negociación corresponde al reconocimiento de las circunstancias de atenuación punitiva, tal es el caso de la marginalidad, ignorancia o pobreza extrema previstas en el artículo", "La jurisprudencia también ha debido establecer los límites de aquellos acuerdos en los que se utiliza una determinada calificación jurídica para producir consecuencias punitivas distintas de las que resultarían de la calificación correspondiente a los hechos.", "Uno de los principales problemas que ha enfrentado la jurisprudencia colombiana ha sido determinar si el allanamiento a cargos constituye una modalidad de preacuerdo o si, por el contrario, se trata de una institución autónoma.", "La justicia consensuada debe ser analizada, sin lugar a duda, desde una perspectiva de los derechos de las víctimas.", "Los literales anteriormente examinados encuentran un punto de convergencia en el control de legalidad que corresponde al juez de conocimiento."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "a. Finalidades", "segs": [0], "obj": "escalones"}, {"label": "b. El reintegro patrimonial", "segs": [1], "obj": "paquete"}, {"label": "c. Circunstancias de atenuación", "segs": [2], "obj": "balanza"}, {"label": "d. Ficciones jurídicas", "segs": [3], "obj": "libros"}, {"label": "e. Allanamiento y preacuerdo", "segs": [4], "obj": "documento"}, {"label": "f. Víctimas y procesado", "segs": [5], "obj": "personas"}, {"label": "g. El juez de conocimiento", "segs": [6], "obj": "mazo"}]}], "rotulo": null, "seccion": "Ruta de la lección", "grupo": null, "titulos_fuente": ["Ruta de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Ruta de la lección"], "titulo_genially": "Ruta de la lección", "complemento_genially": "", "apartado": "Ruta de la lección", "guia": "Recorra la ruta paso a paso."}, {"layout": "compacta", "segmentos": ["Los preacuerdos pueden entenderse como mecanismos de justicia consensuada mediante los cuales la Fiscalía y la defensa, a partir de la manifestación de voluntad del procesado y dentro de los límites legales, acuerdan determinados aspectos relacionados con la admisión de responsabilidad, los cargos y las consecuencias jurídicas que se derivarán de ella.", "En un preacuerdo existe una interacción entre las partes orientada a alcanzar un resultado común: la Fiscalía formula una propuesta o participa en su construcción, la defensa técnica y material evalúa las condiciones ofrecidas, y el procesado será quien decide si acepta o no la solución planteada. El resultado afirmativo de esta interacción se concreta en un preacuerdo que posteriormente deberá ser sometido al control judicial correspondiente.", "Por ello, el preacuerdo no puede ser entendido como una autorización para que se disponga libremente de los elementos que integran la responsabilidad penal."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "Justicia consensuada, no libre disposición", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Justicia consensuada, no libre disposición", "grupo": null, "titulos_fuente": ["Justicia consensuada, no libre disposición"], "encabezados": [], "mediacion": "", "rotulos": ["Justicia consensuada, no libre disposición"], "titulo_genially": "Justicia consensuada, no libre disposición", "complemento_genially": "", "apartado": "Justicia consensuada, no libre disposición", "guia": "Lea el contenido."}, {"layout": "giro", "segmentos": ["La primera finalidad consiste en humanizar la actuación procesal y la pena. La intervención del sistema penal puede producir importantes consecuencias personales, familiares, patrimoniales y sociales tanto para el procesado como para la víctima. La posibilidad de alcanzar una solución anticipada puede evitar parte de las cargas asociadas a un juicio prolongado y reducir el desgaste que puede producir la exposición continuada al conflicto penal.", "2. La segunda finalidad es obtener pronta y cumplida justicia. Los mecanismos consensuados permiten resolver determinados asuntos sin agotar todas las etapas o fases, con cada uno de sus actos procesales, lo que contribuye a una administración de justicia más oportuna y a una utilización racional de los recursos humanos y económicos (institucionales). Cabe destacar que, la economía procesal o la celeridad no constituyen un fin autónomo que permita sacrificar las garantías procesales o la legalidad.", "3. La tercera finalidad consiste en activar la solución de los conflictos sociales que genera el delito. El proceso penal no se limita a determinar la responsabilidad individual del acusado, también debe ofrecer una respuesta institucional frente al conflicto producido por la conducta punible. En este contexto, el consenso puede facilitar una respuesta más rápida y cierta, siempre que esta sea proporcional y jurídicamente legítima.", "4. La cuarta finalidad es propiciar la reparación integral de los perjuicios ocasionados con el delito. La posibilidad de alcanzar anticipadamente una solución tiene la potencialidad de favorecer la satisfacción de los derechos de las víctimas, especialmente cuando el acuerdo incorpora medidas dirigidas a reparar los daños ocasionados. La reparación no puede reducirse, sin embargo, a un elemento accesorio de la negociación, pues se encuentra vinculada con los derechos que corresponden a las víctimas dentro de todas las etapas del trámite penal.", "5. Finalmente, los preacuerdos buscan propiciar la participación del imputado/acusado en la definición de las consecuencias de su propio caso. El procesado deja de ocupar exclusivamente una posición pasiva frente a la actuación estatal (tanto que en materia p rocesal se lo ha denominado “sujeto pasivo de la acción penal”, que no debe confundirse con el sujeto pasivo de la conducta punible) y adquiere la posibilidad de participar, mediante su consentimiento, en la construcción de una solución anticipada. Esta participación se encuentra condicionada a que la decisión sea libre, informada y asistida por una adecuada defensa técnica."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "1. Humanizar la actuación procesal y la pena", "segs": [0], "obj": "corazon"}, {"label": "2. Obtener pronta y cumplida justicia", "segs": [1], "obj": "reloj"}, {"label": "3. Activar la solución de los conflictos sociales", "segs": [2], "obj": "personas"}, {"label": "4. Propiciar la reparación integral", "segs": [3], "obj": "escudo"}, {"label": "5. La participación del imputado en la definición de su caso", "segs": [4], "obj": "balanza"}]}], "rotulo": null, "seccion": "a. Las cinco finalidades del preacuerdo (art. 348 CPP)", "grupo": null, "titulos_fuente": ["a. Las cinco finalidades del preacuerdo (art. 348 CPP)"], "encabezados": [], "mediacion": "", "rotulos": ["a. Las cinco finalidades del preacuerdo (art. 348 CPP)"], "titulo_genially": "a. Las cinco finalidades del preacuerdo (art. 348 CPP)", "complemento_genially": "", "apartado": "a. Las cinco finalidades del preacuerdo (art. 348 CPP)", "guia": "Pase el cursor o toque cada tarjeta para leer su contenido."}, {"layout": "compacta", "segmentos": ["La Corte Constitucional ha considerado en materia de acuerdos y preacuerdos lo siguiente: (i) la existencia de estas figuras no vulnera, per se, el derecho fundamental al debido proceso; (ii) el fiscal no cuenta con una libertad absoluta al momento de adecuar la conducta punible; (iii) a los hechos invocados en su alegación conclusiva, el fiscal no les puede dar sino la calificación jurídica que corresponda conforme a la ley penal preexistente; (…) (vii) en la valoración del acuerdo, el juez velará porque el mismo no desconozca o quebrante garantías fundamentales del imputado y de la víctima; y (viii) en determinados casos, el legislador puede restringir o incluso prohibir la celebración de acuerdos o preacuerdos.", "Por ello, la existencia de un preacuerdo no basta para justificar cualquier resultado: el pacto debe guardar relación con los fines que justifican la existencia misma del mecanismo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "Lo que ha dicho la Corte Constitucional", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Lo que ha dicho la Corte Constitucional", "grupo": null, "titulos_fuente": ["Lo que ha dicho la Corte Constitucional"], "encabezados": [], "mediacion": "", "rotulos": ["Lo que ha dicho la Corte Constitucional"], "titulo_genially": "Lo que ha dicho la Corte Constitucional", "complemento_genially": "", "apartado": "Lo que ha dicho la Corte Constitucional", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La existencia de un margen de negociación no significa que la Fiscalía pueda decidir libremente qué aspectos del proceso modifica, qué beneficios concede o qué consecuencias jurídicas acuerda. La Fiscalía no puede negociar “a cualquier costo”, “esto es, de manera arbitraria (no discrecional -reglada) y con el solo fin de llegar a cualquier resultado que finiquite la actuación, sobrepasando los claros fines del instituto procesal de los preacuerdos (...) si las autoridades no atienden los límites previstos para el uso de este mecanismo, no sólo sus actos pueden perder sus efectos sino que, además, pueden comprometer su responsabilidad penal y disciplinaria”", "La negociación exige una consideración ética que atraviesa todos los contenidos de esta lección, pues del o de la fiscal se espera buena fe y ética profesional en todas las actuaciones que realiza.", "Desde esta perspectiva, una negociación responsable no es aquella que consigue el mayor beneficio posible para una de las partes sin importar las consecuencias, sino aquella que identifica un punto de equilibrio jurídicamente legítimo entre los intereses en conflicto."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "Un margen reglado y una negociación ética", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Un margen reglado y una negociación ética", "grupo": null, "titulos_fuente": ["Un margen reglado y una negociación ética"], "encabezados": [], "mediacion": "", "rotulos": ["Un margen reglado y una negociación ética"], "titulo_genially": "Un margen reglado y una negociación ética", "complemento_genially": "", "apartado": "Un margen reglado y una negociación ética", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["Uno de los límites expresamente establecidos por el legislador se encuentra en el artículo 349 del Código de Procedimiento Penal, aplicable a los delitos en los que el sujeto activo hubiese obtenido un incremento patrimonial derivado de la conducta delictiva. La norma establece como condición para la celebración del preacuerdo el reintegro de, por lo menos, el cincuenta por ciento del incremento patrimonial obtenido y la garantía del recaudo del remanente.", "El reintegro patrimonial es una condición que no puede convertirse en moneda de cambio.", "En los delitos que generan incremento patrimonial, la negociación debe incorporar desde el inicio las exigencias relacionadas con el reintegro. Esto significa que el fiscal debe verificar previamente las condiciones patrimoniales relevantes y determinar si se satisface el presupuesto legal para la celebración del acuerdo."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "b. El reintegro patrimonial (art. 349 CPP)", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "b. El reintegro patrimonial (art. 349 CPP)", "grupo": null, "titulos_fuente": ["b. El reintegro patrimonial (art. 349 CPP)"], "encabezados": [], "mediacion": "", "rotulos": ["b. El reintegro patrimonial (art. 349 CPP)"], "titulo_genially": "b. El reintegro patrimonial (art. 349 CPP)", "complemento_genially": "", "apartado": "b. El reintegro patrimonial (art. 349 CPP)", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["El o la fiscal debe determinar si, en estas condiciones, es procedente celebrar el preacuerdo. Para ello debe contestar las siguientes preguntas:", "¿Es viable, para la Fiscalía, celebrar el preacuerdo propuesto en esos términos?", "¿Está acreditado el incremento patrimonial de $400 millones?", "¿Se cumple el reintegro mínimo del 50 %?", "¿La garantía ofrecida permite asegurar razonablemente el recaudo del remanente?", "¿Puede el fiscal negociar a partir de ese momento consecuencias jurídicas más beneficiosas susceptibles de negociación?"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "lista", "s": [1, 2, 3, 4, 5], "n": [0, 0, 0, 0, 0]}], "items": [{"label": "Veamos un ejemplo: El doble beneficio y el reintegro", "segs": [0, 1, 2, 3, 4, 5], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: El doble beneficio y el reintegro", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: El doble beneficio y el reintegro"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: El doble beneficio y el reintegro"], "titulo_genially": "Veamos un ejemplo: El doble beneficio y el reintegro", "complemento_genially": "", "apartado": "Veamos un ejemplo: El doble beneficio y el reintegro", "guia": "Vea el caso y piense en las preguntas antes de pasar al análisis.", "video": {"src": "../comun/videos/c02.mp4", "vtt": "../comun/videos/c02.vtt", "poster": "../comun/videos/c02.jpg", "titulo": "Caso: El doble beneficio y el reintegro"}}, {"layout": "compacta", "segmentos": ["El caso permite comprender que, cuando el preacuerdo involucra delitos que han producido un incremento patrimonial fruto de la conducta ilícita, la Fiscalía debe verificar las exigencias del artículo 349 del Código de Procedimiento Penal antes de negociar beneficios punitivos. En el ejemplo, el incremento patrimonial asciende a $400 millones, por lo que el reintegro mínimo corresponde a $200 millones. La propuesta de Andrés, consistente en devolver inicialmente $100 millones y comprometerse a pagar los $300 millones restantes en cinco años, no satisface por sí misma esa exigencia.", "El fiscal debe establecer y acreditar el monto del incremento patrimonial, calcular el reintegro mínimo del 50 % y examinar si existen garantías suficientes para asegurar el pago del remanente. También debe verificar que el reintegro y las garantías ofrecidas cumplan los presupuestos legales, sin confundir una promesa de pago futuro con una garantía efectiva. Asimismo, debe tener presente que estas exigencias no pueden compensarse mediante una aceptación de responsabilidad más amplia, pues la aceptación de cargos no sustituye los requisitos patrimoniales establecidos por el legislador.", "Una buena práctica consiste en realizar esta verificación antes de avanzar en la negociación de beneficios, documentar los elementos que sustentan la cuantificación del incremento patrimonial y justificar las condiciones del acuerdo. De esta manera, la Fiscalía puede establecer si la propuesta satisface las exigencias legales y si existen condiciones suficientes para sustentar la viabilidad jurídica del preacuerdo."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Análisis del caso: El doble beneficio y el reintegro", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "¿Qué permite comprender esta situación?", "segs": [0], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [1], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [2], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Análisis del caso: El doble beneficio y el reintegro", "grupo": null, "titulos_fuente": ["Análisis del caso: El doble beneficio y el reintegro"], "encabezados": [], "mediacion": "", "rotulos": ["Análisis del caso: El doble beneficio y el reintegro"], "titulo_genially": "Análisis del caso: El doble beneficio y el reintegro", "complemento_genially": "", "apartado": "Análisis del caso: El doble beneficio y el reintegro", "guia": "Abra cada pregunta para leer el análisis.", "ilustracion": "dialogo-autoridades.webp"}, {"layout": "compacta", "segmentos": ["Otro ámbito especialmente relevante de la negociación corresponde al reconocimiento de las circunstancias de atenuación punitiva, tal es el caso de la marginalidad, ignorancia o pobreza extrema previstas en el artículo Estos presupuestos no pueden utilizarse como simples herramientas estratégicas para obtener una disminución de la pena cuando no existe ningún respaldo fáctico que permita sostener su concurrencia. La Fiscalía no puede incorporar estas circunstancias como una especie de “comodín” de negociación, pues debe existir un mínimo de fundamento fáctico y probatorio que permita establecer, siquiera sumariamente, que el procesado se encontraba efectivamente en la situación alegada y que ésta tuvo incidencia en la ejecución del delito.", "[Se] exige un mínimo de prueba de las circunstancias de menor punibilidad resulta ser lo que se ajusta a la ratio decidendi de la Sentencia C-1260 de 2005 de esta Corporación.", "La negociación puede admitir márgenes de consenso, pero no puede convertir en verdadero aquello que carece completamente de sustento fáctico."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "regla", "n": 0}], "items": [{"label": "c. Circunstancias de atenuación punitiva", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "c. Circunstancias de atenuación punitiva", "grupo": null, "titulos_fuente": ["c. Circunstancias de atenuación punitiva"], "encabezados": [], "mediacion": "", "rotulos": ["c. Circunstancias de atenuación punitiva"], "titulo_genially": "c. Circunstancias de atenuación punitiva", "complemento_genially": "", "apartado": "c. Circunstancias de atenuación punitiva", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["El fiscal debe determinar si, en estas condiciones, puede celebrar el preacuerdo. Para ello debe contestar las siguientes preguntas:", "¿Puede el fiscal reconocer en el preacuerdo la circunstancia de marginalidad solicitada por la defensa, a fin de favorecer la negociación?", "¿Existe un fundamento fáctico para la circunstancia alegada?", "¿Existen elementos probatorios que permitan sostenerla?", "¿La circunstancia tiene relación con la ejecución de la conducta?", "¿El fiscal está simplemente “creando” una circunstancia para disminuir la pena o está reconociendo una situación que encuentra respaldo en la actuación?"], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "lista", "s": [1, 2, 3, 4, 5], "n": [0, 0, 0, 0, 0]}], "items": [{"label": "Veamos un ejemplo: La marginalidad alegada sin sustento", "segs": [0, 1, 2, 3, 4, 5], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: La marginalidad alegada sin sustento", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: La marginalidad alegada sin sustento"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: La marginalidad alegada sin sustento"], "titulo_genially": "Veamos un ejemplo: La marginalidad alegada sin sustento", "complemento_genially": "", "apartado": "Veamos un ejemplo: La marginalidad alegada sin sustento", "guia": "Vea el caso y piense en las preguntas antes de pasar al análisis.", "video": {"src": "../comun/videos/c04.mp4", "vtt": "../comun/videos/c04.vtt", "poster": "../comun/videos/c04.jpg", "titulo": "Caso: La marginalidad alegada sin sustento"}}, {"layout": "compacta", "segmentos": ["El caso permite comprender que la facultad de negociación de la Fiscalía no autoriza a crear o reconocer artificialmente circunstancias de menor punibilidad para obtener una reducción de la pena. En el ejemplo, la defensa propone reconocer la circunstancia de marginalidad, ignorancia o pobreza extremas prevista en el artículo 56 del Código Penal. Sin embargo, las dificultades económicas alegadas por Miguel no son suficientes para justificar ese reconocimiento, especialmente si la información recaudada indica que tenía una actividad laboral, percibía ingresos y no existen elementos que permitan establecer una situación de pobreza extrema, marginalidad o ignorancia con incidencia en la comisión del delito.", "El fiscal debe verificar que la circunstancia de menor punibilidad propuesta tenga un fundamento fáctico y probatorio que permita sostenerla y que exista una relación entre dicha circunstancia y la ejecución de la conducta delictiva. Por tanto, no puede aceptar su reconocimiento únicamente porque resulte conveniente para la negociación o porque el procesado esté dispuesto a aceptar responsabilidad penal.", "Una buena práctica consiste en contrastar las circunstancias alegadas por la defensa con los elementos materiales probatorios y la información legalmente obtenida, identificar si existe respaldo para su reconocimiento y dejar constancia de las razones que justifican la decisión. De esta manera, la Fiscalía puede fundamentar adecuadamente la aceptación o el rechazo de la circunstancia propuesta."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Análisis del caso: La marginalidad alegada sin sustento", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "¿Qué permite comprender esta situación?", "segs": [0], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [1], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [2], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Análisis del caso: La marginalidad alegada sin sustento", "grupo": null, "titulos_fuente": ["Análisis del caso: La marginalidad alegada sin sustento"], "encabezados": [], "mediacion": "", "rotulos": ["Análisis del caso: La marginalidad alegada sin sustento"], "titulo_genially": "Análisis del caso: La marginalidad alegada sin sustento", "complemento_genially": "", "apartado": "Análisis del caso: La marginalidad alegada sin sustento", "guia": "Abra cada pregunta para leer el análisis.", "ilustracion": "dialogo-autoridades.webp"}, {"layout": "compacta", "segmentos": ["En determinados preacuerdos puede utilizarse, dentro de los márgenes legalmente permitidos, una calificación jurídica que opera como referencia para establecer la consecuencia punitiva. Sin embargo, ello no significa que la ficción creada para efectos del acuerdo transforme la realidad sustancial del delito efectivamente cometido.", "La negociación comporta una ficción jurídica habilitante de una benéfica tasación de la pena, que no irradia efectos a la verificación de los requisitos de la suspensión condicional y la prisión domiciliaria (...) La Corte avala los preacuerdos en los casos en los que el acuerdo no está encaminado a variar la calificación jurídica, sino solamente, como se dio en este caso, a hacer alusión a una norma favorable punitivamente para el procesado, que no se ajusta a la hipótesis fáctica aceptada y que tiene sólo el carácter teleológico de establecer el monto de la rebaja punitiva, sin tocar la responsabilidad.", "La ficción utilizada para dosificar la pena no puede emplearse automáticamente para modificar los presupuestos sustanciales que determinan la procedencia de ciertas instituciones como la suspensión de la ejecución o la prisión domiciliaria."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "d. Las ficciones jurídicas", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "d. Las ficciones jurídicas", "grupo": null, "titulos_fuente": ["d. Las ficciones jurídicas"], "encabezados": [], "mediacion": "", "rotulos": ["d. Las ficciones jurídicas"], "titulo_genially": "d. Las ficciones jurídicas", "complemento_genially": "", "apartado": "d. Las ficciones jurídicas", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La Fiscalía investiga a Julián por su participación en una estafa cometida contra una entidad bancaria. De acuerdo con los elementos probatorios, Julián conocía el plan delictivo, participó en su preparación y coordinó junto a los demás integrantes de la organización el momento y la ruta para obtener el dinero. El día de los hechos, además, realizó las actuaciones necesarias para facilitar la ejecución de la conducta y para disponer del dinero obtenido. La investigación permite sostener que Julián tuvo una actuación relevante en la ejecución del delito. La Fiscalía considera que, conforme a los hechos acreditados, su responsabilidad corresponde a la de un coautor impropio. Durante la negociación, Julián manifiesta su intención de aceptar responsabilidad. La Fiscalía y la defensa pactan que, para efectos exclusivamente punitivos, se tomará como referencia una forma de participación menos gravosa, con el propósito de establecer una pena que resulte favorable al procesado. El preacuerdo deja expresamente establecido que esta referencia no pretende modificar los hechos aceptados ni la responsabilidad sustancial de Julián, sino únicamente servir como parámetro para determinar la consecuencia punitiva. Después de conocer el acta de preacuerdo, la defensa solicita que, como consecuencia de la calificación jurídica utilizada para dosificar la pena, se reconozca a Julián la suspensión de la ejecución de la pena, argumentando que la forma de participación acordada produce una pena más reducida que permite cumplir el requisito objetivo de la suspensión de la ejecución de la pena.", "El fiscal debe determinar si, en estas condiciones, puede celebrar el preacuerdo. Para ello debe contestar las siguientes preguntas:\n• ¿Puede la Fiscalía utilizar una calificación jurídica más favorable a la que corresponde a los hechos para efectos del preacuerdo?\n• ¿Estoy utilizando esta calificación para determinar la pena o estoy pretendiendo modificar la responsabilidad sustancial?\n• ¿La utilización de esa calificación modifica la responsabilidad sustancial que realmente se desprende de los hechos aceptados por Julián?\n• ¿Puede la defensa utilizar la calificación jurídica favorable acordada para obtener beneficios como la suspensión de la ejecución de la pena o la prisión domiciliaria?\n• ¿Qué diferencia existe entre utilizar una ficción jurídica para determinar el quantum de la pena y modificar mediante ella la realidad jurídica del delito?\n• ¿Hasta dónde pueden extenderse los efectos de la ficción jurídica utilizada en el preacuerdo?", "El caso permite comprender que la utilización de una calificación jurídica diferente exclusivamente para efectos punitivos no autoriza a modificar artificialmente la responsabilidad penal que se desprende de los hechos aceptados. En el ejemplo, la Fiscalía considera que la actuación de Julián corresponde a una coautoría impropia, pero acuerda utilizar una forma de participación menos gravosa únicamente como referencia para determinar la pena. Esta posibilidad exige diferenciar expresamente la responsabilidad sustancial que se reconoce de la referencia jurídica utilizada para establecer la consecuencia punitiva.", "El fiscal debe verificar que los hechos aceptados mantengan correspondencia con la atribución de responsabilidad y que la calificación acordada tenga un alcance exclusivamente punitivo. Asimismo, debe distinguir entre los efectos de esa referencia para determinar la pena y los requisitos legales que deben cumplirse para acceder a subrogados o sustitutos penales. La calificación más favorable utilizada para dosificar la pena no se traslada automáticamente al análisis de la suspensión de la ejecución de la pena o de la prisión domiciliaria.", "Una buena práctica consiste en precisar el alcance exclusivamente punitivo de la calificación acordada y dejar claramente delimitado que esta no modifica la realidad jurídica de la conducta ni la forma de participación que se desprende de los hechos. También debe explicar que la referencia jurídica utilizada para determinar la pena no implica el reconocimiento automático de beneficios adicionales y verificar que la negociación respete los límites legales correspondientes."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3], [4]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Veamos un ejemplo: Julián y la calificación más favorable", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Julián y la calificación más favorable", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Julián y la calificación más favorable"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Julián y la calificación más favorable"], "titulo_genially": "Veamos un ejemplo: Julián y la calificación más favorable", "complemento_genially": "", "apartado": "Veamos un ejemplo: Julián y la calificación más favorable", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "ruta", "segmentos": ["En una primera etapa jurisprudencial, representada, entre otras, por las decisiones de la Sala de Casación Penal del 5 de septiembre de 2004, 23 de agosto de 2005 (Rad. 21954), 14 de diciembre de 2005 (Rad. 21347), 4 de mayo de 2006 (Rad. 24531) y 23 de mayo de 2006 (Rad. 25300), la Corte sostuvo que la aceptación de cargos no constituía una institución completamente autónoma, sino una modalidad de acuerdo o negociación con la Fiscalía.", "Posteriormente, la jurisprudencia modificó esta comprensión. A partir de decisiones como las del 8 de abril de 2008 (CSJ, SP, Rad. 25306) y del 8 de julio de 2008 (CSJ, SP, Rad. 31063), la Corte comenzó a reconocer una diferencia estructural entre ambas instituciones, previamente la Corte Constitucional ya había tomado esta postura a través de Sentencia de tutela (T-091 de 2006, T-941 de 2006, T-797 de 2006, T-966 de 2006 y la T- 356 de 2007) (Ospina, 2015, p. 105).", "Sin embargo, esta línea jurisprudencial tampoco permaneció invariable. En sentencia SP-14496-2017, la Corte retomó la tesis según la cual la aceptación de cargos debía entenderse como una modalidad de acuerdo con la Fiscalía.", "La discusión fue finalmente redefinida por las sentencias SP-1901-2024 (Rad. 64214) y SP3252-2024 (Rad. 59042), las cuales retoman la diferenciación entre ambas instituciones y establecen una distinción que resulta fundamental para el estudio de esta Unidad."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Primera etapa (2006)", "segs": [0], "obj": "mazo"}, {"label": "Segunda etapa", "segs": [1], "obj": "mazo"}, {"label": "SP-14496-2017", "segs": [2], "obj": "mazo"}, {"label": "SP-1901-2024 y SP3252-2024", "segs": [3], "obj": "mazo"}]}], "rotulo": null, "seccion": "e. Allanamiento y preacuerdo: la línea jurisprudencial", "grupo": null, "titulos_fuente": ["e. Allanamiento y preacuerdo: la línea jurisprudencial"], "encabezados": [], "mediacion": "", "rotulos": ["e. Allanamiento y preacuerdo: la línea jurisprudencial"], "titulo_genially": "e. Allanamiento y preacuerdo: la línea jurisprudencial", "complemento_genially": "", "apartado": "e. Allanamiento y preacuerdo: la línea jurisprudencial", "guia": "Recorra la ruta paso a paso."}, {"layout": "compara", "segmentos": ["El allanamiento a cargos constituye entonces un acto unilateral de parte. El procesado manifiesta su voluntad de aceptar los cargos formulados por la Fiscalía y no necesita negociar con esta última para que su aceptación produzca efectos. El beneficio punitivo está previamente determinado por la ley y se encuentra asociado a la etapa procesal en la que se produce la aceptación.", "En el preacuerdo, en cambio, los beneficios son resultado de la negociación y no responden necesariamente a una rebaja legal rígida. Precisamente por ello, el ejercicio de la facultad negociadora de la Fiscalía está sometido a límites adicionales y requiere un control judicial que garantice que el consenso no desborde el marco jurídico."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "El allanamiento a cargos", "segs": [0], "obj": "documento", "ilus": "norma-competencia.webp"}, {"label": "El preacuerdo", "segs": [1], "obj": "personas", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "Allanamiento frente a preacuerdo", "grupo": null, "titulos_fuente": ["Allanamiento frente a preacuerdo"], "encabezados": [], "mediacion": "", "rotulos": ["Allanamiento frente a preacuerdo"], "titulo_genially": "Allanamiento frente a preacuerdo", "complemento_genially": "", "apartado": "Allanamiento frente a preacuerdo", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["La sentencia C-516 de 2007 reconoció a las víctimas un derecho de participación reforzado en los procesos de negociación, lo que a su vez implica que, por lo menos, deben ser informadas y escuchadas durante el proceso de negociación y deben tener la oportunidad de expresar sus consideraciones ante el juez de conocimiento en el momento del control concerniente.", "La participación de la víctima no equivale, sin embargo, a la atribución de un poder de veto sobre el preacuerdo. La decisión se encuentra sometida al marco de competencias de la Fiscalía y al control judicial.", "Lo relevante es que la víctima pueda conocer la negociación, formular sus observaciones y ejercer las facultades que el ordenamiento le reconoce para la protección de sus derechos a la verdad, la justicia y la reparación integral."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "alerta", "n": 0}, {"t": "p", "s": [2], "c": "clave", "n": 0}], "items": [{"label": "f. La participación de las víctimas", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "f. La participación de las víctimas", "grupo": null, "titulos_fuente": ["f. La participación de las víctimas"], "encabezados": [], "mediacion": "", "rotulos": ["f. La participación de las víctimas"], "titulo_genially": "f. La participación de las víctimas", "complemento_genially": "", "apartado": "f. La participación de las víctimas", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["El procesado puede desistir de una negociación o rechazar una propuesta antes de celebrar el preacuerdo, pero una vez celebrado no puede retractarse libremente, salvo que demuestre un vicio del consentimiento o una vulneración de sus garantías fundamentales, en el marco del parágrafo incluido en el artículo 293 del CPP. Asimismo, la Fiscalía, una vez ha formalizado su voluntad, en el marco del principio de confianza legítima, tampoco puede retractarse.", "Así, una vez suscrita el acta de preacuerdo por la Fiscalía y la defensa, la Fiscalía no puede desconocer unilateralmente lo pactado invocando, por ejemplo, un cambio de criterio institucional, una nueva valoración del caso o modificaciones en la dirección de la entidad. La prohibición de retractación protege la confianza que las partes depositan en el consenso alcanzado y evita que la negociación se convierta en una actuación provisional cuya eficacia dependa de decisiones posteriores y unilaterales."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}], "items": [{"label": "El procesado y la prohibición de retractarse", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "El procesado y la prohibición de retractarse", "grupo": null, "titulos_fuente": ["El procesado y la prohibición de retractarse"], "encabezados": [], "mediacion": "", "rotulos": ["El procesado y la prohibición de retractarse"], "titulo_genially": "El procesado y la prohibición de retractarse", "complemento_genially": "", "apartado": "El procesado y la prohibición de retractarse", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["Los literales anteriormente examinados encuentran un punto de convergencia en el control de legalidad que corresponde al juez de conocimiento. El control judicial no debe ser entendido como una simple comprobación formal de que existe un documento firmado por las partes, pues el juez verifica que el preacuerdo haya sido construido dentro de las competencias de quienes lo celebran y que sus términos respeten las garantías fundamentales, la legalidad sustantiva y procesal y los derechos de las víctimas.", "De ahí que el juez de conocimiento no pueda ser concebido como un simple “notario” de los acuerdos. Su intervención cumple una función de garantía y supone la posibilidad de verificar materialmente que el preacuerdo se encuentre dentro de los límites jurídicos correspondientes."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "g. El juez de conocimiento: no es un notario", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "g. El juez de conocimiento: no es un notario", "grupo": null, "titulos_fuente": ["g. El juez de conocimiento: no es un notario"], "encabezados": [], "mediacion": "", "rotulos": ["g. El juez de conocimiento: no es un notario"], "titulo_genially": "g. El juez de conocimiento: no es un notario", "complemento_genially": "", "apartado": "g. El juez de conocimiento: no es un notario", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La Fiscalía investiga a Andrés, gerente de una empresa que obtuvo irregularmente un contrato estatal mediante la presentación de información falsa. De acuerdo con los elementos probatorios, Andrés coordinó con otros integrantes de la empresa la presentación de documentos alterados y, como consecuencia de la conducta, la empresa obtuvo un beneficio económico de $400 millones. Durante la audiencia de formulación de imputación, Andrés manifiesta espontáneamente que no acepta los cargos tal como fueron formulados por la Fiscalía, sin solicitar ninguna aclaración de ellos. Con posterioridad, su defensa plantea a la Fiscalía la posibilidad de celebrar un preacuerdo. En el curso de la negociación, la defensa propone que Andrés admita responsabilidad a cambio de una disminución de la pena. Además, solicita que se reconozca la circunstancia del artículo 56 del Código Penal, argumentando que Andrés atravesaba dificultades económicas al momento de los hechos. Sin embargo, los elementos de la investigación muestran que Andrés tenía ingresos elevados, patrimonio significativo y que la conducta fue previamente planeada. La defensa también propone que, exclusivamente para efectos de determinar la pena, se utilice una forma de participación menos gravosa que aquella que se desprende de los hechos investigados. Existe, además, un aspecto patrimonial: de los $400 millones de incremento patrimonial, Andrés solamente ha reintegrado $100 millones y ofrece pagar el resto posteriormente. La víctima, que es la entidad estatal afectada, manifiesta durante la negociación que considera insuficiente el reintegro propuesto y solicita conocer las condiciones del preacuerdo antes de que sea presentado ante el juez. Finalmente, la Fiscalía y la defensa llegan a un acuerdo que es aceptado por Andrés y presentado ante el juez de conocimiento. Después de conocer que el juez realizará el control de legalidad, Andrés manifiesta que ya no está de acuerdo con algunas de las condiciones pactadas y pretende retirar su aceptación.", "El estudiante debe analizar:\n• ¿Hasta dónde puede negociar el fiscal? En particular, ¿puede reconocer una circunstancia de marginalidad o pobreza que no tiene respaldo en los hechos, utilizar una calificación jurídica más favorable para dosificar la pena o suscribir el preacuerdo pese a que no se ha cumplido el requisito de reintegro patrimonial?\n• ¿Qué papel debe cumplir la víctima y qué debe verificar el juez antes de impartir aprobación al acuerdo? ¿Puede la víctima impedir por sí sola la celebración del preacuerdo o su intervención tiene un alcance diferente?\n• Una vez que Andrés acepta el preacuerdo y este es presentado ante el juez, ¿puede retractarse libremente? ¿Qué razones justifican que la negociación produzca efectos jurídicos y no pueda ser desconocida unilateralmente?\n• Finalmente, ¿cómo debe actuar el fiscal para conciliar la eficiencia que ofrece la terminación consensuada con los límites derivados de la legalidad, los derechos de las víctimas y la justicia sustancial?", "El caso permite integrar los principales límites que debe observar la Fiscalía durante la negociación de un preacuerdo. La posibilidad de alcanzar una terminación anticipada del proceso no significa que el fiscal pueda disponer libremente de la calificación jurídica, reconocer circunstancias que carecen de respaldo probatorio o prescindir de los requisitos legales exigidos para negociar beneficios.", "En el ejemplo, el fiscal debe verificar que la circunstancia de marginalidad o pobreza alegada por Andrés tenga fundamento fáctico y probatorio; que la calificación jurídica utilizada exclusivamente para efectos punitivos no altere artificialmente la responsabilidad que se desprende de los hechos; y que se cumplan las exigencias del artículo 349 del Código de Procedimiento Penal. Para esto último, debe tener en cuenta que el incremento patrimonial fue de $400 millones y que el reintegro ofrecido debe satisfacer el porcentaje mínimo legal y contar con garantías suficientes respecto del remanente. También debe garantizar la participación de la víctima, informarle las condiciones del preacuerdo y escuchar sus observaciones, sin confundir su derecho a intervenir con una facultad de veto sobre la negociación.", "Una buena práctica consiste en documentar las condiciones de la negociación, verificar que la aceptación sea libre, consciente, voluntaria e informada y anticipar los aspectos que serán objeto de control judicial. Asimismo, el fiscal debe procurar que el contenido del preacuerdo refleje los hechos aceptados, respete los límites legales para el reconocimiento de beneficios y garantice los derechos de las víctimas y del procesado."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3], [4]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada"], "titulo_genially": "Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada", "complemento_genially": "", "apartado": "Veamos un ejemplo: Andrés, la marginalidad y la entidad afectada", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "compacta", "segmentos": ["En consecuencia, el o la fiscal deberá aproximarse al preacuerdo desde una doble perspectiva. Por una parte, como herramienta de negociación y racionalización del proceso penal; por otra, como institución jurídica sometida a límites y controles que garantizan su legitimidad.", "Esta doble dimensión será fundamental para las siguientes lecciones, en las que se profundizará en las técnicas de negociación, la dosificación punitiva y el control de legalidad."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Cierre de la lección", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Cierre de la lección", "grupo": null, "titulos_fuente": ["Cierre de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Cierre de la lección"], "titulo_genially": "Cierre de la lección", "complemento_genially": "", "apartado": "Cierre de la lección", "guia": "Lea el contenido.", "ilustracion": "comunidad-interes-general.webp"}]}</script>
