<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "ta-juego-u1-l2", "niveles": ["Observador", "Investigador", "Fiscal en formación", "Referente en terminaciones"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ta", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 1 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 1, "lesson": 2, "heading": "Lección 1.2. Diferencias entre archivo, inadmisión de denuncia y preclusión", "scenes": [{"layout": "lamina", "segmentos": ["La pregunta que orientará esta lección será, por tanto: ¿qué decisión corresponde adoptar cuando se advierte que una actuación penal no puede o no debe continuar, y cómo determinar si se trata de un supuesto de inadmisión, archivo o preclusión?"], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "¿Qué decisión corresponde adoptar?", "segs": [0], "obj": "balanza", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "Pregunta orientadora de la lección", "grupo": null, "titulos_fuente": ["Pregunta orientadora de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Pregunta orientadora de la lección"], "titulo_genially": "Pregunta orientadora de la lección", "complemento_genially": "", "apartado": "Pregunta orientadora de la lección", "ilustracion": "norma-competencia.webp", "relleno": "dialogo-autoridades.webp"}, {"layout": "ruta", "segmentos": ["El primer escenario que debe diferenciarse del archivo corresponde a la inadmisión de la denuncia.", "Ahora bien, frente a la institución de la preclusión, la misma se analizará en la siguiente unidad.", "En este sentido, ¿qué es lo que debe resolver el fiscal?, una manera útil de comprender las tres figuras consiste en formular una pregunta común antes de decidir la ruta por seguir: ¿qué es exactamente lo que debo analizar o verificar para determinar que la actuación no puede continuar?"], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "a. La inadmisión de la denuncia", "segs": [0], "obj": "documento"}, {"label": "b. La preclusión", "segs": [1], "obj": "mazo"}, {"label": "c. Una ruta práctica para el fiscal", "segs": [2], "obj": "escalones"}]}], "rotulo": null, "seccion": "Ruta de la lección", "grupo": null, "titulos_fuente": ["Ruta de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Ruta de la lección"], "titulo_genially": "Ruta de la lección", "complemento_genially": "", "apartado": "Ruta de la lección", "guia": "Recorra la ruta paso a paso."}, {"layout": "rejilla", "segmentos": ["Se adopta cuando la noticia criminal no cumple los requisitos mínimos para dar inicio a la actuación penal, porque resulta claramente infundada, implausible, absurda o reiterativa.", "Art. 69 CPP · Sentencia C-1177 de 2005.", "Decisión del fiscal, durante la indagación, cuando no existen motivos o circunstancias fácticas que permitan caracterizar el hecho como delito.", "Art. 79 CPP · Sentencia C-1154 de 2005 · Directiva 0002 de 2025 (FGN).", "Decisión del juez de conocimiento cuando, con base en los motivos legales del art. 332 CPP, se establece que debe terminarse la actuación penal de manera anticipada.", "Arts. 331 y 332 CPP."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "1. Inadmisión de la denuncia", "segs": [0, 1], "obj": "documento", "ilus": "norma-competencia.webp"}, {"label": "2. Archivo de las diligencias", "segs": [2, 3], "obj": "carpetas", "ilus": "radicacion-terminos.webp"}, {"label": "3. Preclusión", "segs": [4, 5], "obj": "mazo", "ilus": "dialogo-autoridades.webp"}]}], "rotulo": null, "seccion": "Tres figuras, tres lógicas", "grupo": null, "titulos_fuente": ["Tres figuras, tres lógicas"], "encabezados": [], "mediacion": "", "rotulos": ["Tres figuras, tres lógicas"], "titulo_genially": "Tres figuras, tres lógicas", "complemento_genially": "", "apartado": "Tres figuras, tres lógicas", "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "esquema", "segmentos": ["El punto de partida se encuentra en el artículo 69 del CPP, que establece los requisitos de la denuncia, la querella o la petición especial y dispone que, en todo caso, “se inadmitirán las denuncias sin fundamento\".", "Esta disposición debe interpretarse a la luz de la Sentencia C-1177 de 2005, que condicionó su constitucionalidad y precisó que la inadmisión únicamente procede cuando el hecho no existió o no reviste las características de delito. Además, estableció que la decisión debe ser adoptada por el fiscal, estar debidamente motivada y ser comunicada al denunciante y al Ministerio Público.", "La eventual inadmisión de una denuncia no se vislumbra, como un acto propio de la nuda liberalidad del funcionario investigador, se trata de una decisión que sólo puede legitimarse por la ausencia, en el caso concreto, de los parámetros constitucionales que condicionan la obligatoriedad en el ejercicio de la acción penal: la posible existencia del hecho, y que el mismo revista las características de un delito investigable de oficio (...) En consecuencia condicionará la exequibilidad de la expresión acusada “en todo caso se inadmitirán las denuncias sin fundamento” a que tal decisión emitida por el fiscal sea notificada al denunciante y al Ministerio Público.", "Esta precisión constitucional es fundamental porque impide comprender la inadmisión como una herramienta para rechazar discrecionalmente denuncias que resulten inconvenientes, insuficientemente desarrolladas o difíciles de investigar. La denuncia constituye un mecanismo esencial de acceso a la administración de justicia y, por ello, su inadmisión debe estar rodeada de garantías mínimas que permitan a quien la formula conocer las razones objetivas de la decisión y, cuando sea posible, aportar la información necesaria para superar las deficiencias que dieron lugar a ella.", "La inadmisión se relaciona con la aptitud de la noticia criminal para poner en funcionamiento el aparato investigativo. Cuando la información suministrada carece de los elementos mínimos que permitan establecer un hecho concreto, serio y susceptible de ser encauzado hacia una investigación penal, el ordenamiento permite que la denuncia sea inadmitida en las condiciones fijadas por la ley y la jurisprudencia."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El artículo 69 del CPP", "segs": [0], "obj": "libros"}, {"label": "La Sentencia C-1177 de 2005", "segs": [1], "obj": "mazo"}, {"label": "No es una liberalidad del funcionario", "segs": [2], "obj": "escudo"}, {"label": "Una garantía de acceso a la justicia", "segs": [3], "obj": "personas"}, {"label": "La aptitud de la noticia criminal", "segs": [4], "obj": "lupa"}]}], "rotulo": null, "seccion": "a. La inadmisión de la denuncia", "grupo": null, "titulos_fuente": ["a. La inadmisión de la denuncia"], "encabezados": [], "mediacion": "", "rotulos": ["a. La inadmisión de la denuncia"], "titulo_genially": "a. La inadmisión de la denuncia", "complemento_genially": "", "apartado": "a. La inadmisión de la denuncia", "guia": "Recorra el mapa conceptual.", "objeto_raiz": "documento", "objetos_raiz": ["documento", "personas", "documento"], "descarga": {"href": "documentos/mapa-u1-l2-p04.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: a. La inadmisión de la denuncia (imagen PNG)", "lamina": true}}, {"layout": "compara", "segmentos": ["En la inadmisión, el análisis se sitúa en un momento inicial, relacionado con la suficiencia y fundamento de la denuncia para activar la actuación investigativa.", "En el archivo, por el contrario, ya se está frente a una actuación en la etapa de indagación en la que la Fiscalía ha tenido conocimiento del hecho y, a partir de la información disponible y de las actividades investigativas realizadas, constata que no existen motivos o circunstancias fácticas que permitan caracterizarlo objetivamente como delito o que permitan continuar la indagación bajo alguno de los supuestos legalmente previstos."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "En la inadmisión", "segs": [0], "obj": "documento", "ilus": "norma-competencia.webp"}, {"label": "En el archivo", "segs": [1], "obj": "carpetas", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "Inadmisión y archivo: dos momentos distintos", "grupo": null, "titulos_fuente": ["Inadmisión y archivo: dos momentos distintos"], "encabezados": [], "mediacion": "", "rotulos": ["Inadmisión y archivo: dos momentos distintos"], "titulo_genially": "Inadmisión y archivo: dos momentos distintos", "complemento_genially": "", "apartado": "Inadmisión y archivo: dos momentos distintos", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["En ella, la Sala de Casación Penal reiteró que una denuncia debe contener una imputación concreta, definida, seria y susceptible de orientar razonablemente una investigación, pues un señalamiento abstracto, genérico o vago, desprovisto de elementos que permitan establecer las circunstancias de la posible conducta delictiva, no tiene aptitud suficiente para activar el aparato de investigación.", "Este precedente ofrece una regla de utilidad para la práctica: no toda afirmación de que se ha cometido un delito representa, por sí sola, una noticia criminal con fundamento suficiente para iniciar una actividad investigativa indiscriminada.", "No obstante, esta regla debe aplicarse cuidadosamente en el marco de la Ley 906 de 2004. La inadmisión no puede convertirse en una forma anticipada de archivo ni en un mecanismo para evitar la investigación de hechos que sí contienen una base objetiva susceptible de verificación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "Auto AP-4299-2016: una imputación concreta y seria", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Auto AP-4299-2016: una imputación concreta y seria", "grupo": null, "titulos_fuente": ["Auto AP-4299-2016: una imputación concreta y seria"], "encabezados": [], "mediacion": "", "rotulos": ["Auto AP-4299-2016: una imputación concreta y seria"], "titulo_genially": "Auto AP-4299-2016: una imputación concreta y seria", "complemento_genially": "", "apartado": "Auto AP-4299-2016: una imputación concreta y seria", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La Directiva 0002 de 2025 refuerza esta distinción al establecer que las órdenes de archivo no constituyen mecanismos de administración de la carga de trabajo de los fiscales, tampoco decisiones de política criminal para renunciar o suspender arbitrariamente el ejercicio de la acción penal. Antes de ordenar el archivo, la Fiscalía debe impulsar oficiosamente la indagación, analizar rigurosamente los elementos recaudados y agotar las actuaciones investigativas pertinentes y razonables para verificar la existencia de un delito.", "La delimitación entre inadmisión y archivo adquiere una nueva dimensión a partir de la Directiva 0002 de 2026, donde, además de lo ya mencionado, es conveniente que el fiscal haga un ejercicio lógico y secuencial comprendido por las fases de recepción, ampliación, análisis, inadmisión o asociación, creación de noticia criminal, investigación y eventual archivo, teniendo especialmente presente que la asociación o inadmisión no constituyen archivo."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "Lo que agregan las directivas de 2025 y 2026", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Lo que agregan las directivas de 2025 y 2026", "grupo": null, "titulos_fuente": ["Lo que agregan las directivas de 2025 y 2026"], "encabezados": [], "mediacion": "", "rotulos": ["Lo que agregan las directivas de 2025 y 2026"], "titulo_genially": "Lo que agregan las directivas de 2025 y 2026", "complemento_genially": "", "apartado": "Lo que agregan las directivas de 2025 y 2026", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["Una persona pone en conocimiento de la Fiscalía General de la Nación una noticia criminal, que expresa únicamente: “Quiero denunciar a una persona que me está haciendo daño y que siempre ha querido perjudicarme”. No identifica a quién implica, no describe hechos ni circunstancias de modo, tiempo o lugar; tampoco alude cuál sería la conducta típica que, aun cuando no está obligado a ello porque es improcedente que se le exijan conocimientos jurídicos, en un caso difuso como estos, podría arrojar algunas luces.", "Para identificar la procedencia de la orden de inadmisión o de la orden de archivo, el fiscal debería preguntarse:\n• ¿Debe crearse inmediatamente una noticia criminal y posteriormente ordenar el archivo?\n• ¿La información puede ser ampliada o complementada?\n• ¿Hay insuficiencia inicial de una denuncia?\n• ¿Es preciso desarrollar una investigación para establecer la existencia o no de una conducta delictiva?", "El caso permite comprender que no toda información que llega a la Fiscalía reúne las condiciones mínimas para dar lugar al desarrollo de una indagación penal. En el ejemplo, la manifestación presentada no identifica a una persona, no describe un acontecimiento concreto ni proporciona circunstancias que permitan reconocer una posible conducta delictiva.", "El fiscal debe distinguir entre una noticia criminal que contiene información susceptible de verificación y una manifestación tan indeterminada que no permite establecer siquiera qué hecho debería investigarse.", "Una buena práctica consiste en examinar inicialmente el contenido de la información, identificar si es posible ampliarla o complementarla y determinar si existen datos que permitan precisar las circunstancias de tiempo, modo y lugar. No debe confundirse la insuficiencia de una denuncia con la ausencia de elementos para caracterizar objetivamente un hecho como delito, pues son situaciones diferentes y pueden dar lugar a actuaciones distintas.", "El fiscal debe evitar tanto iniciar investigaciones sobre manifestaciones completamente indeterminadas como ordenar archivos sin haber establecido previamente si la información puede ser precisada; la decisión debe responder a la naturaleza y al grado de concreción de la noticia recibida."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3]]}, {"rot": null, "celdas": [[4], [5]]}], "repetidos": [], "columnas": 2}], "items": [{"label": "Veamos un ejemplo: «Quiero denunciar a una persona»", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}, {"label": "¿Qué disposición o criterio normativo debe tener presente?", "segs": [5], "clase": "celda", "obj": "libros"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: «Quiero denunciar a una persona»", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: «Quiero denunciar a una persona»"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: «Quiero denunciar a una persona»"], "titulo_genially": "Veamos un ejemplo: «Quiero denunciar a una persona»", "complemento_genially": "", "apartado": "Veamos un ejemplo: «Quiero denunciar a una persona»", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "compacta", "segmentos": ["Veamos otro ejemplo… Tres personas denuncian separadamente porque una entidad ofrece supuestos créditos rápidos a cambio de pagos anticipados. Cada denuncia recibe inicialmente un radicado. Durante el análisis se advierte que: los hechos ocurrieron durante el mismo período, se utilizó la misma página web, las víctimas realizaron pagos a la misma cuenta bancaria y las comunicaciones fueron realizadas desde los mismos números telefónicos. Un funcionario propone cerrar dos de los registros porque “ya existe un asunto por los mismos hechos”.", "Para determinar la procedencia de la orden de inadmisión, de la orden de archivo o de la orden de asociación por duplicidad, el fiscal se podría preguntar:\n• ¿La existencia de una investigación previa permite archivar las demás denuncias?\n• ¿Qué resultado generaría la secuencia: denuncia, análisis inicial, identificación de relación con otro caso, asociación, incorporación de la información y continuidad de la investigación existente?", "El caso permite comprender que la existencia de varias denuncias relacionadas con un mismo acontecimiento o fenómeno delictivo no significa que deban archivarse los registros posteriores por duplicidad. En el ejemplo, la coincidencia temporal de los hechos, la utilización de una misma página web, la recepción de los pagos en una cuenta bancaria común y el empleo de los mismos números telefónicos constituyen elementos que permiten advertir una posible relación entre las investigaciones.", "El fiscal debe verificar si las noticias criminales corresponden a hechos relacionados y si la información recaudada en cada una puede contribuir al esclarecimiento de una investigación que ya se encuentra en curso. Para ello, debe examinar los elementos que permiten establecer la posible conexión entre los registros y determinar cómo puede aprovecharse la información aportada en cada denuncia.", "Una buena práctica consiste en identificar los registros relacionados, documentar los elementos que justifican su asociación, incorporar la información relevante a la actuación correspondiente y garantizar que los datos aportados por cada denunciante sean considerados dentro de la investigación. La existencia de un registro previo no elimina la necesidad de examinar la información nueva ni justifica cerrar automáticamente los demás registros."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1]]}], "repetidos": [], "columnas": 1}, {"t": "sub", "x": "Análisis"}, {"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[2], [3], [4]]}], "repetidos": [], "columnas": 3}], "items": [{"label": "Veamos un ejemplo: Tres denuncias por los mismos créditos", "segs": [], "clase": "flujo", "obj": "documento"}, {"label": "Situación", "segs": [0, 1], "clase": "celda", "obj": "expediente"}, {"label": "¿Qué permite comprender esta situación?", "segs": [2], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [3], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [4], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: Tres denuncias por los mismos créditos", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: Tres denuncias por los mismos créditos"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: Tres denuncias por los mismos créditos"], "titulo_genially": "Veamos un ejemplo: Tres denuncias por los mismos créditos", "complemento_genially": "", "apartado": "Veamos un ejemplo: Tres denuncias por los mismos créditos", "guia": "Lea la situación y abra cada pregunta del análisis."}, {"layout": "esquema", "segmentos": ["La preclusión es una decisión judicial, jurisdiccional y definitiva que pone fin a la acción penal cuando no existen motivos para continuar hacia la acusación. Una vez en firme, produce efectos de cosa juzgada.", "Depurar el proceso penal, evitando que continúe cuando, tras la investigación, se verifica que no se configuran los presupuestos legales para formular acusación.", "La Corte Constitucional, en la Sentencia C-591 de 2005, declaró inexequible la expresión «a partir de la formulación de la imputación» contenida en el art. 331, por lo que el fiscal puede solicitar la preclusión en cualquier momento del proceso y la decisión siempre debe ser adoptada judicialmente por el juez de conocimiento. La C-055 de 2018 reafirmó la necesidad de que el juez motive de forma suficiente la decisión de preclusión.", "Imposibilidad de iniciar o continuar el ejercicio de la acción penal; existencia de una causal que excluya la responsabilidad; inexistencia del hecho investigado; atipicidad del hecho investigado; ausencia de intervención del imputado en el hecho; imposibilidad de desvirtuar la presunción de inocencia; vencimiento del término máximo del art. 294 CPP.", "Se realiza audiencia ante el juez de conocimiento. La decisión es judicial. Una vez en firme, pone fin a la acción penal con cosa juzgada e impide los mismos de enjuiciamiento."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Naturaleza", "segs": [0], "obj": "balanza"}, {"label": "Propósito", "segs": [1], "obj": "escalones"}, {"label": "Jurisprudencia", "segs": [2], "obj": "libros"}, {"label": "Causales (art. 332 CPP)", "segs": [3], "obj": "lupa"}, {"label": "Trámite y efectos (arts. 333 y 334)", "segs": [4], "obj": "tribunal"}]}], "rotulo": null, "seccion": "b. La preclusión: lo esencial", "grupo": null, "titulos_fuente": ["b. La preclusión: lo esencial"], "encabezados": [], "mediacion": "", "rotulos": ["b. La preclusión: lo esencial"], "titulo_genially": "b. La preclusión: lo esencial", "complemento_genially": "", "apartado": "b. La preclusión: lo esencial", "guia": "Recorra el mapa conceptual.", "objeto_raiz": "mazo", "objetos_raiz": ["mazo", "personas", "documento"], "descarga": {"href": "documentos/mapa-u1-l2-p10.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: b. La preclusión: lo esencial (imagen PNG)", "lamina": true}}, {"layout": "compara", "segmentos": ["Decisión del fiscal, directa y motivada. Solo durante la indagación (antes de la imputación). No produce cosa juzgada.", "Decisión del juez de conocimiento. Puede solicitarse en cualquier etapa. Termina la acción penal con cosa juzgada y reviste las medidas de aseguramiento."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Archivo", "segs": [0], "obj": "carpetas", "ilus": "norma-competencia.webp"}, {"label": "Preclusión", "segs": [1], "obj": "mazo", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "Archivo frente a preclusión", "grupo": null, "titulos_fuente": ["Archivo frente a preclusión"], "encabezados": [], "mediacion": "", "rotulos": ["Archivo frente a preclusión"], "titulo_genially": "Archivo frente a preclusión", "complemento_genially": "", "apartado": "Archivo frente a preclusión", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["Para establecer la procedencia de la orden de archivo o de la preclusión, el fiscal tendría que reflexionar sobre:", "¿Existe objetivamente una conducta típica?", "¿Existe una conducta que puede ser típica, pero concurre una circunstancia que podría excluir la responsabilidad?", "¿La existencia de una posible causal de ausencia de responsabilidad puede ser decidida mediante archivo?", "¿Cómo identificar la naturaleza jurídica de la causal y aplicar el mecanismo procesal compatible con el ordenamiento?"], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "lista", "s": [1, 2, 3, 4], "n": [0, 0, 0, 0]}], "items": [{"label": "Veamos un ejemplo: El conductor y la maniobra", "segs": [0, 1, 2, 3, 4], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Veamos un ejemplo: El conductor y la maniobra", "grupo": null, "titulos_fuente": ["Veamos un ejemplo: El conductor y la maniobra"], "encabezados": [], "mediacion": "", "rotulos": ["Veamos un ejemplo: El conductor y la maniobra"], "titulo_genially": "Veamos un ejemplo: El conductor y la maniobra", "complemento_genially": "", "apartado": "Veamos un ejemplo: El conductor y la maniobra", "guia": "Vea el caso y piense en las preguntas antes de pasar al análisis.", "video": {"src": "../comun/videos/c09.mp4", "vtt": "../comun/videos/c09.vtt", "poster": "../comun/videos/c09.jpg", "titulo": "Caso: El conductor y la maniobra"}}, {"layout": "compacta", "segmentos": ["El caso permite comprender que debe distinguirse entre la atipicidad objetiva de una conducta y la existencia de una circunstancia que, aunque no elimina su tipicidad, puede excluir la responsabilidad penal. En el ejemplo, la maniobra realizada por el conductor produjo lesiones a una persona y, por tanto, el fiscal debe examinar inicialmente si se encuentran reunidos los elementos objetivos de la conducta típica. Si estos se configuran, pero las circunstancias del accidente permiten considerar que el conductor actuó bajo una causal de ausencia de responsabilidad, el problema ya no corresponde a la caracterización objetiva del hecho, sino a la determinación de la responsabilidad penal.", "El fiscal debe identificar si la circunstancia advertida afecta la tipicidad de la conducta o si, por el contrario, corresponde a una causal de ausencia de responsabilidad. Esta distinción es fundamental para determinar si los hechos carecen de relevancia penal desde el punto de vista objetivo o si, pese a reunir los elementos de una conducta típica, existe una circunstancia que podría excluir la responsabilidad del conductor.", "Una buena práctica consiste en identificar la naturaleza jurídica de la circunstancia invocada, establecer si afecta la tipicidad o si corresponde a una causal de ausencia de responsabilidad y, a partir de esa distinción, seleccionar el mecanismo procesal adecuado. Cuando la discusión recae sobre una causal que excluye la responsabilidad penal, debe acudirse al mecanismo judicial correspondiente, esto es, la preclusión, siempre que se encuentren acreditados sus presupuestos legales.", "El fiscal debe evitar utilizar el archivo como una decisión anticipada sobre la responsabilidad penal: antes de adoptar una determinación, debe distinguir entre la ausencia de tipicidad objetiva y la configuración de una causal de ausencia de responsabilidad, pues cada supuesto tiene un tratamiento procesal diferente."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "malla", "cols": [], "filas": [{"rot": null, "celdas": [[1], [2], [3]]}], "repetidos": [], "columnas": 3}, {"t": "p", "s": [3], "c": "clave", "n": 0}], "items": [{"label": "Análisis del caso: El conductor y la maniobra", "segs": [3], "clase": "flujo", "obj": "documento"}, {"label": "¿Qué permite comprender esta situación?", "segs": [0], "clase": "celda", "obj": "lupa"}, {"label": "¿Qué aspectos debe valorar el fiscal?", "segs": [1], "clase": "celda", "obj": "balanza"}, {"label": "¿Qué debería hacer el fiscal en una situación similar?", "segs": [2], "clase": "celda", "obj": "escalones"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Análisis del caso: El conductor y la maniobra", "grupo": null, "titulos_fuente": ["Análisis del caso: El conductor y la maniobra"], "encabezados": [], "mediacion": "", "rotulos": ["Análisis del caso: _genially": "c. ¿Inadmisión, archivo o preclusión? Diferencias clave", "complemento_genially": "", "apartado": "c. ¿Inadmisión, archivo o preclusión? Diferencias clave", "guia": "Lea el contenido."}, {"layout": "giro", "segmentos": ["La decisión debe basarse en los presupuestos y límites previstos en la ley.", "Debe adoptarse la medida menos restrictiva y adecuada a las circunstancias del caso.", "Se deben garantizar los derechos de las víctimas, del imputado y la correcta administración de la justicia."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Legalidad", "segs": [0], "obj": "escudo"}, {"label": "Proporcionalidad", "segs": [1], "obj": "balanza"}, {"label": "Protección de derechos", "segs": [2], "obj": "personas"}]}], "rotulo": null, "seccion": "Principios orientadores", "grupo": null, "titulos_fuente": ["Principios orientadores"], "encabezados": [], "mediacion": "", "rotulos": ["Principios orientadores"], "titulo_genially": "Principios orientadores", "complemento_genially": "", "apartado": "Principios orientadores", "guia": "Pase el cursor o toque cada tarjeta para leer su contenido."}, {"layout": "ruta", "segmentos": ["¿Cumple los requisitos mínimos y es verosímil?", "¿Existen motivos o circunstancias fácticas que permitan estimar un delito?", "Si ya hay proceso, ¿se configura alguna de las causales del art. 332 CPP?", "Inadmisión, archivo o solicitud de preclusión, según corresponda.", "Fundamente la decisión y comuníquela a quienes corresponda."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "1. Verifique la noticia criminal", "segs": [0], "obj": "lupa"}, {"label": "2. Analice los hechos y la investigación", "segs": [1], "obj": "documento"}, {"label": "3. Examine las causales legales", "segs": [2], "obj": "balanza"}, {"label": "4. Adopte la decisión", "segs": [3], "obj":
