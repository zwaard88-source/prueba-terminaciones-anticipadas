<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "juego": {"clave": "ta-juego-u2-l2", "niveles": ["Observador", "Investigador", "Fiscal en formación", "Referente en terminaciones"]}, "ilustraciones": "ilustraciones-tutela", "paleta": {"marino": "#002F46", "teal": "#396B83", "oxido": "#A75260", "coral": "#EE616B", "crema": "#F8F5C6", "niebla": "#E5F1F1", "hielo": "#F2F8F8", "celeste": "#E5F1F1", "madera": "#A75260", "piso": "#E5F1F1", "gris": "#E5F1F1", "amarillo": "#EE616B"}, "anclas": {"radicacion-terminos.webp": {"r": 1.0429, "p": [[17, 25], [49, 14], [80, 26], [90, 65]]}, "comunidad-interes-general.webp": {"r": 1.0216, "p": [[17, 22], [50, 13], [82, 23], [89, 61]]}, "norma-competencia.webp": {"r": 0.9978, "p": [[16, 22], [50, 13], [83, 24], [8, 67]]}, "dialogo-autoridades.webp": {"r": 1.0045, "p": [[16, 22], [50, 13], [82, 23], [88, 82]]}, "red-portada.webp": {"r": 1.3783, "p": [[31, 8], [54, 48], [50, 79], [84, 8]]}}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "ta", "partirComas": true, "bitacora": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 2 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 2, "lesson": 2, "heading": "Lección 2.2. Audiencia de preclusión: estructura, argumentación y actividad probatoria", "scenes": [{"layout": "lamina", "segmentos": ["La audiencia de preclusión constituye el escenario judicial en el que se somete a consideración del juez de conocimiento la procedencia de una terminación anticipada y definitiva de la actuación penal con fundamento en alguna de las causales previstas en el Código de Procedimiento Penal."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Un escenario judicial, no un trámite", "segs": [0], "obj": "tribunal", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "La audiencia de preclusión", "grupo": null, "titulos_fuente": ["La audiencia de preclusión"], "encabezados": [], "mediacion": "", "rotulos": ["La audiencia de preclusión"], "titulo_genially": "La audiencia de preclusión", "complemento_genially": "", "apartado": "La audiencia de preclusión", "ilustracion": "norma-competencia.webp", "relleno": "dialogo-autoridades.webp"}, {"layout": "ruta", "segmentos": ["La audiencia comienza con su instalación por parte del juez de conocimiento, quien debe verificar las condiciones necesarias para su realización, la comparecencia de las partes e intervinientes y la debida citación de quienes tienen derecho a participar.", "El fiscal debe formular una verdadera proposición jurídica completa; esto es, una argumentación en la que se conecten la situación fáctica acreditada, la causal legal invocada, las razones que permiten aplicarla y los elementos de conocimiento que sustentan la conclusión.", "Una vez concluida la intervención del fiscal, se desarrolla el contradictorio con participación de la víctima, el Ministerio Público y la defensa (material, si desea intervenir, y técnica.", "El inciso condicionado, como ya se aludió y se desarrollará en párrafos posteriores, del artículo 333 del CPP dispone que en la audiencia de preclusión no habrá lugar a solicitud ni práctica de pruebas.", "Una vez agotadas las intervenciones, el juez puede decretar un receso hasta por una hora para preparar la decisión y posteriormente debe pronunciarla oralmente y de manera motivada. La providencia que decide la solicitud debe resolver de manera concreta la causal planteada y explicar las razones por las cuales los presupuestos de la preclusión se encuentran o no acreditados.", "Contra la decisión que resuelve la solicitud de preclusión proceden los mecanismos ordinarios de impugnación previstos por el ordenamiento: reposición y apelación."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "1. Instalación y solicitud", "segs": [0], "obj": "tribunal"}, {"label": "2. Sustentación del fiscal", "segs": [1], "obj": "documento"}, {"label": "3. Contradictorio", "segs": [2], "obj": "personas"}, {"label": "4. Elementos de conocimiento", "segs": [3], "obj": "expediente"}, {"label": "5. Decisión", "segs": [4], "obj": "mazo"}, {"label": "6. Recursos", "segs": [5], "obj": "escalones"}]}], "rotulo": null, "seccion": "La audiencia, paso a paso", "grupo": null, "titulos_fuente": ["La audiencia, paso a paso"], "encabezados": [], "mediacion": "", "rotulos": ["La audiencia, paso a paso"], "titulo_genially": "La audiencia, paso a paso", "complemento_genially": "", "apartado": "La audiencia, paso a paso", "guia": "Recorra la ruta paso a paso."}, {"layout": "compacta", "segmentos": ["El fiscal debe explicar por qué esas circunstancias encajan en una causal legal de preclusión y por qué, a partir del material disponible, la continuación de la actuación carece de fundamento jurídico.", "La carga argumentativa no se satisface mediante la invocación genérica de principios como celeridad, economía procesal, eficiencia o duración/plazo razonable del proceso.", "El objeto de la audiencia consiste entonces en establecer si, conforme al ordenamiento jurídico y al estado de la actuación, existe una razón suficiente para poner fin a la persecución penal, y no simplemente si resulta conveniente que la investigación termine."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "alerta", "n": 0}, {"t": "p", "s": [2], "c": "regla", "n": 0}], "items": [{"label": "La sustentación: una proposición jurídica completa", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "La sustentación: una proposición jurídica completa", "grupo": null, "titulos_fuente": ["La sustentación: una proposición jurídica completa"], "encabezados": [], "mediacion": "", "rotulos": ["La sustentación: una proposición jurídica completa"], "titulo_genially": "La sustentación: una proposición jurídica completa", "complemento_genially": "", "apartado": "La sustentación: una proposición jurídica completa", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La Sala tiene pacíficamente sentado que la decisión por la cual se decreta la preclusión tiene efectos de cosa juzgada, de modo que un pronunciamiento favorable a la pretensión de poner fin anticipado a la actuación «exige que la causal que la funda se encuentre demostrada de manera cierta o, lo que es igual, que respecto de la misma no exista duda o posibilidad de verificación contraria con un mejor esfuerzo investigativo». Dicho en otros términos, «la alternativa de poner fin al proceso por esta vía supone la existencia de prueba de tal entidad que determine de manera concluyente la ausencia de interés del Estado en agotar toda la actuación procesal prevista por el legislador para ejercer la acción penal, dando paso a un mecanismo extraordinario por virtud del cual pueda cesar de manera legal la persecución penal».", "La calidad de la sustentación adquiere particular importancia porque la preclusión no constituye una decisión de conveniencia ni una herramienta para descongestionar investigaciones que simplemente presentan dificultades investigativas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "Lo que ha dicho la Corte Suprema", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Lo que ha dicho la Corte Suprema", "grupo": null, "titulos_fuente": ["Lo que ha dicho la Corte Suprema"], "encabezados": [], "mediacion": "", "rotulos": ["Lo que ha dicho la Corte Suprema"], "titulo_genially": "Lo que ha dicho la Corte Suprema", "complemento_genially": "", "apartado": "Lo que ha dicho la Corte Suprema", "guia": "Lea el contenido."}, {"layout": "rejilla", "segmentos": ["En particular, la víctima tiene un interés constitucionalmente protegido en que la decisión sobre la terminación de la persecución penal sea adoptada mediante un procedimiento que permita controlar adecuadamente la actuación fiscal y preservar sus derechos a la verdad, la justicia y la reparación.", "Precisamente por ello, la Corte Constitucional estableció en la Sentencia C-209 de 2007 que la víctima puede allegar o solicitar elementos materiales probatorios y evidencia física para oponerse a la petición de preclusión, pues una posibilidad puramente formal de controvertir la solicitud resultaría insuficiente si no pudiera aportar elementos capaces de demostrar que existe mérito para continuar la actuación.", "No permitir a la víctima controvertir adecuadamente la solicitud del fiscal puede conducir a una afectación alta de sus derechos, e incluso, a la impunidad. En efecto, dado que, al decretarse la preclusión, la víctima no puede solicitar la reanudación de la investigación, ni aportar nuevos elementos probatorios que permitan reabrir la investigación contra el imputado favorecido con la preclusión, resulta esencial adelantar un control adecuado de las acciones y omisiones del fiscal, y controvertir de manera efectiva de sus decisiones. Por ello, el trámite de la solicitud de preclusión debe estar rodeado de las mayores garantías.", "La intervención del Ministerio Público, por su parte, debe orientarse a la protección del orden jurídico y de los derechos y garantías fundamentales dentro de los límites propios de su función constitucional y legal.", "Puede cuestionar la configuración de la causal, la suficiencia de la argumentación fiscal, la correspondencia entre los elementos de conocimiento y la conclusión propuesta o la necesidad de continuar la actuación. Su intervención, al igual que la de la víctima, puede revelar al juez que la situación procesal no permite concluir que desapareció el mérito para continuar la persecución penal. De esta manera, el contradictorio cumple una función de control material de la solicitud y permite que la decisión judicial sea adoptada después de escuchar las diferentes perspectivas relevantes para la resolución del problema jurídico.", "La defensa merece una consideración particular. La Sentencia C-648 de 2010 declaró inexequible la expresión del artículo 333 del CPP que condicionaba su intervención al evento en que quisiera oponerse a la solicitud fiscal. La Corte Constitucional consideró que una restricción de esa naturaleza desconocía el derecho de defensa, pues la defensa no puede ser obligada a adoptar una posición de oposición frente a una solicitud que puede favorecerle.", "Desde la perspectiva de la dirección judicial, corresponde al juez de conocimiento garantizar que la audiencia permanezca circunscrita al objeto propio de la preclusión. Esto supone identificar la causal sometida a consideración, controlar que los argumentos de los participantes guarden relación con ella, evitar debates manifiestamente impertinentes o inoportunos y asegurar que la controversia se desarrolle dentro de los límites propios de una audiencia de terminación anticipada. La dirección judicial adquiere especial relevancia cuando las partes pretenden convertir la diligencia en una discusión general sobre la totalidad de la actuación penal."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "La víctima", "segs": [0, 1, 2], "obj": "personas", "ilus": "norma-competencia.webp"}, {"label": "El Ministerio Público", "segs": [3, 4], "obj": "escudo", "ilus": "radicacion-terminos.webp"}, {"label": "La defensa", "segs": [5], "obj": "balanza", "ilus": "dialogo-autoridades.webp"}, {"label": "El juez de conocimiento", "segs": [6], "obj": "mazo", "ilus": "comunidad-interes-general.webp"}]}], "rotulo": null, "seccion": "Los intervinientes en la audiencia", "grupo": null, "titulos_fuente": ["Los intervinientes en la audiencia"], "encabezados": [], "mediacion": "", "rotulos": ["Los intervinientes en la audiencia"], "titulo_genially": "Los intervinientes en la audiencia", "complemento_genially": "", "apartado": "Los intervinientes en la audiencia", "guia": "Haga clic en cada recuadro para leer su texto completo."}, {"layout": "compacta", "segmentos": ["El inciso condicionado, como ya se aludió y se desarrollará en párrafos posteriores, del artículo 333 del CPP dispone que en la audiencia de preclusión no habrá lugar a solicitud ni práctica de pruebas. Esta regla responde a la estructura del sistema y a la necesidad de evitar que la audiencia se transforme en un escenario equivalente al juicio oral.", "La prohibición de practicar pruebas, sin embargo, no significa que el juez deba decidir a partir de una exposición puramente retórica del fiscal. La solicitud debe estar sustentada en los elementos de conocimiento que permitan verificar la configuración de la causal.", "En este contexto debe diferenciarse entre practicar una prueba en audiencia y presentar, exhibir o solicitar la valoración de elementos materiales probatorios, evidencia física o información legalmente obtenida que ya obren o puedan ser allegados legítimamente al trámite."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "regla", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "Sin práctica de pruebas, pero con elementos de conocimiento", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Sin práctica de pruebas, pero con elementos de conocimiento", "grupo": null, "titulos_fuente": ["Sin práctica de pruebas, pero con elementos de conocimiento"], "encabezados": [], "mediacion": "", "rotulos": ["Sin práctica de pruebas, pero con elementos de conocimiento"], "titulo_genially": "Sin práctica de pruebas, pero con elementos de conocimiento", "complemento_genially": "", "apartado": "Sin práctica de pruebas, pero con elementos de conocimiento", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["En cuanto al estándar de decisión, la Fiscalía debe comprender que la preclusión no se decreta por la mera existencia de una hipótesis favorable al indiciado o procesado ni por la simple percepción de que la investigación presenta dificultades. La cuestión consiste en establecer, de acuerdo con la causal invocada, si el material de conocimiento disponible permite concluir con certeza que no existe mérito para acusar o que concurre una circunstancia que hace imposible continuar legítimamente la persecución penal.", "La preclusión y la condena, claro está, cumplen funciones procesales diferentes y operan en momentos diferentes.", "En consecuencia, no resulta metodológicamente correcto trasladar mecánicamente a la audiencia de preclusión el estándar probatorio propio de una sentencia condenatoria. Al mismo tiempo, la ausencia de mérito para acusar tampoco puede convertirse en una fórmula vacía para justificar una investigación deficiente: la Fiscalía debe demostrar por qué, a partir de los elementos de conocimiento legítimamente obtenidos y del estado de la investigación, la causal invocada se encuentra configurada."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "alerta", "n": 0}], "items": [{"label": "El estándar de decisión", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "El estándar de decisión", "grupo": null, "titulos_fuente": ["El estándar de decisión"], "encabezados": [], "mediacion": "", "rotulos": ["El estándar de decisión"], "titulo_genially": "El estándar de decisión", "complemento_genially": "", "apartado": "El estándar de decisión", "guia": "Lea el contenido."}, {"layout": "compara", "segmentos": ["También debe evitarse que la audiencia se convierta en un juicio anticipado. La preclusión no constituye un mecanismo para resolver anticipadamente controversias que dependen de la valoración directa de testimonios, de la credibilidad de los declarantes, de la confrontación de versiones contrapuestas o de la apreciación integral de la prueba que deberá producirse en el juicio oral. Cuando la controversia consiste precisamente en determinar cuál versión de los hechos resulta creíble, qué testimonio debe prevalecer o cómo debe valorarse una prueba que requiere inmediación judicial, la audiencia de preclusión no puede sustituir el escenario constitucionalmente previsto para ese debate.", "En consecuencia, el fiscal debe distinguir entre una situación en la que la información disponible permite establecer objetivamente la configuración de una causal de preclusión y otra en la que existen controversias probatorias que solamente pueden resolverse mediante el juicio. La primera puede justificar la terminación anticipada, la segunda exige prudencia frente a la solicitud, porque la existencia de una controversia probatoria no equivale por sí misma a la imposibilidad de continuar la persecución penal. La pregunta central no debe ser si el fiscal considera que probablemente obtendría una condena, sino si jurídicamente existe mérito suficiente para continuar la actuación y si la causal específica invocada se encuentra demostrada."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "No es un juicio anticipado", "segs": [0], "obj": "tribunal", "ilus": "norma-competencia.webp"}, {"label": "Lo que debe distinguir el fiscal", "segs": [1], "obj": "lupa", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "Preclusión no es juicio anticipado", "grupo": null, "titulos_fuente": ["Preclusión no es juicio anticipado"], "encabezados": [], "mediacion": "", "rotulos": ["Preclusión no es juicio anticipado"], "titulo_genially": "Preclusión no es juicio anticipado", "complemento_genially": "", "apartado": "Preclusión no es juicio anticipado", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["Esta consideración adquiere especial importancia frente a la causal de imposibilidad de desvirtuar la presunción de inocencia. En estos casos, el análisis debe estar relacionado con el conjunto de la actividad investigativa desarrollada y con la imposibilidad razonablemente sustentada de alcanzar los presupuestos necesarios para formular acusación.", "La preclusión no puede utilizarse para compensar una investigación que todavía presenta diligencias relevantes, pertinentes y potencialmente determinantes pendientes de realización.", "Cuando la preclusión se solicita durante el juzgamiento por las causales que legalmente pueden invocarse en esa etapa, la exigencia de delimitación es todavía mayor. La actuación ya ha superado la etapa de investigación y la Fiscalía ha formulado acusación, por lo que la pretensión preclusiva no puede utilizarse para reabrir de manera general el debate sobre asuntos que ya fueron objeto de acusación."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "alerta", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}], "items": [{"label": "La causal sexta y la preclusión en el juzgamiento", "segs": [0, 1, 2], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "La causal sexta y la preclusión en el juzgamiento", "grupo": null, "titulos_fuente": ["La causal sexta y la preclusión en el juzgamiento"], "encabezados": [], "mediacion": "", "rotulos": ["La causal sexta y la preclusión en el juzgamiento"], "titulo_genially": "La causal sexta y la preclusión en el juzgamiento", "complemento_genially": "", "apartado": "La causal sexta y la preclusión en el juzgamiento", "guia": "Lea el contenido."}, {"layout": "compara", "segmentos": ["Una vez agotadas las intervenciones, el juez puede decretar un receso hasta por una hora para preparar la decisión y posteriormente debe pronunciarla oralmente y de manera motivada. La providencia que decide la solicitud debe resolver de manera concreta la causal planteada y explicar las razones por las cuales los presupuestos de la preclusión se encuentran o no acreditados. Si la preclusión es decretada y la decisión queda en firme, culmina, con efectos de cosa juzgada, la persecución penal contra el indiciado o procesado por los hechos correspondientes y se revocan las medidas cautelares o con fines de comiso que se le hayan impuesto. El efecto de cosa juzgada constituye precisamente uno de los elementos que explica el carácter definitivo de la institución y la necesidad de que la audiencia esté rodeada de garantías suficientes para todos los sujetos procesales.", "Si, por el contrario, la solicitud es rechazada o negada y la decisión queda en firme, las diligencias regresan a la Fiscalía y se restituye el término que duró el trámite de la preclusión. Adicionalmente, el juez que conoció de la solicitud queda impedido para conocer del juicio, regla que busca preservar la imparcialidad del funcionario que ya tuvo que pronunciarse sobre aspectos relevantes de la investigación y sobre la procedencia de la terminación anticipada. El rechazo de la preclusión, por tanto, no equivale a una declaración de responsabilidad penal ni implica que el juez haya resuelto definitivamente las cuestiones que deberán debatirse en el juicio, significa que, en el estado de la actuación y con fundamento en la causal propuesta, no encontró jurídicamente procedente poner fin anticipado a la persecución penal."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Si se decreta", "segs": [0], "obj": "mazo", "ilus": "norma-competencia.webp"}, {"label": "Si se niega o se rechaza", "segs": [1], "obj": "carpetas", "ilus": "radicacion-terminos.webp"}]}], "rotulo": null, "seccion": "La decisión: si se decreta o si se niega", "grupo": null, "titulos_fuente": ["La decisión: si se decreta o si se niega"], "encabezados": [], "mediacion": "", "rotulos": ["La decisión: si se decreta o si se niega"], "titulo_genially": "La decisión: si se decreta o si se niega", "complemento_genially": "", "apartado": "La decisión: si se decreta o si se niega", "guia": "Haga clic en cada imagen: se despliega con su texto completo."}, {"layout": "compacta", "segmentos": ["Para efectos de la práctica fiscal, la preparación de una audiencia de preclusión debería partir, entonces, de una pregunta esencial: ¿qué hecho jurídicamente relevante pretende demostrarse y qué causal concreta permite extraer de ese hecho la consecuencia de terminar la persecución penal?", "La audiencia debe concebirse, por tanto, como un ejercicio de argumentación jurídica sustentada en elementos de conocimiento y sometida a contradicción, no como una exposición administrativa de los resultados de una investigación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "Preparar una audiencia de preclusión", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Preparar una audiencia de preclusión", "grupo": null, "titulos_fuente": ["Preparar una audiencia de preclusión"], "encabezados": [], "mediacion": "", "rotulos": ["Preparar una audiencia de preclusión"], "titulo_genially": "Preparar una audiencia de preclusión", "complemento_genially": "", "apartado": "Preparar una audiencia de preclusión", "guia": "Lea el contenido."}, {"layout": "compacta", "segmentos": ["La competencia práctica que se pretende desarrollar mediante esta lección consiste precisamente en que el fiscal pueda transformar una conclusión investigativa en una pretensión preclusiva judicialmente controlable.", "Para ello debe saber estructurar la audiencia, delimitar el problema jurídico, formular una proposición jurídica completa, identificar y presentar adecuadamente los elementos materiales probatorios, la evidencia física y la información legalmente obtenida, responder al contradictorio de los demás sujetos procesales y reconocer los límites que impiden convertir la diligencia en un juicio anticipado."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "clave", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Cierre de la lección", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Cierre de la lección", "grupo": null, "titulos_fuente": ["Cierre de la lección"], "encabezados": [], "mediacion": "", "rotulos": ["Cierre de la lección"], "titulo_genially": "Cierre de la lección", "complemento_genially": "", "apartado": "Cierre de la lección", "guia": "Lea el contenido.", "ilustracion": "comunidad-interes-general.webp"}, {"layout": "compacta", "segmentos": ["A través del siguiente video encontrará una síntesis de los principales temas abordados en la unidad, que le permitirá retomar los elementos clave, resolver posibles inquietudes y afianzar los aprendizajes alcanzados.", "La preclusión, entendida de esta manera, no constituye simplemente una forma anticipada de terminar un proceso, sino un instrumento mediante el cual el sistema controla que la persecución penal solamente continúe mientras existan razones jurídicas y probatorias que la hagan legítima."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "clave", "n": 0}], "items": [{"label": "Síntesis de la unidad 2", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["libros", "personas", "huella"]}], "rotulo": null, "seccion": "Síntesis de la unidad 2", "grupo": null, "titulos_fuente": ["Síntesis de la unidad 2"], "encabezados": [], "mediacion": "", "rotulos": ["Síntesis de la unidad 2"], "titulo_genially": "Síntesis de la unidad 2", "complemento_genially": "", "apartado": "Síntesis de la unidad 2", "guia": "Vea el video de síntesis de la unidad.", "video": {"src": "../comun/videos/u2_cierre.mp4", "vtt": "../comun/videos/u2_cierre.vtt", "poster": "../comun/videos/u2_cierre.jpg", "titulo": "Síntesis de la unidad 2"}}, {"layout": "lamina", "segmentos": ["Ahora conoce los principales aspectos relacionados con la preclusión, sus presupuestos, límites y efectos, así como las garantías que protegen los derechos de las víctimas frente a esta decisión. En la siguiente Unidad continuaremos avanzando en el estudio de la actuación penal y abordare
